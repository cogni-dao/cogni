apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-env-secrets
  namespace: cogni-production
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: operator-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: production/operator
  # Same spec as infra/k8s/overlays/production/operator/external-secret.yaml (the Argo-applied
  # copy): ONE definition of operator-env-secrets, so applying either never flips the spec
  # and races the force-sync refresh proof (bug.5566; CD4, ONE_EXTERNAL_SECRET_PER_SERVICE_ENV).
  data:
    - secretKey: DATABASE_RELIABILITY_STATUS_TOKEN
      remoteRef:
        {
          key: production/database-reliability-actuator,
          property: DATABASE_RELIABILITY_STATUS_TOKEN,
        }
