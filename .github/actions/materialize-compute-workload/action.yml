name: Materialize ComputeWorkload
description: Resolve a trusted OCI node bundle and replace one ephemeral checkout overlay.

inputs:
  app_source_root:
    { required: true, description: "Absolute application source checkout" }
  node: { required: true, description: "Catalog node slug" }
  environment:
    { required: true, description: "candidate-a, preview, or production" }
  source_sha: { required: true, description: "Exact node source SHA" }
  source_repository:
    { required: true, description: "Canonical GitHub owner/name" }
  git_read_token:
    {
      required: true,
      description: "Token allowed to read the node source repository",
    }
  domain: { required: true, description: "Environment domain" }
  ghcr_username: { required: true, description: "GHCR reader username" }
  ghcr_token: { required: true, description: "GHCR reader token" }
  dns_zone_id:
    {
      required: false,
      default: "",
      description: "Public Cloudflare zone id (NOT a credential). Carried into the XComputeWorkload's declarative DNS intent; ignored by the legacy ComputeWorkload authority, which resolves its own zone in-cluster. Empty is supported: the composite still publishes the CNAME target it would write.",
    }
  domain_root:
    {
      required: true,
      description: "Cloudflare ZONE NAME this deployment's hosts hang off (FORK_DOMAIN_ROOT). NOT the environment domain, and NOT a credential. Composed with the environment into the environment VM's public DNS alias, which is what the substrate (Temporal/Redis/LiteLLM) answers on.",
    }

runs:
  using: composite
  steps:
    - name: Checkout exact node source
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      with:
        repository: ${{ inputs.source_repository }}
        ref: ${{ inputs.source_sha }}
        fetch-depth: 1
        token: ${{ inputs.git_read_token }}
        path: .compute-node-source

    - name: Set up ORAS
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

    - name: Login to GHCR
      shell: bash
      env:
        GHCR_USERNAME: ${{ inputs.ghcr_username }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
      run: |
        set -euo pipefail
        printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USERNAME" --password-stdin

    - name: Set up pnpm
      uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
      with:
        version: 9.12.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
        cache: pnpm
        cache-dependency-path: ${{ inputs.app_source_root }}/pnpm-lock.yaml

    - name: Install typed materializer dependencies
      shell: bash
      working-directory: ${{ inputs.app_source_root }}
      run: pnpm install --frozen-lockfile

    - name: Materialize immutable desired state
      shell: bash
      working-directory: ${{ inputs.app_source_root }}
      env:
        APP_SOURCE_ROOT: ${{ inputs.app_source_root }}
        NODE: ${{ inputs.node }}
        DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        BUNDLE_REPOSITORY: ghcr.io/${{ inputs.source_repository }}
        DOMAIN: ${{ inputs.domain }}
        COMPUTE_OVERLAY: ${{ runner.temp }}/compute-workload-overlay
        COGNI_CATALOG_ROOT: infra/catalog
        DNS_ZONE_ID: ${{ inputs.dns_zone_id }}
        FORK_DOMAIN_ROOT: ${{ inputs.domain_root }}
      run: |
        set -euo pipefail
        # The environment VM's public DNS alias — the host the shared substrate answers on
        # (5432/5435/6379/4000/7233, see scripts/ci/render-compute-egress-allowlist.sh). Derived
        # by the SAME primitive that provisioning used to CREATE that A record
        # (scripts/setup/bootstrap.sh calls vm_host_for_env with the same two arguments), so the
        # materializer can only ever name a record env provisioning already published. Not a
        # decision and not new logic: one call to the one existing declaration of the convention.
        # shellcheck source=scripts/setup/lib/fork-identity.sh
        source scripts/setup/lib/fork-identity.sh
        # fork_identity_slug() falls back to "node-template" when it cannot read a git origin.
        # That fallback is fine where it was written (a laptop bootstrap prints what it chose);
        # here it would name a host that does not resolve and the node would simply have no
        # Temporal. Fail instead — a deploy lane has no business guessing its own identity.
        git -C "$APP_SOURCE_ROOT" remote get-url origin >/dev/null 2>&1 || [ -n "${FORK_SLUG:-}" ] \
          || { echo "::error::cannot derive the deployment slug: $APP_SOURCE_ROOT has no git origin and FORK_SLUG is unset"; exit 1; }
        # THE SUBSTRATE IS THE RECONCILING CLUSTER'S, NOT THE LANE'S (bug.5206).
        # `substrateHost` is what the Composition turns into TEMPORAL_ADDRESS, REDIS_URL and
        # LITELLM_BASE_URL (composition.yaml:169). The DSNs the same lane receives are composed
        # against the vault that holds them — the CONTROL env's VM — so naming the lane's VM here
        # splits the workload's substrate in half: production's Postgres, the lane's Temporal.
        # One call to the one existing declaration of the convention, never a second copy.
        # shellcheck source=scripts/ci/lib/appset-paths.sh
        CATALOG_DIR="${APP_SOURCE_ROOT}/infra/catalog" . scripts/ci/lib/appset-paths.sh
        SUBSTRATE_ENV="$(CATALOG_DIR="${APP_SOURCE_ROOT}/infra/catalog" control_env_for "$DEPLOYMENT_ENVIRONMENT" "$NODE")"
        SUBSTRATE_HOST="$(vm_host_for_env "$SUBSTRATE_ENV" "${FORK_DOMAIN_ROOT:?}" "$(fork_identity_slug "$APP_SOURCE_ROOT")")"
        if [ "$SUBSTRATE_ENV" != "$DEPLOYMENT_ENVIRONMENT" ]; then
          echo "::notice::${NODE}'s ${DEPLOYMENT_ENVIRONMENT} lane is reconciled by '${SUBSTRATE_ENV}' — its shared substrate is that cluster's (bug.5206)"
        fi
        echo "Environment substrate host: ${SUBSTRATE_HOST}"
        # Value passthrough only — WHICH authority renders, and whether DNS intent is carried
        # at all, are decided by the typed materializer from the catalog row. Nothing here
        # branches on a node (cicd-platform-boundary.md freeze).
        pnpm --filter operator materialize:compute-workload \
          --catalog "${APP_SOURCE_ROOT}/infra/catalog/${NODE}.yaml" \
          --environment "$DEPLOYMENT_ENVIRONMENT" \
          --repo-spec "${GITHUB_WORKSPACE}/.compute-node-source/.cogni/repo-spec.yaml" \
          --bundle-repository "$BUNDLE_REPOSITORY" \
          --source-sha "$SOURCE_SHA" \
          --domain "$DOMAIN" \
          --substrate-host "$SUBSTRATE_HOST" \
          ${DNS_ZONE_ID:+--dns-zone-id "$DNS_ZONE_ID"} \
          --output-dir "$COMPUTE_OVERLAY"
        rsync -a --delete \
          "${COMPUTE_OVERLAY}/" \
          "infra/k8s/overlays/${DEPLOYMENT_ENVIRONMENT}/${NODE}/"
