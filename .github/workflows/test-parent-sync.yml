name: Test Parent Sync

# spec.repo-sync-contract § Test-Parent Mirror (task.5142).
#
# Refreshes the `role: test-parent` artifact declared in .cogni/sync-manifest.yaml from canonical
# hub main, by opening (or updating) ONE reviewed pull request on the mirror. This is the REPAIR
# axis; sync-drift-detector.yml is the SURFACING axis, and both read the same compiled policy
# (scripts/ci/lib/sync-policy.mjs) so they can never disagree.
#
# Triggers — "continuously current" means every canonical merge, not a weekly sweep:
# - push to main: a CI/CD change is in the mirror's PR the moment it lands.
# - schedule (06:00 UTC): catches a run that failed transiently, and re-bases the PR on new main.
# - workflow_dispatch: ad-hoc, with `dry_run` for a no-write plan.
#
# Identity — the operator GitHub App installed on the MIRROR's org, taken from the candidate-a
# Environment (that installation is the one with contents+pull_requests+workflows write there).
# A human credential is never used, `main` is never pushed, and hub production/staging secret
# material is declared hub-only so it cannot enter the mirror's tree.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print the plan without pushing a branch or opening a PR"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-parent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: candidate-a
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (yaml parser)
        run: pnpm install --frozen-lockfile

      - name: Resolve the mirror's owner from the manifest
        id: target
        run: node scripts/ci/resolve-test-parent.mjs >> "$GITHUB_OUTPUT"

      - name: Decode the operator App private key
        id: pem
        env:
          KEY_B64: ${{ secrets.GH_REVIEW_APP_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          {
            echo "key<<PEM_EOF"
            printf '%s' "$KEY_B64" | base64 -d
            echo
            echo "PEM_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Mint an installation token on the mirror's org
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_REVIEW_APP_ID }}
          private-key: ${{ steps.pem.outputs.key }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}

      - name: Refresh the mirror
        env:
          GH_SYNC_TOKEN: ${{ steps.app.outputs.token }}
          HUB_DIR: ${{ github.workspace }}
          HUB_REF: HEAD
        run: |
          node scripts/ci/sync-test-parent.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
