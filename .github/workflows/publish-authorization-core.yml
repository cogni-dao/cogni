name: Publish Authorization Core

# @cogni/authorization-core is owned here, at the policy source. Nodes consume
# an immutable public Release asset rather than copying the package or requiring
# registry credentials. A governed main-only dispatch creates the version tag
# with the existing automation-bot authority; that tag is the sole publication
# trigger. No developer credential needs tag-write authority.
on:
  push:
    tags:
      - "authorization-core-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact authorization-core semver to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-authorization-core-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PACKAGE_NAME: "@cogni/authorization-core"
  PACKAGE_DIR: "packages/authorization-core"
  TAG_PREFIX: "authorization-core-v"

jobs:
  release-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0

      - name: Dispatch must target the exact main tip
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "::error::release dispatch must run against the exact origin/main tip"
            exit 1
          fi

      - name: Requested version must match package version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be an exact x.y.z semver"
            exit 1
          fi
          package_version="$(node -p "require('./' + process.env.PACKAGE_DIR + '/package.json').version")"
          if [ "$REQUESTED_VERSION" != "$package_version" ]; then
            echo "::error::requested ${REQUESTED_VERSION} does not match package ${package_version}"
            exit 1
          fi

      - name: Main tip must have passed every required check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/assert-repo-policy-checks.sh "$GITHUB_SHA"

      - name: Create immutable release tag with governed authority
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_AUTOMATION_BOT_PAT }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?ACTIONS_AUTOMATION_BOT_PAT is required}"
          tag="${TAG_PREFIX}${REQUESTED_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists; versions are immutable"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="$GITHUB_SHA"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0

      - name: Tagged commit must be on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::refusing to publish a commit that is not on origin/main"
            exit 1
          fi

      # A main ancestor is not necessarily gated: an admin can push directly,
      # and a tag may target any historical ancestor. Release only bytes whose
      # exact commit reported every check named by the repository policy.
      - name: Tagged commit must have passed every required check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/assert-repo-policy-checks.sh "$GITHUB_SHA"

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package declarations and runtime
        run: pnpm packages:build

      - name: Test the published package contract
        run: pnpm --filter "$PACKAGE_NAME" test

      - name: Tag must match package version
        run: |
          set -euo pipefail
          version="$(node -p "require('./' + process.env.PACKAGE_DIR + '/package.json').version")"
          tagged_version="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
          if [ "$version" != "$tagged_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Version must be unpublished
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "::error::release ${GITHUB_REF_NAME} already exists; versions are immutable"
            exit 1
          fi

      - name: Pack immutable artifact
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist-pack
          pnpm --filter "$PACKAGE_NAME" exec npm pack --pack-destination "$PWD/dist-pack"
          tgz="$(find dist-pack -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tgz"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"

      - name: Verify tarball entrypoints and license
        run: |
          set -euo pipefail
          tar tzf "${{ steps.pack.outputs.tgz }}" | sed 's|^package/||' | sort -u > /tmp/have.txt
          node -e '
            const fs = require("node:fs");
            const pkg = require(`${process.cwd()}/${process.env.PACKAGE_DIR}/package.json`);
            const wanted = new Set();
            for (const map of Object.values(pkg.exports ?? {})) {
              for (const key of ["types", "import", "default"]) {
                if (map?.[key]) wanted.add(map[key].replace(/^\.\//, ""));
              }
            }
            if (wanted.size === 0) throw new Error("package declares no exports");
            fs.writeFileSync("/tmp/want.txt", [...wanted].sort().join("\n") + "\n");
          '
          missing="$(comm -23 /tmp/want.txt /tmp/have.txt || true)"
          if [ -n "$missing" ]; then
            echo "::error::tarball is missing declared entrypoints:"
            echo "$missing"
            exit 1
          fi
          grep -qE '^LICENSE' /tmp/have.txt
          test -n "$(node -p "require('./' + process.env.PACKAGE_DIR + '/package.json').license ?? ''")"

      - name: Attest exact tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tgz }}

      - name: Attach public release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact="${{ steps.pack.outputs.tgz }}"
          artifact_name="$(basename "$artifact")"
          {
            echo "Immutable public build of ${PACKAGE_NAME}."
            echo
            echo "Verify provenance:"
            echo "    gh attestation verify ${artifact_name} -R ${GITHUB_REPOSITORY}"
          } > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" "$artifact" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
