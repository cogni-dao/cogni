name: Deploy Ref Ancestry

# bug.5150 — DEPLOY_REF_SOURCE_IS_REACHABLE_FROM_MAIN.
#
# This is a FLEET-STATE invariant, not a property of any single PR: it asserts that
# every deploy/* ref Argo tracks resolves to a monorepo source commit still reachable
# from main. Drift is caused by ref/main movement (a PR squash-merge that abandons a
# pinned line, a control-plane re-select whose PR then closes), NEVER by an unrelated
# PR's diff — so running it as a per-PR CI gate bought zero incremental protection while
# painting a permanent, unrelated red on every open PR (bug.5150 fix #2231 shipped it in
# the PR lane; that red-on-arrival check being merged-past is the exact "trained blindness"
# it exists to prevent). It now lives where its subject lives — on main + a cron — and
# surfaces a real violation as a tracking issue instead of red wallpaper. Same pattern as
# sync-drift-detector.yml. The hermetic UNIT proof stays on PR CI (scripts/ci/tests/...).
#
# Triggers:
# - push to main — a merge is the moment main can move past a pinned ref; catch it at once.
# - schedule every 6h — catches ref-side drift with no main push (a control-plane re-select
#   whose PR later closes: exactly the deploy/candidate-a-control-plane case).
# - workflow_dispatch — ad-hoc / after a reconcile, to confirm the fleet is clean.
#
# Permissions: contents:read (checkout), issues:write (upsert the tracking issue).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-ref-ancestry
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # fetch-depth: 0 — the check asserts ancestry against origin/main. A shallow
          # main makes every `git merge-base --is-ancestor` answer a lie, so the script
          # refuses to run against one rather than passing vacuously.
          fetch-depth: 0
          ref: main

      - name: Deploy ref ancestry (bug.5150)
        id: check
        # A real violation is surfaced as the deploy-ref-drift tracking issue below, NOT as a
        # recurring red scheduled job — matches sync-drift-detector.yml (green job, issue is the
        # signal). continue-on-error keeps steps.check.outcome == 'failure' for the upsert to read.
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/ci/check-deploy-ref-ancestry.sh 2>&1 | tee /tmp/deploy-ref-report.txt

      - name: Upsert deploy-ref-drift tracking issue
        # Only on a real violation (script exit 1). A clean run closes any open issue.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ steps.check.outcome }}
          REPORT_PATH: /tmp/deploy-ref-report.txt
        run: |
          set -euo pipefail
          gh label create deploy-ref-drift --color "d76d76" \
            --description "A deploy/* ref serves a commit not reachable from main (bug.5150)" || true
          EXISTING=$(gh issue list --label deploy-ref-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$CHECK_RESULT" = "success" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "✅ deploy-ref-ancestry is green as of ${GITHUB_SHA:0:8} — every asserted deploy ref resolves to a commit reachable from main. Auto-closed by \`.github/workflows/deploy-ref-ancestry.yml\`."
              echo "✅ closed resolved issue #$EXISTING"
            else
              echo "✅ no drift, no existing issue — nothing to do."
            fi
            exit 0
          fi
          # Violation: upsert the tracking issue with the script's own failure block.
          TITLE="deploy-ref-drift: a deploy ref is serving a commit not on main (bug.5150)"
          {
            echo "_Auto-generated by \`.github/workflows/deploy-ref-ancestry.yml\` at $(date -u +%Y-%m-%dT%H:%M:%SZ) for sha ${GITHUB_SHA:0:8}._"
            echo
            echo '```'
            head -c 60000 "$REPORT_PATH"
            echo '```'
          } > /tmp/issue-body.md
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/issue-body.md
            echo "✏️  updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --label deploy-ref-drift --body-file /tmp/issue-body.md
            echo "🆕 opened new deploy-ref-drift issue"
          fi
