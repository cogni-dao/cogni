name: Operator change verifier

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number in the caller repository
        required: true
        type: number
      head_sha:
        description: Exact pull request head revision to classify
        required: true
        type: string
    outputs:
      eligible:
        description: Whether trusted policy allows this exact head to use the fast route
        value: ${{ jobs.verify.outputs.eligible }}
      claimed:
        description: Whether the commit claims the reserved operator-change envelope
        value: ${{ jobs.verify.outputs.claimed }}
      invalid:
        description: Whether a claimed envelope failed verification
        value: ${{ jobs.verify.outputs.invalid }}
      operation:
        description: Classified operation, or none
        value: ${{ jobs.verify.outputs.operation }}
      reason:
        description: Stable classification reason
        value: ${{ jobs.verify.outputs.reason }}

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: operator-change-fast-path
    runs-on: ubuntu-latest
    env:
      FLEET_CONTROL_ENV: ${{ vars.FLEET_CONTROL_ENV || 'production' }}
      FORK_DOMAIN_ROOT: ${{ vars.FORK_DOMAIN_ROOT || 'cognidao.org' }}
    outputs:
      eligible: ${{ steps.classify.outputs.eligible }}
      claimed: ${{ steps.classify.outputs.claimed }}
      invalid: ${{ steps.classify.outputs.invalid }}
      operation: ${{ steps.classify.outputs.operation }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out exact caller head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}
          path: target

      - name: Check out pinned verifier source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: policy
          fetch-depth: 1

      - id: classify
        name: Re-fetch and classify exact pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: pull_request
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER_PR: ${{ inputs.pr_number }}
          PR_HEAD_SHA_PR: ${{ inputs.head_sha }}
          FAST_PATH_POLICY_ROOT: ${{ github.workspace }}/policy
        working-directory: target
        run: bash "$FAST_PATH_POLICY_ROOT/scripts/ci/classify-operator-change-fast-path.sh"

      - name: Reject malformed reserved claims
        env:
          INVALID: ${{ steps.classify.outputs.invalid }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          [ "$INVALID" != true ] || {
            echo "::error::invalid signed operator-change claim: $REASON"
            exit 1
          }
