name: Authorization Facade Credential Projection

on:
  workflow_call:
    inputs:
      lane: { required: true, type: string }
      node: { required: true, type: string }
      operation: { required: false, type: string, default: materialize }
    secrets:
      VM_HOST: { required: true }
      SSH_DEPLOY_KEY: { required: true }
  workflow_dispatch:
    inputs:
      lane:
        required: true
        type: choice
        options: [candidate-a, preview, production]
      node: { required: true, type: string }
      operation:
        required: true
        type: choice
        default: materialize
        options: [materialize, prepare, activate, finish, cancel]

permissions:
  contents: read

concurrency:
  group: authorization-facade-credential-${{ inputs.lane }}-${{ inputs.node }}
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-latest
    environment: ${{ vars.FLEET_CONTROL_ENV || 'production' }}
    outputs:
      provider: ${{ steps.target.outputs.provider }}
      node_id: ${{ steps.target.outputs.node_id }}
      control_url: ${{ steps.target.outputs.control_url }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with: { ref: main }
      - name: Resolve exact authority cell
        id: target
        env:
          LANE: ${{ inputs.lane }}
          NODE: ${{ inputs.node }}
          CONTROL_ENV: ${{ vars.FLEET_CONTROL_ENV || 'production' }}
          FORK_ROOT: ${{ vars.FORK_DOMAIN_ROOT || 'cognidao.org' }}
          CANDIDATE_CONTROL_DOMAIN: ${{ vars.CANDIDATE_OPERATOR_DOMAIN }}
        run: |
          set -euo pipefail
          [[ "$LANE" =~ ^(candidate-a|preview|production)$ ]]
          [[ "$NODE" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          catalog="infra/catalog/${NODE}.yaml"; [ -f "$catalog" ]
          provider="$(LANE="$LANE" yq -N '.deployment_provider[strenv(LANE)] // "k3s"' "$catalog")"
          [[ "$provider" =~ ^(k3s|akash)$ ]]
          . scripts/ci/lib/image-tags.sh
          node_id="$(node_id_for_target "$NODE")"
          [[ "$node_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          case "$CONTROL_ENV" in
            production) control_url="https://${FORK_ROOT}" ;;
            preview) control_url="https://preview.${FORK_ROOT}" ;;
            candidate-a) control_url="https://${CANDIDATE_CONTROL_DOMAIN:-test.${FORK_ROOT}}" ;;
            *) exit 1 ;;
          esac
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "node_id=$node_id" >> "$GITHUB_OUTPUT"
          echo "control_url=$control_url" >> "$GITHUB_OUTPUT"
      - name: Configure control SSH
        env:
          {
            VM_HOST: "${{ secrets.VM_HOST }}",
            SSH_DEPLOY_KEY: "${{ secrets.SSH_DEPLOY_KEY }}",
          }
        run: |
          set -euo pipefail; [ -n "$VM_HOST" ] && [ -n "$SSH_DEPLOY_KEY" ]
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Reconcile control authority
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          SSH_OPTS: -i /home/runner/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30
          FLEET_CONTROL_ENV: ${{ vars.FLEET_CONTROL_ENV || 'production' }}
        run: bash scripts/ci/authorization-facade-credentials.sh authority "${{ inputs.operation }}" "${{ inputs.lane }}" "${{ inputs.node }}" "${{ steps.target.outputs.provider }}"

  lane-view:
    needs: authority
    runs-on: ubuntu-latest
    environment: ${{ inputs.lane }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with: { ref: main }
      - name: Resolve lane facade origin
        id: lane-origin
        env:
          LANE: ${{ inputs.lane }}
          FORK_ROOT: ${{ vars.FORK_DOMAIN_ROOT || 'cognidao.org' }}
          CANDIDATE_DOMAIN: ${{ vars.CANDIDATE_OPERATOR_DOMAIN }}
        run: |
          set -euo pipefail
          case "$LANE" in
            production) origin="https://${FORK_ROOT}" ;;
            preview) origin="https://preview.${FORK_ROOT}" ;;
            candidate-a) origin="https://${CANDIDATE_DOMAIN:-test.${FORK_ROOT}}" ;;
            *) exit 1 ;;
          esac
          [[ "$origin" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - name: Configure lane SSH
        env:
          {
            VM_HOST: "${{ secrets.VM_HOST }}",
            SSH_DEPLOY_KEY: "${{ secrets.SSH_DEPLOY_KEY }}",
          }
        run: |
          set -euo pipefail; [ -n "$VM_HOST" ] && [ -n "$SSH_DEPLOY_KEY" ]
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Project digest verifier and lane-custodied workload
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          SSH_OPTS: -i /home/runner/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30
          AUTHORIZATION_FACADE_CONTROL_URL: ${{ needs.authority.outputs.control_url }}
          AUTHORIZATION_FACADE_LANE: ${{ inputs.lane }}
          AUTHORIZATION_FACADE_NODE_ID: ${{ needs.authority.outputs.node_id }}
          AUTHORIZATION_FACADE_URL: ${{ steps.lane-origin.outputs.origin }}
        run: |
          set -euo pipefail
          node scripts/ci/fetch-authorization-facade-ring.mjs |
            bash scripts/ci/project-authorization-facade-views.sh "${{ inputs.operation }}" "${{ inputs.lane }}" "${{ inputs.node }}" "${{ needs.authority.outputs.provider }}"

  control-custody:
    needs: [authority, lane-view]
    if: needs.authority.outputs.provider == 'akash'
    runs-on: ubuntu-latest
    environment: ${{ vars.FLEET_CONTROL_ENV || 'production' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with: { ref: main }
      - name: Configure control SSH
        env:
          {
            VM_HOST: "${{ secrets.VM_HOST }}",
            SSH_DEPLOY_KEY: "${{ secrets.SSH_DEPLOY_KEY }}",
          }
        run: |
          set -euo pipefail; mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Project control-custodied workload scalar
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          SSH_OPTS: -i /home/runner/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30
          FLEET_CONTROL_ENV: ${{ vars.FLEET_CONTROL_ENV || 'production' }}
        run: bash scripts/ci/authorization-facade-credentials.sh custody "${{ inputs.operation }}" "${{ inputs.lane }}" "${{ inputs.node }}" akash

  finalize:
    needs: [authority, lane-view, control-custody]
    if: always() && needs.authority.result == 'success' && needs.lane-view.result == 'success' && (needs.control-custody.result == 'success' || needs.control-custody.result == 'skipped') && (inputs.operation == 'finish' || inputs.operation == 'cancel')
    runs-on: ubuntu-latest
    environment: ${{ vars.FLEET_CONTROL_ENV || 'production' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with: { ref: main }
      - name: Configure control SSH
        env:
          {
            VM_HOST: "${{ secrets.VM_HOST }}",
            SSH_DEPLOY_KEY: "${{ secrets.SSH_DEPLOY_KEY }}",
          }
        run: |
          set -euo pipefail; mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Finalize authority after rendered proof
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          SSH_OPTS: -i /home/runner/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30
          FLEET_CONTROL_ENV: ${{ vars.FLEET_CONTROL_ENV || 'production' }}
        run: bash scripts/ci/authorization-facade-credentials.sh finalize "${{ inputs.operation }}" "${{ inputs.lane }}" "${{ inputs.node }}" "${{ needs.authority.outputs.provider }}"
