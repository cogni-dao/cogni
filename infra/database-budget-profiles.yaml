# Versioned Postgres budgets referenced by infra/catalog/* database declarations.
# Values are native Postgres/role limits. Admission rate is an input to the
# candidate replay; it is not a claim about future query shape.
shared-default-v1:
  design_rate_per_minute: 60
  cell_capacity:
    vcpus: 2
    memory_gib: 4
    storage_gib: 50
    compute_class: shared
  roles:
    app:
      connection_limit: 2
      statement_timeout_ms: 5000
    service:
      connection_limit: 4
      statement_timeout_ms: 2000
  common:
    lock_timeout_ms: 2000
    idle_in_transaction_session_timeout_ms: 30000
    temp_file_limit_mib: 128
    work_mem_mib: 16

operator-control-v1:
  design_rate_per_minute: 60
  cell_capacity:
    vcpus: 2
    memory_gib: 4
    storage_gib: 50
    compute_class: shared
  roles:
    app:
      # Rolling app (2 x 2), actuator (2 x 1), one diagnostic connection.
      connection_limit: 7
      statement_timeout_ms: 5000
    service:
      # Rolling app (2 x 4), worker (3 x 2), one diagnostic connection.
      connection_limit: 15
      statement_timeout_ms: 2000
  common:
    lock_timeout_ms: 2000
    idle_in_transaction_session_timeout_ms: 30000
    temp_file_limit_mib: 128
    work_mem_mib: 16

dedicated-high-throughput-v1:
  design_rate_per_minute: 240
  cell_capacity:
    vcpus: 4
    memory_gib: 16
    storage_gib: 100
    compute_class: dedicated
  roles:
    app:
      connection_limit: 2
      statement_timeout_ms: 5000
    service:
      connection_limit: 8
      statement_timeout_ms: 2000
  common:
    lock_timeout_ms: 2000
    idle_in_transaction_session_timeout_ms: 30000
    temp_file_limit_mib: 128
    work_mem_mib: 16

# bug.5540/subtask.5025: enable cold allocation only; never bootstraps PG.
# Delivery requires parent-approved spending and qualified native copy/recovery.
# Console ignores the legacy deposit field and enables automatic top-ups by default.
# The proposed deposit below is not an enforced escrow or lifetime spend ceiling.
recovery_profiles:
  pg15-cold-capacity-v1:
    enabled: true
    funding_status: qualified
    cpu_units: 4
    memory_mib: 16384
    ephemeral_size_mib: 1024
    persistent_size_mib: 204800
    postgres_major: 15
    image: postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
    command: [sleep]
    args: [infinity]
    volume_name: database
    mount_path: /var/lib/postgresql/data
    pgdata: /var/lib/postgresql/data/pgdata
    volume_tier: nvme
    pricing_denom: uact
    max_price_per_block: "100"
    initial_escrow_usd: "0.5"
