#
# Operator-domain secrets catalog. Holds entries that are NOT specific to a
# single node:
#   - service: _shared       — A1 secrets consumed by multiple services
#   - service: _system       — G-tier derived secrets (from repo state)
#   - service: poly          — A2 placeholder until cogni-poly ports its
#                              own nodes/poly/.cogni/secrets-catalog.yaml
#   - (no service)           — B/D/E-tier (Compose-infra, CI, repo-level)
#
# Each entry's `service:` field declares its OpenBao path (for A-tier/G-tier);
# B/D/E entries omit it.
#
# See docs/spec/secrets-classification.md for tier definitions.

secrets:
  # ── A1 — service: _shared (cross-service) ──────────────────────────────
  - name: LITELLM_MASTER_KEY
    tier: A1
    service: _shared
    consumedBy: [compose, pod]
    # ONE master key authenticates every node-app pod to the shared LiteLLM proxy,
    # so each node MUST byte-match the value the proxy holds. The blind ancestor
    # scan (node-template→operator→_shared, write-missing-only) let a freshly-formed
    # node keep a DIVERGENT copy that NEVER self-heals → 401/insufficient_quota.
    # operator holds the working value (operator LLM calls succeed in every env);
    # inheritFrom pins per-node materialize to it and overwrite-on-drift self-heals
    # existing nodes on re-promote. Same fix shape as SCHEDULER_API_TOKEN (bug.5021).
    inheritFrom: operator
    required: true
    category: Core App
    source: agent
    description: LiteLLM proxy master API key
    steps: ["Auto-generated sk-cogni-* key"]
    generate: { kind: sk-cogni, randHexBytes: 24 }

  - name: LITELLM_VIRTUAL_KEY
    tier: A1
    appliesTo: llm
    consumedBy: [pod]
    required: true
    category: Core App
    source: agent
    syncTo: litellm-virtual-key
    description: Per-node LiteLLM virtual key for off-cluster workloads; materialization registers the same explicit value with the environment LiteLLM proxy
    steps:
      - Auto-generated as sk-cogni-<48 lowercase hex>
      - Registered under cogni:<env>:<nodeId>:app:v1
    generate: { kind: sk-cogni, randHexBytes: 24 }

  - name: SCHEDULER_API_TOKEN
    tier: A1
    service: _shared
    # The scheduler-worker SENDS this token to each node's /api/internal/graph-runs;
    # the node verifies it against its OWN copy, so a node MUST byte-match the token
    # the worker holds. On prod the worker's scheduler-worker-secrets is written by
    # deploy-infra.sh, sourced from cogni/<env>/operator (the _shared-token SSoT) —
    # NOT cogni/<env>/scheduler-worker (which is unseeded). So inheritFrom pins
    # per-node materialization to the operator path, the copy the worker actually
    # uses (operator chat works in every env ⇒ operator==worker). The blind
    # node-template→operator→_shared scan took node-template FIRST → a divergent
    # copy → 401 on freshly-formed nodes (bug.5021). Overwrite-on-drift in
    # secret-materialize.sh self-heals existing nodes on re-promote.
    inheritFrom: operator
    required: true
    category: Internal Service
    source: agent
    description: scheduler-worker -> internal graph API auth
    steps: ["Auto-generated random string"]
    generate: { kind: base64, bytes: 32 }

  - name: GRAFANA_URL
    tier: A1
    service: operator
    required: false
    category: Observability (Grafana Cloud)
    source: human
    description: Grafana instance URL. OpenBao custody is for the OPERATOR pod — the node-scoped log-read proxy reads it via the operator ExternalSecret (cogni/<env>/operator). loki-query.sh / grafana-postgres-datasource.sh read GRAFANA_URL from a local .env, not OpenBao, so this is operator-service, not _shared.
    url: https://grafana.com/orgs
    steps: ['e.g. "https://your-org.grafana.net" (no trailing slash)']

  - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
    tier: A1
    service: operator
    required: false
    category: Observability (Grafana Cloud)
    source: human
    description: Grafana service account token. OpenBao custody is for the OPERATOR pod (the log-read proxy's Loki credential, read via the operator ExternalSecret cogni/<env>/operator). PR #54 introduces Phase 5e auto-mint (child SA from operator-provided GH_GRAFANA_PARENT_SA_TOKEN); operator-paste path remains for fork bootstrap before Phase 5e wires up.
    steps:
      - Grafana instance
      - Administration -> Service Accounts
      - Add service account with datasource read/query plus datasource create/write for setup runs
      - "Required permissions: datasources:read, datasources:query, datasources:create, datasources:write"
      - "Use a stack service-account token, usually prefixed glsa_; Grafana Cloud access-policy tokens prefixed glc_ do not authorize the Grafana instance HTTP API"
      - Use Grafana Cloud Private Data Source Connect (PDC) for private databases; do not expose Postgres publicly
      - Add token, copy it

  - name: AKASH_ACTUATOR_CONSOLE_API_KEY
    tier: A1
    service: akash-tx-actuator
    # Akash Console API key for the private TRANSACTION ACTUATOR (task.5095/task.5102).
    #
    # CENTRALIZED MANAGED ACCOUNT, ONE ACTIVE WRITER PER WALLET (story.5016 v0, BINDING).
    # candidate-a pins the managed test account + credential; preview pins NO wallet (its control
    # plane is installed but dormant/unfunded); production remains isolated on a dedicated account.
    # Each environment that pins a wallet removes its legacy controller before enabling its actuator
    # and stores the credential ONLY at
    # cogni/<env>/akash-tx-actuator/AKASH_ACTUATOR_CONSOLE_API_KEY. Console/manual writes remain
    # forbidden because they invalidate cursor recovery. Distinct funded accounts per environment
    # are later hardening, not an activation prerequisite (ci-cd.md Axiom 26 correction).
    # AKASH_CONSOLE_API_KEY (the operator app's old Console slot) is RETIRED entirely — task.5138
    # deleted the slot from this catalog, the env schema, and the app; no such credential exists
    # anywhere. The actuator asserts its wallet identity against the NON-SECRET pinned
    # AKASH_ACTUATOR_ACCOUNT_ID (plain config on the Deployment, not a secret).
    #
    # KNOWN V0 TRADEOFF: the durable single-writer index lives in each environment's Postgres, so
    # it is per-database and cannot serialize two envs pinning one wallet. That is exactly why
    # preview pins NO wallet — with candidate-a the sole active writer on the shared test account,
    # there is no cross-environment mutex to need. The least-bespoke activation rule is to stage
    # paid mutations (rail first, prove dormant, then activate Poly) and prohibit every out-of-band
    # Console writer. Separate accounts are the hardening path if concurrent autonomous replacement
    # across funded envs is ever required.
    #
    # As-built 2026-09-16:
    #   production  -> akash10auj6u6wr7aqjawuxurgue9w7wfnca50t8cr4l   (dedicated, funded)
    #   candidate-a -> akash12eh8xgpeyumar3sk6wp94y0tq9uh62mkezxjmt   (the original test account)
    #   preview     -> (none — installed but unfunded control plane; pins no wallet, story.5016)
    #
    # PRODUCTION IS THE PRIMARY, not the last rung (Derek ruling 2026-09-15). Production governs
    # Spawn and is generation-1 activity authority; candidate-a is a transient validation gate
    # whose nodes are ephemeral. An earlier revision of this comment said "CANDIDATE-A ONLY for
    # v0" — that was the as-built drift talking, not the design, and every rung landing on
    # candidate-a first is exactly what the hub contract warns against ("Do not first assign
    # authority to candidate-a and then fake a catalog cutover").
    #
    # DEDICATED SERVICE BUCKET, NOT the operator bucket. The public operator app consumes the
    # WHOLE of cogni/<env>/operator via `dataFrom: extract` -> operator-env-secrets -> envFrom,
    # so an operator-app compromise would steal this wallet. Invariant 1 (PATH =
    # cogni/<env>/<service>/<KEY>) gives the actuator its own <service>, its own ExternalSecret
    # (infra/k8s/overlays/<env>/operator/akash-tx-actuator-external-secret.yaml -> the k8s Secret
    # akash-tx-actuator-env-secrets) and its own projected volume. The operator pod has no
    # ExternalSecret, envFrom, or volume that can reach this path.
    #
    # Optional: unset -> `resolveAkashTxWallet` refuses and the actuator exits at boot rather
    # than open a socket. It NEVER falls back to AKASH_CONSOLE_API_KEY (no such input exists).
    required: false
    category: Infrastructure
    source: human
    description: Akash Console API key for the private Akash transaction actuator; the sole active writer on the operator sponsor wallet
    url: https://console.akash.network
    steps:
      - Hard-disable the environment's legacy ComputeWorkload controller writer FIRST (structural, not a flag)
      - Use the approved managed account credential for this environment (candidate-a + preview share test; production is isolated)
      - "Store it at cogni/<env>/akash-tx-actuator/AKASH_ACTUATOR_CONSOLE_API_KEY via POST /api/v1/nodes/operator/secrets with {env, key, value, service: akash-tx-actuator} (needs can_manage_secrets on the operator node); never paste it into a PR, workflow input, or .env on a VM"
      - "Pin the wallet's PUBLIC account address as AKASH_ACTUATOR_ACCOUNT_ID in the env overlay (non-secret plain config) so the actuator can assert it is spending from the intended wallet"

  # Purpose-only native read authority, generated in this deployment CONTROL/operator owner leg.
  # Candidate receives distinct bytes. No inheritFrom/shared/syncTo and no wallet authority.
  - name: COMPUTE_PROOF_READ_TOKEN
    tier: A1
    service: operator
    required: false
    category: Infrastructure
    source: agent
    generate: { kind: hex, bytes: 32 }
    description: Purpose-only bounded native deployment-proof read bearer

    steps:
      - Generated in the existing CONTROL/operator owner leg, independently per control environment
      - ESO and Reloader deliver the app bank and the selected actuator property

  - name: AKASH_TX_ACTUATOR_TOKEN
    tier: A1
    service: akash-tx-actuator
    # Bearer token for the private Akash transaction actuator (task.5102). The actuator is a
    # ClusterIP-only wallet writer with no other authentication, so this value IS the
    # authority to spend the actuator's Console account.
    #
    # source: agent — WE generate it, so a human must NEVER type it (cicd-secrets-expert killer
    # rule: no human types a secret VALUE into a UI). `generate: {kind: hex, bytes: 32}` is the
    # same generator GH_WEBHOOK_SECRET / CONNECTIONS_ENCRYPTION_KEY use, minted idempotently by
    # scripts/ci/secret-materialize.sh into OpenBao and delivered by ESO. Nothing to hand-seed.
    #
    # TWO CONSUMERS, ONE VALUE, ONE OPENBAO KEY:
    #   1. the actuator pod, via the DEDICATED akash-tx-actuator ExternalSecret
    #      (`dataFrom: extract` on cogni/<env>/akash-tx-actuator) projected as a file;
    #   2. the `akash-tx-actuator-auth` Secret, a second ExternalSecret selecting THIS key by
    #      property, which Crossplane's provider-http dereferences as the placeholder
    #      `{{ akash-tx-actuator-auth:<ns>:token }}` — the placeholder form is what is stored
    #      in the managed resource and its logs, never the value.
    # Both sides read cogni/<env>/akash-tx-actuator/AKASH_TX_ACTUATOR_TOKEN, so they cannot drift.
    # Neither side is reachable from the operator app's bucket.
    #
    # PER ENVIRONMENT, like the wallet it guards: candidate-a / preview / production each get
    # a distinct token, and rotating one cannot reach another env's actuator.
    #
    # Optional: unset -> the actuator refuses to open a socket (an unauthenticated wallet
    # writer is never a degraded mode) and the ExternalSecret does not produce the auth
    # Secret, so provider-http surfaces an unresolved placeholder instead of calling anything.
    required: false
    category: Infrastructure
    source: agent
    description: Bearer token shared by the private Akash transaction actuator and the Crossplane XComputeWorkload Composition that calls it
    steps:
      - Auto-generated hex string, materialized to cogni/<env>/akash-tx-actuator by the flight's materialize-substrate job
      - Never hand-typed and never pasted into a PR, workflow input, or .env on a VM
      - Restart nothing by hand — Reloader rolls the actuator and ESO refreshes the auth Secret
    generate: { kind: hex, bytes: 32 }

