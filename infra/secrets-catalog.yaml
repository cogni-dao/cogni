    tier: B
    # Compose/LiteLLM authority (tier B) but the node-app pod ALSO reads it
    # (server-env.ts → LiteLLM providers), so it must fan out to pods too.
    consumedBy: [compose, pod]
    # ONE canonical OpenRouter key per env; every node must hold the SAME working
    # value. The blind ancestor scan (node-template→operator→_shared,
    # write-missing-only) let a freshly-formed prod node keep a DIVERGENT/stale
    # copy that NEVER self-heals → HTTP 429 insufficient_quota (proven on beacon
    # prod 2026-06-19). operator's prod OPENROUTER provably works; inheritFrom pins
    # per-node materialize to operator and overwrite-on-drift self-heals existing
    # nodes on re-promote. source:human inheritFrom is source-agnostic in
    # secret-materialize.sh (no agent-only gate). Same fix shape as
    # SCHEDULER_API_TOKEN (bug.5021).
    inheritFrom: operator
    required: true
    category: Core App
    source: human
    description: OpenRouter LLM API key
