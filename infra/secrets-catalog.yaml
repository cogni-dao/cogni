  - name: DOLTGRES_PASSWORD
    tier: A1
    appliesTo: database
    consumedBy: [compose]
    required: true
    category: Database
    source: agent
    description:
      Doltgres superuser password — env-wide SSOT at cogni/<env>/operator
      (DOLTGRES_PASSWORD). One shared superuser per env; every node's knowledge_<node>
      DSN and the deploy-infra/reconcile provisioners read operator's value (the same
      pattern as OPENFGA_DB_PASSWORD, PR 1613). Stored, not re-derived — genesis seed
      is a deterministic bootstrap, but post-init it is immutable (Doltgres 0.56.3
      cannot ALTER the superuser; databases.md §5.2) and a restored/rotated volume is
      reconciled with `pnpm secrets:set <env> operator DOLTGRES_PASSWORD`
      (secrets-rotate.md), never re-derived. The pod connects to knowledge_<node> as
      this superuser; swap to a per-node role when upstream adds schema/role privileges.
    steps:
      [
        "Stored SSOT at cogni/<env>/operator; genesis-seeded deterministically, reconciled to the live volume on drift — never re-derived",
      ]
    generate: { kind: hex, bytes: 24 }
