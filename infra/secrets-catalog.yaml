  # Lease log shipping (bug.5127). Akash-placed node apps have no Alloy/daemonset,
  # so the app pushes its own logs; the compute-workload-controller injects these
  # as LOKI_PUSH_* into every cogni-node-app-v1 lease env. DEDICATED write-only
  # token ON PURPOSE — never reuse GRAFANA_CLOUD_LOKI_API_KEY (tier B, CI/VM
  # plane): a token that ships beyond the CI/VM plane must be revocable without
  # touching the Alloy/CI pipeline. logs:write scope only (can push log lines;
  # cannot read telemetry or drive infra) — the "write-only Loki key" the
  # SCOPED_CREDS_ONLY workload contract names (node-workload-spec.ts).
  # required:false for provisioning, but where a consumer projects these keys
  # they MUST exist in cogni/<env>/operator FIRST — a projected Secret with an
  # absent key fails the mount (bug.5142 ordering). secret-materialize satisfies
  # that ordering automatically (bug.5240): it seeds a CI-derived bootstrap
  # value (GRAFANA_CLOUD_LOKI_*) create-if-absent, and a dedicated token set via
  # `pnpm secrets:set` replaces it without ever being clobbered back.
  - name: LOKI_LEASE_PUSH_URL
