  # ══════════════════════════════════════════════════════════════════════════
  # A1 — capability-gated node-app baseline (design.secrets-catalog-per-node v2)
  # Migrated from nodes/node-template/.cogni/secrets-catalog.yaml (task.5094).
  # Declared ONCE; the write side fans each to every type:node whose node-spec
  # has the `appliesTo` capability. shared:false (default) = distinct value per
  # node at cogni/<env>/<node>/<KEY>; shared:true = one value at _shared.
  # ⚠️ CLASSIFICATION REVIEW (secrets-owner): capability + shared flags for the
  #    optional web/oauth/observability entries are best-effort; refine as the
  #    node-spec capability set lands. PRIVY_* = payments (custody) is firm.
  # ══════════════════════════════════════════════════════════════════════════

  - name: AUTH_SECRET
    tier: A1
    appliesTo: web
    required: true
    category: Core App
    source: agent
    description: NextAuth session encryption key (per-node — cross-node forgery isolation)
    steps: ["Auto-generated random string"]
    generate: { kind: base64, bytes: 32 }
  - name: CONNECTIONS_ENCRYPTION_KEY
    tier: A1
    appliesTo: web
    required: true
    category: Core App
    source: agent
    description: AES key for BYO-AI connection credentials at rest (per-node — cross-node decryption isolation)
    steps: ["Auto-generated random string"]
    generate: { kind: base64, bytes: 32 }
  - name: INTERNAL_OPS_TOKEN
    tier: A1
    appliesTo: all-nodes
    required: true
    category: Internal Service
    source: agent
    description: Deploy trigger -> governance schedule sync auth
    steps: ["Auto-generated random string"]
    generate: { kind: base64, bytes: 32 }
  - name: METRICS_TOKEN
    tier: A1
    appliesTo: all-nodes
    consumedBy: [compose, pod]
    required: true
    category: Internal Service
    source: agent
    description: Prometheus scrape -> /api/metrics auth
    steps: ["Auto-generated random string"]
    generate: { kind: base64, bytes: 32 }
  - name: GH_WEBHOOK_SECRET
    tier: A1
    # ONE GitHub App signs all webhooks for ONE receiver (the operator pod), so
    # a distinct per-node value is structurally wrong (bug.5012): service:_shared
    # makes the provision fan-out pass one value through instead of minting per
    # node; inheritFrom pins per-node materialize to cogni/<env>/operator with
    # overwrite-on-drift (same shape as SCHEDULER_API_TOKEN / LITELLM_MASTER_KEY).
    service: _shared
    inheritFrom: operator
    required: true
    category: Internal Service
    # source: agent — WE generate the value (origin is internal). syncTo declares
    # the orthogonal fact that it must also byte-match the GitHub App's webhook
    # secret: deploy-infra pushes the OPERATOR copy to the App via the App's own
    # key (scripts/secrets/sync-app-webhook-secret.sh) so both planes converge.
    # Without the sync, every webhook fails HMAC verification silently and
    # deploy-infra re-breaks it each run. See docs/spec/secrets-management.md.
    source: agent
    syncTo: github-app-webhook
    description: GitHub App webhook HMAC secret — generated here, mirrored to the App
    steps:
      ["Auto-generated hex string, pushed to the GitHub App webhook config"]
    generate: { kind: hex, bytes: 32 }
  - name: EVM_RPC_URL
    tier: A1
    # inheritFrom: operator (was appliesTo:all-nodes + shared:true). ONE canonical
    # Base mainnet RPC per env: the operator holds the billed (account-specific,
    # rate-limited) Alchemy endpoint and every node-app pod INHERITS it — NOT a
    # per-node paste. The blind ancestor scan let a freshly-formed node keep a
    # divergent/missing copy → outbound web3 silently no-ops at runtime (bug.5087);
    # inheritFrom pins per-node materialize to operator and overwrite-on-drift
    # self-heals on re-promote. Same shape as OPENROUTER_API_KEY / LITELLM_MASTER_KEY.
    # source:human = byte-origin (a vendor RPC URL): the operator (or a standalone
    # sovereign fork, which has no operator ancestor) seeds it ONCE.
    inheritFrom: operator
    # Node-app pod reads it (server-env.ts → web3 chain verification). With no
    # appliesTo/service path, consumedBy makes it pod-derived explicitly (same as
    # OPENROUTER_API_KEY's consumedBy declaration; print-pod-keys.ts).
    consumedBy: [pod]
    required: true
    category: Core App
    source: human
    description: Base mainnet RPC endpoint for on-chain verification
    url: https://dashboard.alchemy.com/
    steps:
      - "Create a new app (chain: Base mainnet)"
      - "Copy the full HTTPS URL including API key"
