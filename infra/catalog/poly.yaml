image_repository: ghcr.io/cogni-dao/poly
source_sha: 242266ad474aee590e2fbafcad08a0431d350b45
candidate_a_branch: deploy/candidate-a-poly
preview_branch: deploy/preview-poly
production_branch: deploy/production-poly
# task.5017 — per-env node-set (deploy ⊆ provisioned). A wizard birth enters all
# NODE_FORMATION_ENVS; this list is the catalog twin so render-node-appset.sh
# renders exactly the births appset.ts generates. Trimming a node's reach is a
# later catalog edit (drop an env here) once its envs are provisioned.
# task.5132 — candidate-a AND preview restored, BOTH billed to the PRODUCTION account.
#
# task.5130 removed the candidate-a slot for a correct reason: candidate-a's own actuator is
# pinned to the TEST Console account, reserved for Cogni's operator-platform self-test on
# cogni-test-org throwaway nodes. BILLING_FOLLOWS_OWNER — poly is a real cogni-dao fleet node,
# so every environment it runs in must bill the PRODUCTION sponsor account (akash10auj…).
#
# THE TWO LANES ARE NOW ONE MECHANISM. They were only ever different because preview had no
# way to pay for a lease and candidate-a did — on the test card, which is precisely why
# task.5130 pulled poly out. That difference is gone:
#   1. bug.5202 (#2294) — writerFor keys on (env, OWNER), so a cogni-dao node resolves the
#      PRODUCTION writer in EVERY lane while cogni-test-org keeps the test account.
#   2. task.5132 (#2295/#2299/#2300) — the production cluster reconciles an akash node's
#      non-production AppSet, and the materializer emits `actuatorNamespace: cogni-production`
#      so the Composition dials that writer instead of this lane's empty namespace.
# Both cells are the same two lines in the same row; sequencing them buys nothing and costs a
# whole first-run cycle.
#
# Each lane keeps its OWN idempotence key (`xcw:cogni-<env>:4b06359a-…:0`), derived from the
# XR's own namespace — so these leases can never collide with each other or with production.
# That is the property that would cost real money.
envs: [candidate-a, preview, production]
deployment_provider:
  candidate-a: akash
  preview: akash
  production: akash
# story.5016 production cutover — Crossplane authority; the private Akash transaction
# actuator pays from the production account for every lane (NS3).
compute_api:
  candidate-a: crossplane
  preview: crossplane
  production: crossplane
# Explicit replacement counter for a terminally closed lease — the only
# redeploy-after-close path (actuator refuses a settled idempotence key).
lease_generation:
  candidate-a: 38
  preview: 2
  # 20 -> 21 after gen-20 booted the old eed16dc0 bundle, missed the boot
  # deadline for the promoted 9033a162 bundle, and was closed by policy.
  # The settled xcw:cogni-production:<node-id>:20 key is spent and cannot be
  # replayed into a live lease; gen-21 is the reviewed re-mint for bug.5293.
  #
  # 19 -> 20 originally re-minted after a second DRY auction
  # (story.5050, bug.5293/5334).
  # gen-18 dseq 1790815181111 collected 8 bids and refused all of them; gen-19 dseq
  # 1790818782178 collected 6 bids, but every bidder was outside the required FI/NL/PT
  # countries, then rolled back at 2026-10-01T01:41:25Z. Both settled idempotency keys are
  # spent: replaying gen-19 returns the closed handle and can never apply a new Poly image.
  # There is no activity-env re-mint verb, so this reviewed catalog bump is the recovery
  # prescribed by hub `akash-prod-lease-recovery` (CATALOG_IS_SSOT).
  # 21 -> 22. The country set is deliberately UNCHANGED ([FI, NL, PT], set by #2528).
  # PLACEMENT IS NOT THE PROBLEM, and the evidence is positive, not inferred: RHITE Finland
  # (akash127x6cuk4...dhz7 - isOnline, isAudited, featEndpointCustomDomain=true, and already
  # in AKASH_ALLOWED_PROVIDERS) WON gen-20 and recorded `boot_ok` in
  # compute_provider_outcomes at 2026-10-01T02:50:29Z. That working Finland lease was then
  # destroyed by bootPolicy.onDeadline=Close because the promoted 9033a162 bundle could not
  # hold /readyz through its 20:06-20:36Z window, while production Postgres was dying with
  # `exit code 2` every 1-3 minutes. A DATABASE OUTAGE CLOSED A GOOD LEASE. The auction
  # never misbehaved, and gens 18/19/21 went dry for a different reason again (bug.5334's
  # activeLeases cold-start trap, since removed).
  #
  # Safe to spend this generation now: Postgres is at 1 exit-2 per 45 min (was ~4.6/h, peak
  # 4 per 15 min) after bounding poly's statements, and candidate-a poly holds /readyz=200
  # continuously against this SAME Postgres instance. The boot SLO needs one sustained
  # /readyz, not a flawless hour.
  #
  # DO NOT widen required_placement_countries to rescue a dry auction. BG/RO were already
  # tried and deliberately reverted (#2512/#2516/#2525/#2527 -> #2528). CH is inert: both
  # Swiss providers publish featEndpointCustomDomain=false, so naming CH only lets an
  # incapable provider win on price (screened since #2532). Only THREE registry providers
  # can serve poly's publicHost inside the set, and the derived strike list goes PERMANENT
  # at 3 boot failures - so every wasted generation risks permanently excluding the pool
  # that story.5050 earned. Fix the substrate first, then re-mint. (bug.5293)
  production: 22
required_placement_countries:
  candidate-a: [BE]
  production: [FI, NL, PT]
activity_env: production
owner_wallet: "0x070075F1389Ae1182aBac722B36CA12285d0c949"
path_prefix: nodes/poly/
node_id: 4b06359a-a859-4399-888e-a8c7a6696f7e
# task.5052 (story.5016) — this node's workload runs on Akash; these provider
# egress CIDRs may dial the env VM's substrate ports (5432,5435,6379,4000,7233).
# Rendered per-env (union over rows AKASH-PLACED in that env — bug.5191) by
# scripts/ci/render-compute-egress-allowlist.sh and applied by
# infra/provision/cherry/harden-docker-public-ports.sh. Absent = fail-closed.
compute_egress_cidrs:
  - cidr: 80.200.246.35/32
    comment: shared egress NAT of Akash providers zencloud + digitalfrontier (story.5016)
  - cidr: 213.146.212.69/32
    comment: Portugal provider egress (story.5050)
  - cidr: 77.76.13.0/24
    comment: Bulgaria provider rotating egress range (story.5050)
  - cidr: 95.216.46.103/32
    comment: >-
      Finland provider egress, MEASURED from inside a real lease on
      provider.m3a.eu-n-3.digitalfrontier.network (static.103.46.216.95.clients.your-server.de,
      Helsinki, AS24940 Hetzner) — story.5050. The two /32s previously listed for Finland did
      NOT contain it, which is bug.5326: the pod boots and cannot reach its own Postgres through
      the fail-closed substrate-port DROP. The same lease measured CLOB_STATUS=200 against
      clob.polymarket.com, so Finland is permitted for poly's outbound dependency.
      DELIBERATELY A /32, NOT the Hetzner /16: this list is an IP allowlist in front of
      Postgres/Doltgres/Redis/LiteLLM/Temporal, so a /16 on a public cloud would hand ~131k
      rentable addresses a hole to production. A NAT rotation here costs an outage; a /16
      costs the database. Rotation is the cheaper failure until the network layer
      authenticates identity instead of source address.
  - cidr: 95.217.58.106/32
    comment: Finland provider egress (story.5050)
  - cidr: 157.180.59.24/32
    comment: >-
      RHITE Finland provider EGRESS, measured from inside a real lease on
      provider.akash.rhite.co.uk (story.5050, bug.5326). This provider bid 9.14 during the
      gen-18 dry auction; its egress is in a DIFFERENT netblock from every address
      previously listed here — so without this entry the pod boots and is firewalled off its
      own Postgres by the fail-closed substrate-port DROP, misses the boot SLO, and burns
      three onGiveUp:Replace attempts on what reads as a market failure. The same lease
      measured CLOB_STATUS=200 against clob.polymarket.com from country=FI.
  - cidr: 95.217.139.177/32
    comment: >-
      RHITE Finland provider INGRESS endpoint (story.5050). Kept for reachability, but it is
      NOT the egress — this entry used to carry "workload egress must still be proven" and the
      measurement above disproved it. Ingress is not egress; measure from inside the lease.
  - cidr: 24.144.74.0/24
    comment: >-
      Netherlands provider egress range (story.5050). Widened from 24.144.74.27/32:
      provider.h100.ams.val.akash.pub now answers on .156/.158/.159/.160 and rotates inside
      the /24, so the single-host entry trips bug.5326 the moment NL wins. AS394996, Amsterdam.
  - cidr: 109.102.6.188/32
    comment: Froggy Servers Romania provider endpoint; workload egress must still be proven (story.5050)
