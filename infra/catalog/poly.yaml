name: poly
type: node
port: 3200
node_port: 31600
dockerfile: nodes/poly/app/Dockerfile
image_tag_suffix: "-poly"
migrator_tag_suffix: "-poly-migrate"
source_repo: https://github.com/cogni-dao/poly.git
image_repository: ghcr.io/cogni-dao/poly
source_sha: 1de3e508550327a1dd41a07fa11446d018a7373c
candidate_a_branch: deploy/candidate-a-poly
preview_branch: deploy/preview-poly
production_branch: deploy/production-poly
# task.5017 — per-env node-set (deploy ⊆ provisioned). A wizard birth enters all
# NODE_FORMATION_ENVS; this list is the catalog twin so render-node-appset.sh
# renders exactly the births appset.ts generates. Trimming a node's reach is a
# later catalog edit (drop an env here) once its envs are provisioned.
# task.5132 — candidate-a AND preview restored, BOTH billed to the PRODUCTION account.
#
# task.5130 removed the candidate-a slot for a correct reason: candidate-a's own actuator is
# pinned to the TEST Console account, reserved for Cogni's operator-platform self-test on
# cogni-test-org throwaway nodes. BILLING_FOLLOWS_OWNER — poly is a real cogni-dao fleet node,
# so every environment it runs in must bill the PRODUCTION sponsor account (akash10auj…).
#
# THE TWO LANES ARE NOW ONE MECHANISM. They were only ever different because preview had no
# way to pay for a lease and candidate-a did — on the test card, which is precisely why
# task.5130 pulled poly out. That difference is gone:
#   1. bug.5202 (#2294) — writerFor keys on (env, OWNER), so a cogni-dao node resolves the
#      PRODUCTION writer in EVERY lane while cogni-test-org keeps the test account.
#   2. task.5132 (#2295/#2299/#2300) — the production cluster reconciles an akash node's
#      non-production AppSet, and the materializer emits `actuatorNamespace: cogni-production`
#      so the Composition dials that writer instead of this lane's empty namespace.
# Both cells are the same two lines in the same row; sequencing them buys nothing and costs a
# whole first-run cycle.
#
# Each lane keeps its OWN idempotence key (`xcw:cogni-<env>:4b06359a-…:0`), derived from the
# XR's own namespace — so these leases can never collide with each other or with production.
# That is the property that would cost real money.
envs: [candidate-a, preview, production]
database:
  candidate-a: { tier: dedicated, budget_profile: dedicated-high-throughput-v1 }
  preview: { tier: dedicated, budget_profile: dedicated-high-throughput-v1 }
  production:
    tier: dedicated
    budget_profile: dedicated-high-throughput-v1
    # One app replica: service + read + leader = 7/8; app = 3/4. Reserve one each.
    runtimePoolLimits: { replicaCount: 1, app: 3, service: 4, read: 2 }
reliability_validation:
  candidate-a: { role: dedicated-neighbor }
deployment_provider:
  candidate-a: akash
  preview: akash
  production: akash
# story.5137 / task.5411 (CD4 ONE_WRITER_PER_NODE_LANE) — every environment of this node is
# deployed ONLY by the node-deploy sequencer (POST /api/v1/deploy/workloads). The legacy
# and crossplane authorities and their per-node AppSets were deleted (CD9).
compute_api:
  candidate-a: node-deploy
  preview: node-deploy
  production: node-deploy
required_placement_countries:
  candidate-a: [FI, NL, PT, UA]
  production: [BG, CZ, FI, NL, PT, UA]
activity_env: production
owner_wallet: "0x070075F1389Ae1182aBac722B36CA12285d0c949"
path_prefix: nodes/poly/
node_id: 4b06359a-a859-4399-888e-a8c7a6696f7e
