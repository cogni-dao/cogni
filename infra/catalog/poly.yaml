  - cidr: 157.180.108.139/32
    comment: "RHITE Finland EGRESS after a NAT ROTATION (bug.5326) — measured from inside the live production lease 2026-10-02T06:12Z via poly GET /api/internal/ops/poly/egress-check: egress_ip=157.180.108.139 egress_country=FI blocked=false oracle_http_status=200. The allowlist carried only 157.180.59.24/32, so the fail-closed substrate-port DROP cut the lease off its own Postgres: / and /version served 200 while /readyz returned 503 INTERNAL_ERROR after a ~15s connect timeout, and pg_stat_activity showed zero service_poly connections from any 157.180.* address. That is also why gen-20 missed its boot deadline, NOT the Postgres crash-loop. Deliberately a /32 not the Hetzner /16: this list fronts Postgres/Doltgres/Redis/LiteLLM/Temporal and a /16 on public cloud would hand ~131k rentable addresses a hole into production — rotation is the cheaper failure. Durable fix: measure egress from inside the lease at boot and allowlist it automatically; there is still no TS writer for compute_egress_cidrs (#2175). (bug.5293)"
