name: levelup
type: node
port: 3200
node_port: 31800
dockerfile: nodes/levelup/app/Dockerfile
image_tag_suffix: "-levelup"
migrator_tag_suffix: "-levelup-migrate"
source_repo: https://github.com/cogni-dao/levelup.git
image_repository: ghcr.io/cogni-dao/levelup
source_sha: f1fd69c244d1cbc33b76cefe74264b2c56bb9fcf
candidate_a_branch: deploy/candidate-a-levelup
preview_branch: deploy/preview-levelup
production_branch: deploy/production-levelup
# task.5017/5025 — per-env node-set (deploy ⊆ provisioned). A wizard birth enters
# candidate-a only; preview/production are explicit post-validation transitions.
envs: [candidate-a, preview, production]
deployment_provider:
  candidate-a: akash
  preview: akash
  production: akash
# story.5016 step 13 — FIRST Crossplane-owned Akash workload in the fleet.
# `crossplane` renders an XComputeWorkload composite reconciled by Crossplane
# (infra/crossplane/xcomputeworkload) via the private Akash transaction actuator,
# instead of the bespoke ComputeWorkload CR. ONE_AUTHORITY_PER_WORKLOAD: the
# materializer emits exactly one kind per (node, environment) and the deploy-branch
# `rsync --delete` removes the other in the same commit.
#
# CANDIDATE-A ONLY, and deliberately so. levelup has NEVER existed in
# cogni-candidate-a, so there is no legacy ComputeWorkload CR carrying the
# `compute.cogni.io/external-resource` finalizer there — Crossplane CREATEs rather
# than adopts, and no lease is orphaned. The two existing candidate-a fixtures
# (node-template, toks4) DO carry that finalizer with no controller left to remove
# it, so flipping either of them would hang the Argo app in Terminating AND mint a
# second paid lease. Do not add this cell to preview/production: one actuator and
# one ledger per environment means each additional env is another independent
# writer on the same Akash Console wallet.
compute_api:
  candidate-a: crossplane
# bug.5079 — activity_env is the SINGLETON env allowed to ingest Git receipts. GitHub
# App webhooks are delivered to production only (one App, one webhook URL), and the
# production operator's route index filters to `activityEnv === DEPLOY_ENVIRONMENT`
# (attribution-profile-resolver.ts selectLocalAttributionNodes). A node left on
# candidate-a is therefore structurally unable to receive a receipt: its webhooks
# arrive in production and are dropped `unclaimed`, fail-closed and silent.
# levelup is deployed to production, so production is its activity authority.
activity_env: production
# Stable binding only; the reconciler resolves an env-local users.id by wallet.
owner_wallet: "0x070075F1389Ae1182aBac722B36CA12285d0c949"
path_prefix: nodes/levelup/
node_id: 557d8b59-8e3b-42f0-9aeb-a5c171296556
# task.5052 (story.5016) — this node's workload runs on Akash; these provider
# egress CIDRs may dial the env VM's substrate ports (5432,5435,6379,4000,7233).
# Rendered per-env (union over rows deployed to the env) by
# scripts/ci/render-compute-egress-allowlist.sh and applied by
# infra/provision/cherry/harden-docker-public-ports.sh. Absent = fail-closed.
compute_egress_cidrs:
  - cidr: 80.200.246.35/32
    comment: shared egress NAT of Akash providers zencloud + digitalfrontier (story.5016)
