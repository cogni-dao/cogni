name: levelup
type: node
port: 3200
node_port: 31800
dockerfile: nodes/levelup/app/Dockerfile
image_tag_suffix: "-levelup"
migrator_tag_suffix: "-levelup-migrate"
source_repo: https://github.com/cogni-dao/levelup.git
image_repository: ghcr.io/cogni-dao/levelup
source_sha: f1fd69c244d1cbc33b76cefe74264b2c56bb9fcf
candidate_a_branch: deploy/candidate-a-levelup
preview_branch: deploy/preview-levelup
production_branch: deploy/production-levelup
# task.5017/5025 — per-env node-set (deploy ⊆ provisioned). story.5016 production
# cutover: preview slots are retired fleet-wide (preview has no funded Akash account
# and gets no actuator), and levelup's candidate-a proof slot was already closed —
# its lease released (#2233, dseq 1789435347755) — so the stale candidate-a cells
# are dropped with it. Production is this node's only slot.
envs: [production]
database:
  production: { tier: shared, budget_profile: shared-default-v1 }
deployment_provider:
  production: akash
# story.5016 production cutover — levelup is the FIRST fleet row on the production
# Crossplane authority, the same node that proved the full create→observe→update→close
# rung on candidate-a. `crossplane` renders an XComputeWorkload reconciled via the
# private Akash transaction actuator paying from production's DEDICATED account
# (akash10auj…). ONE_AUTHORITY_PER_WORKLOAD: the materializer emits exactly one kind
# per (node, environment) and the deploy-branch `rsync --delete` evicts the legacy
# ComputeWorkload manifest in the same commit. PRECONDITION (Derek cutover plan):
# the node's old lease is closed and its legacy CR's finalizer cleared BEFORE the
# promote that materializes this cell — flipping over a live legacy CR would hang
# the Argo app Terminating AND mint a second paid lease.
compute_api:
  production: crossplane
# Explicit replacement counter for a terminally closed lease (the actuator refuses to
# re-spend a settled idempotence key). Bumping this is the ONLY redeploy-after-close
# path — kubectl patch is reverted by Argo selfHeal.
lease_generation:
  # 3 -> 2. DELIBERATELY BACKWARD: this ADOPTS the live lease, it does not mint one (bug.5498;
  # same move as poly #2557, hub akash-adopt-live-lease).
  #
  # #2677 bumped 2 -> 3 on 2026-10-10 because in-place updates had stalled. The next day,
  # gen-2 converged in place anyway (akash_tx_updated 2026-10-11T23:24Z, dseq 1790714267559,
  # zencloud), and it served 942d1487 from then on. Gen 3 stayed only in the catalog until the
  # 2026-10-21 fleet refresh promote rendered it. That paid auction went to akash.rhite.co.uk
  # (dseq 1792564697291). Its egress 65.108.194.156 is not trusted for production Postgres
  # 5432 (see infra/catalog/poly.yaml), so the lease reached BootDeadlineExceeded under Hold.
  #
  # Gen-2's key xcw:cogni-production:557d8b59-...:2 is NOT spent. Console read with the
  # actuator credential on 2026-10-21 showed deployment, lease and escrow all active. Rendering
  # gen 2 binds that handle and takes observe -> UPDATE in place. No auction runs, and the
  # UPDATE re-sends the SDL with the env resolved now. That carries the post-cutover DSNs
  # (production substrate 84.32.244.43), so levelup stops using the old VM relay. The gen-3 child is
  # no longer rendered, so its normal REMOVE closes the RHITE lease.
  #
  # Never reuse gen 3: it is the RHITE key and is settled once closed.
  production: 2
# bug.5079 — activity_env is the SINGLETON env allowed to ingest Git receipts. GitHub
# App webhooks are delivered to production only (one App, one webhook URL), and the
# production operator's route index filters to `activityEnv === DEPLOY_ENVIRONMENT`
# (attribution-profile-resolver.ts selectLocalAttributionNodes). A node left on
# candidate-a is therefore structurally unable to receive a receipt: its webhooks
# arrive in production and are dropped `unclaimed`, fail-closed and silent.
# levelup is deployed to production, so production is its activity authority.
activity_env: production
# Stable binding only; the reconciler resolves an env-local users.id by wallet.
owner_wallet: "0x070075F1389Ae1182aBac722B36CA12285d0c949"
path_prefix: nodes/levelup/
node_id: 557d8b59-8e3b-42f0-9aeb-a5c171296556
# task.5052 (story.5016) — this node's workload runs on Akash; these provider
# egress CIDRs may dial the env VM's substrate ports (5432,5435,6379,4000,7233).
# Rendered per-env (union over rows AKASH-PLACED in that env — bug.5191) by
# scripts/ci/render-compute-egress-allowlist.sh and applied by
# infra/provision/cherry/harden-docker-public-ports.sh. Absent = fail-closed.
compute_egress_cidrs:
  - cidr: 80.200.246.35/32
    comment: shared egress NAT of Akash providers zencloud + digitalfrontier (story.5016)
