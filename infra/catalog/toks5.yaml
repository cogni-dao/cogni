name: toks5
type: node
port: 3200
node_port: 31900
dockerfile: nodes/toks5/app/Dockerfile
image_tag_suffix: "-toks5"
migrator_tag_suffix: "-toks5-migrate"
source_repo: https://github.com/cogni-dao/toks5.git
image_repository: ghcr.io/cogni-dao/toks5
source_sha: 7c9b1e08d68839384d1db183d13bbcf33ff2fe7e
candidate_a_branch: deploy/candidate-a-toks5
preview_branch: deploy/preview-toks5
production_branch: deploy/production-toks5
# story.5025 — per-env node-set (deploy ⊆ provisioned). A wizard birth renders the transient
# candidate-a proof slot and canonical production; PREVIEW_IS_ABSENT_AT_BIRTH. Closing the
# candidate after the proof is the ordinary env verb ({env:candidate-a, present:false}).
# BILLING_FOLLOWS_OWNER: toks5 is a real cogni-dao fleet node. Every declared
# environment, including its transient candidate proof slot, uses the production
# sponsor account through its production custodian. The test account remains
# reserved for operator-platform self-tests on cogni-test-org throwaway nodes.
envs: [candidate-a, preview, production]
database:
  candidate-a: { tier: shared, budget_profile: shared-default-v1 }
  preview: { tier: shared, budget_profile: shared-default-v1 }
  production: { tier: shared, budget_profile: shared-default-v1 }
# story.5025 — BORN_ON_AKASH. Placement is stated at birth, never inherited from the k3s
# fallback that exists for rows minted before decentralized compute did.
deployment_provider:
  candidate-a: akash
  preview: akash
  production: akash
# task.5097 — WHICH authority reconciles the workload. Crossplane
# (infra/crossplane/xcomputeworkload) owns every generic concern; the only Cogni-specific
# piece left is the private Akash transaction actuator. A born node never touches the
# bespoke controller in any environment that can BOTH reconcile the composite (an installed
# control plane) and pay for its lease (a pinned actuator wallet); an environment missing
# either is omitted and stays on the pre-existing legacy default (task.5104, task.5097).
compute_api:
  candidate-a: crossplane
  preview: crossplane
  production: crossplane
# bug.5192 — EXPLICIT replacement counter for a terminally settled lease key. The generation is
# the only varying component of the actuator's wallet-wide idempotence key
# (`xcw:cogni-production:f66b260b-4633-41e2-8711-b7c1b8449cc1:<generation>`), and the actuator
# refuses to re-spend a settled key by design (`akash_tx_create_refused_settled_key`), so
# generation 0's receipt — settled with no lease handle after the 33h writer-slot wedge — can
# never mint this node's production lease. A human bumps this by exactly 1 to REPLACE that
# lease; nothing bumps it implicitly, because a generation that moved on its own would answer
# "no existing resource" after a promote and mint a SECOND PAID LEASE.
# task.5122 renamed this cell from `lease_epoch`; the VALUE is unchanged, so the key this row
# resolves to is still `…:1` byte-for-byte. "Epoch" is reserved for attribution/distribution.
lease_generation:
  # Generation 1 closed at its boot deadline; lease/escrow closure verified on-chain.
  candidate-a: 2
  preview: 3
  production: 6
# story.5025 — birth authority is PRODUCTION, the only environment that receives Git
# webhooks (ACTIVITY_FOLLOWS_INGEST, bug.5079). Born here it is immutable for life: a
# sub-production authority would have to be moved by every later promote, and generation 1
# has no fenced cross-environment cutover. Born at the top, it survived the task.5130
# candidate-a close untouched — the very property being born at production buys.
activity_env: production
# Stable binding only; the reconciler resolves an env-local users.id by wallet.
owner_wallet: "0x070075F1389Ae1182aBac722B36CA12285d0c949"
path_prefix: nodes/toks5/
node_id: f66b260b-4633-41e2-8711-b7c1b8449cc1
# task.5052 (story.5016) — this node's workload runs on Akash; these provider
# egress CIDRs may dial the env VM's substrate ports (5432,5435,6379,4000,7233).
# NOTE: the node-birth generator does not yet mint this block (filed at birth of
# toks5); added by hand-PR pending the generator fix.
compute_egress_cidrs:
  - cidr: 95.217.139.183/32
    envs: [preview]
    ports: [5432]
    comment: "Toks5 preview lease 1792054180775/app egress measured through authenticated provider shell on 2026-10-26; admit preview Postgres only (bug.5538)."
  - cidr: 80.200.246.35/32
    comment: shared egress NAT of Akash providers zencloud + digitalfrontier (story.5016)
  - cidr: 65.108.194.156/32
    envs: [candidate-a]
    ports: [5432]
    comment: Toks5 candidate lease 1792623140532 egress measured in the running app at 2026-10-21T23:08Z (spike.5010); service_toks5 targets candidate-a Postgres, whose TCP connection times out without this grant. Candidate Postgres only; production trust is unchanged.
