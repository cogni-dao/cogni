name: red
type: node
port: 3200
node_port: 32000
dockerfile: nodes/red/app/Dockerfile
image_tag_suffix: "-red"
migrator_tag_suffix: "-red-migrate"
source_repo: https://github.com/cogni-dao/red.git
image_repository: ghcr.io/cogni-dao/red
source_sha: c9e4c685ef78f2437aae8a732b03fe1af1df8b31
candidate_a_branch: deploy/candidate-a-red
preview_branch: deploy/preview-red
production_branch: deploy/production-red
# story.5025 — per-env node-set (deploy ⊆ provisioned). A wizard birth renders the transient
# candidate-a proof slot and canonical production; PREVIEW_IS_ABSENT_AT_BIRTH. Closing the
# candidate after the proof is the ordinary env verb ({env:candidate-a, present:false}).
envs: [candidate-a, production]
database:
  candidate-a: { tier: shared, budget_profile: shared-default-v1 }
  production: { tier: shared, budget_profile: shared-default-v1 }
reliability_validation:
  candidate-a: { role: shared-control }
# story.5025 — BORN_ON_AKASH. Placement is stated at birth, never inherited from the k3s
# fallback that exists for rows minted before decentralized compute did.
deployment_provider:
  candidate-a: akash
  production: akash
# story.5137 / task.5411 (CD4 ONE_WRITER_PER_NODE_LANE) — every environment of this node is
# deployed ONLY by the node-deploy sequencer (POST /api/v1/deploy/workloads). The legacy
# and crossplane authorities and their per-node AppSets were deleted (CD9).
compute_api:
  candidate-a: node-deploy
  production: node-deploy
# story.5025 — birth authority is PRODUCTION, the only environment that receives Git
# webhooks (ACTIVITY_FOLLOWS_INGEST, bug.5079). Born here it is immutable for life: a
# sub-production authority would have to be moved by every later promote, and generation 1
# has no fenced cross-environment cutover. candidate-a stays passive — it never ingests, so
# it can never run a competing activity ledger.
activity_env: production
# Stable binding only; the reconciler resolves an env-local users.id by wallet.
owner_wallet: "0x070075F1389Ae1182aBac722B36CA12285d0c949"
path_prefix: nodes/red/
node_id: 921b1d1d-4ded-4a6d-b3f1-f7d6affa406a
