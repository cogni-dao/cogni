name: beacon
type: node
port: 3200
node_port: 31300
dockerfile: nodes/beacon/app/Dockerfile
image_tag_suffix: "-beacon"
migrator_tag_suffix: "-beacon-migrate"
source_repo: https://github.com/cogni-dao/beacon.git
image_repository: ghcr.io/cogni-dao/beacon
source_sha: 8b9f788092043288653cd49dc1fbfb8c15051108
candidate_a_branch: deploy/candidate-a-beacon
preview_branch: deploy/preview-beacon
production_branch: deploy/production-beacon
# task.5017 — per-env node-set (deploy ⊆ provisioned). A wizard birth enters all
# NODE_FORMATION_ENVS; this list is the catalog twin so render-node-appset.sh
# renders exactly the births appset.ts generates. Trimming a node's reach is a
# later catalog edit (drop an env here) once its envs are provisioned.
# story.5016 production cutover: preview slot retired (preview has no funded Akash
# account and gets no actuator; its lease on the shared account was closed).
envs: [candidate-a, production]
database:
  candidate-a: { tier: shared, budget_profile: shared-default-v1 }
  production: { tier: shared, budget_profile: shared-default-v1 }
deployment_provider:
  candidate-a: akash
  production: akash
# story.5137 / task.5411 (CD4 ONE_WRITER_PER_NODE_LANE) — every environment of this node is
# deployed ONLY by the node-deploy sequencer (POST /api/v1/deploy/workloads). The legacy
# and crossplane authorities and their per-node AppSets were deleted (CD9).
compute_api:
  candidate-a: node-deploy
  production: node-deploy
activity_env: production
owner_wallet: "0x070075F1389Ae1182aBac722B36CA12285d0c949"
path_prefix: nodes/beacon/
node_id: f97f68f2-8406-4a3b-b5a9-d579b779f19d
