name: node-template
type: node
port: 3200
# task.5078 — edge NodePort (see operator.yaml). Must match overlay nodePort.
node_port: 30200
dockerfile: nodes/node-template/app/Dockerfile
# bug.0344 — see infra/catalog/operator.yaml for why these fields exist.
image_tag_suffix: "-node-template"
migrator_tag_suffix: "-node-template-migrate"
source_repo: https://github.com/Cogni-DAO/node-template.git
image_repository: ghcr.io/cogni-dao/node-template
# Accepted deploy SHA — the catalog pin that replaces the nodes/<slug> gitlink
# (spec.node-submodule-retirement, CATALOG_SOURCE_SHA_IS_THE_DEPLOY_PIN).
source_sha: 654e5f2132cdc774a329f24c69340170e4721d2a
# task.0320 — per-env deploy branches (see operator.yaml).
candidate_a_branch: deploy/candidate-a-node-template
preview_branch: deploy/preview-node-template
production_branch: deploy/production-node-template
# task.5017 — per-env node-set (deploy ⊆ provisioned).
# story.5016 production cutover: preview slot retired (preview has no funded Akash
# account and gets no actuator; its lease on the shared account was closed).
# task.5130 — the candidate-a slot is REMOVED. candidate-a's actuator is pinned to the
# TEST Console account (akash12eh8…), reserved for Cogni's own operator-platform self-test
# on cogni-test-org throwaway nodes. BILLING_FOLLOWS_OWNER: node-template is a real
# cogni-dao repo, so every environment it runs in must bill the PRODUCTION sponsor account
# (akash10auj…). This closes node-template's candidate-a FLIGHT lane; restoring one needs a
# non-test wallet first (task.5132). The overlays/candidate-a/node-template/ dir stays —
# it is the per-env RENDER TEMPLATE for render-node-overlays.sh, not a deployed shape
# (identical to overlays/preview/node-template/, an env node-template also does not join).
envs: [candidate-a, production]
database:
  candidate-a: { tier: shared, budget_profile: shared-default-v1 }
  production: { tier: shared, budget_profile: shared-default-v1 }
deployment_provider:
  candidate-a: akash
  production: akash
# story.5016 production cutover — Crossplane authority; the private Akash transaction
# actuator pays from production's DEDICATED account (akash10auj…). PRECONDITION:
# old lease closed + legacy CR finalizer cleared BEFORE the promote that
# materializes this cell (ONE_AUTHORITY_PER_WORKLOAD; rsync --delete evicts the
# legacy manifest in the same commit).
compute_api:
  candidate-a: crossplane
  production: crossplane
# Explicit replacement counter for a terminally closed lease — the only
# redeploy-after-close path (actuator refuses a settled idempotence key).
lease_generation:
  candidate-a: 1
  production: 3
activity_env: production
owner_wallet: "0x070075F1389Ae1182aBac722B36CA12285d0c949"
path_prefix: nodes/node-template/
node_id: b927a9dd-6132-4fc9-a51e-e3cee2568e3c
# task.5052 (story.5016) — this node's workload runs on Akash; these provider
# egress CIDRs may dial the env VM's substrate ports (5432,5435,6379,4000,7233).
# Rendered per-env (union over rows AKASH-PLACED in that env — bug.5191) by
# scripts/ci/render-compute-egress-allowlist.sh and applied by
# infra/provision/cherry/harden-docker-public-ports.sh. Absent = fail-closed.
compute_egress_cidrs:
  - cidr: 95.217.30.59/32
    envs: [production]
    ports: [5432, 5435, 6379, 4000, 7233]
    comment: Temporary recovery grant for production RHITE lease 1792831352201; egress measured inside the lease at 2026-10-30T20:38:56Z while all five substrate TCP ports timed out (bug.5557). Automatic egress admission remains unbuilt.
  - cidr: 80.200.246.35/32
    comment: shared egress NAT of Akash providers zencloud + digitalfrontier (story.5016)
  - cidr: 95.217.139.183/32
    envs: [candidate-a]
    ports: [5432]
    comment: Candidate PostgreSQL SYN source observed on the lane VM at 2026-10-24T18:06Z while lease 1792715065695 readiness timed out; ingress 95.217.139.177 is not its egress identity (bug.5533).
  - cidr: 2.29.118.117/32
    envs: [production, candidate-a]
    comment: node-template lease egress MEASURED on both substrate VMs 2026-10-29 — prod (cogni.vm.cognidao.org) 39/40 SYNs to :5432 correlated 1:1 with node-template /readyz; candidate-a 12 SYNs/18s correlated to node-template-test /readyz. Hetzner (static.117.118.29.2.clients.your-server.de); both leases share this NAT. The leases rotated off 80.200.246.35, so every substrate connection (Postgres/Redis/Temporal/LiteLLM) was dropped by the fail-closed firewall; / and /version served 200 while /readyz 503 after a ~10s connect timeout and pg_stat_activity showed zero cogni_node_template connections. Durable fix = auto-measure egress at boot and self-allowlist; there is still no TS writer for compute_egress_cidrs. (bug.5550)
