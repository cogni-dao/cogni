# LiteLLM Test Config
# Purpose: Routes all model requests to mock-openai-api for deterministic system integration tests.
# Scope: Used when LITELLM_CONFIG=litellm.test.config.yaml (test stacks only). No real provider keys needed.
# Links: https://node-template.cognidao.org/knowledge/node-test-contract
#
# Model names must match TEST_MODEL_ID and friends in tests/_fakes/ai/test-constants.ts.
# All entries route to the same mock-openai-api backend.

model_list:
  # Primary test model — matches TEST_MODEL_ID ("test-model")
  - model_name: test-model
    litellm_params:
      model: openai/mock-gpt-markdown
      api_base: http://mock-llm:3000
      api_key: "os.environ/OPENROUTER_API_KEY"
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
    model_info:
      display_name: "Test Model"
      is_free: false
      provider_key: "mock"
      metadata:
        cogni:
          default_preferred: true

  # Free test model — matches TEST_MODEL_FREE ("test-free-model")
  # Per COST_AUTHORITY_IS_LITELLM: zero pricing so LiteLLM reports response_cost=0 in callback
  - model_name: test-free-model
    litellm_params:
      model: openai/mock-gpt-markdown
      api_base: http://mock-llm:3000
      api_key: "os.environ/OPENROUTER_API_KEY"
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      display_name: "Free Test Model"
      is_free: true
      provider_key: "mock"
      metadata:
        cogni:
          default_free: true

  # Paid test model — matches TEST_MODEL_PAID ("test-paid-model")
  - model_name: test-paid-model
    litellm_params:
      model: openai/mock-gpt-markdown
      api_base: http://mock-llm:3000
      api_key: "os.environ/OPENROUTER_API_KEY"
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
    model_info:
      display_name: "Paid Test Model"
      is_free: false
      provider_key: "mock"

  # Governance alias used by scheduler-core in stack tests
  - model_name: kimi-k2.5
    litellm_params:
      model: openai/mock-gpt-markdown
      api_base: http://mock-llm:3000
      api_key: "os.environ/OPENROUTER_API_KEY"
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
    model_info:
      display_name: "Kimi K2.5 (Test Alias)"
      is_free: false
      provider_key: "mock"

  # Streaming plumbing model (deterministic, no prompt dependence)
  # Used by stack tests that validate SSE parsing without relying on mock-llm fidelity.
  - model_name: mock-stream
    litellm_params:
      model: openai/mock-gpt-markdown
      api_base: http://mock-llm:3000
      api_key: "os.environ/OPENROUTER_API_KEY"
      mock_response: "MOCK_STREAM_OK"
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
    model_info:
      display_name: "Mock Stream (Deterministic)"
      is_free: false
      provider_key: "mock"

litellm_settings:
  include_cost_in_streaming_usage: true
  callbacks: cogni_callbacks.cogni_node_router

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/LITELLM_DATABASE_URL"
  database_type: "postgres"
