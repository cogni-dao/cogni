#
# A sample spawn-facing workload. This is the shape a node repo-spec renders to
# (see nodes/operator/app/src/features/compute-crossplane/render-xakashworkload.ts).
apiVersion: compute.cogni.io/v1alpha1
kind: XAkashWorkload
metadata:
  name: demo-node-app
spec:
  nodeId: "11111111-1111-1111-1111-111111111111"
  publicHost: demo-node.example.com
  providerConfigName: default
  services:
    - name: app
      image: ghcr.io/cogni-dao/node-app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      cpuUnits: 0.5
      memoryMi: 512
      storageMi: 1024
      port: 3000
      visibility: public
