#
# Composition functions used by the XAkashWorkload Composition. Pinned versions.
# go-templating renders the MR;
# auto-ready propagates the MR's readiness to the XR.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.12.4
  packagePullPolicy: IfNotPresent
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.7.0
  packagePullPolicy: IfNotPresent
