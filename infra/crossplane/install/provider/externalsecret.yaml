#
# ESO producer for the Akash Console credential the provider uses. Materializes
# a native k8s Secret (akash-console-credentials) from OpenBao — the credential
# VALUE is never in git. Same ClusterSecretStore (openbao-backend) the rest of
# the substrate uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-console-credentials
  namespace: crossplane-system
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: provider-akash
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-console-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The full Authorization header value (e.g. "Bearer <token>") the provider
    # sends to the Console API. Seed at cogni/<env>/operator :: AKASH_CONSOLE_AUTHORIZATION.
    - secretKey: authorization
      remoteRef:
        key: candidate-a/operator
        property: AKASH_CONSOLE_AUTHORIZATION
