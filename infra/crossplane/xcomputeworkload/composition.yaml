#
# Composition for XComputeWorkload (task.5096). Crossplane owns EVERY generic concern —
# watches, requeue, exponential backoff, finalizers, drift correction, conditions, ownership
# and garbage collection. The only Cogni-specific things in this file are (a) the SHAPE of the
# request it sends to the private Akash transaction actuator (task.5095, cogni#2203) and
# (b) the lowering of the full-fidelity XR onto that actuator's wire contract.
#
# HOW CROSSPLANE INVOKES THE ACTUATOR
#   The actuator's four bounded ops map exactly onto provider-http's four managed-resource
#   actions, so no Cogni code decides WHEN to act:
#       OBSERVE -> POST /v1/akash/observe   (also carries the exact-SHA serving probe)
#       CREATE  -> POST /v1/akash/create    (the ONLY paid transaction)
#       UPDATE  -> POST /v1/akash/update    (in-place SDL replacement; mints no lease)
#       REMOVE  -> POST /v1/akash/delete
#   `isRemovedCheck` turns "no allocation, or a closed one" into Crossplane's "the external
#   resource does not exist", which is what makes CREATE fire exactly once and what lets a
#   deleted XR finish deleting. `expectedResponseCheck` is the ONLY thing that triggers UPDATE.
#
# THE WIRE IS THE 5095 CONTRACT, NOT THIS API. @contracts/compute.akash-tx.v1 is a zod
# strictObject: an unknown key is a 400, never a silently ignored field. So the pipeline LOWERS
# the full-fidelity XR (bundle artifacts, bindings, secret refs, runtime profile, visibility)
# onto exactly `{cogniKey, environment, spec:{name, services[]}}`. Every lowering rule below is
# a port of `toProvisionSpec` + `legacyCogniAppEnv` in the bespoke controller, and the two must
# stay byte-comparable — that equality is what makes this a migration rather than a rewrite.
#
# NO SECRET VALUES CROSS THIS FILE. Each `secretRefs[].key` becomes a provider-http
# `{{ name:namespace:key }}` placeholder. The OSS provider resolves it from the environment's
# existing ESO-managed Secret at request time and preserves the placeholder form in spec,
# status.requestDetails and its own logs. The actuator's bearer token is the same mechanism.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xcomputeworkload-akash
  labels:
    provider: akash
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "1"
spec:
  compositeTypeRef:
    apiVersion: compute.cogni.io/v1alpha1
    kind: XComputeWorkload
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $meta := $xr.metadata }}
            {{- $ns := $meta.namespace }}
            {{- $name := $meta.name }}
            {{- $env := $spec.environment }}
            {{- $wl := $spec.workload }}
            {{- $slug := $wl.name }}
            {{- $desiredSha := $spec.bundle.source.sha }}
            {{- $publicHost := lower (trimSuffix "." $wl.publicHost) }}

            {{- /*
              IDENTITY GATE. The legacy CRD enforced `metadata.name == spec.nodeId` with a
              top-level CEL rule; an XRD schema may only describe spec/status, so the rule
              lives here instead. Failing the render is strictly safer than admitting the
              object: no managed resource is produced, so NOTHING IS SPENT, and Crossplane
              surfaces the message on the XR.
            */ -}}
            {{- if ne $name $spec.nodeId }}
            {{- fail (printf "XComputeWorkload %s/%s: metadata.name must equal spec.nodeId (%s) - one paid workload per node per environment namespace" $ns $name $spec.nodeId) }}
            {{- end }}
            {{- if ne (printf "cogni-%s" $env) $ns }}
            {{- fail (printf "XComputeWorkload %s/%s: spec.environment %s must be reconciled in namespace cogni-%s" $ns $name $env $env) }}
            {{- end }}

            {{- /*
              WHO CONSUMES THE INFRASTRUCTURE (task.5103). Every spend receipt is bound to a node
              id, a composite uid and the composite generation that asked for it, so a paid lease
              is attributable to a node rather than to a wallet. Identity is STATED, never
              derived: the actuator deliberately does not parse `cogniKey`, read the workload
              slug, or infer a node from its Console credential, and this block is the only place
              that says it.

              NOTHING HERE IS DEFAULTED. A defaulted `compositeGeneration` of 1 would record a
              revision that was never observed, and the receipt's CHECK (> 0) would happily
              accept the lie — a fabricated provenance is worse than a refusal, because it is
              indistinguishable from a real one after the fact. Same posture as a bundle.ref with
              no digest: fail the render, produce no managed resource, spend nothing.

              `nodeId` is taken from the SPEC, which the gate above has already proven equal to
              metadata.name — so the two identities the cluster and the ledger use cannot drift.
            */ -}}
            {{- if not (hasKey $meta "generation") }}
            {{- fail (printf "XComputeWorkload %s/%s: metadata.generation is absent; refusing to fabricate a revision that was never observed" $ns $name) }}
            {{- end }}
            {{- $generation := int $meta.generation }}
            {{- if lt $generation 1 }}
            {{- fail (printf "XComputeWorkload %s/%s: metadata.generation %d is not a positive revision" $ns $name $generation) }}
            {{- end }}
            {{- $compositeUid := dig "uid" "" $meta }}
            {{- if eq $compositeUid "" }}
            {{- fail (printf "XComputeWorkload %s/%s: metadata.uid is absent; a receipt that cannot name the object it paid for is unattributable" $ns $name) }}
            {{- end }}
            {{- $identity := dict "nodeId" $spec.nodeId "compositeUid" $compositeUid "compositeGeneration" $generation }}

            {{- /*
              KEY_IS_THE_IDEMPOTENCE_BOUNDARY (@ports/akash-tx.port). The actuator's cogniKey is
              the wallet-wide slot, so here it MUST be stable for the life of the workload. The
              legacy controller's key embedded metadata.generation, which was safe only because
              that controller decided observe-then-create itself. Under Crossplane, provider-http
              asks "does the resource for this key exist?" - a key that changed per reconcile
              would answer "no" after every promote and mint a SECOND PAID LEASE. namespace and
              name are both immutable (name == nodeId), so the only varying component is
              spec.leaseGeneration, which NOTHING bumps implicitly.

              leaseEpoch is the PRE-task.5122 name, and is READ HERE ONLY - no caller writes it
              any more (the materializer emits leaseGeneration exclusively). It stays served
              because XComputeWorkloads committed on deploy/<env>-<node> refs before task.5122
              still carry it; each is converted by its next flight/promote, which rewrites the
              overlay wholesale under the canonical name. REMOVAL GATE (task.5121): delete this
              fallback, and the XRD's leaseEpoch property, only once
              `git grep leaseEpoch $(git for-each-ref --format='%(refname)' refs/remotes/origin/deploy)`
              is empty. Note the fallback is also value-safe in the meantime: an absent field
              digs to 0, which is every un-replaced workload's CURRENT key, so a stale ref can
              only ever resolve DOWN to a key it already spent - never up to a fresh one.

              If both names exist they MUST agree: choosing either side of a mismatch could mint
              a paid replacement unexpectedly, so drift fails the render before any Request
              exists.
            */ -}}
            {{- $hasLeaseEpoch := hasKey $spec "leaseEpoch" }}
            {{- $hasLeaseGeneration := hasKey $spec "leaseGeneration" }}
            {{- if and $hasLeaseEpoch $hasLeaseGeneration (ne (int (get $spec "leaseEpoch")) (int (get $spec "leaseGeneration"))) }}
            {{- fail (printf "XComputeWorkload %s/%s: spec.leaseEpoch and spec.leaseGeneration disagree; refusing to choose an idempotence key" $ns $name) }}
            {{- end }}
            {{- $leaseGeneration := int (dig "leaseEpoch" 0 $spec) }}
            {{- if $hasLeaseGeneration }}{{ $leaseGeneration = int (get $spec "leaseGeneration") }}{{ end }}
            {{- /* task.5132 — $ns was doing THREE jobs. Split the two that are not the
              same question:
                - $cogniKey keeps $ns, so a node's pre-prod lease can never collide with its
                  production one. Reuse would hand the actuator a SETTLED key and it would
                  refuse the mint, which is the correct refusal for the wrong reason.
                - $writerNs resolves WHICH actuator mints it, and therefore which Console
                  account pays. A real node bills production in every lane (NS3), so a
                  pre-prod XR must dial the production writer rather than a Service its own
                  cluster does not run ("preview runs no akash writer",
                  infra/k8s/overlays/preview/operator/kustomization.yaml).
              Default is $ns, so every existing production XR renders byte-identically. */}}
            {{- $writerNs := $ns }}
            {{- if (dig "actuatorNamespace" "" $spec) }}{{ $writerNs = get $spec "actuatorNamespace" }}{{ end }}
            {{- $cogniKey := printf "xcw:%s:%s:%d" $ns $name $leaseGeneration }}
            {{- $baseUrl := printf "http://akash-tx-actuator.%s.svc.cluster.local:8080" $writerNs }}
            {{- $authHeader := printf "Bearer {{ akash-tx-actuator-auth:%s:token }}" $writerNs }}

            {{- /* ------------------------------------------------------------------
              LOWERING: full-fidelity XR -> the actuator's ProvisionSpec.
              Port of toProvisionSpec() + legacyCogniAppEnv() in
              features/compute/compute-workload-reconciler.ts.
            ------------------------------------------------------------------ */ -}}
            {{- $images := dict }}
            {{- range $spec.bundle.artifacts }}{{ $_ := set $images .name .image }}{{ end }}
            {{- $ports := dict }}
            {{- range $wl.services }}{{ $_ := set $ports .name (int .port) }}{{ end }}
            {{- $substrate := dig "runtime" "substrateHost" "" $spec }}
            {{- $logPush := dig "runtime" "logPush" false $spec }}
            {{- $secretName := printf "%s-compute-env-secrets" $slug }}

            {{- /*
              MIGRATION FACTS (bug.5116 order, task.5135 decoupling). Accumulated while lowering
              the services below, because the only service that can owe a migration is the one
              carrying the `cogni-node-app-v1` profile, and the XRD already guarantees there is
              at most one of those.
            */ -}}
            {{- $migrationPolicy := dig "migration" "policy" "RequireBeforeServing" $spec }}
            {{- $appImage := "" }}
            {{- $appDoltgres := false }}

            {{- $services := list }}
            {{- range $svc := $wl.services }}
            {{- $image := index $images $svc.artifact }}
            {{- $profile := dig "runtimeProfile" "" $svc }}
            {{- $isApp := eq $profile "cogni-node-app-v1" }}
            {{- if $isApp }}{{ $appImage = $image }}{{ end }}
            {{- $e := dict }}
            {{- /* bindHost/port contract - identical to the legacy outer env block. */ -}}
            {{- $_ := set $e "HOST" $svc.bindHost }}
            {{- $_ := set $e "HOSTNAME" $svc.bindHost }}
            {{- $_ := set $e "PORT" (printf "%d" (int $svc.port)) }}
            {{- if $isApp }}
            {{- $_ := set $e "APP_ENV" "production" }}
            {{- $_ := set $e "DEPLOY_ENVIRONMENT" $env }}
            {{- $_ := set $e "COGNI_REPO_SHA" $desiredSha }}
            {{- /*
              sharedSubstrateEnv(). The legacy controller derived this host from the DATABASE_URL
              SECRET VALUE; an OSS engine that never sees a secret cannot, so it reads the
              value-free spec.runtime.substrateHost instead. ABSENT degrades exactly like the
              legacy unparseable-DSN branch: the whole block is omitted rather than guessed.
            */ -}}
            {{- if ne $substrate "" }}
            {{- $_ := set $e "TEMPORAL_ADDRESS" (printf "%s:7233" $substrate) }}
            {{- $_ := set $e "TEMPORAL_NAMESPACE" (printf "cogni-%s" $env) }}
            {{- $_ := set $e "TEMPORAL_TASK_QUEUE" "scheduler-tasks" }}
            {{- $_ := set $e "REDIS_URL" (printf "redis://%s:6379" $substrate) }}
            {{- $_ := set $e "LITELLM_BASE_URL" (printf "http://%s:4000" $substrate) }}
            {{- $_ := set $e "SCHEDULER_WORKER_HEALTH_URL" (printf "http://%s:30900" $substrate) }}
            {{- end }}
            {{- end }}
            {{- /* bindings -> sibling service URLs (legacy bindingEnv). */ -}}
            {{- range $k, $target := $svc.bindings }}
            {{- $_ := set $e $k (printf "http://%s:%d" $target (int (index $ports $target))) }}
            {{- end }}
            {{- /*
              VALUE-FREE secret refs -> provider-http placeholders. LITELLM_VIRTUAL_KEY is
              RENAMED to LITELLM_MASTER_KEY for the node-app profile and is not also passed
              under its own name - byte-identical to legacyCogniAppEnv's destructure.
            */ -}}
            {{- range (dig "secretRefs" (list) $svc) }}
            {{- $ref := printf "{{ %s:%s:%s }}" $secretName $ns .key }}
            {{- if and $isApp (eq .key "DOLTGRES_URL") }}{{ $appDoltgres = true }}{{ end }}
            {{- if and $isApp (eq .key "LITELLM_VIRTUAL_KEY") }}
            {{- $_ := set $e "LITELLM_MASTER_KEY" $ref }}
            {{- else }}
            {{- $_ := set $e .key $ref }}
            {{- end }}
            {{- end }}
            {{- if $isApp }}
            {{- /*
              APPLICATION-LOG IDENTITY (bug.5127). The node-template transport labels its
              streams {service="app", service_name=<slug>, node=<nodeId>, env, source="lease"}.
              OPT-IN, unlike the legacy controller: a provider-http placeholder is FAIL-CLOSED
              (an absent secret key fails the whole request) where the controller's direct read
              was fail-open, and LOKI_LEASE_PUSH_* are `required: false` in the secrets catalog.
              Enable it only where operator-env-secrets actually carries all three keys.
            */ -}}
            {{- $_ := set $e "COGNI_NODE_ID" $spec.nodeId }}
            {{- if $logPush }}
            {{- $_ := set $e "LOKI_PUSH_URL" (printf "{{ operator-env-secrets:%s:LOKI_LEASE_PUSH_URL }}" $writerNs) }}
            {{- $_ := set $e "LOKI_PUSH_USER" (printf "{{ operator-env-secrets:%s:LOKI_LEASE_PUSH_USER }}" $writerNs) }}
            {{- $_ := set $e "LOKI_PUSH_PASSWORD" (printf "{{ operator-env-secrets:%s:LOKI_LEASE_PUSH_TOKEN }}" $writerNs) }}
            {{- $_ := set $e "LOKI_PUSH_SOURCE" "lease" }}
            {{- end }}
            {{- /* buildNodeAppIdentityEnv() - these deliberately win over every key above. */ -}}
            {{- $_ := set $e "NODE_NAME" $slug }}
            {{- $_ := set $e "COGNI_REPO_PATH" "/app" }}
            {{- $_ := set $e "AUTH_TRUST_HOST" "true" }}
            {{- $_ := set $e "NEXTAUTH_URL" (printf "https://%s" $publicHost) }}
            {{- $_ := set $e "APP_BASE_URL" (printf "https://%s" $publicHost) }}
            {{- end }}
            {{- /* visibility -> expose. Public is the only service that takes the hostname. */ -}}
            {{- $public := eq $svc.visibility "public" }}
            {{- $expose := dict "port" (int $svc.port) "as" (ternary 80 (int $svc.port) $public) "global" $public }}
            {{- if $public }}{{ $_ := set $expose "hosts" (list $publicHost) }}{{ end }}
            {{- $out := dict "name" $svc.name "image" $image "env" $e "cpuUnits" $svc.cpuUnits "memoryMi" (int $svc.memoryMi) "storageMi" (int $svc.storageMi) "expose" (list $expose) }}
            {{- if hasKey $svc "command" }}{{ $_ := set $out "command" $svc.command }}{{ end }}
            {{- if hasKey $svc "args" }}{{ $_ := set $out "args" $svc.args }}{{ end }}
            {{- $services = append $services $out }}
            {{- end }}
            {{- /*
              THE RELEASE-SIDE MIGRATION STEP (task.5135). It rides on OBSERVE — the UNPAID tick
              — and on nothing else. Buying compute proves nothing about a database, and making
              a DB Job a precondition of a Console POST is exactly what left node toks5 with a
              valid XR, a valid image digest, and NO LEASE IN ANY ENVIRONMENT: its migration
              never ran, so the actuator was never called, and `akash-lease` reported "not yet
              ready" 1044 times with no alarm. The lease is now created regardless; a workload
              whose schema is missing cannot serve its exact SHA and trips BOOT_SLO_OR_CLOSE,
              which is bounded and loud.

              PRESENCE IS THE POLICY. There is no `Skip` member on this wire: a workload with a
              database sends the block, one without omits it. The step is rendered in exactly one
              case — `RequireBeforeServing` with a `cogni-node-app-v1` service to migrate.

              NO COMMANDS ON THE WIRE. `profile` NAMES a command set the actuator owns. A
              caller-supplied command would let anyone who can reach the actuator run an
              arbitrary container against the environment's database under its service account.
            */ -}}
            {{- $migrationStep := dict }}
            {{- if and (eq $migrationPolicy "RequireBeforeServing") (ne $appImage "") }}
            {{- $bundleDigest := regexFind "sha256:[0-9a-f]{64}$" $spec.bundle.ref }}
            {{- if eq $bundleDigest "" }}
            {{- fail (printf "XComputeWorkload %s/%s: spec.bundle.ref %q has no sha256 digest to migrate against" $ns $name $spec.bundle.ref) }}
            {{- end }}
            {{- $migrationStep = dict "profile" "cogni-node-app-v1" "bundleDigest" $bundleDigest "image" $appImage "doltgres" $appDoltgres }}
            {{- end }}
            {{- $hasMigrationStep := gt (len $migrationStep) 0 }}

            {{- /*
              DEPRECATED LOWERING, kept for the zero-downtime field migration only. XRs already
              committed to a deploy ref carry `policy: RequireBeforeTransaction`, and the
              actuator they are reconciled against may still be the pre-task.5135 build that
              REQUIRES `migration` on every mutation. Dropping the field for those would 400 the
              whole fleet mid-rollout, so they keep the old wire byte-for-byte. The current
              actuator parses and IGNORES it.

              No migration runs on this path, and that is safe: a workload only reaches a NEW
              bundle digest by being rematerialized, and any rematerialize writes
              `RequireBeforeServing`. An XR still on the old value is pinned to a digest whose
              migration already succeeded.
            */ -}}
            {{- $legacyMigration := dict }}
            {{- if eq $migrationPolicy "RequireBeforeTransaction" }}
            {{- $legacyMigration = dict "policy" "Skip" }}
            {{- if ne $appImage "" }}
            {{- $legacyDigest := regexFind "sha256:[0-9a-f]{64}$" $spec.bundle.ref }}
            {{- if eq $legacyDigest "" }}
            {{- fail (printf "XComputeWorkload %s/%s: spec.bundle.ref %q has no sha256 digest to prove a migration against" $ns $name $spec.bundle.ref) }}
            {{- end }}
            {{- $legacyMigration = dict "policy" "RequireBeforeTransaction" "profile" "cogni-node-app-v1" "bundleDigest" $legacyDigest "image" $appImage "doltgres" $appDoltgres }}
            {{- end }}
            {{- end }}
            {{- $hasLegacyMigration := gt (len $legacyMigration) 0 }}

            {{- $payload := dict "cogniKey" $cogniKey "environment" $env "identity" $identity "spec" (dict "name" $slug "services" $services) }}
            {{- if $hasMigrationStep }}{{ $_ := set $payload "migrationStep" $migrationStep }}{{ end }}
            {{- if $hasLegacyMigration }}{{ $_ := set $payload "migration" $legacyMigration }}{{ end }}

            {{- /* ---------- observed state ---------- */ -}}
            {{- $observedResources := default (dict) .observed.resources }}
            {{- $leaseObs := index $observedResources "akash-lease" }}
            {{- $resp := dict }}
            {{- $respStatus := 0 }}
            {{- if $leaseObs }}
            {{- $raw := dig "status" "response" "body" "" $leaseObs.resource }}
            {{- if ne $raw "" }}{{ $resp = fromJson $raw }}{{ end }}
            {{- $respStatus = int (dig "status" "response" "statusCode" 0 $leaseObs.resource) }}
            {{- end }}
            {{- /*
              REFUSAL_IS_OBSERVABLE (bug.5115: a wallet block that only reached provider logs was
              invisible for hours). A non-2xx answer carries the actuator's stable `code`, and the
              same body field an observation uses, so the refusal that is currently blocking this
              workload reaches the XR instead of only the provider's logs. An observation has no
              `code`, so the two can never be confused.

              Retryability is read from the HTTP STATUS, not from a table of codes: the actuator
              documents 409 as "conflict, come back later with the same key" and 5xx as unproven,
              while every other 4xx is terminal for this desired state. A code table here would
              have to be edited every time the actuator learns a refusal — the exact coupling
              status.failure.reason is a patterned string rather than an enum to avoid.
            */ -}}
            {{- $refusalCode := dig "code" "" $resp }}
            {{- $refusalMessage := dig "message" "" $resp }}
            {{- $refusalRetryable := or (eq $respStatus 409) (ge $respStatus 500) }}
            {{- $prevResource := dig "status" "resource" (dict) $xr }}
            {{- $found := dig "found" false $resp }}
            {{- $res := dig "resource" (dict) $resp }}
            {{- $state := dig "state" "unknown" $res }}
            {{- $endpoints := dig "endpoints" (list) $res }}
            {{- $externalName := dig "externalName" "" $res }}
            {{- $serving := dig "serving" false $resp }}
            {{- $active := and $found (eq $state "active") }}
            {{- $closed := and $found (eq $state "closed") }}

            {{- /*
              THE RELEASE STEP, READ BACK (task.5135). Only an OBSERVE answer carries a phase —
              a create/update response does not — so the last seen phase is LATCHED through the
              ticks that do not report one. Without the latch, status.migration would blink out
              on exactly the responses an operator is most likely to be staring at.
            */ -}}
            {{- $prevMigrationPhase := dig "status" "migration" "phase" "" $xr }}
            {{- $migrationPhase := dig "migration" "phase" $prevMigrationPhase $resp }}
            {{- $migrationFailed := eq $migrationPhase "failed" }}

            {{- /*
              LATCHED observed bundle. Only a workload that actually SERVED its exact source sha
              may claim to have observed that bundle, and once latched a transient probe failure
              never un-latches it. Both the convergence clause and BOOT_SLO_OR_CLOSE depend on
              this: the deadline may only close a lease that has NEVER served.
            */ -}}
            {{- $prevSha := dig "status" "observedBundle" "source" "sha" "" $xr }}
            {{- $hasServedDesired := or (and $active $serving) (eq $prevSha $desiredSha) }}

            {{- /* ---------- BOOT_SLO_OR_CLOSE ---------- */ -}}
            {{- $bootDeadlineSeconds := int (dig "bootPolicy" "bootDeadlineSeconds" 1800 $spec) }}
            {{- $onDeadline := dig "bootPolicy" "onDeadline" "Hold" $spec }}
            {{- $createdAt := $meta.creationTimestamp }}
            {{- /*
              BOOT EPOCH (bug.5244). The deadline is anchored to the CURRENT boot attempt —
              (bundle sha, leaseGeneration) — not the XR's creationTimestamp. Anchored to
              creation, a never-served XR older than the deadline was a roach motel:
              $closeForBudget latched true, the lease Request stopped rendering, so no
              OBSERVE could ever set $prevSha and no spec change could un-close it. The
              anchor is latched through status.bootEpoch: same key -> keep the recorded
              start; key changed -> this render opens a fresh window. A first render (no
              recorded epoch) keeps creationTimestamp, so every existing XR renders
              byte-identically until its spec next changes.
            */ -}}
            {{- $bootKey := printf "%s:%d" $desiredSha $leaseGeneration }}
            {{- $prevBootKey := dig "status" "bootEpoch" "key" "" $xr }}
            {{- $prevBootAt := dig "status" "bootEpoch" "at" "" $xr }}
            {{- $bootAnchorAt := $createdAt }}
            {{- if and (eq $prevBootKey $bootKey) (ne $prevBootAt "") }}
            {{- $bootAnchorAt = $prevBootAt }}
            {{- else if ne $prevBootKey "" }}
            {{- $bootAnchorAt = dateInZone "2006-01-02T15:04:05Z07:00" now "UTC" }}
            {{- end }}
            {{- $anchorTime := toDate "2006-01-02T15:04:05Z07:00" $bootAnchorAt }}
            {{- $ageSeconds := int (sub (now | unixEpoch) ($anchorTime | unixEpoch)) }}
            {{- $bootDeadlineAt := dateInZone "2006-01-02T15:04:05Z07:00" ($anchorTime | dateModify (printf "%ds" $bootDeadlineSeconds)) "UTC" }}
            {{- $neverServed := and (not $serving) (eq $prevSha "") }}
            {{- $deadlineExceeded := and $neverServed (gt $ageSeconds $bootDeadlineSeconds) }}
            {{- $closeForBudget := and $deadlineExceeded (eq $onDeadline "Close") }}

            {{- /*
              A CLOSED lease is TERMINAL for this XR, and the composed Request stops being
              rendered. Re-creating under the same key would ask the actuator to re-spend a
              settled key (it refuses by design, FAIL_CLOSED), so hammering it would only burn
              provider calls. Replacement is an explicit spec.leaseGeneration bump.
            */ -}}
            {{- $terminallyClosed := and $closed (not $closeForBudget) }}
            {{- $renderLease := not (or $closeForBudget $terminallyClosed) }}

            {{- /*
              BOOT GRACE. `serving` is the convergence signal, so a not-yet-serving workload
              would otherwise look out-of-date and provoke an SDL UPDATE on every poll -
              restarting the very container that is trying to boot. A newly leased workload
              therefore gets BOOT_GRACE_SECONDS of quiet before the convergence clause is armed.
              A redeploy (prevSha set and different) arms it immediately: that lease is already
              serving something, so a replacement SDL is the correct action.
            */ -}}
            {{- $bootGraceSeconds := 600 }}
            {{- $armConvergence := or (gt $ageSeconds $bootGraceSeconds) (and (ne $prevSha "") (ne $prevSha $desiredSha)) }}
            {{- $upToDateLogic := "(.response.body.found == true) and (.response.body.resource.state != \"closed\")" }}
            {{- if $armConvergence }}
            {{- $upToDateLogic = "(.response.body.found == true) and (.response.body.resource.state != \"closed\") and (.response.body.serving == true)" }}
            {{- end }}

            {{- /* ---------- DNS target (bug.5125: never CNAME a host to itself) ---------- */ -}}
            {{- $dns := dig "dns" (dict) $spec }}
            {{- $dnsTarget := "" }}
            {{- range $endpoints }}
            {{- $h := regexReplaceAll "^[A-Za-z][A-Za-z0-9+.-]*://" . "" | splitList "/" | first | splitList ":" | first | lower | trimSuffix "." }}
            {{- if and (eq $dnsTarget "") (ne $h "") (ne $h $publicHost) (not (regexMatch "^[0-9]{1,3}([.][0-9]{1,3}){3}$" $h)) }}
            {{- $dnsTarget = $h }}
            {{- end }}
            {{- end }}

            {{- /*
              PUBLISHED IS AN OBSERVATION, NOT AN INTENT ECHO (bug.5152). `published` used to
              render as "spec.dns is set", so an XR whose Cloudflare write had been failing since
              creation still reported its hostname as published — the one field an operator reads
              to answer "is this node reachable by NAME?" was structurally incapable of saying
              no, and a live, healthy, 200-serving workload looked converged while its public
              name answered 502. It is now read back from the composed dns-record Request's last
              Cloudflare response: true only when a record that IS this composite's desired
              proxied CNAME is actually live in the zone.
            */ -}}
            {{- $dnsObs := index $observedResources "dns-record" }}
            {{- $dnsResp := dict }}
            {{- if $dnsObs }}
            {{- $dnsRaw := dig "status" "response" "body" "" $dnsObs.resource }}
            {{- if ne $dnsRaw "" }}{{ $dnsResp = fromJson $dnsRaw }}{{ end }}
            {{- end }}
            {{- /* Cloudflare answers a LIST with an array and a CREATE/UPDATE with one object. */ -}}
            {{- $dnsResult := dig "result" (list) $dnsResp }}
            {{- $dnsRecords := list }}
            {{- if kindIs "slice" $dnsResult }}{{ $dnsRecords = $dnsResult }}{{ else if kindIs "map" $dnsResult }}{{ $dnsRecords = list $dnsResult }}{{ end }}
            {{- $dnsPublished := false }}
            {{- range $dnsRecords }}
            {{- if and (eq (dig "type" "" .) "CNAME") (eq (dig "content" "" . | lower | trimSuffix ".") $dnsTarget) (dig "proxied" false .) }}
            {{- $dnsPublished = true }}
            {{- end }}
            {{- end }}

            {{- /* ---------- composed: the paid Akash lease ---------- */ -}}
            {{- if $renderLease }}
            ---
            apiVersion: http.m.crossplane.io/v1alpha2
            kind: Request
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: akash-lease
                {{- if and $active $serving }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: cogni-http
              # No deletionPolicy: the NAMESPACED Request has none. managementPolicies defaults
              # to ["*"], which includes Delete - deleting the XR must close the lease and stop
              # the burn, so Orphan is never the right default for a resource that costs money.
              forProvider:
                # allocateAndLease waits for bids, screens providers and confirms the lease.
                # A short timeout would abandon a transaction that is already paid for.
                waitTimeout: 300s
                headers:
                  Content-Type: ["application/json"]
                  Authorization: [{{ $authHeader | quote }}]
                payload:
                  baseUrl: {{ $baseUrl | quote }}
                  body: {{ toJson $payload | quote }}
                mappings:
                  # OBSERVE is the level-triggered tick, and therefore the ONE action that
                  # carries the migration. `workload` + `environment` travel with it because the
                  # actuator refuses to infer WHOSE database a digest belongs to — inferring it
                  # is how "which environment's DB?" became a payment-plane question at all.
                  - action: OBSERVE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/observe")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        {{- /* bug.5237 PHASE 2 (deliberately NOT emitted yet): add
                          `publicHost: {{ $publicHost }}` here so serving is proven through
                          the provider's host-routed path. The actuator's observe schema is
                          a strictObject — emitting the key before every environment's
                          actuator image carries the phase-1 schema turns each observe into
                          a 400 and freezes reconciliation fleet-wide. Flip this line only
                          after the phase-1 actuator is deployed everywhere. */}}
                        expectedSourceSha: {{ $desiredSha | quote }}{{ if $hasMigrationStep }},
                        workload: .payload.body.spec.name,
                        environment: .payload.body.environment,
                        migration: .payload.body.migrationStep{{ end }}
                      }
                  # The PAID transaction. Its body is enumerated rather than `.payload.body`
                  # verbatim so a field added for another action can never leak onto the wire
                  # that spends money — `migrationStep` is exactly such a field, and the create
                  # contract is a strict object that would 400 on it.
                  - action: CREATE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/create")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        environment: .payload.body.environment,
                        identity: .payload.body.identity,
                        spec: .payload.body.spec{{ if $hasLegacyMigration }},
                        migration: .payload.body.migration{{ end }}
                      }
                  - action: UPDATE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/update")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        externalName: .response.body.resource.externalName,
                        environment: .payload.body.environment,
                        identity: .payload.body.identity,
                        spec: .payload.body.spec{{ if $hasLegacyMigration }},
                        migration: .payload.body.migration{{ end }}
                      }
                  - action: REMOVE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/delete")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        externalName: .response.body.resource.externalName
                      }
                expectedResponseCheck:
                  type: CUSTOM
                  logic: {{ $upToDateLogic | quote }}
                # A released allocation still resolves to a handle whose provider state is
                # `closed`, so "found" alone would never go false and the Request could never
                # finish deleting. Closed IS removed.
                isRemovedCheck:
                  type: CUSTOM
                  logic: '(.response.body.found == false) or (.response.body.resource.state == "closed")'
            {{- end }}

            {{- /* ---------- composed: DNS intent ---------- */ -}}
            {{- if and $dns (ne $dnsTarget "") $renderLease }}
            {{- $cfBase := printf "https://api.cloudflare.com/client/v4/zones/%s/dns_records" $dns.zoneId }}
            {{- $cfToken := printf "Bearer {{ operator-env-secrets:%s:CLOUDFLARE_API_TOKEN }}" $writerNs }}
            {{- $cfPayload := dict "name" $publicHost "content" $dnsTarget }}
            {{- /*
              ADOPT BY NAME, NEVER BY TYPE (bug.5152). Cloudflare's list API FILTERS, it does not
              merge: `?type=CNAME&name=<host>` over a host already held by a legacy A record
              returns an EMPTY array, which isRemovedCheck reads as "the external resource does
              not exist". CREATE then fires forever against a name Cloudflare will never admit a
              second record onto (a CNAME is exclusive), the 400 is the steady state, and NOTHING
              ever converts the stale record — while status happily claimed the name was
              published. The HOST is the identity; the record TYPE is desired state. So probe the
              NAME across all types and adopt whatever occupies it, exactly as the bespoke
              reconciler this composition replaces does: CloudflareComputeWorkloadDnsAdapter
              .reconcile() calls findRecords(hostname) with NO type filter and then PUTs the
              CNAME over the live record's id, which is how every other Akash node in the fleet
              got converted from its k3s A record. ci-cd.md Axiom 21 already pinned the mirror
              image of this for the k3s writer ("never `?type=A`, which reads a live CNAME as
              absent"); it is restated here because this is a second, independent writer.

              A/AAAA/CNAME are the only types adopted — they are the address types this composite
              is allowed to own. A name held by anything else (MX, TXT, ...) filters to an empty
              set, so the request fails LOUDLY on CREATE rather than silently converting a record
              this composite never owned. That mirrors the bespoke adapter's DnsOwnershipChanged.

              PROXIED IS LOAD-BEARING, not a preference. The Akash provider's ingress serves a
              `*.ingress.zencloud.eu` certificate, so a grey-cloud CNAME from the cogni name to
              it fails TLS on a subject-name mismatch before a single byte of HTTP is exchanged.
              Cloudflare's orange cloud is what terminates TLS for the cogni name and
              re-originates to the provider; every serving Akash node in the fleet is proxied,
              and so is the bespoke adapter's desired record. `proxied: false` here would have
              published a record that resolves and still cannot be reached.
            */ -}}
            {{- $cfAdoptable := `(.response.body.result // [] | if type == "array" then . else [.] end | map(select(.type == "A" or .type == "AAAA" or .type == "CNAME")))` }}
            ---
            apiVersion: http.m.crossplane.io/v1alpha2
            kind: Request
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: dns-record
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: cogni-http
              forProvider:
                waitTimeout: 30s
                headers:
                  Content-Type: ["application/json"]
                  Authorization: [{{ $cfToken | quote }}]
                payload:
                  baseUrl: {{ $cfBase | quote }}
                  body: {{ toJson $cfPayload | quote }}
                mappings:
                  - action: OBSERVE
                    method: GET
                    url: (.payload.baseUrl + "?name=" + .payload.body.name)
                  - action: CREATE
                    method: POST
                    url: .payload.baseUrl
                    body: |
                      {
                        type: "CNAME",
                        name: .payload.body.name,
                        content: .payload.body.content,
                        ttl: 1,
                        proxied: true
                      }
                  - action: UPDATE
                    method: PUT
                    url: (.payload.baseUrl + "/" + ({{ $cfAdoptable }} | .[0].id))
                    body: |
                      {
                        type: "CNAME",
                        name: .payload.body.name,
                        content: .payload.body.content,
                        ttl: 1,
                        proxied: true
                      }
                  - action: REMOVE
                    method: DELETE
                    url: (.payload.baseUrl + "/" + ({{ $cfAdoptable }} | .[0].id))
                expectedResponseCheck:
                  type: CUSTOM
                  logic: |
                    ({{ $cfAdoptable }} | length) == 1
                    and
                    ({{ $cfAdoptable }} | .[0].type) == "CNAME"
                    and
                    ({{ $cfAdoptable }} | .[0].content) == .payload.body.content
                    and
                    ({{ $cfAdoptable }} | .[0].proxied) == true
                isRemovedCheck:
                  type: CUSTOM
                  logic: |
                    ({{ $cfAdoptable }} | length) == 0
            {{- end }}

            {{- /* ---------- composite status ---------- */ -}}
            {{- $phase := "Progressing" }}
            {{- $failReason := "" }}
            {{- $failMessage := "" }}
            {{- if and $active $serving }}
            {{- $phase = "Ready" }}
            {{- else if $closeForBudget }}
            {{- $phase = "Failed" }}
            {{- $failReason = "BootDeadlineClosed" }}
            {{- $failMessage = printf "workload did not serve %s within %ds; the lease was closed to stop spend" (substr 0 12 $desiredSha) $bootDeadlineSeconds }}
            {{- else if $deadlineExceeded }}
            {{- $phase = "Failed" }}
            {{- $failReason = "BootDeadlineExceeded" }}
            {{- $failMessage = printf "workload did not serve %s within %ds; spend continues because bootPolicy.onDeadline is Hold" (substr 0 12 $desiredSha) $bootDeadlineSeconds }}
            {{- else if and (ne $refusalCode "") (not $refusalRetryable) }}
            {{- $phase = "Failed" }}
            {{- $failReason = $refusalCode }}
            {{- $failMessage = substr 0 256 $refusalMessage }}
            {{- else if $migrationFailed }}
            {{- /*
              A terminal migration failure OUTRANKS a retryable refusal on purpose. The refusal
              says "come back later"; this says "later will not help", and burying the second
              behind the first is how a stall stays invisible. It does NOT outrank a terminal
              refusal, which is about the action actually being attempted, nor the boot deadline,
              which is about money.
            */ -}}
            {{- $phase = "Failed" }}
            {{- $failReason = "MigrationFailed" }}
            {{- $failMessage = printf "database migration for bundle digest of %s failed; a new bundle digest is required. The lease is unaffected - this gates readiness, not payment" (substr 0 12 $desiredSha) }}
            {{- else if ne $refusalCode "" }}
            {{- $phase = "Progressing" }}
            {{- $failReason = $refusalCode }}
            {{- $failMessage = substr 0 256 $refusalMessage }}
            {{- else if $terminallyClosed }}
            {{- $phase = "Failed" }}
            {{- $failReason = "LeaseClosed" }}
            {{- $failMessage = printf "lease %s is closed; bump spec.leaseGeneration to mint a replacement (the actuator refuses to re-spend a settled key)" $externalName }}
            {{- end }}
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            status:
              phase: {{ $phase | quote }}
              serving: {{ and $active $serving }}
              bootDeadlineAt: {{ $bootDeadlineAt | quote }}
              bootEpoch:
                key: {{ $bootKey | quote }}
                at: {{ $bootAnchorAt | quote }}
              {{- if ne $migrationPhase "" }}
              migration:
                phase: {{ $migrationPhase | quote }}
              {{- end }}
              {{- if $hasServedDesired }}
              observedBundle:
                ref: {{ $spec.bundle.ref | quote }}
                source:
                  repository: {{ $spec.bundle.source.repository | quote }}
                  sha: {{ $desiredSha | quote }}
              {{- else if ne $prevSha "" }}
              observedBundle: {{ toJson (dig "status" "observedBundle" (dict) $xr) }}
              {{- end }}
              {{- if $found }}
              resource:
                provider: akash
                id: {{ $externalName | quote }}
                state: {{ $state | quote }}
                endpoints: {{ toJson $endpoints }}
              {{- else if and (ne $refusalCode "") $prevResource }}
              {{- /*
                LATCH THE HANDLE THROUGH A REFUSAL. provider-http overwrites
                status.response.body with the ERROR body of a failed mutation, so a 4xx on
                UPDATE leaves this render with no observation at all — and the naive result is
                that status.resource.id vanishes at the exact moment an operator needs the lease
                handle to diagnose the failure. A refusal is "we did not get to look", NOT "the
                lease is gone", so the last observation is carried forward. A genuine
                `found: false` observation is NOT latched: that one really does mean gone, and
                advertising a stale handle there would be a lie.
              */}}
              resource: {{ toJson $prevResource }}
              {{- end }}
              {{- if ne $dnsTarget "" }}
              dns:
                hostname: {{ $publicHost | quote }}
                target: {{ $dnsTarget | quote }}
                published: {{ $dnsPublished }}
              {{- end }}
              {{- if ne $failReason "" }}
              failure:
                reason: {{ $failReason | quote }}
                message: {{ $failMessage | quote }}
              {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
