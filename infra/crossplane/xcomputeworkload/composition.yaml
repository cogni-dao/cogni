#
# Composition for XComputeWorkload (task.5096). Crossplane owns EVERY generic concern —
# watches, requeue, exponential backoff, finalizers, drift correction, conditions, ownership
# and garbage collection. The only Cogni-specific things in this file are (a) the SHAPE of the
# request it sends to the private Akash transaction actuator (task.5095, cogni#2203) and
# (b) the lowering of the full-fidelity XR onto that actuator's wire contract.
#
# HOW CROSSPLANE INVOKES THE ACTUATOR
#   The actuator's four bounded ops map exactly onto provider-http's four managed-resource
#   actions, so no Cogni code decides WHEN to act:
#       OBSERVE -> POST /v1/akash/observe   (also carries the exact-SHA serving probe)
#       CREATE  -> POST /v1/akash/create    (the ONLY paid transaction)
#       UPDATE  -> POST /v1/akash/update    (in-place SDL replacement; mints no lease)
#       REMOVE  -> POST /v1/akash/delete
#   `isRemovedCheck` turns "no allocation, or a closed one" into Crossplane's "the external
#   resource does not exist", which is what makes CREATE fire exactly once and what lets a
#   deleted XR finish deleting. `expectedResponseCheck` is the ONLY thing that triggers UPDATE.
#
# THE WIRE IS THE 5095 CONTRACT, NOT THIS API. @contracts/compute.akash-tx.v1 is a zod
# strictObject: an unknown key is a 400, never a silently ignored field. So the pipeline LOWERS
# the full-fidelity XR (bundle artifacts, bindings, secret refs, runtime profile, visibility)
# onto exactly `{cogniKey, environment, spec:{name, services[], placement?}}`. Every lowering rule below is
# a port of `toProvisionSpec` + `legacyCogniAppEnv` in the bespoke controller, and the two must
# stay byte-comparable — that equality is what makes this a migration rather than a rewrite.
#
# NO SECRET VALUES CROSS THIS FILE. Each `secretRefs[].key` becomes a provider-http
# `{{ name:namespace:key }}` placeholder. The OSS provider resolves it from the environment's
# existing ESO-managed Secret at request time and preserves the placeholder form in spec,
# status.requestDetails and its own logs. The actuator's bearer token is the same mechanism.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xcomputeworkload-akash
  labels:
    provider: akash
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "1"
spec:
  compositeTypeRef:
    apiVersion: compute.cogni.io/v1alpha1
    kind: XComputeWorkload
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $spec := $xr.spec }}
            {{- $meta := $xr.metadata }}
            {{- $ns := $meta.namespace }}
            {{- $name := $meta.name }}
            {{- $env := $spec.environment }}
            {{- $wl := $spec.workload }}
            {{- $slug := $wl.name }}
            {{- $desiredSha := $spec.bundle.source.sha }}
            {{- $publicHost := lower (trimSuffix "." $wl.publicHost) }}

            {{- /*
              IDENTITY GATE. The legacy CRD enforced `metadata.name == spec.nodeId` with a
              top-level CEL rule; an XRD schema may only describe spec/status, so the rule
              lives here instead. Failing the render is strictly safer than admitting the
              object: no managed resource is produced, so NOTHING IS SPENT, and Crossplane
              surfaces the message on the XR.
            */ -}}
            {{- /*
              ISOLATED_SERVICE_IS_ITS_OWN_LEASE (story.5093). A node may own exactly one more
              workload per isolated service the operator catalog names. Its name is
              `<nodeId>-<instance>`, so the idempotence key below (`xcw:<ns>:<name>:<gen>`)
              is a distinct paid lease while the receipt identity stays the node's nodeId.
              Absent instance keeps the original one-workload-per-node gate byte-for-byte.
            */ -}}
            {{- $instance := dig "instance" "" $spec }}
            {{- $expectedName := $spec.nodeId }}
            {{- if ne $instance "" }}{{ $expectedName = printf "%s-%s" $spec.nodeId $instance }}{{ end }}
            {{- if ne $name $expectedName }}
            {{- fail (printf "XComputeWorkload %s/%s: metadata.name must equal %s (spec.nodeId %s, spec.instance %q) - one paid workload per node per instance per environment namespace" $ns $name $expectedName $spec.nodeId $instance) }}
            {{- end }}
            {{- if ne (printf "cogni-%s" $env) $ns }}
            {{- fail (printf "XComputeWorkload %s/%s: spec.environment %s must be reconciled in namespace cogni-%s" $ns $name $env $env) }}
            {{- end }}

            {{- /*
              WHO CONSUMES THE INFRASTRUCTURE (task.5103). Every spend receipt is bound to a node
              id, a composite uid and the composite generation that asked for it, so a paid lease
              is attributable to a node rather than to a wallet. Identity is STATED, never
              derived: the actuator deliberately does not parse `cogniKey`, read the workload
              slug, or infer a node from its Console credential, and this block is the only place
              that says it.

              NOTHING HERE IS DEFAULTED. A defaulted `compositeGeneration` of 1 would record a
              revision that was never observed, and the receipt's CHECK (> 0) would happily
              accept the lie — a fabricated provenance is worse than a refusal, because it is
              indistinguishable from a real one after the fact. Same posture as a bundle.ref with
              no digest: fail the render, produce no managed resource, spend nothing.

              `nodeId` is taken from the SPEC, which the gate above has already proven equal to
              metadata.name — so the two identities the cluster and the ledger use cannot drift.
            */ -}}
            {{- if not (hasKey $meta "generation") }}
            {{- fail (printf "XComputeWorkload %s/%s: metadata.generation is absent; refusing to fabricate a revision that was never observed" $ns $name) }}
            {{- end }}
            {{- $generation := int $meta.generation }}
            {{- if lt $generation 1 }}
            {{- fail (printf "XComputeWorkload %s/%s: metadata.generation %d is not a positive revision" $ns $name $generation) }}
            {{- end }}
            {{- $compositeUid := dig "uid" "" $meta }}
            {{- if eq $compositeUid "" }}
            {{- fail (printf "XComputeWorkload %s/%s: metadata.uid is absent; a receipt that cannot name the object it paid for is unattributable" $ns $name) }}
            {{- end }}
            {{- $identity := dict "nodeId" $spec.nodeId "compositeUid" $compositeUid "compositeGeneration" $generation }}

            {{- /*
              KEY_IS_THE_IDEMPOTENCE_BOUNDARY (@ports/akash-tx.port). The actuator's cogniKey is
              the wallet-wide slot, so here it MUST be stable for the life of the workload. The
              legacy controller's key embedded metadata.generation, which was safe only because
              that controller decided observe-then-create itself. Under Crossplane, provider-http
              asks "does the resource for this key exist?" - a key that changed per reconcile
              would answer "no" after every promote and mint a SECOND PAID LEASE. namespace and
              name are both immutable (name == nodeId), so spec.leaseGeneration is the only
              operator-controlled varying component. bug.5287 adds only the bounded
              `:recover:<1..3>` child namespace after actor read-back proves the current key is
              closed; transport retries and reconcile ticks never vary either identity.

              leaseEpoch is the PRE-task.5122 name, and is READ HERE ONLY - no caller writes it
              any more (the materializer emits leaseGeneration exclusively). It stays served
              because XComputeWorkloads committed on deploy/<env>-<node> refs before task.5122
              still carry it; each is converted by its next flight/promote, which rewrites the
              overlay wholesale under the canonical name. REMOVAL GATE (task.5121): delete this
              fallback, and the XRD's leaseEpoch property, only once
              `git grep leaseEpoch $(git for-each-ref --format='%(refname)' refs/remotes/origin/deploy)`
              is empty. Note the fallback is also value-safe in the meantime: an absent field
              digs to 0, which is every un-replaced workload's CURRENT key, so a stale ref can
              only ever resolve DOWN to a key it already spent - never up to a fresh one.

              If both names exist they MUST agree: choosing either side of a mismatch could mint
              a paid replacement unexpectedly, so drift fails the render before any Request
              exists.
            */ -}}
            {{- $hasLeaseEpoch := hasKey $spec "leaseEpoch" }}
            {{- $hasLeaseGeneration := hasKey $spec "leaseGeneration" }}
            {{- if and $hasLeaseEpoch $hasLeaseGeneration (ne (int (get $spec "leaseEpoch")) (int (get $spec "leaseGeneration"))) }}
            {{- fail (printf "XComputeWorkload %s/%s: spec.leaseEpoch and spec.leaseGeneration disagree; refusing to choose an idempotence key" $ns $name) }}
            {{- end }}
            {{- $leaseGeneration := int (dig "leaseEpoch" 0 $spec) }}
            {{- if $hasLeaseGeneration }}{{ $leaseGeneration = int (get $spec "leaseGeneration") }}{{ end }}
            {{- /* task.5132 — $ns was doing THREE jobs. Split the two that are not the
              same question:
                - $cogniKey keeps $ns, so a node's pre-prod lease can never collide with its
                  production one. Reuse would hand the actuator a SETTLED key and it would
                  refuse the mint, which is the correct refusal for the wrong reason.
                - $writerNs resolves WHICH actuator mints it, and therefore which Console
                  account pays. A real node bills production in every lane (NS3), so a
                  pre-prod XR must dial the production writer rather than a Service its own
                  cluster does not run ("preview runs no akash writer",
                  infra/k8s/overlays/preview/operator/kustomization.yaml).
              Default is $ns, so every existing production XR renders byte-identically. */}}
            {{- $writerNs := $ns }}
            {{- if (dig "actuatorNamespace" "" $spec) }}{{ $writerNs = get $spec "actuatorNamespace" }}{{ end }}
            {{- $baseCogniKey := printf "xcw:%s:%s:%d" $ns $name $leaseGeneration }}
            {{- $cogniKey := $baseCogniKey }}
            {{- $baseUrl := printf "http://akash-tx-actuator.%s.svc.cluster.local:8080" $writerNs }}
            {{- $authHeader := printf "Bearer {{ akash-tx-actuator-auth:%s:token }}" $writerNs }}

            {{- /* ------------------------------------------------------------------
              LOWERING: full-fidelity XR -> the actuator's ProvisionSpec.
              Port of toProvisionSpec() + legacyCogniAppEnv() in
              the retired features/compute/compute-workload-reconciler.ts (deleted in
              task.5098; read it at commit 4d6fb62d if you need the original).
            ------------------------------------------------------------------ */ -}}
            {{- $images := dict }}
            {{- range $spec.bundle.artifacts }}{{ $_ := set $images .name .image }}{{ end }}
            {{- $ports := dict }}
            {{- range $wl.services }}{{ $_ := set $ports .name (int .port) }}{{ end }}
            {{- $substrate := dig "runtime" "substrateHost" "" $spec }}
            {{- $logPush := dig "runtime" "logPush" false $spec }}
            {{- $secretName := printf "%s-compute-env-secrets" $slug }}

            {{- /*
              MIGRATION FACTS (bug.5116 order, task.5135 decoupling). Accumulated while lowering
              the services below, because the only service that can owe a migration is the one
              carrying the `cogni-node-app-v1` profile, and the XRD already guarantees there is
              at most one of those.
            */ -}}
            {{- $migrationPolicy := dig "migration" "policy" "RequireBeforeServing" $spec }}
            {{- $appImage := "" }}
            {{- $appDoltgres := false }}

            {{- $services := list }}
            {{- range $svc := $wl.services }}
            {{- $image := index $images $svc.artifact }}
            {{- $profile := dig "runtimeProfile" "" $svc }}
            {{- $isApp := eq $profile "cogni-node-app-v1" }}
            {{- if $isApp }}{{ $appImage = $image }}{{ end }}
            {{- $e := dict }}
            {{- /* bindHost/port contract - identical to the legacy outer env block. */ -}}
            {{- $_ := set $e "HOST" $svc.bindHost }}
            {{- $_ := set $e "HOSTNAME" $svc.bindHost }}
            {{- $_ := set $e "PORT" (printf "%d" (int $svc.port)) }}
            {{- if $isApp }}
            {{- $_ := set $e "APP_ENV" "production" }}
            {{- $_ := set $e "DEPLOY_ENVIRONMENT" $env }}
            {{- $_ := set $e "COGNI_REPO_SHA" $desiredSha }}

            {{- /*
              sharedSubstrateEnv(). The legacy controller derived this host from the DATABASE_URL
              SECRET VALUE; an OSS engine that never sees a secret cannot, so it reads the
              value-free spec.runtime.substrateHost instead. ABSENT degrades exactly like the
              legacy unparseable-DSN branch: the whole block is omitted rather than guessed.
            */ -}}
            {{- if ne $substrate "" }}
            {{- $_ := set $e "TEMPORAL_ADDRESS" (printf "%s:7233" $substrate) }}
            {{- $_ := set $e "TEMPORAL_NAMESPACE" (printf "cogni-%s" $env) }}
            {{- $_ := set $e "TEMPORAL_TASK_QUEUE" "scheduler-tasks" }}
            {{- $_ := set $e "REDIS_URL" (printf "redis://%s:6379" $substrate) }}
            {{- $_ := set $e "LITELLM_BASE_URL" (printf "http://%s:4000" $substrate) }}
            {{- $_ := set $e "SCHEDULER_WORKER_HEALTH_URL" (printf "http://%s:30900" $substrate) }}
            {{- end }}
            {{- end }}
            {{- /*
              An isolated-service lease has no node-app profile, but its public service must
              still prove the exact source SHA on /version. It receives the SHA and nothing
              else: no substrate topology, no profile secrets, no log-push credentials.
            */ -}}
            {{- if and (ne $instance "") (eq $svc.visibility "public") }}
            {{- $_ := set $e "COGNI_REPO_SHA" $desiredSha }}
            {{- end }}
            {{- /* bindings -> sibling service URLs (legacy bindingEnv). */ -}}
            {{- range $k, $target := $svc.bindings }}
            {{- $_ := set $e $k (printf "http://%s:%d" $target (int (index $ports $target))) }}
            {{- end }}
            {{- /*
              VALUE-FREE secret refs -> provider-http placeholders. LITELLM_VIRTUAL_KEY is
              RENAMED to LITELLM_MASTER_KEY for the node-app profile and is not also passed
              under its own name - byte-identical to legacyCogniAppEnv's destructure.
            */ -}}
            {{- range (dig "secretRefs" (list) $svc) }}
            {{- $ref := printf "{{ %s:%s:%s }}" $secretName $ns .key }}
            {{- if and $isApp (eq .key "DOLTGRES_URL") }}{{ $appDoltgres = true }}{{ end }}
            {{- if and $isApp (eq .key "LITELLM_VIRTUAL_KEY") }}
            {{- $_ := set $e "LITELLM_MASTER_KEY" $ref }}
            {{- else }}
            {{- $_ := set $e .key $ref }}
            {{- end }}
            {{- end }}
            {{- if $isApp }}
            {{- /*
              APPLICATION-LOG IDENTITY (bug.5127). The node-template transport labels its
              streams {service="app", service_name=<slug>, node=<nodeId>, env, source="lease"}.
              OPT-IN, unlike the legacy controller: a provider-http placeholder is FAIL-CLOSED
              (an absent secret key fails the whole request) where the controller's direct read
              was fail-open, and LOKI_LEASE_PUSH_* are `required: false` in the secrets catalog.
              Enable it only where operator-env-secrets actually carries all three keys.
            */ -}}
            {{- $_ := set $e "COGNI_NODE_ID" $spec.nodeId }}
            {{- /* Owned public pool policy wins after bindings and secret-ref lowering. */ -}}
            {{- $databasePools := dig "runtime" "databasePoolLimits" (dict) $spec }}
            {{- if gt (len $databasePools) 0 }}
            {{- if ne (int $databasePools.replicaCount) 1 }}{{ fail "database pools require exactly one app replica" }}{{ end }}
            {{- $_ := set $e "DB_POOL_MAX" (printf "%d" (int $databasePools.app)) }}
            {{- $_ := set $e "DB_SERVICE_POOL_MAX" (printf "%d" (int $databasePools.service)) }}
            {{- $_ := set $e "DB_READ_POOL_MAX" (printf "%d" (int $databasePools.read)) }}
            {{- end }}
            {{- if $logPush }}
            {{- $_ := set $e "LOKI_PUSH_URL" (printf "{{ operator-env-secrets:%s:LOKI_LEASE_PUSH_URL }}" $writerNs) }}
            {{- $_ := set $e "LOKI_PUSH_USER" (printf "{{ operator-env-secrets:%s:LOKI_LEASE_PUSH_USER }}" $writerNs) }}
            {{- $_ := set $e "LOKI_PUSH_PASSWORD" (printf "{{ operator-env-secrets:%s:LOKI_LEASE_PUSH_TOKEN }}" $writerNs) }}
            {{- $_ := set $e "LOKI_PUSH_SOURCE" "lease" }}
            {{- end }}
            {{- /* buildNodeAppIdentityEnv() - these deliberately win over every key above. */ -}}
            {{- $_ := set $e "NODE_NAME" $slug }}
            {{- $_ := set $e "COGNI_REPO_PATH" "/app" }}
            {{- $_ := set $e "AUTH_TRUST_HOST" "true" }}
            {{- $_ := set $e "NEXTAUTH_URL" (printf "https://%s" $publicHost) }}
            {{- $_ := set $e "APP_BASE_URL" (printf "https://%s" $publicHost) }}
            {{- end }}
            {{- /* visibility -> expose. Public is the only service that takes the hostname. */ -}}
            {{- $public := eq $svc.visibility "public" }}
            {{- $expose := dict "port" (int $svc.port) "as" (ternary 80 (int $svc.port) $public) "global" $public }}
            {{- if $public }}{{ $_ := set $expose "hosts" (list $publicHost) }}{{ end }}
            {{- $out := dict "name" $svc.name "image" $image "env" $e "cpuUnits" $svc.cpuUnits "memoryMi" (int $svc.memoryMi) "storageMi" (int $svc.storageMi) "expose" (list $expose) }}
            {{- if hasKey $svc "command" }}{{ $_ := set $out "command" $svc.command }}{{ end }}
            {{- if hasKey $svc "args" }}{{ $_ := set $out "args" $svc.args }}{{ end }}
            {{- $services = append $services $out }}
            {{- end }}
            {{- /*
              THE RELEASE-SIDE MIGRATION STEP (task.5135). It rides on OBSERVE — the UNPAID tick
              — and on nothing else. Buying compute proves nothing about a database, and making
              a DB Job a precondition of a Console POST is exactly what left node toks5 with a
              valid XR, a valid image digest, and NO LEASE IN ANY ENVIRONMENT: its migration
              never ran, so the actuator was never called, and `akash-lease` reported "not yet
              ready" 1044 times with no alarm. The lease is now created regardless; a workload
              whose schema is missing cannot serve its exact SHA and trips BOOT_SLO_OR_CLOSE,
              which is bounded and loud.

              PRESENCE IS THE POLICY. There is no `Skip` member on this wire: a workload with a
              database sends the block, one without omits it. The step is rendered in exactly one
              case — `RequireBeforeServing` with a `cogni-node-app-v1` service to migrate.

              NO COMMANDS ON THE WIRE. `profile` NAMES a command set the actuator owns. A
              caller-supplied command would let anyone who can reach the actuator run an
              arbitrary container against the environment's database under its service account.
            */ -}}
            {{- $migrationStep := dict }}
            {{- if and (eq $migrationPolicy "RequireBeforeServing") (ne $appImage "") }}
            {{- $bundleDigest := regexFind "sha256:[0-9a-f]{64}$" $spec.bundle.ref }}
            {{- if eq $bundleDigest "" }}
            {{- fail (printf "XComputeWorkload %s/%s: spec.bundle.ref %q has no sha256 digest to migrate against" $ns $name $spec.bundle.ref) }}
            {{- end }}
            {{- $migrationStep = dict "profile" "cogni-node-app-v1" "bundleDigest" $bundleDigest "image" $appImage "doltgres" $appDoltgres }}
            {{- end }}
            {{- $hasMigrationStep := gt (len $migrationStep) 0 }}

            {{- /*
              DEPRECATED LOWERING, kept for the zero-downtime field migration only. XRs already
              committed to a deploy ref carry `policy: RequireBeforeTransaction`, and the
              actuator they are reconciled against may still be the pre-task.5135 build that
              REQUIRES `migration` on every mutation. Dropping the field for those would 400 the
              whole fleet mid-rollout, so they keep the old wire byte-for-byte. The current
              actuator parses and IGNORES it.

              No migration runs on this path, and that is safe: a workload only reaches a NEW
              bundle digest by being rematerialized, and any rematerialize writes
              `RequireBeforeServing`. An XR still on the old value is pinned to a digest whose
              migration already succeeded.
            */ -}}
            {{- $legacyMigration := dict }}
            {{- if eq $migrationPolicy "RequireBeforeTransaction" }}
            {{- $legacyMigration = dict "policy" "Skip" }}
            {{- if ne $appImage "" }}
            {{- $legacyDigest := regexFind "sha256:[0-9a-f]{64}$" $spec.bundle.ref }}
            {{- if eq $legacyDigest "" }}
            {{- fail (printf "XComputeWorkload %s/%s: spec.bundle.ref %q has no sha256 digest to prove a migration against" $ns $name $spec.bundle.ref) }}
            {{- end }}
            {{- $legacyMigration = dict "policy" "RequireBeforeTransaction" "profile" "cogni-node-app-v1" "bundleDigest" $legacyDigest "image" $appImage "doltgres" $appDoltgres }}
            {{- end }}
            {{- end }}
            {{- $hasLegacyMigration := gt (len $legacyMigration) 0 }}

            {{- /*
              story.5050 — lower the XR's HARD placement requirement onto the wire. The wire
              renames `requiredCountries` to `requiredCountryCodes` because the zod contract
              speaks ISO codes explicitly; both are strictObjects, so a typo here is a 400 and
              never a silently unconstrained lease. Absent stays ABSENT: sending an empty list
              would fail closed in the actuator and refuse every bid.
            */ -}}
            {{- $specDict := dict "name" $slug "services" $services }}
            {{- $requiredCountries := dig "placement" "requiredCountries" (list) $spec }}
            {{- if gt (len $requiredCountries) 0 }}
            {{- $_ := set $specDict "placement" (dict "requiredCountryCodes" $requiredCountries) }}
            {{- end }}
            {{- $payload := dict "cogniKey" $cogniKey "environment" $env "identity" $identity "spec" $specDict }}
            {{- if $hasMigrationStep }}{{ $_ := set $payload "migrationStep" $migrationStep }}{{ end }}
            {{- if $hasLegacyMigration }}{{ $_ := set $payload "migration" $legacyMigration }}{{ end }}

            {{- /* ---------- observed state ---------- */ -}}
            {{- $observedResources := default (dict) .observed.resources }}
            {{- /* PAID_KEY_OWNS_CHILD_IDENTITY (bug.5557 r2). Inventory native owners,
              select the exact paid attempt, THEN name it. Never retarget a Request.
              Spec/refs may precede provider status; only a fully bound native spec is
              admissible without a receipt. Conflicting spec/receipt/cache is corruption.
            */ -}}
            {{- $maxRecoveryAttempts := 3 }}
            {{- $onGiveUp := dig "bootPolicy" "onGiveUp" "Hold" $spec }}
            {{- $recoveryCount := 0 }}
            {{- $recovery := dig "status" "recovery" (dict) $xr | default (dict) }}
            {{- if $recovery }}
            {{- $rg := int (get $recovery "leaseGeneration") }}
            {{- $rc := int (get $recovery "count") }}
            {{- $rk := printf "xcw:%s:%s:%d:recover:%d" $ns $name $rg $rc }}
            {{- if or (not (hasKey $recovery "leaseGeneration")) (lt $rg 0) (ne (printf "%v" $recovery.leaseGeneration) (printf "%d" $rg)) (kindIs "string" $recovery.leaseGeneration) (kindIs "string" $recovery.count) (lt $rc 1) (gt $rc 3) (ne (printf "%v" $recovery.count) (printf "%d" $rc)) }}{{ fail "invalid recovery generation/count tuple" }}{{ end }}
            {{- if and (hasKey $recovery "key") (ne $recovery.key $rk) }}{{ fail "recovery key disagrees with generation/count" }}{{ end }}
            {{- if and (hasKey $recovery "maxAttempts") (or (ne (int $recovery.maxAttempts) $maxRecoveryAttempts) (ne (printf "%v" $recovery.maxAttempts) "3") (kindIs "string" $recovery.maxAttempts)) }}{{ fail "recovery cap disagrees with max3" }}{{ end }}
            {{- if eq $rg $leaseGeneration }}{{ $recoveryCount = $rc }}{{ end }}
            {{- end }}
            {{- $recordedCount := $recoveryCount }}
            {{- $currentKey := $baseCogniKey }}
            {{- if gt $recoveryCount 0 }}{{ $currentKey = printf "%s:recover:%d" $baseCogniKey $recoveryCount }}{{ end }}
            {{- $prevBootKey := dig "status" "bootEpoch" "key" "" $xr }}
            {{- if and (ne $prevBootKey "") (not (regexMatch "^[0-9a-f]{40}:(0|[1-9][0-9]*)(:recover:[1-3])?(:unserved|:served)?$" $prevBootKey)) }}{{ fail "malformed boot attempt key" }}{{ end }}
            {{- $prevBootCanonical := regexReplaceAll ":(unserved|served)$" $prevBootKey "" }}
            {{- $bootAttemptSuffix := printf ":%d" $leaseGeneration }}
            {{- if gt $recoveryCount 0 }}{{ $bootAttemptSuffix = printf "%s:recover:%d" $bootAttemptSuffix $recoveryCount }}{{ end }}
            {{- if and (hasSuffix ":served" $prevBootKey) (ne (dig "status" "observedBundle" "source" "sha" "" $xr) (first (splitList ":" $prevBootKey))) }}{{ fail "served boot history conflicts with observed bundle" }}{{ end }}
            {{- $samePaidAttempt := regexMatch (printf "^[0-9a-f]{40}%s$" (regexQuoteMeta $bootAttemptSuffix)) $prevBootCanonical }}
            {{- $prevResource := dig "status" "resource" (dict) $xr | default (dict) }}
            {{- $prevFailure := dig "status" "failure" "reason" "" $xr }}
            {{- $terminalReason := has $prevFailure (list "LeaseClosed" "RecoveryLimitExceeded" "BootDeadlineClosed") }}
            {{- $completeSelection := or (eq $recoveryCount 0) (and (eq (get $recovery "key") $currentKey) (eq (int (get $recovery "maxAttempts")) 3)) }}
            {{- $parkedClosed := and $samePaidAttempt $completeSelection (ne (dig "status" "bootEpoch" "at" "" $xr) "") (ne (dig "id" "" $prevResource) "") (eq (dig "state" "" $prevResource) "closed") (has $prevFailure (list "LeaseClosed" "RecoveryLimitExceeded")) }}
            {{- $parkedBudget := and $samePaidAttempt $completeSelection (ne (dig "status" "bootEpoch" "at" "" $xr) "") (eq $prevFailure "BootDeadlineClosed") (ne (dig "id" "" $prevResource) "") (ne (dig "status" "bootEpoch" "mintedAt" "" $xr | default "") "") }}
            {{- if and $parkedClosed (eq $prevFailure "RecoveryLimitExceeded") (ne $recoveryCount 3) }}{{ fail "terminal recovery tuple is not max3" }}{{ end }}
            {{- if and $terminalReason (or (eq $prevBootKey "") (hasSuffix (printf ":%d" $leaseGeneration) (regexReplaceAll ":recover:[1-3]$" $prevBootCanonical ""))) (not (or $parkedClosed $parkedBudget)) }}{{ fail "incomplete or conflicting terminal attempt tuple" }}{{ end }}

            {{- $leaseRequestGeneration := int (dig "status" "leaseRequestGeneration" -1 $xr) }}
            {{- $activeLeaseGeneration := int (dig "status" "activeLeaseGeneration" -1 $xr) }}
            {{- $activeBaseKey := printf "xcw:%s:%s:%d" $ns $name $activeLeaseGeneration }}
            {{- $desiredKeys := list $baseCogniKey }}
            {{- $activeKeys := list $activeBaseKey }}
            {{- range $attempt := untilStep 1 4 1 }}
            {{- $desiredKeys = append $desiredKeys (printf "%s:recover:%d" $baseCogniKey $attempt) }}
            {{- $activeKeys = append $activeKeys (printf "%s:recover:%d" $activeBaseKey $attempt) }}
            {{- end }}
            {{- $paidKeyPattern := printf "^xcw:%s:%s:(0|[1-9][0-9]*)(:recover:[1-3])?$" (regexQuoteMeta $ns) (regexQuoteMeta $name) }}
            {{- $owners := dict }}
            {{- $childKeys := dict }}
            {{- $closedKeys := dict }}
            {{- $ambiguousKeys := dict }}
            {{- $activeMatches := 0 }}
            {{- range $childName, $child := $observedResources }}
            {{- if hasPrefix "akash-lease" $childName }}
            {{- if not (regexMatch "^akash-lease(-g(0|[1-9][0-9]*)(-recover-[1-3])?)?$" $childName) }}{{ fail "unsupported lease logical name" }}{{ end }}
            {{- $native := $child.resource }}
            {{- if or (ne (dig "apiVersion" "" $native) "http.m.crossplane.io/v1alpha2") (ne (dig "kind" "" $native) "Request") (eq (dig "metadata" "name" "" $native) "") }}{{ fail "invalid native lease Request shape" }}{{ end }}
            {{- $binding := mustFromJson (dig "spec" "forProvider" "payload" "body" "" $native) }}
            {{- if not (kindIs "map" $binding) }}{{ fail "lease child has no native payload binding" }}{{ end }}
            {{- $paidKey := dig "cogniKey" "" $binding }}
            {{- if not (kindIs "string" $paidKey) }}{{ fail "lease child has malformed paid key" }}{{ end }}
            {{- if not (regexMatch $paidKeyPattern $paidKey) }}{{ fail (printf "lease child %s has unsupported paid key %q" $childName $paidKey) }}{{ end }}
            {{- if hasKey $owners $paidKey }}{{ fail "duplicate native owners of one paid key" }}{{ end }}
            {{- if or (ne (dig "environment" "" $binding) $env) (ne (dig "identity" "nodeId" "" $binding) $spec.nodeId) (ne (dig "identity" "compositeUid" "" $binding) $compositeUid) (lt (int (dig "identity" "compositeGeneration" 0 $binding)) 1) (ne (dig "metadata" "namespace" "" $native) $ns) (eq (dig "metadata" "uid" "" $native) "") (ne (dig "metadata" "annotations" "crossplane.io/composition-resource-name" "" $native) $childName) }}{{ fail "lease child native identity/binding mismatch" }}{{ end }}
            {{- $controllers := 0 }}
            {{- range (dig "metadata" "ownerReferences" (list) $native) }}
            {{- if (dig "controller" false .) }}
            {{- $controllers = add1 $controllers }}
            {{- if or (ne .uid $compositeUid) (ne .name $name) (ne .kind $xr.kind) (ne .apiVersion $xr.apiVersion) }}{{ fail "lease child has another controller owner" }}{{ end }}
            {{- end }}
            {{- end }}
            {{- if ne (int $controllers) 1 }}{{ fail "lease child requires one XR controller owner" }}{{ end }}
            {{- $recordedHandle := "" }}
            {{- $bodyRaw := dig "status" "requestDetails" "body" "" $native }}
            {{- if eq $bodyRaw "" }}
            {{- /* Receipt-free adoption needs the required AkashTxSpec/ServiceSpec
              creation fields, not just a paid key. Check the stored intent's own
              shape; never compare an older payload to the current release. Optional
              wire fields and full strict schema validation remain actuator-owned.
            */ -}}
            {{- $provision := get $binding "spec" }}
            {{- if not (kindIs "map" $provision) }}{{ fail "unrecorded child requires complete provision spec" }}{{ end }}
            {{- $serviceNamePattern := "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" }}
            {{- $provisionName := get $provision "name" }}
            {{- if or (not (kindIs "string" $provisionName)) (gt (len $provisionName) 63) (not (regexMatch $serviceNamePattern $provisionName)) }}{{ fail "unrecorded child requires complete provision spec: invalid name" }}{{ end }}
            {{- $provisionServices := get $provision "services" }}
            {{- if or (not (kindIs "slice" $provisionServices)) (eq (len $provisionServices) 0) }}{{ fail "unrecorded child requires complete provision spec: nonempty services required" }}{{ end }}
            {{- range $service := $provisionServices }}
            {{- if not (kindIs "map" $service) }}{{ fail "unrecorded child requires complete provision spec: invalid service" }}{{ end }}
            {{- $serviceName := get $service "name" }}
            {{- $serviceImage := get $service "image" }}
            {{- if or (not (kindIs "string" $serviceName)) (gt (len $serviceName) 63) (not (regexMatch $serviceNamePattern $serviceName)) (not (kindIs "string" $serviceImage)) (eq $serviceImage "") }}{{ fail "unrecorded child requires complete provision spec: invalid service name/image" }}{{ end }}
            {{- $cpu := get $service "cpuUnits" }}
            {{- if or (not (kindIs "float64" $cpu)) (le $cpu (float64 0)) }}{{ fail "unrecorded child requires complete provision spec: positive service cpuUnits required" }}{{ end }}
            {{- range $field := list "memoryMi" "storageMi" }}
            {{- $size := get $service $field }}
            {{- if or (not (kindIs "float64" $size)) (le $size (float64 0)) (ne $size (floor $size)) }}{{ fail "unrecorded child requires complete provision spec: positive integer service memoryMi/storageMi required" }}{{ end }}
            {{- end }}
            {{- end }}
            {{- $parts := splitList ":" $paidKey }}
            {{- $nativeName := printf "akash-lease-g%s" (index $parts 3) }}
            {{- if eq (len $parts) 6 }}{{ $nativeName = printf "%s-recover-%s" $nativeName (index $parts 5) }}{{ end }}
            {{- if not (or (eq $childName $nativeName) (and (eq (len $parts) 4) (eq $childName "akash-lease"))) }}{{ fail "unrecorded child is not the exact native creation intent" }}{{ end }}
            {{- end }}
            {{- if ne $bodyRaw "" }}
            {{- $body := mustFromJson $bodyRaw }}
            {{- if not (kindIs "map" $body) }}{{ fail "malformed requestDetails" }}{{ end }}
            {{- $recordedHandle = dig "externalName" "" $body }}
            {{- if ne (dig "cogniKey" "" $body) $paidKey }}{{ fail "native spec and recorded paid key disagree" }}{{ end }}
            {{- if and (hasKey $body "environment") (ne $body.environment $env) }}{{ fail "recorded lease environment conflicts" }}{{ end }}
            {{- if and (hasKey $body "identity") (or (ne $body.identity.nodeId $spec.nodeId) (ne $body.identity.compositeUid $compositeUid)) }}{{ fail "recorded lease identity conflicts" }}{{ end }}
            {{- else if or (not (empty (dig "status" "response" (dict) $native))) (not (empty (dig "status" "cache" (dict) $native))) (ne (dig "metadata" "annotations" "crossplane.io/external-name" "" $native) "") }}
            {{- fail "lease child has external evidence without a recorded paid key" }}
            {{- end }}
            {{- $handle := "" }}
            {{- range $slot := list "response" "cache" }}
            {{- $response := dig "status" $slot (dict) $native }}
            {{- if eq $slot "cache" }}{{ $response = dig "response" (dict) $response }}{{ end }}
            {{- $raw := dig "body" "" $response }}
            {{- if ne $raw "" }}
            {{- $answer := mustFromJson $raw }}
            {{- if not (kindIs "map" $answer) }}{{ fail "malformed lease response/cache" }}{{ end }}
            {{- $allocation := dig "resource" $answer $answer }}
            {{- if not (kindIs "map" $allocation) }}{{ fail "malformed lease allocation" }}{{ end }}
            {{- $ownHandle := dig "externalName" "" $allocation }}
            {{- if and (ne $handle "") (ne $ownHandle "") (ne $ownHandle $handle) }}{{ fail "lease response/cache handle conflict" }}{{ end }}
            {{- if ne $ownHandle "" }}{{ $handle = $ownHandle }}{{ end }}
            {{- $code := int (dig "statusCode" 0 $response) }}
            {{- if and (eq $slot "response") (ge $code 200) (lt $code 300) (ne $ownHandle "") (dig "found" true $answer) (eq (dig "state" "" $allocation) "closed") }}{{ $_ := set $closedKeys $paidKey true }}{{ end }}
            {{- end }}
            {{- end }}
            {{- if and (ne $recordedHandle "") (ne $handle "") (ne $recordedHandle $handle) }}{{ fail "recorded cleanup handle conflicts with own allocation" }}{{ end }}
            {{- /* Compare independently bound history BEFORE normalizing status or
              permitting retirement. Both park kinds, and their first retaining pass,
              must agree with every own cleanup handle, including cache-only evidence.
            */ -}}
            {{- if and $samePaidAttempt (eq $paidKey $currentKey) (ne (dig "id" "" $prevResource) "") }}
            {{- if or (and (ne $handle "") (ne $handle $prevResource.id)) (and (ne $recordedHandle "") (ne $recordedHandle $prevResource.id)) }}{{ fail "bound attempt handle conflicts with own cleanup evidence" }}{{ end }}
            {{- end }}
            {{- range (dig "status" "conditions" (list) $native) }}
            {{- if contains "cannot determine creation result" (dig "message" "" .) }}{{ $_ := set $ambiguousKeys $paidKey true }}{{ end }}
            {{- end }}
            {{- $_ := set $owners $paidKey $childName }}
            {{- $_ := set $childKeys $childName $paidKey }}
            {{- if and (ge $activeLeaseGeneration 0) (ne $activeLeaseGeneration $leaseGeneration) (has $paidKey $activeKeys) (not (hasKey $closedKeys $paidKey)) }}
            {{- $activeMatches = add1 $activeMatches }}
            {{- if gt $activeMatches 1 }}{{ fail "multiple live children match active paid-key family" }}{{ end }}
            {{- if not (empty (dig "metadata" "deletionTimestamp" "" $native)) }}{{ fail "active lease child is deleting" }}{{ end }}
            {{- end }}
            {{- else }}
            {{- $unqualifiedRaw := dig "spec" "forProvider" "payload" "body" "" $child.resource }}
            {{- if ne $unqualifiedRaw "" }}
            {{- $unqualified := mustFromJson $unqualifiedRaw }}
            {{- if and (kindIs "map" $unqualified) (hasKey $unqualified "cogniKey") }}{{ fail "paid child has an unsupported logical name" }}{{ end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* The only adjacency proof is CURRENT closure. No maximum-ordinal adoption.
              Retain its native spec until the successor selection survives a status read.
            */ -}}
            {{- $stagedChildren := dict }}
            {{- $closedForCurrentKey := and (hasKey $closedKeys $currentKey) (not (hasKey $ambiguousKeys $currentKey)) }}
            {{- $recoveryExhausted := and $closedForCurrentKey (ge $recoveryCount $maxRecoveryAttempts) }}
            {{- $heldClosed := and $closedForCurrentKey (ne $onGiveUp "Replace") }}
            {{- if and $closedForCurrentKey (not $recoveryExhausted) (eq $onGiveUp "Replace") (not (or $parkedClosed $parkedBudget)) }}
            {{- $oldName := get $owners $currentKey }}
            {{- if not (empty (dig "metadata" "deletionTimestamp" "" (index $observedResources $oldName).resource)) }}{{ fail "selected lease child is deleting" }}{{ end }}
            {{- $_ := set $stagedChildren $oldName (index $observedResources $oldName) }}
            {{- $recoveryCount = add1 $recoveryCount }}
            {{- $currentKey = printf "%s:recover:%d" $baseCogniKey $recoveryCount }}
            {{- $closedForCurrentKey = hasKey $closedKeys $currentKey }}
            {{- $heldClosed = false }}
            {{- $recoveryExhausted = false }}
            {{- end }}
            {{- range $i, $k := $desiredKeys }}
            {{- if hasKey $owners $k }}
            {{- if or (gt (int $i) (int $recoveryCount)) (and (lt (int $i) (int $recoveryCount)) (not (hasKey $closedKeys $k))) }}{{ fail "unexplained ahead/behind paid attempt" }}{{ end }}
            {{- end }}
            {{- end }}
            {{- $leaseResourceName := get $owners $currentKey }}
            {{- if ne $leaseResourceName "" }}
            {{- if and (not (or $parkedClosed $parkedBudget)) (not (empty (dig "metadata" "deletionTimestamp" "" (index $observedResources $leaseResourceName).resource))) }}{{ fail "selected lease child is deleting" }}{{ end }}
            {{- if and (gt $recordedCount 0) (not $completeSelection) (eq (dig "status" "requestDetails" "body" "" (index $observedResources $leaseResourceName).resource) "") }}{{ fail "legacy recovery repair requires its exact recorded paid receipt" }}{{ end }}
            {{- $leaseRequestGeneration = -1 }}
            {{- if regexMatch "^akash-lease-g[0-9]+$" $leaseResourceName }}{{ $leaseRequestGeneration = int (trimPrefix "akash-lease-g" $leaseResourceName) }}{{ end }}
            {{- else }}
            {{- if and (gt $recordedCount 0) (not $completeSelection) }}{{ fail "legacy recovery requires its exact observed receipt" }}{{ end }}
            {{- if and (eq (int $recoveryCount) (int $recordedCount)) (or $samePaidAttempt (and (eq $prevBootKey "") (eq $activeLeaseGeneration $leaseGeneration))) (or (ne (dig "id" "" $prevResource) "") (ne (dig "status" "bootEpoch" "mintedAt" "" $xr | default "") "")) (not (or $parkedClosed $parkedBudget)) }}{{ fail "allocated selected child disappeared without terminal proof" }}{{ end }}
            {{- if and (gt $recordedCount 0) (not $samePaidAttempt) }}{{ fail "missing successor lacks durable selection tuple" }}{{ end }}
            {{- $leaseResourceName = "akash-lease" }}
            {{- if gt $recoveryCount 0 }}
            {{- $leaseResourceName = printf "akash-lease-g%d-recover-%d" $leaseGeneration $recoveryCount }}
            {{- else if or (ge $leaseRequestGeneration 0) (hasKey $observedResources "akash-lease") }}
            {{- $leaseRequestGeneration = $leaseGeneration }}
            {{- $leaseResourceName = printf "akash-lease-g%d" $leaseGeneration }}
            {{- end }}
            {{- if index $observedResources $leaseResourceName }}{{ fail "deterministic lease name already holds another paid key" }}{{ end }}
            {{- end }}
            {{- $attemptChanged := ne (int $recoveryCount) (int $recordedCount) }}
            {{- if or $attemptChanged (not $samePaidAttempt) }}{{ $prevResource = dict }}{{ end }}
            {{- $cogniKey = $currentKey }}
            {{- $_ := set $payload "cogniKey" $cogniKey }}
            {{- /*
              OVERLAP_BEFORE_CLOSE (bug.5322). Crossplane garbage-collects whatever this function
              stops rendering, and for a LIVE, SERVING lease that GC is a REMOVE ->
              /v1/akash/delete. So the block above — which advances the child name the instant
              spec.leaseGeneration is bumped — ALSO closes the incumbent lease before its
              replacement has served a single request (toks4, 2026-09-30: /readyz 503, stale sha,
              no lease). A lease close is IRREVERSIBLE and its idempotence key is refused forever
              once settled, so the only correct ordering is: mint the replacement -> prove it
              serving -> flip DNS -> THEN close the outgoing one.

              status.activeLeaseGeneration is the generation this XR has actually PROVEN serving
              (written only on `active && serving`, the same signals the Ready phase uses). While
              it names a generation OTHER than the desired one, the child holding that
              generation's key keeps being rendered ALONGSIDE the candidate, so nothing GCs it and
              nothing closes its lease. The candidate still enters through CREATE under its own
              fresh key exactly as before, and the last-known-good DNS latch below — which keys on
              the CANDIDATE's $active/$serving — keeps the public name on the incumbent until the
              candidate genuinely serves. Once it does, status.activeLeaseGeneration advances, this
              block stops matching on the NEXT reconcile, and the incumbent GCs through the
              ORDINARY REMOVE path: exactly once, after the cutover. No new close call exists.

              THE RETAINED CHILD IS FOUND BY ITS KEY, NEVER REBUILT FROM ONE. A lease minted under
              a bounded `:recover:<n>` child key must be CLOSED under that same key, and the only
              trustworthy record of which key minted it is the child's own requestDetails body —
              the same source $responseKey reads below. Deriving the key from
              $activeLeaseGeneration alone would hand REMOVE a key the actuator never allocated
              and leave a live lease billing forever. Searching the observed children by key also
              survives the double-bump case: a second bump during an overlap still finds the
              PROVEN-SERVING child rather than the never-served candidate of the first bump.

              RETENTION ENDS ONLY ON A POSITIVE OBSERVATION. provider-http overwrites
              status.response.body with the ERROR body of a failed mutation (the fact bug.5188's
              DNS latch already defends against), and that body has no `found` at all — so
              treating "not observed found" as "nothing to protect" would close the live lease on
              a transient refusal. The presence of the `found` KEY is what distinguishes an
              OBSERVE answer from a refusal body or a create/update echo, so $retainedGone
              requires one: observed, and either gone or closed. An observed `closed` is what
              keeps today's ordinary replace-a-terminally-spent-lease flow (PR #2582, toks5
              preview) byte-identical — a closed outgoing lease is not retained at all, so only
              the candidate renders. An observed `found: false` ends retention for the OTHER
              reason: isRemovedCheck would read it as "does not exist" and CREATE under a settled
              key every reconcile forever, which is the Axiom 26 churn $renderLease fences below.

              BOOTSTRAP IS ZERO-CHURN. Every XR in the fleet omits status.activeLeaseGeneration
              today, which digs to -1 and disables this block entirely — such an XR renders
              exactly as it does on main. The field is adopted the first time that workload is
              observed `active && serving`, after which its next bump is protected.
            */ -}}
            {{- $retainedResourceName := "" }}
            {{- $retainedKey := "" }}
            {{- $retainedResp := dict }}
            {{- if and (ge $activeLeaseGeneration 0) (ne $activeLeaseGeneration $leaseGeneration) }}
            {{- range $childName, $child := $observedResources }}
            {{- if and (eq $retainedResourceName "") (hasPrefix "akash-lease" $childName) (ne $childName $leaseResourceName) }}
            {{- $childKey := get $childKeys $childName }}
            {{- if and (has $childKey $activeKeys) (not (hasKey $closedKeys $childKey)) }}
            {{- $retainedResourceName = $childName }}
            {{- $retainedKey = $childKey }}
            {{- $childRaw := dig "status" "response" "body" "" $child.resource }}
            {{- if ne $childRaw "" }}{{ $retainedResp = fromJson $childRaw }}{{ end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $retainedRes := dig "resource" $retainedResp $retainedResp }}
            {{- $retainedState := dig "state" "unknown" $retainedRes }}
            {{- $retainedFound := dig "found" (ne (dig "externalName" "" $retainedRes) "") $retainedResp }}
            {{- $retainedObserved := hasKey $retainedResp "found" }}
            {{- $retainedGone := and $retainedObserved (or (not $retainedFound) (eq $retainedState "closed")) }}
            {{- $holdOutgoingLease := and (ne $retainedResourceName "") (not $retainedGone) }}
            {{- /* The retained child carries the CURRENT lowering under the INCUMBENT's key. Only
              the key is load-bearing: it is what REMOVE closes, and it is read back from the
              child's own request body, never reconstructed. */ -}}
            {{- $retainedPayload := dict }}
            {{- if $holdOutgoingLease }}
            {{- $retainedPayload = fromJson (toJson $payload) }}
            {{- $_ := set $retainedPayload "cogniKey" $retainedKey }}
            {{- end }}
            {{- /*
              OBSERVE-ONLY BY CONSTRUCTION. expectedResponseCheck is the ONLY thing that triggers
              UPDATE, and an UPDATE on the incumbent is an in-place SDL replacement — it would
              restart the live workload on the CANDIDATE's image, which is the opposite of holding
              it. This logic is satisfied by every response under which the child is retained
              (`active`, or an error body whose `.resource.state` is null), and the one response
              that falsifies it — a positive `closed` — is one of the two observations that stop
              the child being rendered at all. So provider-http only ever OBSERVEs the incumbent.
              CREATE is unreachable for the same reason: isRemovedCheck (unchanged below) fires
              only on an observed `closed` or `found: false`, and $retainedGone has already
              stopped rendering the child in both of those cases.
            */ -}}
            {{- $retainedUpToDateLogic := "(.response.body.resource.state != \"closed\")" }}
            {{- $leaseObs := index $observedResources $leaseResourceName }}
            {{- $resp := dict }}
            {{- $respStatus := 0 }}
            {{- $leaseCreatePending := "" }}
            {{- $leaseCreateAmbiguous := false }}
            {{- if $leaseObs }}
            {{- $raw := dig "status" "response" "body" "" $leaseObs.resource }}
            {{- if ne $raw "" }}{{ $resp = fromJson $raw }}{{ end }}
            {{- $respStatus = int (dig "status" "response" "statusCode" 0 $leaseObs.resource) }}
            {{- $leaseAnnotations := dig "metadata" "annotations" (dict) $leaseObs.resource }}
            {{- $leaseCreatePending = get $leaseAnnotations "crossplane.io/external-create-pending" | default "" }}
            {{- range (dig "status" "conditions" (list) $leaseObs.resource) }}
            {{- if contains "cannot determine creation result" (dig "message" "" .) }}
            {{- $leaseCreateAmbiguous = true }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $responseKey := "" }}
            {{- $lastRequestedSha := "" }}
            {{- if $leaseObs }}
            {{- $requestBodyRaw := dig "status" "requestDetails" "body" "" $leaseObs.resource }}
            {{- if ne $requestBodyRaw "" }}
            {{- $requestBody := mustFromJson $requestBodyRaw }}
            {{- $responseKey = dig "cogniKey" "" $requestBody }}
            {{- $lastRequestedSha = dig "expectedSourceSha" "" $requestBody }}
            {{- end }}
            {{- end }}
            {{- /*
              REFUSAL_IS_OBSERVABLE (bug.5115: a wallet block that only reached provider logs was
              invisible for hours). A non-2xx answer carries the actuator's stable `code`, and the
              same body field an observation uses, so the refusal that is currently blocking this
              workload reaches the XR instead of only the provider's logs. An observation has no
              `code`, so the two can never be confused.

              Retryability is read from the HTTP STATUS, not from a table of codes: the actuator
              documents 409 as "conflict, come back later with the same key" and 5xx as unproven,
              while every other 4xx is terminal for this desired state. A code table here would
              have to be edited every time the actuator learns a refusal — the exact coupling
              status.failure.reason is a patterned string rather than an enum to avoid.
            */ -}}
            {{- $refusalCode := dig "code" "" $resp }}
            {{- $refusalMessage := dig "message" "" $resp }}
            {{- $refusalRetryable := or (eq $respStatus 409) (ge $respStatus 500) }}
            {{- /* OBSERVE wraps the resource; CREATE/UPDATE return it directly. Normalize both
              shapes so a replayed settled key cannot masquerade as an empty response and spin
              forever. */ -}}
            {{- $res := dig "resource" $resp $resp }}
            {{- $state := dig "state" "unknown" $res }}
            {{- $endpoints := dig "endpoints" (list) $res }}
            {{- $externalName := dig "externalName" "" $res }}
            {{- $found := dig "found" (ne $externalName "") $resp }}
            {{- /* A found flag is not an allocation handle. Refuse the whole frame
              before status/child output, including parks: history must never satisfy
              a completeness guard while this incomplete answer supplies emitted status.
            */ -}}
            {{- if and $found (eq $externalName "") }}{{ fail "found allocation requires a nonempty own handle" }}{{ end }}
            {{- $isCurrentObservation := false }}
            {{- if $leaseObs }}{{ $isCurrentObservation = and (eq (dig "status" "requestDetails" "method" "" $leaseObs.resource) "POST") (eq (dig "status" "requestDetails" "url" "" $leaseObs.resource) (printf "%s/v1/akash/observe" $baseUrl)) }}{{ end }}
            {{- $serving := and $isCurrentObservation (ge $respStatus 200) (lt $respStatus 300) (eq $responseKey $currentKey) (eq $lastRequestedSha $desiredSha) (hasKey $resp "found") (dig "serving" false $resp) }}
            {{- $active := and $found (eq $state "active") }}
            {{- $closed := and $found (eq $state "closed") (ge $respStatus 200) (lt $respStatus 300) (eq $responseKey $currentKey) (ne $externalName "") }}
            {{- /* History is not liveness. Preserve the unchanged paid attempt through
              unproven responses regardless of error-code spelling or cache presence.
              A successful current OBSERVE of absence still clears the resource.
              These predicates never make found/active/serving/closed true.
            */ -}}
            {{- $observedAbsent := and $isCurrentObservation (ge $respStatus 200) (lt $respStatus 300) (hasKey $resp "found") (not $found) }}
            {{- $retainResourceHistory := and $samePaidAttempt (not $attemptChanged) (ne (dig "id" "" $prevResource) "") (not $observedAbsent) }}
            {{- if or $parkedClosed $parkedBudget }}
            {{- if and $parkedClosed (ne $externalName "") (ge $respStatus 200) (lt $respStatus 300) (ne $state "closed") }}{{ fail "closed terminal tuple conflicts with selected allocation state" }}{{ end }}
            {{- $externalName = get $prevResource "id" }}
            {{- $state = get $prevResource "state" }}
            {{- $endpoints = dig "endpoints" (list) $prevResource }}
            {{- $found = true }}
            {{- $active = false }}
            {{- $serving = false }}
            {{- $closed = $parkedClosed }}
            {{- $heldClosed = and $parkedClosed (eq $prevFailure "LeaseClosed") }}
            {{- $recoveryExhausted = and $parkedClosed (eq $prevFailure "RecoveryLimitExceeded") }}
            {{- end }}
            {{- /* HOST_ADMITTED_BY_THE_CANDIDATE (story.5038 K2, 2026-10-16). `serving` is a
              host-routed probe against the candidate's endpoint presenting Host: <publicHost>.
              When the candidate and the incumbent sit on the SAME provider and run the SAME
              SHA, the provider's shared ingress answers that probe from the INCUMBENT's host
              rule, so `serving` is true for a candidate whose own host rule the provider never
              admitted. Measured: spawny-boi gen-7 serving=true with endpoints
              [dkb00v1l...ingress.zencloud.eu] only; DNS moved to it, gen-6 closed, and the
              public host went nginx 404. A provider lists every host it admitted for a lease
              among that lease's endpoints (every serving lease in the fleet does; gen-6 listed
              spawny-boi-test.cogni-testing.org). So a lease proves it can take public traffic
              only when its OWN endpoints carry the public host. */ -}}
            {{- $hostAdmitted := eq $publicHost "" }}
            {{- range $endpoints }}
            {{- if eq (regexReplaceAll "^[A-Za-z][A-Za-z0-9+.-]*://" . "" | splitList "/" | first | splitList ":" | first | lower | trimSuffix ".") $publicHost }}{{ $hostAdmitted = true }}{{ end }}
            {{- end }}

            {{- /*
              THE RELEASE STEP, READ BACK (task.5135). Only an OBSERVE answer carries a phase —
              a create/update response does not — so the last seen phase is LATCHED through the
              ticks that do not report one. Without the latch, status.migration would blink out
              on exactly the responses an operator is most likely to be staring at.
            */ -}}
            {{- $prevMigrationPhase := dig "status" "migration" "phase" "" $xr }}
            {{- $migrationPhase := dig "migration" "phase" $prevMigrationPhase $resp }}
            {{- /*
              FAILURE IS NEVER LATCHED (bug.5309). $migrationPhase above deliberately falls
              back to the PREVIOUS phase so status.migration does not blink out on the ticks
              that carry no migration answer — that latch is for DISPLAY and is correct. But
              deciding the XR is terminally Failed from a latched value makes one transient
              `failed` permanent: the actuator then reports `succeeded` on every later tick and
              the XR keeps re-emitting MigrationFailed forever, because a response WITHOUT a
              migration phase re-reads the stale `failed` out of its own status.
              Observed on toks4 candidate-a: Job succeeded=1/failed=0, pod logged
              "migrate complete: 1 migration(s) applied + verified", database present, actuator
              logged akash_tx_migration_succeeded x6 — and the XR sat Failed/MigrationFailed
              with an empty observedBundle and a 404 edge, with no path forward.
              So the TERMINAL decision reads the CURRENT response only. No fresh `failed`, no
              failure. Same correction shape as bug.5301's DNS gate and #2464's None sentinel.
            */ -}}
            {{- $migrationFailed := eq (dig "migration" "phase" "" $resp) "failed" }}

            {{- /*
              LATCHED observed bundle. Only a workload that actually SERVED its exact source sha
              may claim to have observed that bundle, and once latched a transient probe failure
              never un-latches it. Both the convergence clause and BOOT_SLO_OR_CLOSE depend on
              this: the deadline may only close a lease that has NEVER served.
            */ -}}
            {{- $prevSha := dig "status" "observedBundle" "source" "sha" "" $xr }}

            {{- /*
              RECEIPT-BACKED CREATE-AMBIGUITY RECOVERY (bug.5464). provider-http's generic
              leak guard is correct for resources whose CREATE may allocate a different paid
              object when retried. This actuator is deliberately stronger: cogniKey is stable,
              and its durable ledger permits exactly one allocation for that key. A transport or
              kube-apiserver interruption can still strand the generic guard after the actuator
              has returned the existing allocation, which froze Red production on its prior SHA.

              Release that guard only when FOUR independent facts agree: provider-http itself
              reports the ambiguity; the pending timestamp exists; provider-http's current OR
              cached successful response is a real found:true OBSERVE (not a CREATE/UPDATE echo);
              that observation is active with a non-empty external handle under the exact current
              cogniKey. A previously served desired SHA is history, not allocation identity: using
              it to refuse this acknowledgement strands an existing lease after a later response
              loses serving. The cache fallback is necessary
              because provider-http overwrites status.response with a later transient refusal while
              preserving its last successful observation in status.cache.response. It is used only
              when the current response has no `found` key, and the cached response itself must be
              2xx, found:true, active, and handle-bearing. Mirroring pending into succeeded then
              permits OBSERVE — it does not vary cogniKey or leaseGeneration. If the external
              resource disappeared after that observation, the actuator's one-allocation-per-key
              ledger remains the final duplicate-spend fence. Any missing proof stays fail-closed.
            */ -}}
            {{- $leaseReceiptResp := $resp }}
            {{- $leaseReceiptStatus := $respStatus }}
            {{- if and $leaseObs (not (hasKey $resp "found")) }}
            {{- $leaseCacheRaw := dig "status" "cache" "response" "body" "" $leaseObs.resource }}
            {{- if ne $leaseCacheRaw "" }}
            {{- $leaseCacheResp := fromJson $leaseCacheRaw }}
            {{- $leaseCacheStatus := int (dig "status" "cache" "response" "statusCode" 0 $leaseObs.resource) }}
            {{- $leaseCacheRes := dig "resource" (dict) $leaseCacheResp }}
            {{- $leaseCacheFound := dig "found" false $leaseCacheResp }}
            {{- $leaseCacheState := dig "state" "unknown" $leaseCacheRes }}
            {{- $leaseCacheExternalName := dig "externalName" "" $leaseCacheRes }}
            {{- if and (ge $leaseCacheStatus 200) (lt $leaseCacheStatus 300) (hasKey $leaseCacheResp "found") $leaseCacheFound (eq $leaseCacheState "active") (ne $leaseCacheExternalName "") }}
            {{- $leaseReceiptResp = $leaseCacheResp }}
            {{- $leaseReceiptStatus = $leaseCacheStatus }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $leaseReceiptRes := dig "resource" (dict) $leaseReceiptResp }}
            {{- $leaseReceiptObserved := hasKey $leaseReceiptResp "found" }}
            {{- $leaseReceiptFound := dig "found" false $leaseReceiptResp }}
            {{- $leaseReceiptState := dig "state" "unknown" $leaseReceiptRes }}
            {{- $leaseReceiptExternalName := dig "externalName" "" $leaseReceiptRes }}
            {{- $leaseReceiptProven := and (ge $leaseReceiptStatus 200) (lt $leaseReceiptStatus 300) $leaseReceiptObserved $leaseReceiptFound (eq $leaseReceiptState "active") (ne $leaseReceiptExternalName "") (eq $responseKey $currentKey) }}
            {{- /* Match runtime v2.3.3 meta.ExternalCreateIncomplete: malformed
              timestamps parse to zero; pending must be strictly newer than BOTH
              succeeded and failed. Equal timestamps discharge the native guard.
              A nonempty malformed pending value never authorizes an acknowledgement.
            */ -}}
            {{- $leaseCreatePendingTime := toDate "2006-01-02T15:04:05Z07:00" $leaseCreatePending }}
            {{- $leaseCreateIncomplete := false }}
            {{- if $leaseObs }}
            {{- $leaseAnnotations := dig "metadata" "annotations" (dict) $leaseObs.resource }}
            {{- $leaseCreateSucceededTime := toDate "2006-01-02T15:04:05Z07:00" (get $leaseAnnotations "crossplane.io/external-create-succeeded" | default "") }}
            {{- $leaseCreateFailedTime := toDate "2006-01-02T15:04:05Z07:00" (get $leaseAnnotations "crossplane.io/external-create-failed" | default "") }}
            {{- $leaseCreateIncomplete = and (not $leaseCreatePendingTime.IsZero) ($leaseCreatePendingTime.After $leaseCreateSucceededTime) ($leaseCreatePendingTime.After $leaseCreateFailedTime) }}
            {{- end }}
            {{- $recoverLeaseCreateAmbiguity := and $leaseCreateAmbiguous (not $leaseCreatePendingTime.IsZero) $leaseReceiptProven }}
            {{- $unsafeLeaseCreateAmbiguity := and $leaseCreateAmbiguous (not $recoverLeaseCreateAmbiguity) }}
            {{- if and (or $parkedClosed $parkedBudget) $unsafeLeaseCreateAmbiguity }}{{ fail "terminal park has an unproven ambiguous create result" }}{{ end }}
            {{- /*
              TARGETED REQUEUE AFTER A LOST PROVIDER EVENT (bug.0001). A transient kube-apiserver
              refusal can strand one provider-http Request even while its sibling Requests keep
              polling. Re-rendering the same XR does not help when the managed child never
              observes its new body. Crossplane Runtime v2.3.3's official reconcile-requested-at
              annotation is the narrow recovery seam: request one extra reconcile ONLY while
              both durable receipts prove this child missed the desired bundle — the XR has not
              served it, and the Request's last wire body did not name it.

              The token is derived solely from desired state, so it is stable across ordinary
              ticks and changes on the next real revision. It never enters cogniKey, never bumps
              leaseGeneration, and cannot mint a replacement lease. Healthy and intentionally
              down workloads whose Request already observed their current SHA are untouched.
            */ -}}
            {{- $needsLeaseRequeue := and (ne $prevSha $desiredSha) (ne $lastRequestedSha $desiredSha) }}

            {{- /* ---------- BOOT_SLO_OR_CLOSE ---------- */ -}}
            {{- $bootDeadlineSeconds := int (dig "bootPolicy" "bootDeadlineSeconds" 1800 $spec) }}
            {{- $onDeadline := dig "bootPolicy" "onDeadline" "Hold" $spec }}
            {{- $createdAt := $meta.creationTimestamp }}
            {{- /*
              BOOT EPOCH (bug.5244). The deadline is anchored to the CURRENT boot attempt —
              (bundle sha, leaseGeneration) — not the XR's creationTimestamp. Anchored to
              creation, a never-served XR older than the deadline was a roach motel:
              $closeForBudget latched true, the lease Request stopped rendering, so no
              OBSERVE could ever set $prevSha and no spec change could un-close it. The
              at/key retain the attempt's render time. The spend deadline starts only
              after the current paid allocation is observed (bug.5551). An unallocated
              attempt must keep rendering its Request, even after a long pause/refusal.
            */ -}}
            {{- $bootKey := printf "%s:%d" $desiredSha $leaseGeneration }}
            {{- if gt $recoveryCount 0 }}{{ $bootKey = printf "%s:recover:%d" $bootKey $recoveryCount }}{{ end }}
            {{- $sameBootAttempt := and (not $attemptChanged) (eq $prevBootCanonical $bootKey) }}
            {{- /* Qualified history belongs to this paid attempt. A bare legacy key is
              conservatively protected only at its unchanged canonical tuple. Qualifying
              the key never restarts the clock. CREATE echoes cannot prove service.
            */ -}}
            {{- $hasServedDesired := or (and $active $serving) (and $sameBootAttempt (eq $prevSha $desiredSha) (or (hasSuffix ":served" $prevBootKey) (eq $prevBootKey $prevBootCanonical))) }}
            {{- $bootStatusKey := printf "%s:unserved" $bootKey }}
            {{- if $hasServedDesired }}{{ $bootStatusKey = printf "%s:served" $bootKey }}{{ end }}
            {{- if and $sameBootAttempt (eq $prevBootKey $prevBootCanonical) (eq $prevSha $desiredSha) (not (and $active $serving)) }}{{ $bootStatusKey = $prevBootKey }}{{ end }}
            {{- $prevBootAt := dig "status" "bootEpoch" "at" "" $xr }}
            {{- $bootAnchorAt := $createdAt }}
            {{- if and $sameBootAttempt (ne $prevBootAt "") }}
            {{- $bootAnchorAt = $prevBootAt }}
            {{- else if or $attemptChanged (ne $prevBootKey "") }}
            {{- $bootAnchorAt = dateInZone "2006-01-02T15:04:05Z07:00" now "UTC" }}
            {{- end }}
            {{- /* A parked tuple remains bound to the old attempt even after a SHA edit.
              Omission/GC is not external closure, and does not authorize a new paid key.
            */ -}}
            {{- if or $parkedClosed $parkedBudget }}
            {{- $bootStatusKey = $prevBootKey }}
            {{- $bootAnchorAt = $prevBootAt }}
            {{- end }}
            {{- $mintedAt := "" }}
            {{- if or $sameBootAttempt $parkedClosed $parkedBudget }}
            {{- $mintedAt = dig "status" "bootEpoch" "mintedAt" "" $xr | default "" }}
            {{- end }}
            {{- if and (eq $mintedAt "") $found (not $closed) (ne $externalName "") (eq $responseKey $currentKey) (ge $respStatus 200) (lt $respStatus 300) }}
            {{- $mintedAt = dateInZone "2006-01-02T15:04:05Z07:00" now "UTC" }}
            {{- end }}
            {{- $anchorTime := toDate "2006-01-02T15:04:05Z07:00" $bootAnchorAt }}
            {{- $ageSeconds := int (sub (now | unixEpoch) ($anchorTime | unixEpoch)) }}
            {{- $mintTime := toDate "2006-01-02T15:04:05Z07:00" (default $bootAnchorAt $mintedAt) }}
            {{- $mintAgeSeconds := int (sub (now | unixEpoch) ($mintTime | unixEpoch)) }}
            {{- $bootDeadlineAt := dateInZone "2006-01-02T15:04:05Z07:00" ($mintTime | dateModify (printf "%ds" $bootDeadlineSeconds)) "UTC" }}
            {{- /* Never-served is attempt-scoped; historical same-SHA service by a
              predecessor cannot exempt a successor from its own paid boot deadline. */ -}}
            {{- $deadlineExceeded := and (not $closed) (not $parkedClosed) (ne $mintedAt "") (not $hasServedDesired) (gt $mintAgeSeconds $bootDeadlineSeconds) }}
            {{- $closeForBudget := or $parkedBudget (and $deadlineExceeded (eq $onDeadline "Close")) }}
            {{- /* Never persist a terminal discriminator that the next render cannot
              validate. Absence is not closure: if it erased the only usable handle,
              deny this frame rather than poison the earlier tuple or invent liveness.
            */ -}}
            {{- /* The SAME selected resource drives both this guard and status emission. */ -}}
            {{- $statusResource := dict }}
            {{- if and $found (ne $externalName "") }}
            {{- $statusResource = dict "provider" "akash" "id" $externalName "state" $state "endpoints" $endpoints }}
            {{- else if $retainResourceHistory }}
            {{- $statusResource = $prevResource }}
            {{- end }}
            {{- if and $closeForBudget (or (eq $bootAnchorAt "") (eq $mintedAt "") (eq (dig "id" "" $statusResource) "")) }}{{ fail "budget retirement requires complete bound allocation history" }}{{ end }}

            {{- /* B1: persist the complete terminal/retirement tuple while retaining
              its native child. Only a later read of that tuple may omit it. Crossplane
              GCs/persists refs before applying children and patching XR status.
            */ -}}
            {{- if and (or $closeForBudget $recoveryExhausted $heldClosed) (not (or $parkedClosed $parkedBudget)) $leaseObs }}
            {{- $_ := set $stagedChildren $leaseResourceName $leaseObs }}
            {{- end }}
            {{- /* Native GC precedes child apply and XR status. Keep the SAME retiring
              Request until observed metadata clears the pre-Observe/pre-Delete guard.
              Repeated lost applies/status patches therefore re-emit only the existing
              exact-active current/cache proof acknowledgement, never a new paid intent.
            */ -}}
            {{- if or $closeForBudget $recoveryExhausted $heldClosed $parkedClosed }}
            {{- if or $unsafeLeaseCreateAmbiguity (and $leaseCreateIncomplete (not $recoverLeaseCreateAmbiguity)) }}{{ fail "terminal retirement has an unproven pending create result" }}{{ end }}
            {{- if $leaseCreateIncomplete }}{{ $_ := set $stagedChildren $leaseResourceName $leaseObs }}{{ end }}
            {{- end }}
            {{- $renderLease := not (or $closeForBudget $recoveryExhausted $heldClosed $parkedClosed) }}

            {{- /*
              BOOT GRACE. `serving` is the convergence signal, so a not-yet-serving workload
              would otherwise look out-of-date and provoke an SDL UPDATE on every poll -
              restarting the very container that is trying to boot. A newly leased workload
              therefore gets BOOT_GRACE_SECONDS of quiet before the convergence clause is armed.
              A redeploy (prevSha set and different) arms it immediately: that lease is already
              serving something, so a replacement SDL is the correct action.
            */ -}}
            {{- $bootGraceSeconds := 600 }}
            {{- $armConvergence := or (gt $ageSeconds $bootGraceSeconds) (and (ne $prevSha "") (ne $prevSha $desiredSha)) }}
            {{- $upToDateLogic := "(.response.body.found == true) and (.response.body.resource.state != \"closed\")" }}
            {{- if $armConvergence }}
            {{- $upToDateLogic = "(.response.body.found == true) and (.response.body.resource.state != \"closed\") and (.response.body.serving == true)" }}
            {{- end }}

            {{- /* ---------- DNS target (bug.5125: never point a host to itself) ---------- */ -}}
            {{- $dns := dig "dns" (dict) $spec }}
            {{- /* Prefer a provider hostname because it survives ingress-IP rotation. Some
              providers expose ONLY an IPv4 ingress, though (bug.5340 / RHITE). Keep the first
              IPv4 as a fallback instead of discarding the only routable target. */ -}}
            {{- $dnsHostnameTarget := "" }}
            {{- $dnsIpv4Target := "" }}
            {{- range $endpoints }}
            {{- $h := regexReplaceAll "^[A-Za-z][A-Za-z0-9+.-]*://" . "" | splitList "/" | first | splitList ":" | first | lower | trimSuffix "." }}
            {{- if and (ne $h "") (ne $h $publicHost) }}
            {{- if regexMatch "^[0-9]{1,3}([.][0-9]{1,3}){3}$" $h }}
            {{- if eq $dnsIpv4Target "" }}{{ $dnsIpv4Target = $h }}{{ end }}
            {{- else if eq $dnsHostnameTarget "" }}
            {{- $dnsHostnameTarget = $h }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $dnsTarget := $dnsHostnameTarget }}
            {{- if eq $dnsTarget "" }}{{ $dnsTarget = $dnsIpv4Target }}{{ end }}

            {{- /* LAST-KNOWN-GOOD DNS LATCH (bug.5188). status.response.body is overwritten with the
               ERROR body of a failed mutation (see the lease-handle latch below), which has no endpoints,
               so $dnsTarget collapses to "" mid-promote. Omitting the dns-record child then GC-deletes the
               live Cloudflare record -> NXDOMAIN. Latch the last-known-good target from status exactly like
               $prevSha/$prevResource: never withdraw a live record for a transient endpoint-less observe, and
               only FLIP to a genuinely-new target once the new revision actually serves (PROVE_BEFORE_TRAFFIC). */ -}}
            {{- $prevDnsTarget := dig "status" "dns" "target" "" $xr }}
            {{- $effectiveDnsTarget := $dnsTarget }}
            {{- if eq $dnsTarget "" }}
            {{- $effectiveDnsTarget = $prevDnsTarget }}
            {{- else if and (ne $prevDnsTarget "") (ne $dnsTarget $prevDnsTarget) (not (and $active $serving $hostAdmitted)) }}
            {{- $effectiveDnsTarget = $prevDnsTarget }}
            {{- end }}
            {{- $dnsRecordType := "CNAME" }}
            {{- if regexMatch "^[0-9]{1,3}([.][0-9]{1,3}){3}$" $effectiveDnsTarget }}
            {{- $dnsRecordType = "A" }}
            {{- end }}

            {{- /*
              PUBLISHED IS AN OBSERVATION, NOT AN INTENT ECHO (bug.5152). `published` used to
              render as "spec.dns is set", so an XR whose Cloudflare write had been failing since
              creation still reported its hostname as published — the one field an operator reads
              to answer "is this node reachable by NAME?" was structurally incapable of saying
              no, and a live, healthy, 200-serving workload looked converged while its public
              name answered 502. It is now read back from the composed dns-record Request's last
              Cloudflare response: true only when a record that IS this composite's desired
              proxied record of the target-derived type is actually live in the zone.
            */ -}}
            {{- $dnsObs := index $observedResources "dns-record" }}
            {{- $dnsResp := dict }}
            {{- $dnsCreatePending := "" }}
            {{- $dnsCreateAmbiguous := false }}
            {{- if $dnsObs }}
            {{- $dnsRaw := dig "status" "response" "body" "" $dnsObs.resource }}
            {{- if ne $dnsRaw "" }}{{ $dnsResp = fromJson $dnsRaw }}{{ end }}
            {{- /*
              SAFE CREATE-AMBIGUITY RECOVERY (bug.5341). provider-http writes
              external-create-pending before CREATE and normally follows with
              external-create-succeeded. If the controller is interrupted between those writes,
              Crossplane correctly refuses to guess whether CREATE happened. DNS is the narrow
              case where we do not need to guess: OBSERVE is name-addressed, and the desired
              writer adopts an existing A/AAAA/CNAME before deciding whether CREATE is needed.
              Once the provider itself reports that exact ambiguity, mirror its pending timestamp
              into succeeded so the next reconcile performs the authoritative name lookup. Never
              do this merely because pending exists — the provider must already have latched the
              leak-prevention refusal. Lease Requests are deliberately outside this recovery.
            */ -}}
            {{- $dnsAnnotations := dig "metadata" "annotations" (dict) $dnsObs.resource }}
            {{- $dnsCreatePending = get $dnsAnnotations "crossplane.io/external-create-pending" | default "" }}
            {{- range (dig "status" "conditions" (list) $dnsObs.resource) }}
            {{- if contains "cannot determine creation result" (dig "message" "" .) }}
            {{- $dnsCreateAmbiguous = true }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Cloudflare answers a LIST with an array and a CREATE/UPDATE with one object. */ -}}
            {{- $dnsResult := dig "result" (list) $dnsResp }}
            {{- $dnsRecords := list }}
            {{- if kindIs "slice" $dnsResult }}{{ $dnsRecords = $dnsResult }}{{ else if kindIs "map" $dnsResult }}{{ $dnsRecords = list $dnsResult }}{{ end }}
            {{- $dnsPublished := false }}
            {{- /* CUTOVER_IS_OBSERVED_AT_THE_CANDIDATE (bug.5322, measured twice on 2026-10-08).
              $dnsPublished answers "does the live record match what we currently INTEND", and
              during a cutover the intent ($effectiveDnsTarget) is still the INCUMBENT's target
              while the latch holds -- so it is true immediately and cannot gate the close. Gating
              on it closed the incumbent anyway and the public host 404'd for ~7 minutes, twice.
              $dnsCutoverObserved is the signal the close actually needs: the live record carries
              the CANDIDATE's own target ($dnsTarget, derived from the candidate child's observed
              endpoints), so it cannot be true until the edge genuinely moved. Empty $dnsTarget --
              a candidate with no endpoints yet -- can never satisfy it. It cannot pass trivially
              on a target the incumbent shares, either: provider ingress hostnames are per lease,
              and an IPv4-only candidate (bug.5340) is never $serving because the host-routed probe
              rejects IP-literal endpoints (safe-version-probe.ts). */}}
            {{- $dnsCutoverObserved := false }}
            {{- range $dnsRecords }}
            {{- if and (eq (dig "type" "" .) $dnsRecordType) (dig "proxied" false .) }}
            {{- $recordContent := dig "content" "" . | lower | trimSuffix "." }}
            {{- if eq $recordContent $effectiveDnsTarget }}{{ $dnsPublished = true }}{{ end }}
            {{- if and (ne $dnsTarget "") (eq $recordContent $dnsTarget) }}{{ $dnsCutoverObserved = true }}{{ end }}
            {{- end }}
            {{- end }}
            {{- $edgeCutoverObserved := or (not $dns) $dnsCutoverObserved }}

            {{- /* Closed predecessors/first-pass parks keep their own spec and mappings.
              Normalizing each child's own response supports direct CREATE replay and
              wrapped OBSERVE; provider-http may fall back only to that child's cache.
              isRemovedCheck can skip REMOVE: omission is never settlement proof.
            */ -}}
            {{- range $childName, $child := $stagedChildren }}
            {{- $cleanupSpec := mustFromJson (toJson $child.resource.spec) }}
            {{- range $mapping := $cleanupSpec.forProvider.mappings }}
            {{- if has $mapping.action (list "UPDATE" "REMOVE") }}
            {{- $_ := set $mapping "body" (replace "externalName: .response.body.resource.externalName" "externalName: (.response.body.resource.externalName // .response.body.externalName)" $mapping.body) }}
            {{- end }}
            {{- end }}
            {{- $_ := set $cleanupSpec.forProvider "isRemovedCheck" (dict "type" "CUSTOM" "logic" `(.response.body.found == false) or ((.response.body.resource.state // .response.body.state) == "closed")`) }}
            {{- /* Retain this child's ALREADY sufficient native success annotation.
              Otherwise SSA can revoke an applied acknowledgement after its condition
              clears but before XR status persists. This copies observed metadata only;
              it cannot discharge a newer pending timestamp or borrow another child's proof.
            */ -}}
            {{- $cleanupAnnotations := dig "metadata" "annotations" (dict) $child.resource }}
            {{- $cleanupPendingTime := toDate "2006-01-02T15:04:05Z07:00" (get $cleanupAnnotations "crossplane.io/external-create-pending" | default "") }}
            {{- $cleanupSucceeded := get $cleanupAnnotations "crossplane.io/external-create-succeeded" | default "" }}
            {{- $cleanupSucceededTime := toDate "2006-01-02T15:04:05Z07:00" $cleanupSucceeded }}
            {{- if or $cleanupPendingTime.IsZero $cleanupSucceededTime.IsZero ($cleanupPendingTime.After $cleanupSucceededTime) }}{{ $cleanupSucceeded = "" }}{{ end }}
            {{- if and (eq $childName $leaseResourceName) $recoverLeaseCreateAmbiguity (eq $cleanupSucceeded "") }}{{ $cleanupSucceeded = $leaseCreatePending }}{{ end }}
            ---
            apiVersion: http.m.crossplane.io/v1alpha2
            kind: Request
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $childName }}
                {{- if ne $cleanupSucceeded "" }}
                crossplane.io/external-create-succeeded: {{ $cleanupSucceeded | quote }}
                {{- end }}
            spec: {{ toJson $cleanupSpec }}
            {{- end }}

            {{- /* ---------- composed: the OUTGOING Akash lease, held open ---------- */ -}}
            {{- /* bug.5322. A DELIBERATE COPY of the lease Request below, differing in exactly
              four places — the composition-resource-name, the absent `ready` annotation, the
              payload (the incumbent's own key) and expectedResponseCheck (observe-only). The
              mappings and isRemovedCheck are byte-identical on purpose: REMOVE is how this child
              eventually closes its lease, so it must speak the same wire as the child that
              minted it. They are pinned equal by
              tests/ci-invariants/crossplane-xcomputeworkload.spec.ts so the copy cannot drift.
              It is NOT folded into one `range` over two children because the candidate block's
              exact bytes are the thing bug.5322's fix must not disturb. */ -}}
            {{- if $holdOutgoingLease }}
            ---
            apiVersion: http.m.crossplane.io/v1alpha2
            kind: Request
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $retainedResourceName }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: cogni-http
              forProvider:
                waitTimeout: 300s
                headers:
                  Content-Type: ["application/json"]
                  Authorization: [{{ $authHeader | quote }}]
                payload:
                  baseUrl: {{ $baseUrl | quote }}
                  body: {{ toJson $retainedPayload | quote }}
                mappings:
                  - action: OBSERVE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/observe")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        publicHost: {{ $publicHost | quote }},
                        expectedSourceSha: {{ $desiredSha | quote }}{{ if $hasMigrationStep }},
                        workload: .payload.body.spec.name,
                        environment: .payload.body.environment,
                        migration: .payload.body.migrationStep{{ end }}
                      }
                  - action: CREATE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/create")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        environment: .payload.body.environment,
                        identity: .payload.body.identity,
                        spec: .payload.body.spec{{ if $hasLegacyMigration }},
                        migration: .payload.body.migration{{ end }}
                      }
                  - action: UPDATE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/update")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        externalName: (.response.body.resource.externalName // .response.body.externalName),
                        environment: .payload.body.environment,
                        identity: .payload.body.identity,
                        spec: .payload.body.spec{{ if $hasLegacyMigration }},
                        migration: .payload.body.migration{{ end }}
                      }
                  - action: REMOVE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/delete")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        externalName: (.response.body.resource.externalName // .response.body.externalName)
                      }
                expectedResponseCheck:
                  type: CUSTOM
                  logic: {{ $retainedUpToDateLogic | quote }}
                isRemovedCheck:
                  type: CUSTOM
                  logic: '(.response.body.found == false) or ((.response.body.resource.state // .response.body.state) == "closed")'
            {{- end }}

            {{- /* ---------- composed: the paid Akash lease ---------- */ -}}
            {{- if $renderLease }}
            ---
            apiVersion: http.m.crossplane.io/v1alpha2
            kind: Request
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $leaseResourceName }}
                {{- if $needsLeaseRequeue }}
                crossplane.io/reconcile-requested-at: {{ printf "%s:%d" $desiredSha $generation | quote }}
                {{- end }}
                {{- if $recoverLeaseCreateAmbiguity }}
                crossplane.io/external-create-succeeded: {{ $leaseCreatePending | quote }}
                {{- end }}
                {{- if and $active $serving }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: cogni-http
              # No deletionPolicy: the NAMESPACED Request has none. managementPolicies defaults
              # to ["*"], which includes Delete - deleting the XR must close the lease and stop
              # the burn, so Orphan is never the right default for a resource that costs money.
              forProvider:
                # allocateAndLease waits for bids, screens providers and confirms the lease.
                # A short timeout would abandon a transaction that is already paid for.
                waitTimeout: 300s
                headers:
                  Content-Type: ["application/json"]
                  Authorization: [{{ $authHeader | quote }}]
                payload:
                  baseUrl: {{ $baseUrl | quote }}
                  body: {{ toJson $payload | quote }}
                mappings:
                  # OBSERVE is the level-triggered tick, and therefore the ONE action that
                  # carries the migration. `workload` + `environment` travel with it because the
                  # actuator refuses to infer WHOSE database a digest belongs to — inferring it
                  # is how "which environment's DB?" became a payment-plane question at all.
                  - action: OBSERVE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/observe")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        {{- /* bug.5237 PHASE 2. Phase 1's strict-schema reader is deployed in
                          every environment, so OBSERVE can now require the real host-routed
                          path instead of mistaking a healthy bare ingress for the hostname
                          that users reach. Keep this field on OBSERVE only: it is proof input,
                          never paid-mutation input. */}}
                        publicHost: {{ $publicHost | quote }},
                        expectedSourceSha: {{ $desiredSha | quote }}{{ if $hasMigrationStep }},
                        workload: .payload.body.spec.name,
                        environment: .payload.body.environment,
                        migration: .payload.body.migrationStep{{ end }}
                      }
                  # The PAID transaction. Its body is enumerated rather than `.payload.body`
                  # verbatim so a field added for another action can never leak onto the wire
                  # that spends money — `migrationStep` is exactly such a field, and the create
                  # contract is a strict object that would 400 on it.
                  - action: CREATE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/create")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        environment: .payload.body.environment,
                        identity: .payload.body.identity,
                        spec: .payload.body.spec{{ if $hasLegacyMigration }},
                        migration: .payload.body.migration{{ end }}
                      }
                  - action: UPDATE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/update")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        externalName: (.response.body.resource.externalName // .response.body.externalName),
                        environment: .payload.body.environment,
                        identity: .payload.body.identity,
                        spec: .payload.body.spec{{ if $hasLegacyMigration }},
                        migration: .payload.body.migration{{ end }}
                      }
                  - action: REMOVE
                    method: POST
                    url: (.payload.baseUrl + "/v1/akash/delete")
                    body: |
                      {
                        cogniKey: .payload.body.cogniKey,
                        externalName: (.response.body.resource.externalName // .response.body.externalName)
                      }
                expectedResponseCheck:
                  type: CUSTOM
                  logic: {{ $upToDateLogic | quote }}
                # A released allocation still resolves to a handle whose provider state is
                # `closed`, so "found" alone would never go false and the Request could never
                # finish deleting. Closed IS removed.
                isRemovedCheck:
                  type: CUSTOM
                  logic: '(.response.body.found == false) or ((.response.body.resource.state // .response.body.state) == "closed")'
            {{- end }}

            {{- /* ---------- composed: DNS intent ---------- */ -}}
            {{- /* LEASE LIVENESS AND DNS PUBLICATION ARE DIFFERENT CONCERNS (bug.5301). This
              gate used to include $renderLease, so EVERY terminal lease condition (budget
              close, recovery exhaustion, Hold-parked or foreign-key closure) also GC-deleted
              the public hostname -> live Cloudflare DELETE -> NXDOMAIN (beacon/node-template,
              2026-09-28). With Replace armed, closure becomes routine and every recovery cycle
              would open an NXDOMAIN window. The record now withdraws only on genuine XR
              deletion via normal finalization — the same class of hazard the last-known-good
              latch above already defends for the mid-promote case. */ -}}
            {{- if and $dns (ne $effectiveDnsTarget "") }}
            {{- $cfBase := printf "https://api.cloudflare.com/client/v4/zones/%s/dns_records" $dns.zoneId }}
            {{- $cfToken := printf "Bearer {{ operator-env-secrets:%s:CLOUDFLARE_API_TOKEN }}" $writerNs }}
            {{- $cfPayload := dict "name" $publicHost "content" $effectiveDnsTarget "type" $dnsRecordType }}
            {{- /*
              ADOPT BY NAME, NEVER BY TYPE (bug.5152). Cloudflare's list API FILTERS, it does not
              merge: `?type=CNAME&name=<host>` over a host already held by a legacy A record
              returns an EMPTY array, which isRemovedCheck reads as "the external resource does
              not exist". CREATE then fires forever against a name Cloudflare will never admit a
              second record onto (a CNAME is exclusive), the 400 is the steady state, and NOTHING
              ever converts the stale record — while status happily claimed the name was
              published. The HOST is the identity; the record TYPE is desired state. So probe the
              NAME across all types and adopt whatever occupies it, exactly as the bespoke
              reconciler this composition replaces does: CloudflareComputeWorkloadDnsAdapter
              .reconcile() calls findRecords(hostname) with NO type filter and then PUTs the
              desired A or CNAME over the live record's id, which is how every other Akash node
              in the fleet got converted from its k3s A record. ci-cd.md Axiom 21 already pinned the mirror
              image of this for the k3s writer ("never `?type=A`, which reads a live CNAME as
              absent"); it is restated here because this is a second, independent writer.

              A/AAAA/CNAME are the only types adopted — they are the address types this composite
              is allowed to own. A name held by anything else (MX, TXT, ...) filters to an empty
              set, so the request fails LOUDLY on CREATE rather than silently converting a record
              this composite never owned. That mirrors the bespoke adapter's DnsOwnershipChanged.

              PROXIED IS LOAD-BEARING, not a preference. Provider ingress certificates are not
              issued for the Cogni hostname, whether the target is a provider hostname (CNAME)
              or a bare IPv4 address (A). Cloudflare's orange cloud terminates TLS for the Cogni
              name and re-originates to the provider; `proxied: false` would publish a record
              that resolves and still cannot be reached safely.
            */ -}}
            {{- $cfAdoptable := `(.response.body.result // [] | if type == "array" then . else [.] end | map(select(.type == "A" or .type == "AAAA" or .type == "CNAME")))` }}
            ---
            apiVersion: http.m.crossplane.io/v1alpha2
            kind: Request
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: dns-record
                {{- if and $dnsCreateAmbiguous (ne $dnsCreatePending "") }}
                crossplane.io/external-create-succeeded: {{ $dnsCreatePending | quote }}
                {{- end }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: cogni-http
              forProvider:
                waitTimeout: 30s
                headers:
                  Content-Type: ["application/json"]
                  Authorization: [{{ $cfToken | quote }}]
                payload:
                  baseUrl: {{ $cfBase | quote }}
                  body: {{ toJson $cfPayload | quote }}
                mappings:
                  - action: OBSERVE
                    method: GET
                    url: (.payload.baseUrl + "?name=" + .payload.body.name)
                  - action: CREATE
                    method: POST
                    url: .payload.baseUrl
                    body: |
                      {
                        type: .payload.body.type,
                        name: .payload.body.name,
                        content: .payload.body.content,
                        ttl: 1,
                        proxied: true
                      }
                  - action: UPDATE
                    method: PUT
                    url: (.payload.baseUrl + "/" + ({{ $cfAdoptable }} | .[0].id))
                    body: |
                      {
                        type: .payload.body.type,
                        name: .payload.body.name,
                        content: .payload.body.content,
                        ttl: 1,
                        proxied: true
                      }
                  - action: REMOVE
                    method: DELETE
                    url: (.payload.baseUrl + "/" + ({{ $cfAdoptable }} | .[0].id))
                expectedResponseCheck:
                  type: CUSTOM
                  logic: |
                    ({{ $cfAdoptable }} | length) == 1
                    and
                    ({{ $cfAdoptable }} | .[0].type) == .payload.body.type
                    and
                    ({{ $cfAdoptable }} | .[0].content) == .payload.body.content
                    and
                    ({{ $cfAdoptable }} | .[0].proxied) == true
                isRemovedCheck:
                  type: CUSTOM
                  logic: |
                    ({{ $cfAdoptable }} | length) == 0
            {{- end }}

            {{- /* ---------- composite status ---------- */ -}}
            {{- $phase := "Progressing" }}
            {{- $failReason := "" }}
            {{- $failMessage := "" }}
            {{- if and $active $serving }}
            {{- $phase = "Ready" }}
            {{- else if $unsafeLeaseCreateAmbiguity }}
            {{- $phase = "Failed" }}
            {{- $failReason = "CreateResultAmbiguous" }}
            {{- $failMessage = printf "provider-http cannot prove the paid create result for cogniKey %s; automatic recovery stayed fail-closed because its exact active allocation receipt was incomplete" $currentKey }}
            {{- else if $closeForBudget }}
            {{- $phase = "Failed" }}
            {{- $failReason = "BootDeadlineClosed" }}
            {{- $failMessage = printf "workload did not serve %s within %ds; lease retirement requested; external closure and settlement are unproven" (substr 0 12 $desiredSha) $bootDeadlineSeconds }}
            {{- else if $deadlineExceeded }}
            {{- $phase = "Failed" }}
            {{- $failReason = "BootDeadlineExceeded" }}
            {{- $failMessage = printf "workload did not serve %s within %ds; spend continues because bootPolicy.onDeadline is Hold" (substr 0 12 $desiredSha) $bootDeadlineSeconds }}
            {{- else if $parkedClosed }}
            {{- /* The validated earlier tuple authorizes omission. A later refusal is
              not contrary allocation evidence and must not erase its terminal reason.
              Ownership, conflicting allocation and ambiguity guards run before this.
            */ -}}
            {{- $phase = "Failed" }}
            {{- $failReason = $prevFailure }}
            {{- $failMessage = printf "lease %s remains closed; durable %s park permits no further paid mutation" $externalName $prevFailure }}
            {{- $failMessage = trunc 256 $failMessage }}
            {{- if ne $refusalCode "" }}{{ $failMessage = printf "actuator refusal %s: %s; lease remains closed" $refusalCode $refusalMessage | trunc 256 }}{{ end }}
            {{- else if $heldClosed }}
            {{- /* Ordered BEFORE recoveryExhausted: if someone flips Replace back to Hold
              mid-recovery, the human choice (Hold) names the state. */ -}}
            {{- $phase = "Failed" }}
            {{- $failReason = "LeaseClosed" }}
            {{- $failMessage = printf "lease %s is closed and bootPolicy.onGiveUp is Hold; bump spec.leaseGeneration to mint a replacement (no paid recovery is attempted under Hold)" $externalName }}
            {{- else if $recoveryExhausted }}
            {{- $phase = "Failed" }}
            {{- $failReason = "RecoveryLimitExceeded" }}
            {{- $failMessage = printf "lease recovery exhausted after %d attempts for generation %d; no further paid mutation will be attempted" $recoveryCount $leaseGeneration }}
            {{- else if and (ne $refusalCode "") (not $refusalRetryable) }}
            {{- $phase = "Failed" }}
            {{- $failReason = $refusalCode }}
            {{- $failMessage = substr 0 256 $refusalMessage }}
            {{- else if $migrationFailed }}
            {{- /*
              A terminal migration failure OUTRANKS a retryable refusal on purpose. The refusal
              says "come back later"; this says "later will not help", and burying the second
              behind the first is how a stall stays invisible. It does NOT outrank a terminal
              refusal, which is about the action actually being attempted, nor the boot deadline,
              which is about money.
            */ -}}
            {{- $phase = "Failed" }}
            {{- $failReason = "MigrationFailed" }}
            {{- $failMessage = printf "database migration for bundle digest of %s failed; a new bundle digest is required. The lease is unaffected - this gates readiness, not payment" (substr 0 12 $desiredSha) }}
            {{- else if ne $refusalCode "" }}
            {{- $phase = "Progressing" }}
            {{- $failReason = $refusalCode }}
            {{- $failMessage = substr 0 256 $refusalMessage }}
            {{- else if gt $recoveryCount 0 }}
            {{- $phase = "Progressing" }}
            {{- $failReason = "LeaseRecoveryInProgress" }}
            {{- $failMessage = printf "lease recovery attempt %d of %d for generation %d" $recoveryCount $maxRecoveryAttempts $leaseGeneration }}
            {{- end }}
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            status:
              phase: {{ $phase | quote }}
              serving: {{ and $active $serving }}
              {{- if ne $mintedAt "" }}
              bootDeadlineAt: {{ $bootDeadlineAt | quote }}
              {{- else }}
              bootDeadlineAt: null
              {{- end }}
              bootEpoch:
                key: {{ $bootStatusKey | quote }}
                at: {{ $bootAnchorAt | quote }}
                {{- if ne $mintedAt "" }}
                mintedAt: {{ $mintedAt | quote }}
                {{- else }}
                {{- /* Status fields merge: omission would carry the previous attempt's clock. */}}
                mintedAt: null
                {{- end }}
              {{- if gt $recoveryCount 0 }}
              recovery:
                leaseGeneration: {{ $leaseGeneration }}
                count: {{ $recoveryCount }}
                maxAttempts: {{ $maxRecoveryAttempts }}
                key: {{ $cogniKey | quote }}
              {{- else }}
              recovery: null
              {{- end }}
              {{- if ge $leaseRequestGeneration 0 }}
              leaseRequestGeneration: {{ $leaseRequestGeneration }}
              {{- end }}
              {{- /* THE CUTOVER LATCH (bug.5322). The generation PROVEN serving AT THE EDGE.
                Advancing it is what lets the OVERLAP_BEFORE_CLOSE block above stop retaining the
                outgoing child on the next reconcile, which closes the incumbent's lease -- so it
                must require proof that THE PUBLIC HOST is pointed at the candidate, not merely
                that the candidate COULD serve it. Carried forward verbatim on every tick that does
                not prove the cutover: it must never silently regress to -1 and un-protect a live
                lease. Omitted entirely while still -1 so a fleet that has never served renders
                byte-identically.
                EDGE-OBSERVED, NOT LEASE-OBSERVED (measured twice, 2026-10-08). $serving comes from
                the host-routed probe, which connects to the candidate's OWN lease endpoint
                presenting Host: <publicHost>; it passes the moment the provider routes that vhost
                on that lease, while Cloudflare still points at the incumbent. Advancing on
                `active && serving` closed gen-1 while the edge still used it: spawny-boi
                candidate-a went nginx 404 for ~7 minutes (441 bad responses, manual re-flight to
                recover), and the bug.5188 last-known-good latch then pinned DNS to a CLOSED lease.
                $dnsPublished cannot gate it either: it compares the live record with current
                INTENT ($effectiveDnsTarget), which is still the incumbent's target while the DNS
                latch holds, so it is true at once (the second outage). $edgeCutoverObserved
                requires the LIVE record (read back from Cloudflare, bug.5152) to carry the
                CANDIDATE's own target. Sequence: tick N candidate serves -> DNS child writes its
                target -> tick N+1 the record reads back carrying it -> advance -> tick N+2 the
                outgoing child stops rendering and closes. A stalled Cloudflare write therefore
                leaks a retained lease (bounded, visible, costed) instead of dropping traffic.
                A workload with no spec.dns has no edge to move: its lease endpoint IS its public
                route, so `active && serving` remains the proof there.
                $hostAdmitted (story.5038 K2): the candidate's OWN endpoints must carry the public
                host, or a shared-ingress answer from the incumbent passes as the candidate's. */}}
              {{- if and $active $serving $hostAdmitted $edgeCutoverObserved }}
              activeLeaseGeneration: {{ $leaseGeneration }}
              {{- else if ge $activeLeaseGeneration 0 }}
              activeLeaseGeneration: {{ $activeLeaseGeneration }}
              {{- end }}
              {{- if ne $migrationPhase "" }}
              migration:
                phase: {{ $migrationPhase | quote }}
              {{- end }}
              {{- if $hasServedDesired }}
              observedBundle:
                ref: {{ $spec.bundle.ref | quote }}
                source:
                  repository: {{ $spec.bundle.source.repository | quote }}
                  sha: {{ $desiredSha | quote }}
              {{- else if ne $prevSha "" }}
              observedBundle: {{ toJson (dig "status" "observedBundle" (dict) $xr) }}
              {{- end }}
              {{- if $statusResource }}
              resource: {{ toJson $statusResource }}
              {{- else }}
              resource: null
              {{- end }}
              {{- if ne $effectiveDnsTarget "" }}
              dns:
                hostname: {{ $publicHost | quote }}
                target: {{ $effectiveDnsTarget | quote }}
                published: {{ $dnsPublished }}
              {{- end }}
              {{- if ne $failReason "" }}
              failure:
                reason: {{ $failReason | quote }}
                message: {{ $failMessage | quote }}
              {{- else }}
              {{- /* UNCONDITIONAL EMISSION (bug.5287). Omitting the key does not clear it:
                    status merge preserves the previous value, so a recovered workload kept
                    its stale failure.reason (ledger_unavailable under Progressing) latched
                    for days. "None" is the cleared-failure sentinel — always written, never
                    omitted; compute-workload-readiness treats it as absent. Matches the
                    XRD reason pattern ^[A-Za-z_][A-Za-z0-9_]{0,127}$. */}}
              failure:
                reason: "None"
                message: ""
              {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
