# Grafana unified-alerting template — equal Serve + Run proof for every environment.
#
# This file contains only deterministic, low-cardinality Prometheus/Loki rules.
# Missing evidence is critical: an absent collector must never render green.
# Datasource UIDs are stable Grafana Cloud resources; credentials remain outside git.
apiVersion: 1
groups:
  - orgId: 1
    folder: Cogni Reliability
    name: fleet-capacity
    interval: 1m
    rules:
      - uid: fleet-telemetry-deadman
        title: __ENVIRONMENT__ telemetry collector missing
        condition: THRESHOLD
        for: 5m
        data:
          - refId: SIGNAL
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min by (job) (up{env="__ENVIRONMENT__",job=~"integrations/(unix|cadvisor|postgres)|prometheus.scrape.(app_metrics|worker_metrics)"})'
              instant: true
              refId: SIGNAL
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: SIGNAL
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: observe }
        annotations:
          summary: "__ENVIRONMENT__ telemetry source {{ $labels.job }} is down."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-memory-headroom
        title: __ENVIRONMENT__ memory headroom below 15%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(node_memory_MemAvailable_bytes{env="__ENVIRONMENT__"} / node_memory_MemTotal_bytes{env="__ENVIRONMENT__"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: lt, params: [0.15] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "__ENVIRONMENT__ host has less than 15% available memory."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-disk-headroom
        title: __ENVIRONMENT__ root disk headroom below 15%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(node_filesystem_avail_bytes{env="__ENVIRONMENT__",mountpoint="/"} / node_filesystem_size_bytes{env="__ENVIRONMENT__",mountpoint="/"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: lt, params: [0.15] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "__ENVIRONMENT__ root filesystem has less than 15% free space."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-inode-headroom
        title: __ENVIRONMENT__ root inode headroom below 10%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(node_filesystem_files_free{env="__ENVIRONMENT__",mountpoint="/"} / node_filesystem_files{env="__ENVIRONMENT__",mountpoint="/"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: lt, params: [0.10] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "__ENVIRONMENT__ root filesystem has less than 10% free inodes."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-io-pressure
        title: __ENVIRONMENT__ host I/O pressure sustained above 20%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'max(rate(node_pressure_io_waiting_seconds_total{env="__ENVIRONMENT__"}[5m]))'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: gt, params: [0.20] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "__ENVIRONMENT__ I/O pressure has exceeded 20% for ten minutes."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-container-oom
        title: __ENVIRONMENT__ container OOM detected
        condition: THRESHOLD
        for: 0s
        data:
          - refId: EVENTS
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'sum(increase(container_oom_events_total{env="__ENVIRONMENT__"}[10m]))'
              instant: true
              refId: EVENTS
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: EVENTS
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "At least one __ENVIRONMENT__ container OOM occurred in the last ten minutes."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-postgres-down
        title: __ENVIRONMENT__ PostgreSQL exporter reports down
        condition: THRESHOLD
        for: 2m
        data:
          - refId: UP
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(pg_up{env="__ENVIRONMENT__"})'
              instant: true
              refId: UP
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: UP
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "__ENVIRONMENT__ PostgreSQL is unreachable from its exporter."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-postgres-connections
        title: __ENVIRONMENT__ PostgreSQL connections above 75%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'sum(pg_stat_database_numbackends{env="__ENVIRONMENT__"}) / max(pg_settings_max_connections{env="__ENVIRONMENT__"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: gt, params: [0.75] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "__ENVIRONMENT__ PostgreSQL connection usage exceeds 75%."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-postgres-temp-io
        title: __ENVIRONMENT__ database temp I/O above 5 MiB/s
        condition: THRESHOLD
        for: 10m
        data:
          - refId: BYTES
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'max by (datname) (rate(pg_stat_database_temp_bytes{env="__ENVIRONMENT__",datname!~"template.*"}[5m]))'
              instant: true
              refId: BYTES
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: BYTES
              conditions:
                - evaluator: { type: gt, params: [5242880] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "Database {{ $labels.datname }} is writing more than 5 MiB/s of temp data."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-backup-freshness
        title: __ENVIRONMENT__ database backup evidence stale
        condition: THRESHOLD
        for: 15m
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 93600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum(count_over_time({env="__ENVIRONMENT__",service="db-backup"} | json | event="db_backup.completed" [26h]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "No successful __ENVIRONMENT__ database backup evidence arrived in 26 hours."
        noDataState: Alerting
        execErrState: Alerting

      # task.5247 — environment-level warnings intentionally precede the
      # append-only Serve rule so its positional identity remains stable.
      - uid: reliability-io-warning
        title: __ENVIRONMENT__ host I/O pressure sustained above 10%
        condition: THRESHOLD
        for: 5m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'max(rate(node_pressure_io_waiting_seconds_total{env="__ENVIRONMENT__"}[5m]))'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: gt, params: [0.10] }
              refId: THRESHOLD
        labels:
          {
            severity: warning,
            proof_class: run,
            policy_version: reliability-status-v1,
          }
        annotations:
          summary: "__ENVIRONMENT__ I/O pressure has exceeded the v1 warning threshold for five minutes."
        noDataState: Alerting
        execErrState: Alerting

      - uid: reliability-connections-warning
        title: __ENVIRONMENT__ PostgreSQL connections sustained above 60%
        condition: THRESHOLD
        for: 5m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'sum(pg_stat_database_numbackends{env="__ENVIRONMENT__"}) / max(pg_settings_max_connections{env="__ENVIRONMENT__"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: gt, params: [0.60] }
              refId: THRESHOLD
        labels:
          {
            severity: warning,
            proof_class: run,
            policy_version: reliability-status-v1,
          }
        annotations:
          summary: "__ENVIRONMENT__ PostgreSQL connections exceed the v1 warning threshold."
        noDataState: Alerting
        execErrState: Alerting

      - uid: reliability-memory-warning
        title: __ENVIRONMENT__ memory headroom sustained below 25%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(node_memory_MemAvailable_bytes{env="__ENVIRONMENT__"} / node_memory_MemTotal_bytes{env="__ENVIRONMENT__"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: lt, params: [0.25] }
              refId: THRESHOLD
        labels:
          {
            severity: warning,
            proof_class: run,
            policy_version: reliability-status-v1,
          }
        annotations:
          summary: "__ENVIRONMENT__ memory headroom is below the v1 warning threshold."
        noDataState: Alerting
        execErrState: Alerting

      - uid: reliability-disk-warning
        title: __ENVIRONMENT__ root disk headroom sustained below 25%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(node_filesystem_avail_bytes{env="__ENVIRONMENT__",mountpoint="/"} / node_filesystem_size_bytes{env="__ENVIRONMENT__",mountpoint="/"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: lt, params: [0.25] }
              refId: THRESHOLD
        labels:
          {
            severity: warning,
            proof_class: run,
            policy_version: reliability-status-v1,
          }
        annotations:
          summary: "__ENVIRONMENT__ root disk headroom is below the v1 warning threshold."
        noDataState: Alerting
        execErrState: Alerting

      # Append-only ordering is load-bearing: the Grafana provider models
      # nested rules positionally. New rules stay above this terminal rule so
      # the established Serve alert identity and history remain stable.
      - uid: fleet-serve-down
        title: __ENVIRONMENT__ node serving unavailable
        condition: THRESHOLD
        for: 2m
        data:
          - refId: SERVING
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              # One alert instance per node. A regional probe failure alone is
              # not a fleet outage: serving is unavailable only when every
              # independent probe region reports failure.
              expr: 'max by (environment, node_slug) (probe_success{environment="__ENVIRONMENT__",proof_class="serve"})'
              instant: true
              refId: SERVING
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: SERVING
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: serve }
        annotations:
          summary: "{{ $labels.node_slug }} is unreachable from every independent probe region."
        noDataState: Alerting
        execErrState: Alerting
