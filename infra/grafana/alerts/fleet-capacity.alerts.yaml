# Grafana unified-alerting provisioning — production fleet Serve + Run proof.
#
# This file contains only deterministic, low-cardinality Prometheus/Loki rules.
# Missing evidence is critical: an absent collector must never render green.
# Datasource UIDs are stable Grafana Cloud resources; credentials remain outside git.
apiVersion: 1
groups:
  - orgId: 1
    folder: Cogni Reliability
    name: fleet-capacity
    interval: 1m
    rules:
      - uid: fleet-telemetry-deadman
        title: Production telemetry collector missing
        condition: THRESHOLD
        for: 5m
        data:
          - refId: SIGNAL
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min by (job) (up{env="production",job=~"integrations/(unix|cadvisor|postgres)|prometheus.scrape.(app_metrics|worker_metrics)"})'
              instant: true
              refId: SIGNAL
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: SIGNAL
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: observe }
        annotations:
          summary: "Production telemetry source {{ $labels.job }} is down."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-memory-headroom
        title: Production memory headroom below 15%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(node_memory_MemAvailable_bytes{env="production"} / node_memory_MemTotal_bytes{env="production"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: lt, params: [0.15] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "Production host has less than 15% available memory."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-disk-headroom
        title: Production root disk headroom below 15%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(node_filesystem_avail_bytes{env="production",mountpoint="/"} / node_filesystem_size_bytes{env="production",mountpoint="/"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: lt, params: [0.15] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "Production root filesystem has less than 15% free space."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-inode-headroom
        title: Production root inode headroom below 10%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(node_filesystem_files_free{env="production",mountpoint="/"} / node_filesystem_files{env="production",mountpoint="/"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: lt, params: [0.10] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "Production root filesystem has less than 10% free inodes."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-io-pressure
        title: Production host I/O pressure sustained above 20%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'max(rate(node_pressure_io_waiting_seconds_total{env="production"}[5m]))'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: gt, params: [0.20] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "Production I/O pressure has exceeded 20% for ten minutes."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-container-oom
        title: Production container OOM detected
        condition: THRESHOLD
        for: 0s
        data:
          - refId: EVENTS
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'sum(increase(container_oom_events_total{env="production"}[10m]))'
              instant: true
              refId: EVENTS
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: EVENTS
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "At least one production container OOM occurred in the last ten minutes."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-postgres-down
        title: Production PostgreSQL exporter reports down
        condition: THRESHOLD
        for: 2m
        data:
          - refId: UP
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'min(pg_up{env="production"})'
              instant: true
              refId: UP
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: UP
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "Production PostgreSQL is unreachable from its exporter."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-postgres-connections
        title: Production PostgreSQL connections above 75%
        condition: THRESHOLD
        for: 10m
        data:
          - refId: RATIO
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'sum(pg_stat_database_numbackends{env="production"}) / max(pg_settings_max_connections{env="production"})'
              instant: true
              refId: RATIO
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: RATIO
              conditions:
                - evaluator: { type: gt, params: [0.75] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "Production PostgreSQL connection usage exceeds 75%."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-postgres-temp-io
        title: Production database temp I/O above 5 MiB/s
        condition: THRESHOLD
        for: 10m
        data:
          - refId: BYTES
            datasourceUid: grafanacloud-prom
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: grafanacloud-prom }
              expr: 'max by (datname) (rate(pg_stat_database_temp_bytes{env="production",datname!~"template.*"}[5m]))'
              instant: true
              refId: BYTES
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: BYTES
              conditions:
                - evaluator: { type: gt, params: [5242880] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "Database {{ $labels.datname }} is writing more than 5 MiB/s of temp data."
        noDataState: Alerting
        execErrState: Alerting

      - uid: fleet-backup-freshness
        title: Production database backup evidence stale
        condition: THRESHOLD
        for: 15m
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 93600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum(count_over_time({env="production",service="db-backup"} | json | event="db_backup.completed" [26h]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        labels: { severity: critical, proof_class: run }
        annotations:
          summary: "No successful production database backup evidence arrived in 26 hours."
        noDataState: Alerting
        execErrState: Alerting
