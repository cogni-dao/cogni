# Grafana unified-alerting provisioning — per-env mesh plane (task.5428; hub node-service-delivery §2
# "Gateway watchdog" + "Operational alerts", task.5384).
#
# WHY: the mesh replaces source-IP admission. Its failure modes are quiet: a gateway that lost its
# coordinator keeps forwarding on a stale policy (revocation fails open until the 4 h bound), a
# coordinator that restarts with the sequencer pod, a public ACME certificate on a DNS-only host
# that stops renewing, and credential/approval failures inside the sequencer. These rules make each
# loud. All sources are free Loki logs: paid synthetic checks are under the CEO hard stop (task.5396),
# so certificate expiry is read from Caddy's own certificate-maintenance log lines.
#
# APPLY: Grafana Git Sync does not sync alerting (see ./README.md). Apply via the alerting provisioning
# API or Terraform and confirm a contact point on the notification policy. Datasource UID
# `grafanacloud-logs` is the production Loki source (one stack, env is a label).
# The rules marked `slice: T2` read events the sequencer emits once slice T2 ships; apply them with T2,
# because their no-data state is Alerting by design (an absent coordinator health stream must page).
# The rule marked `slice: P4` reads the env-plane substrate-gw (task.5428 P4); apply it with P4.
# The rule marked `slice: T1p` reads the production env-plane substrate-gw; apply it only after that
# instance's first heartbeat is in Loki (its no-data state pages).
#
# Source events:
#   substrate-gw (Loki {env,namespace="cogni-mesh",service="substrate-gw"} via the k3s pod-log source;
#     infra/k8s/base/mesh-env-plane/substrate-gw.sh)
#     msg="substrate_gw_map_poll_lost"  every 15 s while joined but out of map poll {lostSeconds,boundSeconds}
#     msg="substrate_gw_serve_reset"    the bound passed; forwarding stopped (fail closed)
#     msg="substrate_gw_watchdog"       heartbeat once a minute
#   Caddy (Loki {env,service="caddy"}) certmagic: logger tls.renew / tls.obtain / tls.cache.maintenance,
#     fields identifier + remaining (seconds; Caddy encodes durations as float seconds)
#   sequencer pod (Loki {env="production",namespace="cogni-production"}): containers headscale-<env>
#     (JSON logs); Kubernetes events {source="k8s-events"} (alloy-k8s-events) for its rollout
#   sequencer, slice T2: msg="node_mesh_coordinator_health" {env, outcome}, msg="node_mesh_substrate_mismatch"
#   sequencer (candidate-a test operator): msg="node_deploy_sequencer_mesh_dns" {outcome, host, target}, one
#     line per record per pass (features/node-deploy/mesh-dns.ts)
apiVersion: 1
groups:
  - orgId: 1
    folder: Cogni Reliability
    name: mesh-plane
    interval: 1m
    rules:
      # Hard requirement 20: warn after 60 s out of map poll.
      - uid: mesh-substrate-gw-map-poll-lost-warn
        title: substrate-gw out of its map poll for more than 60 s
        condition: THRESHOLD
        for: 0s
        data:
          - refId: LOST
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 120, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'max by (env, namespace) (max_over_time({service="substrate-gw",namespace=~"cogni-mesh-.+"} | json | msg="substrate_gw_map_poll_lost" | unwrap lostSeconds [2m]))'
              queryType: instant
              refId: LOST
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: LOST
              conditions:
                - evaluator: { type: gt, params: [60] }
              refId: THRESHOLD
        annotations:
          summary: "substrate_gw_map_poll_lost on {{ $labels.env }}: the env gateway cannot reach its Headscale (mesh-<env>.<zone>). It still forwards on its last policy, so a revoked node keeps access until the map poll returns or the 4 h bound stops forwarding. Check the production sequencer pod's headscale-<env> container, the production edge route and cogni-mesh/mesh-control-fwd on the env VM."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # Hard requirement 20: page after 15 minutes out of map poll.
      - uid: mesh-substrate-gw-map-poll-lost-page
        title: substrate-gw out of its map poll for more than 15 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: LOST
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 120, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'max by (env, namespace) (max_over_time({service="substrate-gw",namespace=~"cogni-mesh-.+"} | json | msg="substrate_gw_map_poll_lost" | unwrap lostSeconds [2m]))'
              queryType: instant
              refId: LOST
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: LOST
              conditions:
                - evaluator: { type: gt, params: [900] }
              refId: THRESHOLD
        annotations:
          summary: "substrate-gw on {{ $labels.env }} has been out of its map poll for over 15 minutes. Revocation is failing open on that env until the coordinator returns; at the configured bound (4 h in production) the gateway stops forwarding and every lease of that env loses its substrate."
        labels: { severity: critical, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # The bound passed: the gateway stopped forwarding (fail closed). Every lease of that env is cut.
      - uid: mesh-substrate-gw-serve-reset
        title: substrate-gw stopped forwarding (map-poll bound exceeded)
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env, namespace) (count_over_time({service="substrate-gw",namespace=~"cogni-mesh-.+"} | json | msg="substrate_gw_serve_reset" [15m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "substrate-gw on {{ $labels.env }} ran `tailscale serve reset` after exceeding its map-poll bound: no lease of that env reaches its shared services until Headscale answers again (the watchdog then restores the declared serve config by itself)."
        labels: { severity: critical, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # The gateway watchdog itself is gone (container down, VM down, or log shipping broken).
      # One substrate-gw per tailnet on the candidate-a VM (cogni-mesh-candidate-a, cogni-mesh-test-candidate-a):
      # fewer than both namespaces heartbeating is an alert. Add a namespace with each new instance.
      # slice: P4 — no substrate-gw runs before P4, and this rule's no-data state pages.
      - uid: mesh-substrate-gw-no-heartbeat
        title: A candidate-a substrate-gw watchdog heartbeat missing for 5 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'count(sum by (namespace) (count_over_time({env="candidate-a",service="substrate-gw",namespace=~"cogni-mesh-(candidate-a|test-candidate-a)"} | json | msg="substrate_gw_watchdog" [5m])))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [2] }
              refId: THRESHOLD
        annotations:
          summary: "No substrate_gw_watchdog line from candidate-a in 5 minutes: the env gateway (or its fail-closed watchdog) is not running, or its logs are not shipped. Check the cogni-mesh-<tailnet>/substrate-gw pods on the env VM's k3s (Argo apps candidate-a-mesh-plane-<tailnet>)."
        labels: { severity: critical, plane: mesh, slice: P4 }
        noDataState: Alerting
        execErrState: Alerting

      # The production VM's one substrate-gw (cogni-mesh-production). Its own rule, so the candidate-a rule
      # above never pages for a production rollout and this one never pages for candidate-a.
      # slice: T1p — apply it only AFTER a substrate_gw_watchdog line from cogni-mesh-production is in Loki:
      # its no-data state pages, so applying it earlier pages critical for an instance that does not exist.
      - uid: mesh-substrate-gw-no-heartbeat-production
        title: The production substrate-gw watchdog heartbeat missing for 5 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'count(sum by (namespace) (count_over_time({env="production",service="substrate-gw",namespace="cogni-mesh-production"} | json | msg="substrate_gw_watchdog" [5m])))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        annotations:
          summary: "No substrate_gw_watchdog line from production in 5 minutes: the production env gateway (or its fail-closed watchdog) is not running, or its logs are not shipped. Check cogni-mesh-production/substrate-gw on the production VM's k3s (Argo app production-mesh-plane-production)."
        labels: { severity: critical, plane: mesh, slice: T1p }
        noDataState: Alerting
        execErrState: Alerting

      # The preview VM's one substrate-gw (cogni-mesh-preview). Its own rule, so the other env rules never
      # page for a preview rollout and this one never pages for them (same shape as production).
      # slice: T1v — apply it only AFTER a substrate_gw_watchdog line from cogni-mesh-preview is in Loki:
      # its no-data state pages, so applying it earlier pages critical for an instance that does not exist.
      - uid: mesh-substrate-gw-no-heartbeat-preview
        title: The preview substrate-gw watchdog heartbeat missing for 5 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'count(sum by (namespace) (count_over_time({env="preview",service="substrate-gw",namespace="cogni-mesh-preview"} | json | msg="substrate_gw_watchdog" [5m])))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        annotations:
          summary: "No substrate_gw_watchdog line from preview in 5 minutes: the preview env gateway (or its fail-closed watchdog) is not running, or its logs are not shipped. Check cogni-mesh-preview/substrate-gw on the preview VM's k3s (Argo app preview-mesh-plane-preview)."
        labels: { severity: critical, plane: mesh, slice: T1v }
        noDataState: Alerting
        execErrState: Alerting

      # 14 days before a DNS-only mesh certificate expires. Caddy renews at 1/3 lifetime left (~30 d of
      # a 90 d certificate), and logs every maintenance attempt with `remaining` seconds. A line with
      # under 14 d left means renewal has been failing for over two weeks.
      - uid: mesh-certificate-expiry-14d
        title: Mesh site certificate expires within 14 days
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env, identifier) (count_over_time({service="caddy"} | json | logger=~"tls.*" | identifier=~"(mesh|derp)-.+|cogni(-[a-z0-9-]+)?[.]vm[.].+" | remaining != "" | remaining < 1209600 [1h]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "The public ACME certificate for {{ $labels.identifier }} ({{ $labels.env }} edge) has under 14 days left and is not renewing. These hosts are DNS-only: confirm the DNS record points at the env VM, that ports 80/443 reach Caddy directly, and read Caddy tls.obtain errors."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # Renewal / issuance errors for a mesh site, before they become an expiry.
      - uid: mesh-certificate-obtain-errors
        title: Mesh site certificate issuance failing
        condition: THRESHOLD
        for: 30m
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env, identifier) (count_over_time({service="caddy"} | json | level="error" | logger=~"tls.obtain|tls.renew|tls.issuance.acme.*" | identifier=~"(mesh|derp)-.+|cogni(-[a-z0-9-]+)?[.]vm[.].+" [1h]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "Caddy on {{ $labels.env }} cannot obtain or renew the public certificate for {{ $labels.identifier }} for 30+ minutes. A DNS-only mesh host must resolve directly to that env VM (never proxied)."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # A sequencer rollout takes longer than 10 minutes (B7). In production and candidate-a the per-tailnet
      # coordinators restart with the pod (CD5), so a stuck rollout is a coordinator outage.
      # LIMITS (a proxy until kube-state-metrics exists, bug.5165): it counts Warning events over 10 minutes
      # with `for: 10m`, so it fires after 10 to 20 minutes of continuous Warnings. A rollout stuck with only
      # Normal events (a slow image pull) never fires, and ProgressDeadlineExceeded is a Deployment
      # condition that may never be emitted as an event. Read the Kubernetes
      # events in Loki (alloy-k8s-events -> {source="k8s-events"}): Warning events on the sequencer pod
      # or Deployment (BackOff, Unhealthy liveness, FailedMount of a headscale PVC/socket volume,
      # FailedScheduling, ProgressDeadlineExceeded) that keep arriving for 10 minutes mean the new pod
      # has not come up within the bound. The leader heartbeat is NOT a rollout signal: it keeps
      # flowing while a headscale container is down, and node-deploy.alerts.yaml already owns it.
      # Source health is its own rule (mesh-k8s-events-source-silent, bug.5579): this one stays
      # noData=OK so a quiet healthy cluster is green, and the liveness rule pages when the source dies.
      - uid: mesh-sequencer-rollout-slow
        title: A coordinator-carrying sequencer rollout stuck for more than 10 minutes
        condition: THRESHOLD
        for: 10m
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env) (count_over_time({source="k8s-events",env=~"production|candidate-a",namespace=~"cogni-production|cogni-candidate-a",event_type="Warning"} | json | name=~"operator-node-deploy-sequencer.*" | reason=~"ProgressDeadlineExceeded|BackOff|Unhealthy|FailedMount|FailedAttachVolume|FailedScheduling|FailedCreatePodSandBox|Failed" [10m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "operator-node-deploy-sequencer has emitted Warning events (BackOff / Unhealthy / FailedMount / FailedScheduling / ProgressDeadlineExceeded) for 10 minutes: its rollout, and with it every env's Headscale coordinator, has not completed within the bound. Read the pod's events and its headscale-<env> container logs."
        labels: { severity: critical, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # The rollout rule above is only as good as its source. Production Kubernetes events stopped
      # reaching Loki on 2026-10-21 (bug.5579), which leaves every event-based rule silently green.
      # Missing evidence must page: production and candidate-a (both run a coordinator-carrying sequencer)
      # must each ship at least one k8s-events line per 30 minutes.
      - uid: mesh-k8s-events-source-silent
        title: Kubernetes events absent from Loki for 30 minutes (production or candidate-a)
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'count(sum by (env) (count_over_time({source="k8s-events",env=~"production|candidate-a"} [30m])))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [2] }
              refId: THRESHOLD
        annotations:
          summary: "Production or candidate-a Kubernetes events did not reach Loki in 30 minutes (bug.5579). Every event-based rule, including the sequencer rollout alert, is blind for that env until alloy-k8s-events ships again on its VM."
        labels: { severity: critical, plane: mesh }
        noDataState: Alerting
        execErrState: Alerting

      # A coordinator container is crash-looping (each start logs {"message":"starting headscale"},
      # verified against v0.29.7 output), so that env has no stable coordinator.
      - uid: mesh-headscale-restarting
        title: A Headscale coordinator restarted more than 3 times in 15 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env, container) (count_over_time({env=~"production|candidate-a",namespace=~"cogni-production|cogni-candidate-a",container=~"headscale-.+"} |~ "(?i)starting headscale" [15m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [3] }
              refId: THRESHOLD
        annotations:
          summary: "{{ $labels.container }} started more than 3 times in 15 minutes: that env's tailnet has no stable coordinator (no new joins, no revokes, no gateway re-approval). Read its JSON logs (PVC permission, config, sqlite)."
        labels: { severity: critical, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # Mesh credential / authentication failures seen by a coordinator: rejected or expired pre-auth
      # keys and refused registrations. A burst means a lease is joining with a revoked or wrong key.
      - uid: mesh-headscale-auth-failures
        title: Headscale refusing mesh credentials
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env, container) (count_over_time({env=~"production|candidate-a",namespace=~"cogni-production|cogni-candidate-a",container=~"headscale-.+"} |~ "(?i)(auth ?key|pre-?auth).*(expired|invalid|not found|used)|registration.*(fail|denied)" [15m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [10] }
              refId: THRESHOLD
        annotations:
          summary: "{{ $labels.container }} refused more than 10 mesh credentials in 15 minutes. A revoked attempt key keeps retrying (expected for a few minutes after a revoke) or a lease holds a wrong key. Read the sequencer's attempt keys and the lease's cogni-mesh companion logs."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # The test tailnet's DNS-only records (cogni-testing.org) are written by the candidate-a test operator's
      # sequencer, the only holder of that zone's token. A failed write or readback leaves the test
      # coordinator and relay unreachable and their certificates unissued.
      - uid: mesh-dns-writer-failed
        title: Sequencer cannot write a mesh DNS record
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env, host) (count_over_time({env="candidate-a",service="sequencer"} | json | msg="node_deploy_sequencer_mesh_dns" | outcome!~"ok|created|updated" [30m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "The {{ $labels.env }} sequencer could not write or read back the DNS-only mesh record {{ $labels.host }} in 30 minutes. Read node_deploy_sequencer_mesh_dns lines (outcome, causeMessage): a zone-token scope or an ambiguous record is the usual cause."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # Missing evidence pages: the writer logs every record on every pass (10 minutes).
      - uid: mesh-dns-writer-no-data
        title: No mesh DNS writer evidence for 30 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum(count_over_time({env="candidate-a",service="sequencer"} | json | msg="node_deploy_sequencer_mesh_dns" [30m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        annotations:
          summary: "No node_deploy_sequencer_mesh_dns line from the candidate-a sequencer in 30 minutes: the test tailnet's DNS records have no running writer (sequencer down, no leader, edge zone unresolved, or log shipping broken)."
        labels: { severity: warning, plane: mesh }
        noDataState: Alerting
        execErrState: Alerting

      # slice: T2 — the sequencer cannot reach a coordinator (design §2 "A failed Headscale call").
      - uid: mesh-coordinator-call-failed
        title: Sequencer mesh call to Headscale failing
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env) (count_over_time({env=~"production|candidate-a",service="sequencer"} | json | msg="node_mesh_coordinator_health" | outcome!="ok" [10m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "The sequencer's Headscale call failed (outcome != ok). It has stopped every mesh write for that env (no new keys, revokes queued, revocation failing open) until the coordinator answers."
        labels: { severity: critical, plane: mesh, slice: T2 }
        noDataState: OK
        execErrState: Alerting

      # slice: T2 — no coordinator health line for 10 minutes: missing evidence pages.
      - uid: mesh-coordinator-health-no-data
        title: A sequencer emitted no mesh coordinator health evidence for 10 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'count(sum by (env) (count_over_time({env=~"production|candidate-a",service="sequencer"} | json | msg="node_mesh_coordinator_health" [10m])))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [2] }
              refId: THRESHOLD
        annotations:
          summary: "No node_mesh_coordinator_health line in 10 minutes: the sequencer is not checking its coordinators (or Loki shipping broke). An unobserved coordinator must never be green."
        labels: { severity: critical, plane: mesh, slice: T2 }
        noDataState: Alerting
        execErrState: Alerting

      # slice: T2 — an approved substrate-gw did not match the request published over the verified
