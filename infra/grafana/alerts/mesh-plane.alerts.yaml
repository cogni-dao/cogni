# Grafana unified-alerting provisioning — per-env mesh plane (task.5428; hub node-service-delivery §2
# "Gateway watchdog" + "Operational alerts", task.5384).
#
# WHY: the mesh replaces source-IP admission. Its failure modes are quiet: a gateway that lost its
# coordinator keeps forwarding on a stale policy (revocation fails open until the 4 h bound), a
# coordinator that restarts with the sequencer pod, a public ACME certificate on a DNS-only host
# that stops renewing, and credential/approval failures inside the sequencer. These rules make each
# loud. All sources are free Loki logs: paid synthetic checks are under the CEO hard stop (task.5396),
# so certificate expiry is read from Caddy's own certificate-maintenance log lines.
#
# APPLY: Grafana Git Sync does not sync alerting (see ./README.md). Apply via the alerting provisioning
# API or Terraform and confirm a contact point on the notification policy. Datasource UID
# `grafanacloud-logs` is the production Loki source (one stack, env is a label).
# The rules marked `slice: T2` read events the sequencer emits once slice T2 ships; apply them with T2,
# because their no-data state is Alerting by design (an absent coordinator health stream must page).
#
# Source events:
#   substrate-gw (Loki {env,namespace="cogni-mesh",service="substrate-gw"} via the k3s pod-log source;
#     infra/k8s/base/mesh-env-plane/substrate-gw.sh)
#     msg="substrate_gw_map_poll_lost"  every 15 s while joined but out of map poll {lostSeconds,boundSeconds}
#     msg="substrate_gw_serve_reset"    the bound passed; forwarding stopped (fail closed)
#     msg="substrate_gw_watchdog"       heartbeat once a minute
#   Caddy (Loki {env,service="caddy"}) certmagic: logger tls.renew / tls.obtain / tls.cache.maintenance,
#     fields identifier + remaining (seconds; Caddy encodes durations as float seconds)
#   sequencer pod (Loki {env="production",namespace="cogni-production"}): containers headscale-<env>
#     (JSON logs); Kubernetes events {source="k8s-events"} (alloy-k8s-events) for its rollout
#   sequencer, slice T2: msg="node_mesh_coordinator_health" {env, outcome}, msg="node_mesh_substrate_mismatch"
apiVersion: 1
groups:
  - orgId: 1
    folder: Cogni Reliability
    name: mesh-plane
    interval: 1m
    rules:
      # Hard requirement 20: warn after 60 s out of map poll.
      - uid: mesh-substrate-gw-map-poll-lost-warn
        title: substrate-gw out of its map poll for more than 60 s
        condition: THRESHOLD
        for: 0s
        data:
          - refId: LOST
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 120, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'max by (env) (max_over_time({service="substrate-gw"} | json | msg="substrate_gw_map_poll_lost" | unwrap lostSeconds [2m]))'
              queryType: instant
              refId: LOST
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: LOST
              conditions:
                - evaluator: { type: gt, params: [60] }
              refId: THRESHOLD
        annotations:
          summary: "substrate_gw_map_poll_lost on {{ $labels.env }}: the env gateway cannot reach its Headscale (mesh-<env>.<zone>). It still forwards on its last policy, so a revoked node keeps access until the map poll returns or the 4 h bound stops forwarding. Check the production sequencer pod's headscale-<env> container, the production edge route and cogni-mesh/mesh-control-fwd on the env VM."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # Hard requirement 20: page after 15 minutes out of map poll.
      - uid: mesh-substrate-gw-map-poll-lost-page
        title: substrate-gw out of its map poll for more than 15 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: LOST
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 120, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'max by (env) (max_over_time({service="substrate-gw"} | json | msg="substrate_gw_map_poll_lost" | unwrap lostSeconds [2m]))'
              queryType: instant
              refId: LOST
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: LOST
              conditions:
                - evaluator: { type: gt, params: [900] }
              refId: THRESHOLD
        annotations:
          summary: "substrate-gw on {{ $labels.env }} has been out of its map poll for over 15 minutes. Revocation is failing open on that env until the coordinator returns; at the configured bound (4 h in production) the gateway stops forwarding and every lease of that env loses its substrate."
        labels: { severity: critical, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # The bound passed: the gateway stopped forwarding (fail closed). Every lease of that env is cut.
      - uid: mesh-substrate-gw-serve-reset
        title: substrate-gw stopped forwarding (map-poll bound exceeded)
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env) (count_over_time({service="substrate-gw"} | json | msg="substrate_gw_serve_reset" [15m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "substrate-gw on {{ $labels.env }} ran `tailscale serve reset` after exceeding its map-poll bound: no lease of that env reaches its shared services until Headscale answers again (the watchdog then restores the declared serve config by itself)."
        labels: { severity: critical, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # The gateway watchdog itself is gone (container down, VM down, or log shipping broken).
      # Envs listed here are the envs with an infra/k8s/overlays/<env>/mesh-plane overlay.
      - uid: mesh-substrate-gw-no-heartbeat
        title: substrate-gw watchdog heartbeat missing for 5 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 300, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum(count_over_time({env="candidate-a",service="substrate-gw"} | json | msg="substrate_gw_watchdog" [5m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        annotations:
          summary: "No substrate_gw_watchdog line from candidate-a in 5 minutes: the env gateway (or its fail-closed watchdog) is not running, or its logs are not shipped. Check the cogni-mesh/substrate-gw pod on the env VM's k3s (Argo app candidate-a-mesh-plane)."
        labels: { severity: critical, plane: mesh }
        noDataState: Alerting
        execErrState: Alerting

      # 14 days before a DNS-only mesh certificate expires. Caddy renews at 1/3 lifetime left (~30 d of
      # a 90 d certificate), and logs every maintenance attempt with `remaining` seconds. A line with
      # under 14 d left means renewal has been failing for over two weeks.
      - uid: mesh-certificate-expiry-14d
        title: Mesh site certificate expires within 14 days
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env, identifier) (count_over_time({service="caddy"} | json | logger=~"tls.*" | identifier=~"mesh-.+|cogni(-[a-z0-9-]+)?[.]vm[.].+" | remaining != "" | remaining < 1209600 [1h]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "The public ACME certificate for {{ $labels.identifier }} ({{ $labels.env }} edge) has under 14 days left and is not renewing. These hosts are DNS-only: confirm the DNS record points at the env VM, that ports 80/443 reach Caddy directly, and read Caddy tls.obtain errors."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # Renewal / issuance errors for a mesh site, before they become an expiry.
      - uid: mesh-certificate-obtain-errors
        title: Mesh site certificate issuance failing
        condition: THRESHOLD
        for: 30m
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env, identifier) (count_over_time({service="caddy"} | json | level="error" | logger=~"tls.obtain|tls.renew|tls.issuance.acme.*" | identifier=~"mesh-.+|cogni(-[a-z0-9-]+)?[.]vm[.].+" [1h]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "Caddy on {{ $labels.env }} cannot obtain or renew the public certificate for {{ $labels.identifier }} for 30+ minutes. A DNS-only mesh host must resolve directly to that env VM (never proxied)."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # A sequencer rollout takes longer than 10 minutes (B7). In production the per-env coordinators
      # restart with the pod (CD5), so a stuck rollout is a coordinator outage. Read the Kubernetes
      # events in Loki (alloy-k8s-events -> {source="k8s-events"}): Warning events on the sequencer pod
      # or Deployment (BackOff, Unhealthy liveness, FailedMount of a headscale PVC/socket volume,
      # FailedScheduling, ProgressDeadlineExceeded) that keep arriving for 10 minutes mean the new pod
      # has not come up within the bound. The leader heartbeat is NOT a rollout signal: it keeps
      # flowing while a headscale container is down, and node-deploy.alerts.yaml already owns it.
      # Source health is its own rule (mesh-k8s-events-source-silent, bug.5579): this one stays
      # noData=OK so a quiet healthy cluster is green, and the liveness rule pages when the source dies.
      - uid: mesh-sequencer-rollout-slow
        title: Node deploy sequencer rollout stuck for more than 10 minutes
        condition: THRESHOLD
        for: 10m
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum(count_over_time({source="k8s-events",env="production",namespace="cogni-production",event_type="Warning"} | json | name=~"operator-node-deploy-sequencer.*" | reason=~"ProgressDeadlineExceeded|BackOff|Unhealthy|FailedMount|FailedAttachVolume|FailedScheduling|FailedCreatePodSandBox|Failed" [10m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "operator-node-deploy-sequencer has emitted Warning events (BackOff / Unhealthy / FailedMount / FailedScheduling / ProgressDeadlineExceeded) for 10 minutes: its rollout, and with it every env's Headscale coordinator, has not completed within the bound. Read the pod's events and its headscale-<env> container logs."
        labels: { severity: critical, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # The rollout rule above is only as good as its source. Production Kubernetes events stopped
      # reaching Loki on 2026-10-21 (bug.5579), which leaves every event-based rule silently green.
      # Missing evidence must page: no production k8s-events line for 30 minutes is an alert.
      - uid: mesh-k8s-events-source-silent
        title: Production Kubernetes events absent from Loki for 30 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum(count_over_time({source="k8s-events",env="production"} [30m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        annotations:
          summary: "No production Kubernetes event reached Loki in 30 minutes (bug.5579). Every event-based rule, including the sequencer rollout alert, is blind until alloy-k8s-events ships again on the production VM."
        labels: { severity: critical, plane: mesh }
        noDataState: Alerting
        execErrState: Alerting

      # A coordinator container is crash-looping (each start logs {"message":"starting headscale"},
      # verified against v0.29.7 output), so that env has no stable coordinator.
      - uid: mesh-headscale-restarting
        title: A Headscale coordinator restarted more than 3 times in 15 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (container) (count_over_time({env="production",namespace="cogni-production",container=~"headscale-.+"} |~ "(?i)starting headscale" [15m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [3] }
              refId: THRESHOLD
        annotations:
          summary: "{{ $labels.container }} started more than 3 times in 15 minutes: that env's tailnet has no stable coordinator (no new joins, no revokes, no gateway re-approval). Read its JSON logs (PVC permission, config, sqlite)."
        labels: { severity: critical, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # Mesh credential / authentication failures seen by a coordinator: rejected or expired pre-auth
      # keys and refused registrations. A burst means a lease is joining with a revoked or wrong key.
      - uid: mesh-headscale-auth-failures
        title: Headscale refusing mesh credentials
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (container) (count_over_time({env="production",namespace="cogni-production",container=~"headscale-.+"} |~ "(?i)(auth ?key|pre-?auth).*(expired|invalid|not found|used)|registration.*(fail|denied)" [15m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [10] }
              refId: THRESHOLD
        annotations:
          summary: "{{ $labels.container }} refused more than 10 mesh credentials in 15 minutes. A revoked attempt key keeps retrying (expected for a few minutes after a revoke) or a lease holds a wrong key. Read the sequencer's attempt keys and the lease's cogni-mesh companion logs."
        labels: { severity: warning, plane: mesh }
        noDataState: OK
        execErrState: Alerting

      # slice: T2 — the sequencer cannot reach a coordinator (design §2 "A failed Headscale call").
      - uid: mesh-coordinator-call-failed
        title: Sequencer mesh call to Headscale failing
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env) (count_over_time({env="production",service="sequencer"} | json | msg="node_mesh_coordinator_health" | outcome!="ok" [10m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "The sequencer's Headscale call failed (outcome != ok). It has stopped every mesh write for that env (no new keys, revokes queued, revocation failing open) until the coordinator answers."
        labels: { severity: critical, plane: mesh, slice: T2 }
        noDataState: OK
        execErrState: Alerting

      # slice: T2 — no coordinator health line for 10 minutes: missing evidence pages.
      - uid: mesh-coordinator-health-no-data
        title: No mesh coordinator health evidence for 10 minutes
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 600, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum(count_over_time({env="production",service="sequencer"} | json | msg="node_mesh_coordinator_health" [10m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: THRESHOLD
        annotations:
          summary: "No node_mesh_coordinator_health line in 10 minutes: the sequencer is not checking its coordinators (or Loki shipping broke). An unobserved coordinator must never be green."
        labels: { severity: critical, plane: mesh, slice: T2 }
        noDataState: Alerting
        execErrState: Alerting

      # slice: T2 — an approved substrate-gw did not match the request published over the verified
      # channel (tags or keys); the sequencer deleted it (hard requirement 11).
      - uid: mesh-substrate-mismatch
        title: substrate-gw approval did not match the published request
        condition: THRESHOLD
        for: 0s
        data:
          - refId: COUNT
            datasourceUid: grafanacloud-logs
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: loki, uid: grafanacloud-logs }
              expr: 'sum by (env) (count_over_time({env="production",service="sequencer"} | json | msg="node_mesh_substrate_mismatch" [15m]))'
              queryType: instant
              refId: COUNT
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              type: threshold
              expression: COUNT
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: THRESHOLD
        annotations:
          summary: "node_mesh_substrate_mismatch: a tag:substrate approval on {{ $labels.env }} had tags or machine/node keys that differ from the env VM's published request, and the node was deleted. Someone may be racing the gateway's enrollment."
        labels: { severity: critical, plane: mesh, slice: T2 }
        noDataState: OK
        execErrState: Alerting
