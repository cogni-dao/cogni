#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  # Required by the weekly kine-compaction timer below (k3s stores cluster
  # state in kine, a SQLite revision log). Drift repayment: sqlite3 was
  # hand-installed on the production VM on 2026-09-09 while diagnosing
  # bug.5105; declaring it here is what makes a rebuilt VM reproducible.
  - sqlite3

swap:
  filename: /swapfile
  size: 2147483648

write_files:
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    # Reference: infra/compose/docker-daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  - path: /etc/systemd/journald.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=200M
      SystemMaxFileSize=50M
      RuntimeMaxUse=50M

  # k3s server config — disable traefik + servicelb (Caddy handles ingress).
  # k3s install script reads this automatically; no INSTALL_K3S_EXEC flags needed.
  # HONEST_ALLOCATABLE (docs/research/2026-06-10-node-app-scaling-architecture.md):
  # this VM co-hosts the Compose stack (~2.8GB) k3s can't see, so without a
  # reservation k3s reports the full VM RAM as allocatable and over-commits
  # node-app pods → silent OOM/crash-loop. system-reserved subtracts the Compose
  # footprint so over-commit becomes an honest Pending; eviction-hard is the
  # safety net. Templated — an infra-split app VM (no Compose on-box) sets it low.
  - path: /etc/rancher/k3s/config.yaml
    owner: root:root
    permissions: "0644"
    content: |
      disable:
        - traefik
        - servicelb
      kubelet-arg:
        - "system-reserved=memory=${system_reserved_memory}"
        - "eviction-hard=memory.available<${eviction_hard_memory}"
      # KINE_WRITES_ARE_THE_COST: every Event create/update is a row in kine's
      # append-only revision history. A flapping probe can emit tens of thousands
      # of Event updates (2026-09-09: openbao readiness had 20,920) — a major
      # feeder of the revision history that grew state.db past 10 GB and drove
      # the node to 45% iowait. The default 1h retention is far longer than
      # anyone reads an Event; 30m bounds the storm. bug.5188: 30m still let
      # kine bloat 6.4 GB in ~3 days, so tighten Event retention further to 5m —
      # Events are the #1 kine-write source and nothing in this control plane
      # reads an Event older than a few minutes. Retained-history cleanup is the
      # kine-compact timer below; this bounds the inflow.
      kube-apiserver-arg:
        - "event-ttl=5m"

  # k3s container registry config — node-level, all pods get access.
  # - ghcr.io: auth for private cogni images (simpler than per-Deployment
  #   imagePullSecrets for single-node).
  # - docker.io: mirror via mirror.gcr.io (Google's pull-through cache) because
  #   this VM's direct Docker Hub path is unreliable (IPv6 routing issues).
  #   Required for vendor images like grafana/alloy (observability), else
  #   pods fall back to direct docker.io and fail ImagePullBackOff.
  - path: /etc/rancher/k3s/registries.yaml
    owner: root:root
    permissions: "0600"
    content: |
      mirrors:
        ghcr.io:
          endpoint:
            - "https://ghcr.io"
        docker.io:
          endpoint:
            - "https://mirror.gcr.io"
            - "https://registry-1.docker.io"
      configs:
        "ghcr.io":
          auth:
            username: "${ghcr_deploy_username}"
            password: "${ghcr_deploy_token}"

  # Firewall hardening — closes Docker-published internal ports (postgres,
  # doltgres, redis, litellm, temporal-grpc) to the public internet via the
  # DOCKER-USER iptables chain. Single-source script under
  # infra/provision/cherry/harden-docker-public-ports.sh; injected by
  # Terraform `templatefile()` so existing-VM SSH runs use the same logic.
  # Links: bug.5167
  - path: /usr/local/sbin/cogni-harden-docker-public-ports.sh
    owner: root:root
    permissions: "0755"
    content: |
      ${indent(6, harden_script)}

  - path: /opt/cogni-bootstrap.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      # Cogni VM Bootstrap — Docker + k3s + Argo CD on a single VM.
      # Docker Compose runs postgres/temporal/litellm/redis (infra services).
      # k3s runs operator + nodes + services via Argo CD GitOps.
      # Contract: writes /var/lib/cogni/bootstrap.ok on success, bootstrap.fail on error
      set -euo pipefail

      MARKER_OK="/var/lib/cogni/bootstrap.ok"
      MARKER_FAIL="/var/lib/cogni/bootstrap.fail"
      LOG="/var/log/cogni-bootstrap.log"

      mkdir -p /var/lib/cogni
      exec > >(tee -a "$LOG") 2>&1

      # Trap: write failure marker with context, append diagnostics to log
      trap 'ec=$?; {
        echo "BOOTSTRAP_OK=0"
        echo "FAIL_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "EXIT_CODE=$ec"
        echo "LAST_COMMAND=$${BASH_COMMAND}"
      } > "$MARKER_FAIL"
      echo "=== cloud-init status ===" >> "$LOG"
      cloud-init status 2>&1 >> "$LOG" || true
      echo "=== cloud-init-output.log tail ===" >> "$LOG"
      tail -n 200 /var/log/cloud-init-output.log 2>&1 >> "$LOG" || true
      exit $ec' ERR

      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Starting Cogni bootstrap..."

      # ── Docker ───────────────────────────────────────────────
      # TODO: Replace with golden image (Packer) - Docker should be pre-installed, not fetched at boot
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Installing Docker via get.docker.com..."
      curl -fsSL https://get.docker.com | sh

      systemctl enable docker
      systemctl start docker

      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Validating Docker installation..."
      command -v docker >/dev/null || { echo "FATAL: docker binary not found"; exit 1; }
      docker --version || { echo "FATAL: docker --version failed"; exit 1; }
      docker compose version || { echo "FATAL: docker compose plugin not found"; exit 1; }
      systemctl is-active --quiet docker || { echo "FATAL: docker service not active"; exit 1; }

      systemctl restart systemd-journald

      # ── Firewall: close Docker-published internal ports to public internet ──
      # Must run AFTER docker is up (DOCKER-USER chain is created by dockerd),
      # BEFORE compose services start publishing those ports. See bug.5167.
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Hardening Docker-published ports..."
      bash /usr/local/sbin/cogni-harden-docker-public-ports.sh

      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Creating cogni-edge network..."
      docker network create cogni-edge || true

      mkdir -p /opt/cogni-template-edge /opt/cogni-template-runtime

      # ── k3s (containerd) ─────────────────────────────────────
      # Coexists with Docker Compose (dockerd) on the same host.
      # docker ps won't show k3s pods; use kubectl or crictl.
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Installing k3s..."
      curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="v1.31.4+k3s1" sh -

      # Wait for k3s node to register (race condition: node not immediately available)
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Waiting for k3s node to register..."
      for i in $(seq 1 30); do
        if kubectl get nodes --no-headers 2>/dev/null | grep -q .; then
          break
        fi
        echo "  waiting for node registration ($i/30)..."
        sleep 2
      done
      kubectl wait --for=condition=Ready node --all --timeout=120s
      k3s --version
      kubectl get nodes

      # ── HONEST_ALLOCATABLE gate ──────────────────────────────
      # The kubelet system-reserved arg (config.yaml written by write_files above)
      # must actually be in effect — else k3s reports raw VM RAM as allocatable and
      # over-commits node-app pods on this Compose-co-resident box, which is the
      # fleet-502 readiness-cascade failure mode (2026-07-16; a legacy node that
      # predated this arg ran with allocatable==capacity). A fresh node MUST boot
      # honest; fail the bootstrap loudly rather than ship a node that lies about
      # capacity. See docs/design/operator-fleet-safety.md SLA#1.
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Asserting honest allocatable (system-reserved in effect)..."
      CAP_MEM=$(kubectl get node -o jsonpath='{.items[0].status.capacity.memory}')
      ALLOC_MEM=$(kubectl get node -o jsonpath='{.items[0].status.allocatable.memory}')
      echo "  capacity.memory=$CAP_MEM allocatable.memory=$ALLOC_MEM (expect allocatable < capacity by ~${system_reserved_memory})"
      if [ -z "$CAP_MEM" ] || [ "$CAP_MEM" = "$ALLOC_MEM" ]; then
        echo "FATAL: allocatable.memory ($ALLOC_MEM) == capacity.memory ($CAP_MEM) — kubelet system-reserved NOT in effect."
        echo "  The node would over-commit and cascade to a fleet-502. Check /etc/rancher/k3s/config.yaml kubelet-arg and that k3s read it at start."
        exit 1
      fi

      # ── Argo CD + ksops ──────────────────────────────────────
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Cloning repo for Argo CD manifests..."
      apt-get install -y git
      # Inject GHCR PAT for private repo access (same token works for git + registry).
      AUTHED_URL=$(echo "${cogni_repo_url}" | sed "s|https://|https://${ghcr_deploy_username}:${ghcr_deploy_token}@|")
      git clone --depth=1 --branch "${cogni_repo_ref}" \
        "$AUTHED_URL" /tmp/cogni-repo

      # Create argocd namespace + age key Secret BEFORE Argo CD install.
      # ksops sidecar mounts this Secret as a volume for decryption.
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Creating argocd namespace + SOPS age key Secret..."
      kubectl create namespace argocd || true
      echo "${sops_age_private_key}" > /tmp/age-key.txt
      kubectl -n argocd create secret generic sops-age-key \
        --from-file=keys.txt=/tmp/age-key.txt
      rm -f /tmp/age-key.txt

      # Install Argo CD in stages:
      # 1. Base install (remote manifest, pinned version)
      # 2. Wait for server to be available (patches need running deployments)
      # 3. Apply ksops CMP ConfigMap
      # 4. Patch repo-server with ksops sidecar
      # 5. Apply ApplicationSets for staging + production
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Installing Argo CD base (v2.13.4)..."
      kubectl apply -n argocd \
        -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.4/manifests/install.yaml

      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Waiting for Argo CD to be ready..."
      kubectl -n argocd wait --for=condition=Available \
        deployment/argocd-server --timeout=300s

      # ksops CMP plugin + repo-server sidecar patch removed.
      # k8s secrets are created directly by provision script + deploy-infra.sh.
      # SOPS/ksops will be replaced by ESO (task.0284).
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Argo CD installed (no ksops — secrets managed directly)"

      # ApplicationSets are NOT applied here — the provision script applies them
      # AFTER secrets, EndpointSlice IPs, and overlay fixes are all in place.
      # This prevents Argo from racing to sync with incomplete manifests.
      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Skipping ApplicationSets (provision script applies them last)"

      rm -rf /tmp/cogni-repo

      # ── Success marker ───────────────────────────────────────
      rm -f "$MARKER_FAIL"
      {
        echo "BOOTSTRAP_OK=1"
        echo "BOOTSTRAP_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "DOCKER_VERSION=$(docker --version)"
        echo "COMPOSE_VERSION=$(docker compose version)"
        echo "K3S_VERSION=$(k3s --version 2>&1 | head -1)"
        echo "ARGOCD=installed"
        echo "SOPS_KEY=injected"
      } > "$MARKER_OK"

      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Bootstrap complete!"

  # ── kine (SQLite) compaction + page reclamation ──────────────────────────
  # k3s's default datastore is kine, an append-only revision log in SQLite:
  # every object update is a NEW row, and superseded revisions are only removed
  # by kine's own compactor. On 2026-09-09 production state.db reached 10.35 GB
  # with PRAGMA freelist_count = 0 — ZERO reclaimable free pages. The bloat was
  # 1,883,352 LIVE rows for only 150,285 distinct keys (~12.5 retained
  # revisions per key): kine's compaction had failed to keep up. A bare VACUUM
  # (this timer's first design) would therefore have reclaimed nothing. What
  # actually fixed production on 2026-09-10 was compaction — delete every
  # superseded revision, keeping the newest row per name — then VACUUM to
  # return the freed pages to the OS: 10.35 GB -> 353 MB, disk 91% -> 59%.
  # Every k8s API call is a query against this file, so a bloated store slows
  # the API server, which times out probes, which emit Events, which write more
  # kine. This timer breaks that loop unattended. Pair with event-ttl above
  # (bounds the write rate) - this bounds the retained history.
  - path: /usr/local/sbin/k3s-kine-compact.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      DB=/var/lib/rancher/k3s/server/db/state.db
      # Compaction gate. Set BELOW the 512 MB DoD ceiling (bug.5243), not at it:
      # with an hourly timer, once state.db crosses this gate the next run (≤1 h
      # later) compacts, so the peak is gate + at most one hour of growth. A gate
      # AT 512 MB would let the peak sawtooth past 512 MB under storm load and
      # miss the "kine stays <512 MB" DoD; 256 MB keeps the peak comfortably under
      # it. Still well above the reclaim-vs-apiserver-restart break-even.
      MIN_BYTES=268435456
      [ -f "$DB" ] || { echo "kine-compact: no state.db; nothing to do"; exit 0; }
      SIZE=$(stat -c %s "$DB")
      if [ "$SIZE" -lt "$MIN_BYTES" ]; then
        echo "kine-compact: state.db is $SIZE bytes, under threshold $MIN_BYTES; skipping"
        exit 0
      fi
      # VACUUM rewrites the entire database, so it needs headroom equal to the
      # current file. Refuse rather than fill the disk we are trying to protect.
      # VACUUM rewrites into a transient copy before swapping. SQLite places that
      # copy in SQLITE_TMPDIR/TMPDIR, which is NOT necessarily the database's
      # filesystem - so pin it here, otherwise the headroom check below measures
      # one filesystem while the write lands on another.
      export SQLITE_TMPDIR=/var/lib/rancher/k3s/server/db
      AVAIL=$(df -PB1 "$SQLITE_TMPDIR" | awk 'NR==2 {print $4}')
      if [ "$AVAIL" -lt "$SIZE" ]; then
        echo "kine-compact: need $SIZE bytes free, have $AVAIL - refusing"
        exit 1
      fi
      echo "kine-compact: state.db $SIZE bytes; stopping k3s"
      # Armed BEFORE the stop: if `systemctl stop` itself fails under `set -e`,
      # an unarmed trap would leave the cluster down with no restart.
      trap 'systemctl start k3s' EXIT
      systemctl stop k3s
      ROWS_BEFORE=$(sqlite3 "$DB" 'SELECT count(*) FROM kine;')
      # Compaction: keep only the newest row per name (that row IS current
      # state — including delete-tombstones — so this can never remove a live
      # key) and drop every superseded revision. This is the exact operation
      # that took production from 1,883,352 rows to ~150K on 2026-09-10; do
      # not get cleverer than what prod proved.
      sqlite3 "$DB" 'DELETE FROM kine WHERE id NOT IN (SELECT MAX(id) FROM kine GROUP BY name);'
      # VACUUM only pays AFTER the delete: it returns the freed pages to the
      # OS. Alone it reclaims ~nothing (prod freelist_count was 0).
      sqlite3 "$DB" 'VACUUM;'
      ROWS_AFTER=$(sqlite3 "$DB" 'SELECT count(*) FROM kine;')
      NEW=$(stat -c %s "$DB")
      echo "kine-compact: rows $ROWS_BEFORE -> $ROWS_AFTER; $SIZE -> $NEW bytes (reclaimed $((SIZE - NEW)))"

  - path: /etc/systemd/system/k3s-kine-compact.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Compact superseded k3s kine revisions and reclaim SQLite pages
      After=k3s.service

      [Service]
      Type=oneshot
      # A multi-GB compact+VACUUM on a saturated disk runs far past systemd's
      # default start timeout, and a timeout SIGKILLs the script - which skips
      # the EXIT trap and would strand k3s stopped. The script bounds its own
      # work (size threshold + headroom refusal), so let it finish.
      TimeoutStartSec=infinity
      ExecStart=/usr/local/sbin/k3s-kine-compact.sh

  - path: /etc/systemd/system/k3s-kine-compact.timer
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Hourly k3s kine compaction

      [Timer]
      # bug.5188: weekly (Sun 04:15) could not keep up — production kine bloated
      # to 6.4 GB in ~3 days between runs, starving the apiserver long before the
      # next compaction. Run hourly instead. This is cheap: the script's MIN_BYTES
      # gate (256 MB, below the 512 MB DoD ceiling) means most hourly runs no-op
      # without stopping k3s, and it only pays the (few-second) compact+VACUUM
      # once state.db has grown past the gate — so the k3s blip happens on demand,
      # not every hour, and the peak stays under 512 MB (gate + ≤1 h of growth).
      OnCalendar=hourly
      RandomizedDelaySec=5m
      Persistent=true

      [Install]
      WantedBy=timers.target

  # ── kine size exporter (early-warning for regrowth) ──────────────────────
  # bug.5243: hourly compaction + crossplane leader-election-off cut the write
  # rate, but nothing ALERTS if kine regrows toward the 512 MB starvation point.
  # k3s/kine does NOT expose apiserver_storage_db_total_size_in_bytes (verified
  # empty on prod), so we can't scrape it — instead emit the raw state.db size
  # as a node_exporter textfile metric. Alloy's unix exporter reads this dir
  # (host rootfs is mounted read-only at /host/root in the alloy container), the
  # name is added to Alloy's keep-allowlist, and a Grafana rule alerts on it.
  # Named node_* to match the existing scrape/relabel conventions.
  - path: /usr/local/sbin/k3s-kine-size-export.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      DB=/var/lib/rancher/k3s/server/db/state.db
      DIR=/var/lib/node_exporter/textfile
      OUT="$DIR/kine.prom"
      mkdir -p "$DIR"
      SIZE=0
      [ -f "$DB" ] && SIZE=$(stat -c %s "$DB")
      # Atomic write (temp + mv) so a scrape never reads a half-written file.
      TMP=$(mktemp "$DIR/.kine.XXXXXX")
      {
        echo "# HELP node_k3s_kine_state_db_bytes Size of the k3s kine (SQLite) datastore file in bytes."
        echo "# TYPE node_k3s_kine_state_db_bytes gauge"
        echo "node_k3s_kine_state_db_bytes $SIZE"
      } > "$TMP"
      mv -f "$TMP" "$OUT"

  - path: /etc/systemd/system/k3s-kine-size-export.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Export k3s kine state.db size as a node_exporter textfile metric

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/k3s-kine-size-export.sh

  - path: /etc/systemd/system/k3s-kine-size-export.timer
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Sample k3s kine size every minute for alerting

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=1min

      [Install]
      WantedBy=timers.target

runcmd:
  - bash /opt/cogni-bootstrap.sh
  - systemctl daemon-reload
  - systemctl enable --now k3s-kine-compact.timer
  - systemctl enable --now k3s-kine-size-export.timer
