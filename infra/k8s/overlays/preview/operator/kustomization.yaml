apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-preview

resources:
  - ../../../base/node-app
  - ../../../base/openfga-external
  # STILL preview's deployment authority. No infra/catalog row names
  # `compute_api.preview: crossplane`, and `resolveNodeComputeApi` resolves an absent cell to
  # `legacy` (LEGACY_IS_DEFAULT), so every preview workload is reconciled by this controller
  # exactly as before. story.5016 step 9 removed it from candidate-a ONLY; task.5098 deletes it
  # outright once every environment has cut over.
  - ../../../base/compute-workload-controller
  # task.5097 — the private Akash transaction actuator Crossplane dials, STAGED for preview so
  # the cutover is a catalog flip plus a secret write rather than days of manifest work. It is
  # NOT an active writer here: ONE_WALLET_ONE_ACTIVE_WRITER is preserved by two independent
  # fail-closed facts, either of which alone stops it spending —
  #   1. `cogni/preview/akash-tx-actuator` is UNSEEDED, so the ExternalSecret below stays
  #      NotReady, `akash-tx-actuator-env-secrets` is never created, and the pod cannot start;
  #   2. `AKASH_ACTUATOR_ACCOUNT_ID` is "" in the patch below, so even once the bucket IS seeded
  #      the actuator refuses to boot with `actuator_account_id_missing`.
  # Both states are CORRECT for an environment whose wallet has not been cut over. See the
  # comment on the patch below before changing either.
  - ../../../base/akash-tx-actuator
  - external-secret.yaml
  # story.5016 secret-boundary amendment 2 — the actuator's OWN secret plane
  # (cogni/preview/akash-tx-actuator -> akash-tx-actuator-env-secrets). Deliberately a SECOND
  # ExternalSecret rather than more keys in external-secret.yaml above: that one is extracted
  # wholesale into the public operator app's envFrom.
  - ./akash-tx-actuator-external-secret.yaml
  - ./akash-tx-actuator-auth-external-secret.yaml
  - ./secrets-writer-sa.yaml
  - ./compute-workload-platform-application.yaml

namePrefix: operator-

# Runs AFTER the built-in namePrefix transformer and restores the actuator Service's
# name to the bare `akash-tx-actuator` the Crossplane Composition dials. See
# ../../../base/akash-tx-actuator-service-name for why the prefix is what gives.
transformers:
  - ../../../base/akash-tx-actuator-service-name

replacements:
  - source:
      kind: Application
      name: compute-workload-platform
      fieldPath: spec.destination.namespace
    targets:
      - select: { kind: Application, name: compute-workload-platform }
        fieldPaths: [metadata.namespace]

images:
  - name: ghcr.io/cogni-dao/cogni-template
    newName: ghcr.io/cogni-dao/cogni-template
    digest: "sha256:be5e99490e9356f70c6af4b38b62cfbd9775f46047202e8c96ead10de35bd1a0"

patches:
  # story.5016 Gate 0b: controller env values are set BY NAME via strategic
  # merge (env lists merge on `name`), never by positional JSON-pointer index.
  # A positional `/env/N/value` patch silently repoints when the base list
  # shifts — that exact failure (d69e5c29) blanked AKASH_ALLOWED_PROVIDERS
  # fleet-wide, and an empty allowlist rejects every Akash provider bid.
  - target:
      kind: Deployment
      name: compute-workload-controller
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compute-workload-controller
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  # Identical to base; listed first only so the merged env keeps
                  # the base ordering (merge emits patched entries first).
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef: { fieldPath: metadata.namespace }
                  - name: CONTROLLER_ENVIRONMENT
                    value: preview
                  - name: DEPLOYMENT_DOMAIN
                    value: preview.cognidao.org
                  - name: AKASH_ALLOWED_PROVIDERS
                    value: akash16yr3wxt97ae045a06kr3ycde9srcgpg8syjxxm
  # Same BY-NAME strategic merge as the controller above (story.5016 Gate 0b). The
  # actuator's wallet scope is `akash-console:<DEPLOY_ENVIRONMENT>`, which MUST equal the
  # `environment` the Composition sends — the Composition pins that to `cogni-<env>` == the
  # namespace, so these two values are one invariant expressed in two places.
  - target:
      kind: Deployment
      name: akash-tx-actuator
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: akash-tx-actuator
      spec:
        template:
          spec:
            containers:
              - name: actuator
                env:
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef: { fieldPath: metadata.namespace }
                  - name: DEPLOY_ENVIRONMENT
                    value: preview
                  - name: AKASH_ALLOWED_PROVIDERS
                    value: akash16yr3wxt97ae045a06kr3ycde9srcgpg8syjxxm
                  # HUMAN GATE (story.5016 secret-boundary amendment 3). The PUBLIC Akash
                  # account/wallet address the actuator is authorized to spend from — pinned
                  # here as plain config because it is not a secret and must be reviewable in
                  # git. The actuator asserts the live Console account matches it at boot and
                  # refuses otherwise, which is what replaced holding the legacy wallet key
                  # just to byte-compare it.
                  #
                  # DELIBERATELY EMPTY — DO NOT "FIX" THIS (task.5097). preview has no funded,
                  # revocation-proven Akash Console account yet, and the legacy
                  # compute-workload-controller above is still this environment's ONE active
                  # writer on the shared sponsor wallet. An empty value makes the actuator exit
                  # at boot with `actuator_account_id_missing` instead of opening a socket — the
                  # CORRECT fail-closed state for a wallet writer with no proven wallet, and the
                  # reason staging this Deployment cannot buy a lease or contend for one.
                  #
                  # Fill it ONLY as part of the ordered cutover documented on
                  # AKASH_ACTUATOR_CONSOLE_API_KEY in infra/secrets-catalog.yaml: structurally
                  # disable every legacy controller writer for this env FIRST, revoke the legacy
                  # Console key, mint a FRESH key on the account this address names, seed
                  # cogni/preview/akash-tx-actuator/AKASH_ACTUATOR_CONSOLE_API_KEY, and land the
                  # address here in that same change. Pinning an address while the legacy
                  # controller still writes is the split-brain story.5016 exists to purge.
                  - name: AKASH_ACTUATOR_ACCOUNT_ID
                    value: ""
  # Node-specific ConfigMap values.
  # DNS names must match prefixed Service names (namePrefix applies to all resources).
  - target:
      kind: ConfigMap
      name: node-app-config
    patch: |
      - op: replace
        path: /data/NODE_NAME
        value: "operator"
      # Deploy-env name the secrets route stamps onto the OpenBao path
      # (cogni/<env>/<node>/<KEY>). Distinct from APP_ENV (a build flag).
      - op: add
        path: /data/DEPLOY_ENVIRONMENT
        value: "preview"
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-preview"
      - op: replace
        path: /data/LITELLM_BASE_URL
        value: "http://operator-litellm-external:4000"
      - op: replace
        path: /data/TEMPORAL_ADDRESS
        value: "operator-temporal-external:7233"
      - op: replace
        path: /data/REDIS_URL
        value: "redis://operator-redis-external:6379"
      - op: add
        path: /data/NEXTAUTH_URL
        value: "https://preview.cognidao.org"
      - op: add
        path: /data/NODE_MINT_OWNER
        value: "cogni-test-org"
      - op: add
        path: /data/NODE_TEMPLATE_OWNER
        value: "cogni-test-org"
      - op: add
        path: /data/DOLTHUB_OWNER
        value: "cogni-test-nodes"
      - op: add
        path: /data/NODE_SUBMODULE_PARENT_OWNER
        value: "cogni-test-org"
      - op: add
        path: /data/NODE_SUBMODULE_PARENT_REPO
        value: "cogni-monorepo"
      - op: add
        path: /data/OPENFGA_API_URL
        value: "http://operator-openfga-external:8080"
      # Node self-serve secret writes — operator's OpenBao writer role (SA +
      # projected token wired on the Deployment below). OPENBAO_ADDR defaults to
      # the in-cluster ClusterIP, so only the role name is set here.
      - op: add
        path: /data/OPENBAO_NODE_SECRETS_WRITER_ROLE
        value: "preview-node-secrets-writer"
  # NodePort assignment (operator = 30000) + instance label on selector.
  # Instance label prevents cross-node service routing: namePrefix only renames
  # resource names, not labels/selectors, so without this every Service
  # round-robins across all node-app pods.
  - target:
      kind: Service
      name: node-app
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30000
      - op: add
        path: /spec/selector/app.kubernetes.io~1instance
        value: "operator"
  # Fix secret refs + instance label on matchLabels and pod template.
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: "operator-env-secrets"
      - op: replace
        path: /spec/template/spec/initContainers/0/envFrom/1/secretRef/name
        value: "operator-env-secrets"
      # design.node-self-serve-secrets §1.B: the operator pod's OWN OpenBao
      # identity, bound by the preview-node-secrets-writer k8s-auth role.
      # Projected token carries the cogni-openbao audience. SSA (#1642) keeps
      # this drift-free.
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: secrets-writer
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: openbao-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    audience: cogni-openbao
                    expirationSeconds: 3600
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: openbao-token
            mountPath: /var/run/secrets/openbao
            readOnly: true
      - op: add
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: "operator"
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: "operator"

  # task.0423: Doltgres knowledge-plane migrator runs as a second initContainer
  # on the operator Deployment. DATABASE_URL maps to DOLTGRES_URL.
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: migrate-doltgres
          image: ghcr.io/cogni-dao/cogni-template:placeholder
          command:
            - /bin/sh
            - -c
            - exec node /app/nodes/$(NODE_NAME)/app/migrate-doltgres.mjs /app/nodes/$(NODE_NAME)/app/doltgres-migrations
          envFrom:
            - configMapRef:
                name: operator-node-app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: operator-env-secrets
                  key: DOLTGRES_URL
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

  # bug.0295: VM discovery via DNS (cogni-preview.vm.cognidao.org).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  - target: { kind: Service, name: postgres-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-external
      spec:
        type: ExternalName
        externalName: cogni-preview.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: temporal-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal-external
      spec:
        type: ExternalName
        externalName: cogni-preview.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: litellm-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm-external
      spec:
        type: ExternalName
        externalName: cogni-preview.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: openfga-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: openfga-external
      spec:
        type: ExternalName
        externalName: cogni-preview.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: redis-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: redis-external
      spec:
        type: ExternalName
        externalName: cogni-preview.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: doltgres-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: doltgres-external
      spec:
        type: ExternalName
        externalName: cogni-preview.vm.cognidao.org
        clusterIP: null
  - target: { kind: EndpointSlice, name: postgres-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-external-1
  - target: { kind: EndpointSlice, name: temporal-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: temporal-external-1
  - target: { kind: EndpointSlice, name: litellm-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: litellm-external-1
  - target: { kind: EndpointSlice, name: redis-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: redis-external-1
  - target: { kind: EndpointSlice, name: doltgres-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: doltgres-external-1
