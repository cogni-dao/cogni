#
# The preview actuator's dedicated blast-radius boundary. The public operator app
# extracts `preview/operator` wholesale; wallet credentials therefore live only at
# `preview/akash-tx-actuator` and are projected only into the private actuator pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-tx-actuator-env-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: akash-tx-actuator
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-tx-actuator-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: preview/akash-tx-actuator
