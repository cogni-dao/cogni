#
# story.5016 secret-boundary amendment 2, staged for PREVIEW (task.5097) — the actuator's OWN
# secret plane. Byte-for-byte the candidate-a object except for the environment segment of the
# OpenBao path.
#
# WHY THIS EXISTS AT ALL. The operator ExternalSecret next door pulls the ENTIRE
# `cogni/<env>/operator` bucket with `dataFrom: extract` into `operator-env-secrets`, and the
# public operator app takes that whole Secret through `envFrom`. Anything parked in that bucket
# is therefore readable by the internet-facing Next.js process. The Akash Console credential is
# the operator sponsor wallet — an operator-app compromise must not be able to spend it. So the
# actuator gets its own `<service>` under Invariant 1 (PATH = cogni/<env>/<service>/<KEY>), its
# own ExternalSecret, its own k8s Secret, and its own least-privilege projected volume.
#
# The isolation is STRUCTURAL, not a convention: there is no ExternalSecret, `envFrom`, or volume
# anywhere in the operator Deployment that names `cogni/preview/akash-tx-actuator` or
# `akash-tx-actuator-env-secrets`. The operator pod cannot reach the wallet even if it tries.
# (Proven by rendering this overlay: `kubectl kustomize infra/k8s/overlays/preview/operator |
# grep akash-tx-actuator-env-secrets` returns only the actuator's own objects.)
#
# UNSEEDED ON PURPOSE. `cogni/preview/akash-tx-actuator` does NOT exist yet, so this
# ExternalSecret stays NotReady, `akash-tx-actuator-env-secrets` is never created, and the
# actuator pod cannot start. That is the CORRECT pre-cutover state for an environment with no
# funded, revocation-proven wallet — see infra/secrets-catalog.yaml
# (AKASH_ACTUATOR_CONSOLE_API_KEY) for the ordered cutover: disable every legacy controller
# writer FIRST, revoke the legacy key, mint a fresh one, and only then seed this path. Do NOT
# "fix" the NotReady condition by seeding the bucket ahead of that order — two live writers on
# one Console wallet is the exact split-brain this cutover exists to purge.
#
# Invariant 2 shape (ONE ExternalSecret per (service, env), `dataFrom: extract`, target
# `<service>-env-secrets`). Extracting the whole bucket is safe HERE because the bucket holds
# only this service's keys — and the pod still narrows it further with an explicit `items:` list.
#
# The object renders as `operator-akash-tx-actuator-env-secrets` under the overlay's
# `namePrefix: operator-`; `spec.target.name` is deliberately unprefixed because ESO does not
# apply kustomize, and the base Deployment mounts the Secret by that exact name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-tx-actuator-env-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: akash-tx-actuator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-tx-actuator-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: preview/akash-tx-actuator
