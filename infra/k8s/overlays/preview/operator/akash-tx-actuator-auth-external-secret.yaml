#
# Provider-http dereferences exactly this Secret/key. Select only the generated
# bearer token; the Crossplane provider must never be able to read the Console key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-tx-actuator-auth
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: akash-tx-actuator
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-tx-actuator-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: preview/akash-tx-actuator
        property: AKASH_TX_ACTUATOR_TOKEN
