apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: 4b06359a-a859-4399-888e-a8c7a6696f7e
  namespace: cogni-preview
  labels:
    cogni.io/node-id: 4b06359a-a859-4399-888e-a8c7a6696f7e
    cogni.io/environment: preview
    cogni.io/node: poly
spec:
  nodeId: 4b06359a-a859-4399-888e-a8c7a6696f7e
  environment: preview
  bundle:
    ref: ghcr.io/cogni-dao/poly@sha256:22b11d4d00423f2b2bc565e098caf0ea14edb7a549b0ba34801961e6eaa7206e
    source:
      repository: cogni-dao/poly
      sha: f9f3111847ba757db48cf98579ca6348e6ec9b58
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/poly@sha256:b818400e1624d12b2b070227eba62f0f7da634bdd279d454ef690ca02333c4cd
      - name: paper-trader
        image: ghcr.io/cogni-dao/poly-paper-trader@sha256:e124d7f3bf162f51aa9fd46c102763084856a90002d7e087a4a72b183206195e
  workload:
    name: poly
    publicHost: poly-preview.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
          - key: PAPER_ENFORCE_MODE
          - key: POLYGON_RPC_URL
          - key: PRIVY_USER_WALLETS_APP_ID
          - key: PRIVY_USER_WALLETS_APP_SECRET
          - key: PRIVY_USER_WALLETS_SIGNING_KEY
          - key: POLY_WALLET_AEAD_KEY_ID
          - key: POLY_TRADER_OBSERVATION_WRITER_ENABLED
          - key: POLY_WALLET_AEAD_KEY_HEX
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings:
          PAPER_SIDECAR_URL: paper-trader
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
      - name: paper-trader
        artifact: paper-trader
        port: 9100
        visibility: private
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 0.5
        memoryMi: 384
        storageMi: 1024
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Close
    onGiveUp: Hold
  leaseGeneration: 5
  actuatorNamespace: cogni-production
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
