apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: poly-compute-env-secrets
  namespace: cogni-preview
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: poly-compute-env-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        AUTH_SECRET: '{{ index . "AUTH_SECRET" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        BILLING_INGEST_TOKEN: '{{ index . "BILLING_INGEST_TOKEN" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        DATABASE_SERVICE_URL: '{{ index . "DATABASE_SERVICE_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        DATABASE_SSL_CA_CERT: '{{ index . "DATABASE_SSL_CA_CERT" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        DATABASE_URL: '{{ index . "DATABASE_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        DOLTGRES_URL: '{{ index . "DOLTGRES_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        EVM_RPC_URL: '{{ index . "EVM_RPC_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        LITELLM_VIRTUAL_KEY: '{{ index . "LITELLM_VIRTUAL_KEY" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        PAPER_ENFORCE_MODE: '{{ index . "PAPER_ENFORCE_MODE" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        POLYGON_RPC_URL: '{{ index . "POLYGON_RPC_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        POLY_TRADER_OBSERVATION_WRITER_ENABLED: '{{ index . "POLY_TRADER_OBSERVATION_WRITER_ENABLED" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        POLY_WALLET_AEAD_KEY_HEX: '{{ index . "POLY_WALLET_AEAD_KEY_HEX" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        POLY_WALLET_AEAD_KEY_ID: '{{ index . "POLY_WALLET_AEAD_KEY_ID" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        PRIVY_USER_WALLETS_APP_ID: '{{ index . "PRIVY_USER_WALLETS_APP_ID" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        PRIVY_USER_WALLETS_APP_SECRET: '{{ index . "PRIVY_USER_WALLETS_APP_SECRET" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        PRIVY_USER_WALLETS_SIGNING_KEY: '{{ index . "PRIVY_USER_WALLETS_SIGNING_KEY" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        SCHEDULER_API_TOKEN: '{{ index . "SCHEDULER_API_TOKEN" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: preview/poly
        property: AUTH_SECRET
    - secretKey: BILLING_INGEST_TOKEN
      remoteRef:
        key: preview/poly
        property: BILLING_INGEST_TOKEN
    - secretKey: DATABASE_SERVICE_URL
      remoteRef:
        key: preview/poly
        property: DATABASE_SERVICE_URL
    - secretKey: DATABASE_SSL_CA_CERT
      remoteRef:
        key: preview/poly
        property: DATABASE_SSL_CA_CERT
    - secretKey: DATABASE_URL
      remoteRef:
        key: preview/poly
        property: DATABASE_URL
    - secretKey: DOLTGRES_URL
      remoteRef:
        key: preview/poly
        property: DOLTGRES_URL
    - secretKey: EVM_RPC_URL
      remoteRef:
        key: preview/poly
        property: EVM_RPC_URL
    - secretKey: LITELLM_VIRTUAL_KEY
      remoteRef:
        key: preview/poly
        property: LITELLM_VIRTUAL_KEY
    - secretKey: PAPER_ENFORCE_MODE
      remoteRef:
        key: preview/poly
        property: PAPER_ENFORCE_MODE
    - secretKey: POLYGON_RPC_URL
      remoteRef:
        key: preview/poly
        property: POLYGON_RPC_URL
    - secretKey: POLY_TRADER_OBSERVATION_WRITER_ENABLED
      remoteRef:
        key: preview/poly
        property: POLY_TRADER_OBSERVATION_WRITER_ENABLED
    - secretKey: POLY_WALLET_AEAD_KEY_HEX
      remoteRef:
        key: preview/poly
        property: POLY_WALLET_AEAD_KEY_HEX
    - secretKey: POLY_WALLET_AEAD_KEY_ID
      remoteRef:
        key: preview/poly
        property: POLY_WALLET_AEAD_KEY_ID
    - secretKey: PRIVY_USER_WALLETS_APP_ID
      remoteRef:
        key: preview/poly
        property: PRIVY_USER_WALLETS_APP_ID
    - secretKey: PRIVY_USER_WALLETS_APP_SECRET
      remoteRef:
        key: preview/poly
        property: PRIVY_USER_WALLETS_APP_SECRET
    - secretKey: PRIVY_USER_WALLETS_SIGNING_KEY
      remoteRef:
        key: preview/poly
        property: PRIVY_USER_WALLETS_SIGNING_KEY
    - secretKey: SCHEDULER_API_TOKEN
      remoteRef:
        key: preview/poly
        property: SCHEDULER_API_TOKEN
