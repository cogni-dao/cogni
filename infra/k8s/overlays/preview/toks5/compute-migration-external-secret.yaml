apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toks5-compute-migration-secrets
  namespace: cogni-preview
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: toks5-compute-migration-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: preview/toks5-database-migration
        property: DATABASE_MIGRATION_URL
    - secretKey: DOLTGRES_URL
      remoteRef:
        key: preview/toks5
        property: DOLTGRES_URL
