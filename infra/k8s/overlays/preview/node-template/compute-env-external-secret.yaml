apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-template-compute-env-secrets
  namespace: cogni-preview
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: node-template-compute-env-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: preview/node-template
        property: AUTH_SECRET
    - secretKey: BILLING_INGEST_TOKEN
      remoteRef:
        key: preview/node-template
        property: BILLING_INGEST_TOKEN
    - secretKey: DATABASE_SERVICE_URL
      remoteRef:
        key: preview/node-template
        property: DATABASE_SERVICE_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: preview/node-template
        property: DATABASE_URL
    - secretKey: LITELLM_VIRTUAL_KEY
      remoteRef:
        key: preview/node-template
        property: LITELLM_VIRTUAL_KEY
    - secretKey: SCHEDULER_API_TOKEN
      remoteRef:
        key: preview/node-template
        property: SCHEDULER_API_TOKEN
