#
# task.5428 — the `preview` env-plane instance's own namespace, so its NetworkPolicies select nothing else.
# The name matches the Alloy k3s pod-log filter (`cogni-.*`), so substrate-gw's events reach Loki.
apiVersion: v1
kind: Namespace
metadata:
  name: cogni-mesh-preview
  labels:
    app.kubernetes.io/part-of: cogni-mesh
    cogni.dev/mesh-tailnet: preview
