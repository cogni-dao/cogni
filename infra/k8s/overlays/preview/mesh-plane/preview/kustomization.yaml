#
# task.5428 — the `preview` tailnet's env-plane instance on the preview VM's own k3s (canonical; its coordinator runs in the production sequencer).
# Reconciled by infra/k8s/argocd/control-plane/preview/preview-mesh-plane-preview-application.yaml.
# Every value comes from the tailnet table in scripts/ci/lib/mesh-plane.sh (generated, then pinned by
# tests/ci-invariants/mesh-env-plane.spec.ts); the forwarder ClusterIPs are in the k3s static band
# (10.43.0.16-.254), unique in the repo. No instance writes a target another instance writes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cogni-mesh-preview
nameSuffix: -preview
resources:
  - namespace.yaml
components:
  - ../../../../base/mesh-env-plane
configMapGenerator:
  - name: mesh-env
    literals:
      - MESH_TAILNET=preview
      - MESH_CONTROL_HOST=mesh-preview.cognidao.org
      - MESH_RELAY_HOST=derp-preview.cognidao.org
      - MESH_VM_HOST=cogni-preview.vm.cognidao.org
      - MESH_WIREGUARD_PORT=41641
      # HR20 bound: 4 h. The short-bound test sets a smaller value here in a reviewed PR, flights it
      # through the control-plane lane, and reverts it the same way.
      - SUBSTRATE_GW_MAP_POLL_BOUND_SECONDS=14400
patches:
  - target: { kind: Service, name: mesh-control-fwd }
    patch: |
      - op: replace
        path: /spec/clusterIP
        value: 10.43.0.47
  - target: { kind: Service, name: substrate-fwd }
    patch: |
      - op: replace
        path: /spec/clusterIP
        value: 10.43.0.48
  - target: { kind: Service, name: derper }
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 32346
  - target: { kind: Service, name: substrate-gw-publisher }
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 32347
  # substrate-fwd's translated destination for node:30900 is the scheduler-worker pod of this env.
  - target: { kind: NetworkPolicy, name: substrate-fwd }
    patch: |
      - op: replace
        path: /spec/egress/1/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: cogni-preview
  # Forwarder load fix (story.5146): socat forks one child per open connection (~0.75 MiB RSS each plus
  # its socket buffers). The base 12Mi/20m cap is sized for an idle instance. On 2026-11-07 the six
  # production node lanes moved onto this tailnet; from 22:34Z the kernel killed substrate-fwd 47 times
  # in 35 min (memcg usage 12288kB = limit, oom.group kills every listener). The relay listener died with
  # them, so substrate-gw lost its relay and every node lost Postgres, Doltgres and Temporal. These VMs
  # have the headroom (see the budget in tests/ci-invariants/mesh-env-plane.spec.ts); candidate-a has not,
  # so the base stays small. Guaranteed QoS kept (requests = limits).
  - target: { kind: Deployment, name: substrate-fwd }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: 250m, memory: 256Mi } }
  - target: { kind: Deployment, name: mesh-control-fwd }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 50m, memory: 64Mi } }
replacements:
  # hostAliases ips = the forwarder Services' ClusterIPs (one source; after the patches above).
  - source: { kind: Service, name: mesh-control-fwd, fieldPath: spec.clusterIP }
    targets:
      - select: { kind: Deployment, name: substrate-gw }
        fieldPaths: [spec.template.spec.hostAliases.0.ip]
  - source: { kind: Service, name: substrate-fwd, fieldPath: spec.clusterIP }
    targets:
      - select: { kind: Deployment, name: substrate-gw }
        fieldPaths: [spec.template.spec.hostAliases.1.ip]
  # hostAliases names = this tailnet's control and relay hosts (one source: mesh-env).
  - source: { kind: ConfigMap, name: mesh-env, fieldPath: data.MESH_CONTROL_HOST }
    targets:
      - select: { kind: Deployment, name: substrate-gw }
        fieldPaths: [spec.template.spec.hostAliases.0.hostnames.0]
  - source: { kind: ConfigMap, name: mesh-env, fieldPath: data.MESH_RELAY_HOST }
    targets:
      - select: { kind: Deployment, name: substrate-gw }
        fieldPaths: [spec.template.spec.hostAliases.1.hostnames.0]
