apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: b927a9dd-6132-4fc9-a51e-e3cee2568e3c
  namespace: cogni-candidate-a
  labels:
    cogni.io/node-id: b927a9dd-6132-4fc9-a51e-e3cee2568e3c
    cogni.io/environment: candidate-a
    cogni.io/node: node-template
spec:
  nodeId: b927a9dd-6132-4fc9-a51e-e3cee2568e3c
  environment: candidate-a
  bundle:
    ref: ghcr.io/cogni-dao/node-template@sha256:5d99a22168c134455a03a0224430e1d8b58b7bbb4b6e2d771f3696b9485baceb
    source:
      repository: cogni-dao/node-template
      sha: dd93e84681b44329d4daf874fe10b494f00db6e0
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/node-template@sha256:c203b4aebdd7a07a0f721b9c81841f6ca38b2b7c5620da25afe592e7ce7837dd
  workload:
    name: node-template
    publicHost: node-template-test.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Close
    onGiveUp: Hold
  leaseGeneration: 0
  actuatorNamespace: cogni-production
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
