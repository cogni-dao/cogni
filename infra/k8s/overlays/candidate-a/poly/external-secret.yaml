#
# ESO producer for this node's app Secret. The render-node-overlays.sh renderer
# (and its byte-exact operator-mint twin gens/overlay.ts) clone this file into
# every wizard-born node's overlay with a pure s/poly/<slug>/g rewrite,
# so poly/beacon/… each get their own <slug>-env-secrets from cogni/<env>/<slug>.
# Twin of infra/k8s/overlays/<env>/operator/external-secret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # namePrefix renders this object as poly-env-secrets. The target Secret
  # below is intentionally already prefixed because ESO does not apply kustomize.
  name: env-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: poly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: poly-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: candidate-a/poly
