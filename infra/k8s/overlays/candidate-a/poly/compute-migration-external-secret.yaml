apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: poly-compute-migration-secrets
  namespace: cogni-candidate-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: poly-compute-migration-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: candidate-a/poly-database-migration
        property: DATABASE_MIGRATION_URL
    - secretKey: DOLTGRES_URL
      remoteRef:
        key: candidate-a/poly
        property: DOLTGRES_URL
