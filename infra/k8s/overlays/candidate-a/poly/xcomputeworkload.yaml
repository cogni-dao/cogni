apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: 4b06359a-a859-4399-888e-a8c7a6696f7e
  namespace: cogni-candidate-a
  labels:
    cogni.io/node-id: 4b06359a-a859-4399-888e-a8c7a6696f7e
    cogni.io/environment: candidate-a
    cogni.io/node: poly
spec:
  nodeId: 4b06359a-a859-4399-888e-a8c7a6696f7e
  environment: candidate-a
  bundle:
    ref: ghcr.io/cogni-dao/poly@sha256:e08d0ec960e5656920850fc62d14d11130b9bd0ebb04d416ae1a9e15884183d3
    source:
      repository: cogni-dao/poly
      sha: 6582caf451862402fb51518fcba0532a4e80016e
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/poly@sha256:d71f551cc641624e1db067d795e905fb2ac4caeb866dde3e90d385dc8f8891b2
      - name: paper-trader
        image: ghcr.io/cogni-dao/poly-paper-trader@sha256:cb053f5d558b49b0af1587b3293253b6defa5e511426910aee17ca255a03097f
  workload:
    name: poly
    publicHost: poly-test.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
          - key: PAPER_ENFORCE_MODE
          - key: POLYGON_RPC_URL
          - key: PRIVY_USER_WALLETS_APP_ID
          - key: PRIVY_USER_WALLETS_APP_SECRET
          - key: PRIVY_USER_WALLETS_SIGNING_KEY
          - key: POLY_WALLET_AEAD_KEY_ID
          - key: POLY_TRADER_OBSERVATION_WRITER_ENABLED
          - key: POLY_WALLET_AEAD_KEY_HEX
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings:
          PAPER_SIDECAR_URL: paper-trader
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
      - name: paper-trader
        artifact: paper-trader
        port: 9100
        visibility: private
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 0.5
        memoryMi: 384
        storageMi: 1024
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Close
    onGiveUp: Replace
  leaseGeneration: 42
  placement:
    requiredCountries:
      - BE
  actuatorNamespace: cogni-production
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
