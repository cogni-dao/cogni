apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: 557d8b59-8e3b-42f0-9aeb-a5c171296556
  namespace: cogni-candidate-a
  labels:
    cogni.io/node-id: 557d8b59-8e3b-42f0-9aeb-a5c171296556
    cogni.io/environment: candidate-a
    cogni.io/node: levelup
spec:
  nodeId: 557d8b59-8e3b-42f0-9aeb-a5c171296556
  environment: candidate-a
  bundle:
    ref: ghcr.io/cogni-dao/levelup@sha256:a9cbe6236a19c389aaa7245675b85e2483e8eab70a2db27a3b147b0de0caa71e
    source:
      repository: cogni-dao/levelup
      sha: 4a123d04e14763c9ab850c957528a2be058041a0
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/levelup@sha256:e4e417e336e1f93c480d28947c5fa8f382278dbbb404ce832940d8dcc14e4e9f
  workload:
    name: levelup
    publicHost: levelup-test.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Close
    onGiveUp: Hold
  leaseGeneration: 1
  actuatorNamespace: cogni-production
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
