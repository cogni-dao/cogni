apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: red-compute-env-secrets
  namespace: cogni-candidate-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: red-compute-env-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        AUTH_SECRET: '{{ index . "AUTH_SECRET" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        BILLING_INGEST_TOKEN: '{{ index . "BILLING_INGEST_TOKEN" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        DATABASE_SERVICE_URL: '{{ index . "DATABASE_SERVICE_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        DATABASE_SSL_CA_CERT: '{{ index . "DATABASE_SSL_CA_CERT" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        DATABASE_URL: '{{ index . "DATABASE_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        DOLTGRES_URL: '{{ index . "DOLTGRES_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        EVM_RPC_URL: '{{ index . "EVM_RPC_URL" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        LITELLM_VIRTUAL_KEY: '{{ index . "LITELLM_VIRTUAL_KEY" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        SANDBOX_EXECD_TOKEN: '{{ index . "SANDBOX_EXECD_TOKEN" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
        SCHEDULER_API_TOKEN: '{{ index . "SCHEDULER_API_TOKEN" | toJson | trimPrefix "\"" | trimSuffix "\"" }}'
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: candidate-a/red
        property: AUTH_SECRET
    - secretKey: BILLING_INGEST_TOKEN
      remoteRef:
        key: candidate-a/red
        property: BILLING_INGEST_TOKEN
    - secretKey: DATABASE_SERVICE_URL
      remoteRef:
        key: candidate-a/red
        property: DATABASE_SERVICE_URL
    - secretKey: DATABASE_SSL_CA_CERT
      remoteRef:
        key: candidate-a/red
        property: DATABASE_SSL_CA_CERT
    - secretKey: DATABASE_URL
      remoteRef:
        key: candidate-a/red
        property: DATABASE_URL
    - secretKey: DOLTGRES_URL
      remoteRef:
        key: candidate-a/red
        property: DOLTGRES_URL
    - secretKey: EVM_RPC_URL
      remoteRef:
        key: candidate-a/red
        property: EVM_RPC_URL
    - secretKey: LITELLM_VIRTUAL_KEY
      remoteRef:
        key: candidate-a/red
        property: LITELLM_VIRTUAL_KEY
    - secretKey: SANDBOX_EXECD_TOKEN
      remoteRef:
        key: candidate-a/red
        property: SANDBOX_EXECD_TOKEN
    - secretKey: SCHEDULER_API_TOKEN
      remoteRef:
        key: candidate-a/red
        property: SCHEDULER_API_TOKEN
