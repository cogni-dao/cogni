apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: red-compute-env-secrets
  namespace: cogni-candidate-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: red-compute-env-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: candidate-a/red
        property: AUTH_SECRET
    - secretKey: BILLING_INGEST_TOKEN
      remoteRef:
        key: candidate-a/red
        property: BILLING_INGEST_TOKEN
    - secretKey: DATABASE_SERVICE_URL
      remoteRef:
        key: candidate-a/red
        property: DATABASE_SERVICE_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: candidate-a/red
        property: DATABASE_URL
    - secretKey: DOLTGRES_URL
      remoteRef:
        key: candidate-a/red
        property: DOLTGRES_URL
    - secretKey: EVM_RPC_URL
      remoteRef:
        key: candidate-a/red
        property: EVM_RPC_URL
    - secretKey: LITELLM_VIRTUAL_KEY
      remoteRef:
        key: candidate-a/red
        property: LITELLM_VIRTUAL_KEY
    - secretKey: SCHEDULER_API_TOKEN
      remoteRef:
        key: candidate-a/red
        property: SCHEDULER_API_TOKEN
