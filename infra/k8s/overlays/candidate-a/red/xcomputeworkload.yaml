apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: 921b1d1d-4ded-4a6d-b3f1-f7d6affa406a
  namespace: cogni-candidate-a
  labels:
    cogni.io/node-id: 921b1d1d-4ded-4a6d-b3f1-f7d6affa406a
    cogni.io/environment: candidate-a
    cogni.io/node: red
spec:
  nodeId: 921b1d1d-4ded-4a6d-b3f1-f7d6affa406a
  environment: candidate-a
  bundle:
    ref: ghcr.io/cogni-dao/red@sha256:853530469a531f7fe62b854938952039bb11d8512a3d3271e4f1ce200e46d08e
    source:
      repository: cogni-dao/red
      sha: 376347b3709404a1af93ae27a52bbbe3e91e078d
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/red@sha256:33a8e49f7a39b8fc6a12e2b052382eed85e8b341a52c78db78375fe5d84e51c6
  workload:
    name: red
    publicHost: red-test.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Close
    onGiveUp: Hold
  leaseGeneration: 0
  actuatorNamespace: cogni-production
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
