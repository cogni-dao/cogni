apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: f66b260b-4633-41e2-8711-b7c1b8449cc1
  namespace: cogni-candidate-a
  labels:
    cogni.io/node-id: f66b260b-4633-41e2-8711-b7c1b8449cc1
    cogni.io/environment: candidate-a
    cogni.io/node: toks5
spec:
  nodeId: f66b260b-4633-41e2-8711-b7c1b8449cc1
  environment: candidate-a
  bundle:
    ref: ghcr.io/cogni-dao/toks5@sha256:ea281a0d8600759d9eefaa70607d4279dd833c1d5bccaa1e560862aaf6cd620e
    source:
      repository: cogni-dao/toks5
      sha: e4f6bd1f192e21562fe3b37d4b3d00c5a211b6d2
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/toks5@sha256:fca4ce71685eb13421ca4c69d2985146adf7f7a7fceac2ddad79d17ce5aff675
  workload:
    name: toks5
    publicHost: toks5-test.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Close
    onGiveUp: Hold
  leaseGeneration: 1
  actuatorNamespace: cogni-production
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
