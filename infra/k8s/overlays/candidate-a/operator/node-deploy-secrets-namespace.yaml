#
# task.5400 — the DEDICATED namespace for the node-deploy sequencer's generated state-workload passwords.
# It exists so the sequencer never needs a secrets verb in the wallet namespace (`cogni-candidate-a`), where the
# akash-tx actuator and its ExternalSecret-projected credentials live. Cluster-scoped, so the overlay's
# `namespace:` transformer leaves it alone; the sequencer's Role/RoleBinding are moved into it by a
# `replacements` entry in kustomization.yaml. Created before the Role (sync-wave -1).
apiVersion: v1
kind: Namespace
metadata:
  name: cogni-node-deploy-candidate-a
  labels:
    app.kubernetes.io/name: node-deploy-secrets
    app.kubernetes.io/part-of: cogni
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
