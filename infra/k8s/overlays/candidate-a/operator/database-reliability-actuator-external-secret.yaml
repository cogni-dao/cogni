# Dedicated privileged-control bucket; never extracted into the public operator app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-reliability-actuator-env-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: database-reliability-actuator
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: database-reliability-actuator-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_RELIABILITY_ADMIN_URL
      remoteRef:
        {
          key: candidate-a/database-reliability-actuator,
          property: DATABASE_RELIABILITY_ADMIN_URL,
        }
    - secretKey: DATABASE_RELIABILITY_STATUS_TOKEN
      remoteRef:
        {
          key: candidate-a/database-reliability-actuator,
          property: DATABASE_RELIABILITY_STATUS_TOKEN,
        }
    - secretKey: GH_REVIEW_APP_PRIVATE_KEY_BASE64
      remoteRef:
        {
          key: candidate-a/operator,
          property: GH_REVIEW_APP_PRIVATE_KEY_BASE64,
        }
    - secretKey: PROMETHEUS_READ_USERNAME
      remoteRef:
        { key: candidate-a/operator, property: PROMETHEUS_READ_USERNAME }
    - secretKey: PROMETHEUS_READ_PASSWORD
      remoteRef:
        { key: candidate-a/operator, property: PROMETHEUS_READ_PASSWORD }
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        { key: candidate-a/operator, property: GRAFANA_SERVICE_ACCOUNT_TOKEN }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-reliability-status-client
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: database-reliability-status-client
spec:
  refreshInterval: 5m
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target:
    name: database-reliability-status-client
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_RELIABILITY_STATUS_TOKEN
      remoteRef:
        {
          key: candidate-a/database-reliability-actuator,
          property: DATABASE_RELIABILITY_STATUS_TOKEN,
        }
