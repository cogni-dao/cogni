apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-candidate-a

resources:
  - ../../../base/node-app
  - ../../../base/openfga-external
  # Exactly ONE writer reaches the Akash wallet here: the private transaction actuator
  # below, called by the node-deploy sequencer (task.5400). ONE_WALLET_ONE_ACTIVE_WRITER.
  # Preview pins NO wallet, so candidate-a is the sole active writer on the shared test
  # wallet; production carries the rail on its own dedicated wallet.
  # task.5102 — each environment that HOSTS A WRITER has its own actuator and
  # credential-delivery path; candidate-a holds the managed test account, preview hosts no
  # writer, and production is isolated on a dedicated account. `account -> writer` is
  # injective (bug.5187); tests/ci-invariants/akash-tx-actuator-runtime.spec.ts pins the
  # funded set (ACTUATOR_ENVIRONMENTS) and each writer's own OpenBao path.
  - ../../../base/akash-tx-actuator
  - external-secret.yaml
  - ../../../base/operator-migration-external-secret
  # story.5016 secret-boundary amendment 2 — the actuator's OWN secret plane
  # (cogni/candidate-a/akash-tx-actuator -> akash-tx-actuator-env-secrets). Deliberately a
  # SECOND ExternalSecret rather than more keys in external-secret.yaml above: that one is
  # extracted wholesale into the public operator app's envFrom.
  - ./akash-tx-actuator-external-secret.yaml
  # bug.5240 — the keyless lease-log pump rides wherever an actuator runs: it enumerates the
  # actuator's ledger (read-only op) and ships every live lease's logs to Loki.
  - ../../../base/lease-log-pump
  # task.5400 — the node-deploy sequencer (blue/green deploy verb) rides wherever an actuator runs: it
  # PAYS only through that actuator and holds no Console key. Single instance by advisory lock.
  - ../../../base/node-deploy-sequencer
  - ./node-deploy-secrets-namespace.yaml
  # task.5247 — private read-only database status observation.
  - ../../../base/database-reliability-actuator
  - ./database-reliability-actuator-external-secret.yaml
  - ./secrets-writer-sa.yaml

namePrefix: operator-

# task.5428 — the mesh coordinators (one Headscale container + PVC + socket volume + client NodePort
# per tailnet) ride beside their one writer: this TEST operator's sequencer serves its own candidate-a lanes (test-org fixture nodes) on its own tailnet, with no production identity (test-fleet parity).
components:
  - ../../../base/node-deploy-mesh/tailnets/test-candidate-a

# Runs AFTER the built-in namePrefix transformer and restores the actuator Service's
# name to the bare `akash-tx-actuator` its callers dial. See
# ../../../base/akash-tx-actuator-service-name for why the prefix is what gives.
transformers:
  - ../../../base/akash-tx-actuator-service-name

images:
  - name: ghcr.io/cogni-dao/cogni-template
    newName: ghcr.io/cogni-dao/cogni-template
    digest: "sha256:0250cc2e6c01a80172d19b00583b65c50990b27849ca16815e75d2d899511b53"

replacements:
  # task.5400 — the sequencer's secrets live in a DEDICATED namespace, not the wallet namespace
  # (cogni-candidate-a). The `namespace:` transformer above forces EVERYTHING it can into cogni-candidate-a, including
  # the name of a Namespace object, so this replacement puts them back. ONE source of truth: the env
  # value the sequencer itself reads (patched BY NAME below), copied onto the Namespace's name and the
  # Role/RoleBinding's namespace, so the process, the Namespace and the RBAC can never disagree.
  - source:
      kind: Deployment
      name: node-deploy-sequencer
      fieldPath: spec.template.spec.containers.[name=sequencer].env.[name=NODE_DEPLOY_SECRETS_NAMESPACE].value
    targets:
      - select: { kind: Namespace, name: cogni-node-deploy-candidate-a }
        fieldPaths: [metadata.name]
      - select: { kind: Role, name: node-deploy-sequencer }
        fieldPaths: [metadata.namespace]
      - select: { kind: RoleBinding, name: node-deploy-sequencer }
        fieldPaths: [metadata.namespace]

patches:
  - target:
      kind: ExternalSecret
      name: migration-secrets
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: candidate-a/operator-database-migration
  - target:
      kind: Deployment
      name: database-reliability-actuator
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: database-reliability-actuator
      spec:
        template:
          spec:
            containers:
              - name: actuator
                env:
                  - name: DEPLOY_ENVIRONMENT
                    value: candidate-a
                  - name: FORK_DOMAIN_ROOT
                    value: cognidao.org
  # bug.5546: the operator serving container ran at base tier (512Mi limit /
  # 384MB V8 heap = 128MB non-heap headroom). A heavy /knowledge|/graph SSR
  # refresh hit V8's 384MB old-space ceiling -> FATAL JS heap OOM -> in-place
  # restart -> 502. Operator is hand-authored (generator-exempt), so this is a
  # per-node bump: 1Gi container limit + matching --max-old-space-size=768
  # (256MB non-heap margin). requests + cpu limit are left unchanged (no QoS /
  # scheduling / surge change). A larger per-env operator-control tier is a
  # tracked follow-up; see .context/compute-sizing-design.md.
  - target:
      kind: Deployment
      name: node-app
    # JSON6902 (not strategic-merge): operator-rollout-strategy.test.sh parses
    # every node-app patch as an op-list. Base env[0] is NODE_OPTIONS; the
    # overlay only appends env, so index 0 is stable.
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "--max-old-space-size=768"
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: replace
        path: /spec/template/spec/initContainers/0/env/0/valueFrom/secretKeyRef/name
        value: operator-migration-secrets
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATABASE_RELIABILITY_ACTUATOR_URL
          value: http://operator-database-reliability-actuator:8080
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATABASE_RELIABILITY_STATUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: operator-env-secrets
              key: DATABASE_RELIABILITY_STATUS_TOKEN
              optional: true
  # story.5016 Gate 0b: actuator env values are set BY NAME via strategic
  # merge (env lists merge on `name`), never by positional JSON-pointer index.
  # A positional `/env/N/value` patch silently repoints when the base list
  # shifts — that exact failure (d69e5c29) blanked AKASH_ALLOWED_PROVIDERS
  # fleet-wide. Since story.5050 an empty AKASH_ALLOWED_PROVIDERS means "no
  # provider pin — screen on policy alone", NOT "reject every bid"; a silently
  # repointed env value is nonetheless still a fleet-wide incident.
  # DEPLOY_ENVIRONMENT must equal the `environment` the Composition sends — the Composition
  # pins that to `cogni-<env>` == the namespace, so these two values are one invariant expressed
  # in two places. It is NOT the ledger scope: bug.5187 keys `wallet_scope` on
  # AKASH_ACTUATOR_ACCOUNT_ID below, so that one account is one single-writer slot.
  - target:
      kind: Deployment
      name: akash-tx-actuator
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: akash-tx-actuator
      spec:
        template:
          spec:
            containers:
              - name: actuator
                env:
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef: { fieldPath: metadata.namespace }
                  - name: DEPLOY_ENVIRONMENT
                    value: candidate-a
                  - name: AKASH_ALLOWED_PROVIDERS
                    # task.5270 — BEHAVIOR PARITY: byte-identical to production's list, same
                    # order. Candidate-a is where production behavior is proven, so a narrower
                    # candidate pin (previously 3 providers, bug.5356) validated a different
                    # auction than the one production runs. Geo placement is still enforced
                    # per node by `required_placement_countries.<env>`, which filters bids
                    # fail-closed. tests/ci-invariants/overlay-behavior-parity.spec.ts fails
                    # if this value drifts from production's.
                    value: ""
                    # bug.5582: no provider pin. 10 of the 12 pinned providers run Akash < v0.16.7
                    # and stopped bidding on ACT-priced orders, so the pin refused every live bidder
                    # fleet-wide. Placement is screened on policy alone (countries, quality, strikes).
                  # HUMAN GATE (story.5016 secret-boundary amendment 3). The PUBLIC Akash
                  # account/wallet address the actuator is authorized to spend from — pinned
                  # here as plain config because it is not a secret and must be reviewable in
                  # git. The actuator asserts the live Console account matches it at boot and
                  # refuses otherwise, which is what replaced holding the legacy wallet key
                  # just to byte-compare it.
                  #
                  # EMPTY until the cutover: disable every legacy controller writer, revoke the
                  # legacy Console key, mint a fresh key on the SAME account, then land that
                  # account's address here in the same change that seeds
                  # cogni/candidate-a/akash-tx-actuator/AKASH_ACTUATOR_CONSOLE_API_KEY.
                  # Until then the actuator CrashLoops with `actuator_account_id_missing`,
                  # which is the correct state for a wallet writer with no proven wallet.
                  - name: AKASH_ACTUATOR_ACCOUNT_ID
                    # PUBLIC, non-secret Akash account address of the operator sponsor wallet.
                    # Asserted at boot by assertActuatorWalletAccount() against Console
                    # /v1/wallets, so the actuator refuses to start if its credential resolves
                    # to any other account. This is the same account the legacy controller used:
                    # story.5016's cutover is one wallet with ONE ACTIVE WRITER, achieved by
                    # revoking the legacy key and minting a fresh one, not by a second account.
                    value: "akash12eh8xgpeyumar3sk6wp94y0tq9uh62mkezxjmt"
  # bug.5240 — same BY-NAME env rule as the actuator patch above.
  - target:
      kind: Deployment
      name: lease-log-pump
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: lease-log-pump
      spec:
        template:
          spec:
            containers:
              - name: pump
                env:
                  - name: DEPLOY_ENVIRONMENT
                    value: candidate-a
  # task.5400 — the RoleBinding lives in the dedicated secrets namespace (see `replacements`), so the
  # `namespace:`/`namePrefix:` transformers no longer rewrite its ServiceAccount subject: state it.
  - target:
      kind: RoleBinding
      name: node-deploy-sequencer
    patch: |
      - op: replace
        path: /subjects/0
        value:
          kind: ServiceAccount
          name: operator-node-deploy-sequencer
          namespace: cogni-candidate-a
  # task.5405 — the admission bound on the sequencer's ExternalSecrets applies to THIS env's dedicated
  # namespace only (base/node-deploy-sequencer/admission-policy.yaml).
  - target:
      kind: ValidatingAdmissionPolicyBinding
      name: node-deploy-sequencer-externalsecrets
    patch: |
      - op: replace
        path: /spec/matchResources/namespaceSelector/matchExpressions/0/values
        value: [cogni-node-deploy-candidate-a]
  # task.5400 — same BY-NAME env rule as the actuator and pump patches.
  - target:
      kind: Deployment
      name: node-deploy-sequencer
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: node-deploy-sequencer
      spec:
        template:
          spec:
            containers:
              - name: sequencer
                env:
                  - name: DEPLOY_ENVIRONMENT
                    value: candidate-a
                  - name: NODE_DEPLOY_OPERATOR_DOMAIN_ROOT
                    value: cognidao.org
                  - name: NODE_DEPLOY_SECRETS_NAMESPACE
                    value: cogni-node-deploy-candidate-a
                  - name: AKASH_CHAIN_OWNER
                    value: "akash12eh8xgpeyumar3sk6wp94y0tq9uh62mkezxjmt"
                  # task.5405 — a node APP gets the same runtime env the Crossplane lane gave it. Its
                  # secrets arrive through the EXISTING custody path (OpenBao -> ESO eso-reader -> a
                  # Secret in NODE_DEPLOY_SECRETS_NAMESPACE): no new OpenBao role, no projected token.
                  # `vm_host_for_env`: the environment VM's published alias the shared substrate
                  # (Temporal 7233, Redis 6379, LiteLLM 4000, worker health 30900) answers on.
                  - name: NODE_DEPLOY_SUBSTRATE_HOST
                    value: cogni-candidate-a.vm.cognidao.org
                  # The test operator's fleet: the org that owns its nodes' source repos. Same value as
                  # NODE_SUBMODULE_PARENT_OWNER, which the route uses; unset admits no remote-source node, so the
                  # sequencer's edge guard would refuse every test node's host (story.5137 test lane).
                  - name: NODE_DEPLOY_FLEET_OWNER
                    valueFrom:
                      configMapKeyRef:
                        name: node-app-config
                        key: NODE_SUBMODULE_PARENT_OWNER
                        optional: true
                  - name: NODE_DEPLOY_WORKLOAD_ZONE
                    valueFrom:
                      configMapKeyRef:
                        name: node-app-config
                        key: NODE_DEPLOY_WORKLOAD_ZONE
                        optional: true
                  # story.5137 — this TEST operator's node hosts live in the isolated test zone, not in
                  # cognidao.org (hub test-fleet-parity-boundary; dns-ops skill). Its Cloudflare token
                  # (OpenBao cogni/candidate-a/operator/CLOUDFLARE_API_TOKEN) is scoped to this zone only,
                  # so the sequencer resolves the zone id BY NAME with that token. The operator endpoint
                  # (test.cognidao.org) and the substrate host above stay in cognidao.org. Production sets
                  # cognidao.org explicitly; preview has no local binding.
                  # task.5428 — the test tailnet's DNS-only hosts live in this test zone, so THIS sequencer
                  # (the only holder of the test-zone token) is their one writer: a CNAME to the candidate-a
                  # VM alias, proxied=false, read back every 10 minutes (features/node-deploy/mesh-dns.ts).
                  # Pinned equal to scripts/ci/lib/mesh-plane.sh by node-deploy-mesh-coordinators.spec.ts.
                  - name: NODE_DEPLOY_MESH_DNS_RECORDS
                    value: mesh-test-candidate-a=cogni-candidate-a.vm.cognidao.org,derp-test-candidate-a=cogni-candidate-a.vm.cognidao.org
                  # task.5428 — the test operator's candidate-a lane reaches the substrate over its OWN tailnet
                  # (test-fleet parity): its node apps get a per-attempt mesh key, the socket
                  # /var/run/headscale/test-candidate-a/headscale.sock and the control URL
                  # https://mesh-test-candidate-a.cogni-testing.org (env-lanes.ts). The production operator's
                  # canonical lanes flip in its own overlay.
                  - name: NODE_DEPLOY_SUBSTRATE_TRANSPORTS
                    value: candidate-a=mesh:test-candidate-a
  - target:
      kind: ConfigMap
      name: node-app-config
    patch: |
      - op: replace
        path: /data/NODE_NAME
        value: "operator"
      # Deploy-env name the secrets route stamps onto the OpenBao path
      # (cogni/<env>/<node>/<KEY>). Distinct from APP_ENV (a build flag).
      - op: add
        path: /data/DEPLOY_ENVIRONMENT
        value: "candidate-a"
      # FLEET CONTROL ENV (bug.5204/bug.5235) — the env whose cluster reconciles akash lanes, the
      # TS twin of scripts/ci/lib/appset-paths.sh `control_env_for` (FLEET_CONTROL_ENV). This is the
      # ISOLATED cogni-test-org fleet with NO production cluster, so its OWN control plane
      # (candidate-a) reconciles + pays for akash lanes and the env-membership verb authors its
      # AppSets under appsets/candidate-a/, not the nonexistent appsets/production/. Unset on the
      # cogni-dao fleet => production (byte-identical).
      - op: add
        path: /data/FLEET_CONTROL_ENV
        value: "candidate-a"
      # Public Akash workload zone for the disposable test fleet. This is deliberately separate
      # from NEXTAUTH_URL/test.cognidao.org, which is the shared k3s operator control endpoint.
      - op: add
        path: /data/FORK_DOMAIN_ROOT
        value: "cogni-testing.org"
      # PUBLIC, non-secret Akash account the actuator spends from (same value pinned on the
      # akash-tx-actuator container above). The OPERATOR APP needs it too: the env-membership
      # verb's remove (`POST /api/v1/nodes/{id}/envs`) and the deploy-state route read the
      # allocation ledger through createLeaseReadCapability (compute-leases.ts), which returns
      # undefined unless AKASH_ACTUATOR_ACCOUNT_ID is on the app runtime. (The lease_generation
      # derivation this was first added for was deleted, task.5411.)
      - op: add
        path: /data/AKASH_ACTUATOR_ACCOUNT_ID
        value: "akash12eh8xgpeyumar3sk6wp94y0tq9uh62mkezxjmt"
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-candidate-a"
      - op: replace
        path: /data/LITELLM_BASE_URL
        value: "http://operator-litellm-external:4000"
      - op: replace
        path: /data/TEMPORAL_ADDRESS
        value: "operator-temporal-external:7233"
      - op: replace
        path: /data/REDIS_URL
        value: "redis://operator-redis-external:6379"
      - op: add
        path: /data/NEXTAUTH_URL
        value: "https://test.cognidao.org"
      # Node-formation mint target — candidate-a mints node repos into the disposable
      # cogni-test-org (zero Cogni-DAO access); cogni-operator-test holds admin there.
      # Fail-closed: the publish route 503s if these are unset.
      - op: add
        path: /data/NODE_MINT_OWNER
        value: "cogni-test-org"
      - op: add
        path: /data/NODE_TEMPLATE_OWNER
        value: "cogni-test-org"
      # DoltHub node knowledge repo owner — non-secret environment config.
      # PAT stays in operator-env-secrets via OpenBao/ESO.
      - op: add
        path: /data/DOLTHUB_OWNER
        value: "cogni-test-nodes"
      # Per-env override for the operator's OWN knowledge mirror: candidate-a
      # syncs to a throwaway repo so validation here never touches prod knowledge.
      # A doltgres push only lands cleanly on a repo with no prior (divergent)
      # history, so this is a dedicated fresh repo — NOT the reused probe. Prod
      # instead targets its canonical <owner>/<slug> repo.
      - op: add
        path: /data/KNOWLEDGE_DOLTHUB_REMOTE_URL
        value: "https://doltremoteapi.dolthub.com/cogni-dao/knowledge-operator-candidate-a"
      # Submodule pin-PR target: candidate-a uses the throwaway org mirror.
      - op: add
        path: /data/NODE_DEPLOY_WORKLOAD_ZONE
        value: "cogni-testing.org"
      - op: add
        path: /data/NODE_SUBMODULE_PARENT_OWNER
        value: "cogni-test-org"
      - op: add
        path: /data/NODE_SUBMODULE_PARENT_REPO
        value: "cogni-monorepo"
      # Runtime catalog/deploy-state source. This is intentionally distinct from
      # the disposable submodule PR target above: candidate serves the fleet
      # declared by the canonical operator repo.
      - op: add
        path: /data/NODE_REGISTRY_CATALOG_OWNER
        value: "cogni-dao"
      - op: add
        path: /data/NODE_REGISTRY_CATALOG_REPO
        value: "cogni"
      - op: add
        path: /data/OPENFGA_API_URL
        value: "http://operator-openfga-external:8080"
      # Node self-serve secret writes — the operator's OpenBao writer role (the
      # SA + projected token are wired on the Deployment below). OPENBAO_ADDR
      # defaults to the in-cluster ClusterIP, so only the role name is set here.
      - op: add
        path: /data/OPENBAO_NODE_SECRETS_WRITER_ROLE
        value: "candidate-a-node-secrets-writer"
  - target:
      kind: Service
      name: node-app
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30000
      - op: add
        path: /spec/selector/app.kubernetes.io~1instance
        value: "operator"
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: "operator-env-secrets"
      - op: replace
        path: /spec/template/spec/initContainers/0/envFrom/1/secretRef/name
        value: "operator-env-secrets"
      - op: add
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: "operator"
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: "operator"

  # design.node-self-serve-secrets §1.B: the operator pod's OWN OpenBao identity.
  # serviceAccountName resolves to operator-secrets-writer (namePrefix), bound by
  # the <env>-node-secrets-writer k8s-auth role. The projected token carries the
  # cogni-openbao audience (the default audience is bound to no role — silent-auth trap).
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: secrets-writer
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: openbao-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    audience: cogni-openbao
                    expirationSeconds: 3600
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: openbao-token
            mountPath: /var/run/secrets/openbao
            readOnly: true

  # task.0423: Doltgres knowledge-plane migrator runs as a second initContainer
  # on the operator Deployment. DATABASE_URL maps to DOLTGRES_URL (separate from
  # the Postgres DATABASE_URL the main container + first initContainer use).
  - target:
      kind: Deployment
      name: node-app
    patch: |
      # One-time legacy writer cutover; restore RollingUpdate after all operator lanes prove v2.
      - op: replace
        path: /spec/strategy
        value: {type: Recreate}
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: migrate-doltgres
          image: ghcr.io/cogni-dao/cogni-template:placeholder
          command:
            - /bin/sh
            - -c
            - exec node --input-type=module -e 'import { migrateOperatorAfterNativeDrain } from "/app/nodes/operator/app/migrate-doltgres.mjs"; await migrateOperatorAfterNativeDrain("/app/nodes/operator/app/doltgres-migrations")'
          envFrom:
            - configMapRef:
                name: operator-node-app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: operator-env-secrets
                  key: DOLTGRES_URL
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  # bug.0295: VM discovery via DNS (cogni-candidate-a.vm.cognidao.org).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  - target: { kind: Service, name: postgres-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-external
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: temporal-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal-external
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: litellm-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm-external
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: openfga-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: openfga-external
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: redis-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: redis-external
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: doltgres-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: doltgres-external
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: EndpointSlice, name: postgres-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-external-1
  - target: { kind: EndpointSlice, name: temporal-external-1 }
    patch: |
