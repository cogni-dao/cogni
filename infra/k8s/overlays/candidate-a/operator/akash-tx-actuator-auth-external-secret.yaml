#
# task.5102 — the bearer token the XComputeWorkload Composition presents to the actuator.
# The Composition references it as the provider-http placeholder
# `{{ akash-tx-actuator-auth:<ns>:token }}`: the OSS provider resolves it from THIS Secret at
# request time and keeps the placeholder form in spec, status.requestDetails and its logs, so
# no value ever crosses the control plane.
#
# Same OpenBao key the actuator pod reads (cogni/<env>/operator/AKASH_TX_ACTUATOR_TOKEN),
# projected under the exact object name + key the placeholder names. The object below is
# rendered as operator-akash-tx-actuator-auth by namePrefix; target.name is deliberately
# unprefixed because ESO does not apply kustomize.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-tx-actuator-auth
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-tx-actuator-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  # One key, selected by property — NOT `dataFrom: extract`. The whole operator bucket must
  # not be reachable through an object the Crossplane provider can dereference by name.
  data:
    - secretKey: token
      remoteRef:
        key: candidate-a/operator
        property: AKASH_TX_ACTUATOR_TOKEN
