#
# The OPERATOR-owned half of the `cogni-candidate-a` lane's env resolution (story.5016 seam 5).
# Sibling of candidate-a-actuator-auth-external-secret.yaml; same pattern, different bucket key.
#
# WHY THIS EXISTS. Every workload env value reaches Akash as a provider-http placeholder that is
# resolved IN THE RECONCILING CLUSTER, and the Composition builds each placeholder's namespace
# from the XR's OWN namespace. Three distinct Secret names are dereferenced that way:
#   akash-tx-actuator-auth:<ns>:token        -> seam 4, the writer's bearer
#   <slug>-compute-env-secrets:<ns>:<KEY>    -> the NODE's own values; generated per-node by
#                                               nodes/operator/app/src/features/compute/
#                                               compute-workload-secret-manifests.ts. STILL
#                                               UNRESOLVED in a lane — neither a cross-env write
#                                               nor a cross-cluster read exists yet; see
#                                               kustomization.yaml for both dead ends.
#   operator-env-secrets:<ns>:<KEY>          -> THIS FILE
#
# The third one is the platform's, not the node's, so no per-node generator can produce it and
# nothing else in this lane would. Without it a lane XR mints its lease and then fails closed on
# DNS — the node is paid for and unreachable by name.
#
# EXACTLY THE KEYS THE COMPOSITION NAMES IN $ns, SELECTED ONE BY ONE — never `dataFrom: extract`.
# cogni-production's own `operator-env-secrets` is a wholesale extract of the operator bucket (50
# keys today: DSNs, the GitHub App key, LLM keys). Projecting that shape into a lane would let
# ANY XComputeWorkload placed in this namespace name ANY production operator credential as a
# lease env var and ship it to a third-party provider. Key-selection is what caps the lane's
# reach at the four values it actually needs. The set is pinned against the Composition by
# tests/ci-invariants/akash-lane-compute-env-custody.spec.ts, so a new $ns-scoped operator
# placeholder fails review here instead of failing closed in a paid lease.
#
# DOWN-TRUST. This is a production-custody credential read by a pre-prod-NAMED namespace INSIDE
# the production cluster — the only direction allowed. The inverse (a production token placed in
# the candidate-a CLUSTER, which runs unmerged control-plane trees by design) stays REJECTED.
#
# COUPLING, ACCEPTED KNOWINGLY. All four keys are `required: false` in infra/secrets-catalog.yaml,
# and ESO fails an ExternalSecret WHOLE when a named property is absent — so on a fork whose
# operator bucket lacks the LOKI_LEASE_PUSH_* trio this object does not sync at all and takes
# CLOUDFLARE_API_TOKEN down with it. That is a deliberate trade for key-selection: the wholesale
# extract that degrades per-key is the same shape that would leak the other 46 keys. All four are
# present in the production operator bucket as of this commit; a fork that lacks the trio drops
# those three entries (and leaves `runtime.logPush` off, which is already the XRD default).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-env-secrets
  namespace: cogni-candidate-a
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: akash-lane
spec:
  # Class: STANDARD. Unlike the actuator bearer next door, none of these four spends money —
  # a Cloudflare Zone-DNS-Edit token and a logs:write-only Grafana credential. 1h matches the
  # projection in cogni-production these are copied from; 1m is unsanctioned (60x OpenBao reads
  # against a Shamir 1-of-1 server that has already OOMKilled, bug.5011).
  refreshInterval: 1h
  secretStoreRef:
    # The IN-CLUSTER store. NEVER a second ClusterSecretStore pointed at a pre-prod cluster's
    # OpenBao: that would make a cluster running unreviewed code the SOURCE of values this
    # cluster interpolates into a lease billed to the production Console account, which is
    # up-trust no matter which way the credential itself flows.
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    # Wire contract, not a preference — this is the literal name in the placeholder
    # `{{ operator-env-secrets:<ns>:KEY }}` the Composition emits.
    name: operator-env-secrets
    creationPolicy: Owner
    # Retain: a lease already holding a DNS record must not lose the token that DELETES it.
    deletionPolicy: Retain
  data:
    # DNS intent — composition.yaml "composed: DNS intent".
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: production/operator
        property: CLOUDFLARE_API_TOKEN
    # Application-log identity (bug.5127) — composition.yaml, opt-in via runtime.logPush.
    - secretKey: LOKI_LEASE_PUSH_URL
      remoteRef:
        key: production/operator
        property: LOKI_LEASE_PUSH_URL
    - secretKey: LOKI_LEASE_PUSH_USER
      remoteRef:
        key: production/operator
        property: LOKI_LEASE_PUSH_USER
    - secretKey: LOKI_LEASE_PUSH_TOKEN
      remoteRef:
        key: production/operator
        property: LOKI_LEASE_PUSH_TOKEN
