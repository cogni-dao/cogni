#
# The bearer the `cogni-preview` lane presents to the ONE production writer (story.5016 seam 4).
# Pattern: ../operator/akash-tx-actuator-auth-external-secret.yaml, projected one namespace over.
#
# The Composition references this object as the provider-http placeholder
# `{{ akash-tx-actuator-auth:<ns>:token }}` — <ns> being the XR's own namespace — so the object
# name, the namespace and the key are a wire contract, not a preference. The OSS provider
# resolves it at request time and keeps the placeholder form in spec, status.requestDetails and
# its logs, so no value ever crosses the control plane.
#
# SAME PATH, DELIBERATELY. remoteRef is `production/akash-tx-actuator` — NOT
# `preview/akash-tx-actuator`. Same account ⇒ same ledger ⇒ same writer ⇒ same bearer. A
# per-lane path would either resolve to nothing (this cluster's OpenBao holds only
# cogni/production/*) or imply a second writer. This is a READ of a production-custody
# credential by a pre-prod-NAMED namespace INSIDE the production cluster — down-trust, the only
# direction allowed. The inverse — the production Console key placed in a candidate-a or
# preview CLUSTER — stays REJECTED: those clusters run unreviewed control-plane trees.
#
# NOTE this does NOT fund the preview ENVIRONMENT's own actuator: preview still ships no
# actuator Deployment and pins no account (INSTALLED_IS_NOT_FUNDED, asserted by
# tests/ci-invariants/akash-tx-actuator-runtime.spec.ts). The lane is a namespace in the
# PRODUCTION cluster; the preview cluster gains nothing from this file.
#
# One key, selected by property — NOT `dataFrom: extract`. Even the actuator's own OpenBao
# bucket must not be dereferenceable wholesale through an object the Crossplane provider can
# name: this Secret carries the bearer token and NOTHING else (never the Console credential
# beside it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-tx-actuator-auth
  namespace: cogni-preview
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    # component is the ACTUATOR, not a node app: a rotation sweep keyed on this label
    # (scripts/secrets/sync-secret.sh akash-tx-actuator) must see every projection of this
    # token, including the lane copies.
    app.kubernetes.io/component: akash-tx-actuator
spec:
  # Class: CRITICAL (secrets-management.md "Refresh intervals") — same as the writer's own auth
  # Secret, because this credential spends real money. NOT 1m (unsanctioned, 60x OpenBao reads
  # against a Shamir 1-of-1 server that has already OOMKilled, bug.5011) and NOT 1h.
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-tx-actuator-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: production/akash-tx-actuator
        property: AKASH_TX_ACTUATOR_TOKEN
