#
# The PRODUCTION actuator's own secret plane. Mirrors the candidate-a leaf; only the OpenBao
# path differs, because a wallet is per-environment by construction.
#
# WHY PRODUCTION EXISTS AT ALL (Derek ruling 2026-09-15, supersedes "CANDIDATE-A ONLY for v0"):
# production governs Spawn, and production only. Candidate-a is a transient validation gate whose
# nodes are ephemeral, so the environment that mints DURABLE paid leases is this one. The merged
# hub entry `akash-cicd-pareto-scope` already said so — "Spawn succeeds only when the canonical
# production hostname serves the exact immutable build SHA... Generation-1 activity authority
# should be production from birth" — the as-built simply landed every rung on candidate-a first.
#
# ONE WALLET, ONE ACTIVE WRITER still holds, and is what makes a SECOND Console account
# mandatory rather than a preference: production spends from its own funded account, candidate-a
# keeps the original. Two actuators on one account would be two independent writers against one
# wallet, each serialized only by its OWN env's Postgres (`akash_tx_allocations_single_writer_idx`
# is a per-database partial unique index — it cannot see another environment's ledger).
#
# The isolation is STRUCTURAL: nothing in the operator Deployment names
# `cogni/production/akash-tx-actuator` or `akash-tx-actuator-env-secrets`, so an operator-app
# compromise cannot reach the production wallet. That is the whole point of the dedicated bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-tx-actuator-env-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: akash-tx-actuator
spec:
  # Class: CRITICAL (secrets-management.md "Refresh intervals"). This credential spends real
  # money, so it is financial-state material like the AEAD row — 5m, paired with the force-sync
  # hook that rotation actually uses. NOT 1m (not a sanctioned class; 60x OpenBao reads forever
  # against a Shamir 1-of-1 OpenBao that has already OOMKilled, bug.5011) and NOT 1h (the routine
  # app-secret class — this is not a routine app secret).
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-tx-actuator-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: production/akash-tx-actuator
