apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-production

resources:
  - ../../../base/node-app
  - ../../../base/openfga-external
  # story.5016 step 9, production (mirror of #2212 on candidate-a): the legacy
  # compute-workload-controller is structurally removed so exactly ONE writer — the
  # Crossplane transaction actuator below — can reach an Akash wallet from this env.
  # Its old-account leases are closed (all 12 retired 2026-09-15) and its Console key
  # is dead; the pod was pure reconcile-churn + memory on a full box.
  - external-secret.yaml
  - ./secrets-writer-sa.yaml
  - ./compute-workload-platform-application.yaml
  # story.5016 production cutover — the private Akash transaction actuator Crossplane calls.
  # #2234 shipped the two ExternalSecrets deliberately WITHOUT this Deployment because a
  # projected Secret source whose key is absent makes kubelet refuse the mount (FailedMount,
  # Argo app Degraded, invisible to Loki — bug.5142). That ordering constraint is satisfied:
  # the production credential is written and verified at cogni/production/akash-tx-actuator,
  # so the Deployment can land and mount it.
  - ../../../base/akash-tx-actuator
  - ./akash-tx-actuator-external-secret.yaml
  - ./akash-tx-actuator-auth-external-secret.yaml

namePrefix: operator-

# Runs AFTER the built-in namePrefix transformer and restores the actuator Service's
# name to the bare `akash-tx-actuator` the Crossplane Composition dials. See
# ../../../base/akash-tx-actuator-service-name for why the prefix is what gives.
transformers:
  - ../../../base/akash-tx-actuator-service-name

replacements:
  - source:
      kind: Application
      name: compute-workload-platform
      fieldPath: spec.destination.namespace
    targets:
      - select: { kind: Application, name: compute-workload-platform }
        fieldPaths: [metadata.namespace]

images:
  - name: ghcr.io/cogni-dao/cogni-template
    newName: ghcr.io/cogni-dao/cogni-template
    digest: "sha256:ab7f2bfc24b4b48a2b825c2faee8454c42ce423706767049cc1e4faba3705388"

patches:
  # story.5016 Gate 0b: env values are set BY NAME via strategic merge (env lists
  # merge on `name`), never by positional JSON-pointer index. A positional
  # `/env/N/value` patch silently repoints when the base list shifts — that exact
  # failure (d69e5c29) blanked AKASH_ALLOWED_PROVIDERS fleet-wide, and an empty
  # allowlist rejects every Akash provider bid.
  - target:
      kind: Deployment
      name: akash-tx-actuator
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: akash-tx-actuator
      spec:
        template:
          spec:
            containers:
              - name: actuator
                env:
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef: { fieldPath: metadata.namespace }
                  - name: DEPLOY_ENVIRONMENT
                    value: production
                  # Same allowlist as the legacy controller above and as candidate-a's proven
                  # lease: the zencloud provider that already hosts every production slot.
                  - name: AKASH_ALLOWED_PROVIDERS
                    value: akash16yr3wxt97ae045a06kr3ycde9srcgpg8syjxxm
                  - name: AKASH_ACTUATOR_ACCOUNT_ID
                    # PUBLIC, non-secret Akash account address of the operator sponsor wallet.
                    # Asserted at boot by assertActuatorWalletAccount() against Console
                    # /v1/wallets, so the actuator refuses to start if its credential resolves
                    # to any other account. Unlike candidate-a (which kept the original shared
                    # account), production spends from its own DEDICATED funded account —
                    # ONE_WALLET_ONE_ACTIVE_WRITER is per environment, and this pin is the
                    # non-secret half of that proof (the credential lives only at
                    # cogni/production/akash-tx-actuator, never in the operator bucket).
                    value: "akash10auj6u6wr7aqjawuxurgue9w7wfnca50t8cr4l"
  # Node-specific ConfigMap values.
  # DNS names must match prefixed Service names (namePrefix applies to all resources).
  - target:
      kind: ConfigMap
      name: node-app-config
    patch: |
      - op: replace
        path: /data/NODE_NAME
        value: "operator"
      # Deploy-env name the secrets route stamps onto the OpenBao path
      # (cogni/<env>/<node>/<KEY>). Distinct from APP_ENV (a build flag).
      - op: add
        path: /data/DEPLOY_ENVIRONMENT
        value: "production"
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-production"
      - op: replace
        path: /data/LITELLM_BASE_URL
        value: "http://operator-litellm-external:4000"
      - op: replace
        path: /data/TEMPORAL_ADDRESS
        value: "operator-temporal-external:7233"
      - op: replace
        path: /data/REDIS_URL
        value: "redis://operator-redis-external:6379"
      - op: add
        path: /data/NEXTAUTH_URL
        value: "https://cognidao.org"
      - op: add
        path: /data/NODE_MINT_OWNER
        value: "cogni-dao"
      - op: add
        path: /data/NODE_TEMPLATE_OWNER
        value: "cogni-dao"
      - op: add
        path: /data/NODE_SUBMODULE_PARENT_OWNER
        value: "cogni-dao"
      - op: add
        path: /data/NODE_SUBMODULE_PARENT_REPO
        value: "cogni"
      - op: add
        path: /data/DOLTHUB_OWNER
        value: "cogni-dao"
      # Non-prod mirror org: prod publish ALSO creates <this>/<slug> so a fresh
      # node's candidate-a/preview mirror target exists (bug.5002). The prod PAT is
      # cross-org (creates in cogni-dao AND cogni-test-nodes); non-prod holds no PAT
      # (bug.5003), so this bootstrap can only run here on prod.
      - op: add
        path: /data/DOLTHUB_NONPROD_OWNER
        value: "cogni-test-nodes"
      - op: add
        path: /data/OPENFGA_API_URL
        value: "http://operator-openfga-external:8080"
      # Node self-serve secret writes — operator's OpenBao writer role (SA +
      # projected token wired on the Deployment below). OPENBAO_ADDR defaults to
      # the in-cluster ClusterIP, so only the role name is set here.
      - op: add
        path: /data/OPENBAO_NODE_SECRETS_WRITER_ROLE
        value: "production-node-secrets-writer"
  # NodePort assignment (operator = 30000) + instance label on selector.
  # Instance label prevents cross-node service routing: namePrefix only renames
  # resource names, not labels/selectors, so without this every Service
  # round-robins across all node-app pods.
  - target:
      kind: Service
      name: node-app
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30000
      - op: add
        path: /spec/selector/app.kubernetes.io~1instance
        value: "operator"
  # Fix secret refs + instance label on matchLabels and pod template.
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: "operator-env-secrets"
      - op: replace
        path: /spec/template/spec/initContainers/0/envFrom/1/secretRef/name
        value: "operator-env-secrets"
      # design.node-self-serve-secrets §1.B: the operator pod's OWN OpenBao
      # identity. serviceAccountName resolves to operator-secrets-writer
      # (namePrefix), bound by the production-node-secrets-writer k8s-auth role.
      # Projected token carries the cogni-openbao audience (default audience is
      # bound to no role — silent-auth trap). SSA (#1642) keeps this drift-free.
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: secrets-writer
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: openbao-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    audience: cogni-openbao
                    expirationSeconds: 3600
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: openbao-token
            mountPath: /var/run/secrets/openbao
            readOnly: true
      - op: add
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: "operator"
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: "operator"

  # task.0423: Doltgres knowledge-plane migrator runs as a second initContainer
  # on the operator Deployment. DATABASE_URL maps to DOLTGRES_URL.
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: migrate-doltgres
          image: ghcr.io/cogni-dao/cogni-template:placeholder
          command:
            - /bin/sh
            - -c
            - exec node /app/nodes/$(NODE_NAME)/app/migrate-doltgres.mjs /app/nodes/$(NODE_NAME)/app/doltgres-migrations
          envFrom:
            - configMapRef:
                name: operator-node-app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: operator-env-secrets
                  key: DOLTGRES_URL
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

  # bug.0295: VM discovery via DNS (cogni.vm.cognidao.org).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  - target: { kind: Service, name: postgres-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-external
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: temporal-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal-external
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: litellm-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm-external
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: openfga-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: openfga-external
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: redis-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: redis-external
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: doltgres-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: doltgres-external
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: EndpointSlice, name: postgres-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-external-1
  - target: { kind: EndpointSlice, name: temporal-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: temporal-external-1
  - target: { kind: EndpointSlice, name: litellm-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: litellm-external-1
  - target: { kind: EndpointSlice, name: redis-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: redis-external-1
  - target: { kind: EndpointSlice, name: doltgres-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: doltgres-external-1
