apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # namePrefix renders this object as operator-env-secrets. The target Secret
  # below is intentionally already prefixed because ESO does not apply kustomize.
  name: env-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: operator-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: production/operator
---
# Migration is a separate capability from the public app runtime. Argo owns
# this producer so the initContainer can never race an imperative-only Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: migration-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: database-migration
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: operator-migration-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: production/operator-database-migration
        property: DATABASE_MIGRATION_URL
