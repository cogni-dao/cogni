# Private control banks are extracted only into their owning service secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-reliability-actuator-env-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: database-reliability-actuator
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: database-reliability-actuator-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PROMETHEUS_READ_USERNAME
      remoteRef:
        key: production/_shared
        property: PROMETHEUS_READ_USERNAME
    - secretKey: PROMETHEUS_READ_PASSWORD
      remoteRef:
        key: production/_shared
        property: PROMETHEUS_READ_PASSWORD
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: production/operator
        property: GRAFANA_SERVICE_ACCOUNT_TOKEN
  dataFrom:
    - extract:
        key: production/database-reliability-actuator
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-reliability-readmitter-env-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: database-reliability-readmitter
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: database-reliability-readmitter-env-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_RELIABILITY_STATUS_TOKEN
      remoteRef:
        key: production/database-reliability-actuator
        property: DATABASE_RELIABILITY_STATUS_TOKEN
    - secretKey: PROMETHEUS_READ_USERNAME
      remoteRef:
        key: production/_shared
        property: PROMETHEUS_READ_USERNAME
    - secretKey: PROMETHEUS_READ_PASSWORD
      remoteRef:
        key: production/_shared
        property: PROMETHEUS_READ_PASSWORD
  dataFrom:
    - extract:
        key: production/database-reliability-readmitter
