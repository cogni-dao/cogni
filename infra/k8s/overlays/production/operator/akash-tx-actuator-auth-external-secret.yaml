#
# task.5102 — the bearer token the XComputeWorkload Composition presents to the actuator.
# The Composition references it as the provider-http placeholder
# `{{ akash-tx-actuator-auth:<ns>:token }}`: the OSS provider resolves it from THIS Secret at
# request time and keeps the placeholder form in spec, status.requestDetails and its logs, so
# no value ever crosses the control plane.
#
# Same OpenBao key the actuator pod reads — now cogni/<env>/akash-tx-actuator/AKASH_TX_ACTUATOR_TOKEN,
# the actuator's DEDICATED bucket rather than the broad operator one the public app extracts
# wholesale (story.5016 secret-boundary amendment 2). Projected under the exact object name + key
# the placeholder names. The object below is rendered as operator-akash-tx-actuator-auth by
# namePrefix; target.name is deliberately unprefixed because ESO does not apply kustomize.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-tx-actuator-auth
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: operator
spec:
  # Class: CRITICAL (secrets-management.md "Refresh intervals"). This credential spends real
  # money, so it is financial-state material like the AEAD row — 5m, paired with the force-sync
  # hook that rotation actually uses. NOT 1m (not a sanctioned class; 60x OpenBao reads forever
  # against a Shamir 1-of-1 OpenBao that has already OOMKilled, bug.5011) and NOT 1h (the routine
  # app-secret class — this is not a routine app secret).
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-tx-actuator-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  # One key, selected by property — NOT `dataFrom: extract`. Even the actuator's own bucket must
  # not be reachable wholesale through an object the Crossplane provider can dereference by name:
  # provider-http resolves `{{ akash-tx-actuator-auth:<ns>:token }}`, so this Secret must carry
  # the bearer token and NOTHING else (never the Console wallet credential beside it).
  data:
    - secretKey: token
      remoteRef:
        key: production/akash-tx-actuator
        property: AKASH_TX_ACTUATOR_TOKEN
