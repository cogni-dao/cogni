#
# task.5102 shape, staged for PRODUCTION (task.5097) — the bearer token the XComputeWorkload
# Composition presents to the actuator. The Composition references it as the provider-http
# placeholder `{{ akash-tx-actuator-auth:<ns>:token }}`: the OSS provider resolves it from THIS
# Secret at request time and keeps the placeholder form in spec, status.requestDetails and its
# logs, so no value ever crosses the control plane.
#
# Same OpenBao key the actuator pod reads — cogni/production/akash-tx-actuator/AKASH_TX_ACTUATOR_TOKEN,
# the actuator's DEDICATED bucket rather than the broad operator one the public app extracts
# wholesale (story.5016 secret-boundary amendment 2). Projected under the exact object name + key
# the placeholder names. The object below is rendered as operator-akash-tx-actuator-auth by
# namePrefix; target.name is deliberately unprefixed because ESO does not apply kustomize.
#
# `AKASH_TX_ACTUATOR_TOKEN` is `source: agent` in infra/secrets-catalog.yaml (generate: hex/32),
# so nothing is hand-typed: secret-materialize mints it idempotently for the environment. It is
# NOT the wallet — the wallet credential is the separate, human-seeded
# AKASH_ACTUATOR_CONSOLE_API_KEY in the same bucket, and only the ExternalSecret next door
# extracts that.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: akash-tx-actuator-auth
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: akash-tx-actuator-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  # One key, selected by property — NOT `dataFrom: extract`. Even the actuator's own bucket must
  # not be reachable wholesale through an object the Crossplane provider can dereference by name:
  # provider-http resolves `{{ akash-tx-actuator-auth:<ns>:token }}`, so this Secret must carry
  # the bearer token and NOTHING else (never the Console wallet credential beside it).
  data:
    - secretKey: token
      remoteRef:
        key: production/akash-tx-actuator
        property: AKASH_TX_ACTUATOR_TOKEN
