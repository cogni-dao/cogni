apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: f66b260b-4633-41e2-8711-b7c1b8449cc1
  namespace: cogni-production
  labels:
    cogni.io/node-id: f66b260b-4633-41e2-8711-b7c1b8449cc1
    cogni.io/environment: production
    cogni.io/node: toks5
spec:
  nodeId: f66b260b-4633-41e2-8711-b7c1b8449cc1
  environment: production
  bundle:
    ref: ghcr.io/cogni-dao/toks5@sha256:246b4c2c169177c2b0f0a0db971871bfd4250174d479c55d557baee4d51cb6d1
    source:
      repository: cogni-dao/toks5
      sha: 2a3027db61deef3237391b35647730b5cea12ff4
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/toks5@sha256:02d74f1875a6a996b051c2c12755c3fa90e7e839eb665b03909f1a709e87130d
  workload:
    name: toks5
    publicHost: toks5.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Hold
    onGiveUp: Hold
  leaseGeneration: 6
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
