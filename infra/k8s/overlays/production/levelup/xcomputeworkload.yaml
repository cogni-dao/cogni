apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: 557d8b59-8e3b-42f0-9aeb-a5c171296556
  namespace: cogni-production
  labels:
    cogni.io/node-id: 557d8b59-8e3b-42f0-9aeb-a5c171296556
    cogni.io/environment: production
    cogni.io/node: levelup
spec:
  nodeId: 557d8b59-8e3b-42f0-9aeb-a5c171296556
  environment: production
  bundle:
    ref: ghcr.io/cogni-dao/levelup@sha256:1666fa34d3cebbbb6f56040b2d594445e6f3c805b06f02ad644ee6a945635aff
    source:
      repository: cogni-dao/levelup
      sha: 1af23e28299c56ccdb77b11fab19a7b8f7a13be7
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/levelup@sha256:7ff88c64949e4a8e7d37bf42bc9a2d167f65bb7a6561f18b10ad87422ce1204b
  workload:
    name: levelup
    publicHost: levelup.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Hold
    onGiveUp: Hold
  leaseGeneration: 4
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
