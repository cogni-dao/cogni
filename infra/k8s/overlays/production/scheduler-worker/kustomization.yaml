apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-production

resources:
  - ../../../base/scheduler-worker

# Image digest — updated by manual PR for production promotion.
images:
  - name: ghcr.io/cogni-dao/cogni-template
    newName: ghcr.io/cogni-dao/cogni-template
    newTag: "production-placeholder-scheduler-worker"

patches:
  # GENERATED sibling (render-scheduler-worker-endpoints.sh): this env's
  # PROVIDER-RESOLVED COGNI_NODE_ENDPOINTS. bug.5094 — a node placed on akash has
  # no in-cluster Service, so its address is env-variant and belongs here, not in
  # the shared base. Listed first so the base default is replaced before the
  # env-specific ops below apply.
  - path: node-endpoints.patch.yaml

  # bug.5188 — reclaim ~470MiB on the oversubscribed prod control VM (5.8GB,
  # co-hosting the Compose stack + k3s). The base runs 2 replicas to kill the
  # single-pod SPOF; in PRODUCTION at 0 users that HA margin is not worth the
  # RAM on a VM that is starving its own control plane. Drop prod to 1 replica.
  # Preview/candidate-a keep the base 2. See the base deployment comment for the
  # coupling history (2026-06-25 fleet-502): the readiness coupling that made a
  # worker outage a fleet outage has since been removed, and schedule lifecycle
  # lives in the operator app (advisory-locked), so a single poller does not
  # break correctness — reviewer to confirm no remaining hard 2-replica HA dep.
  - target:
      kind: Deployment
      name: scheduler-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: ConfigMap
      name: scheduler-worker-config
    patch: |
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-production"
      - op: add
        path: /data/DEPLOY_ENVIRONMENT
        value: "production"
      # bug.5212 — the lanes this cluster CUSTODIES. An akash node's non-production lane is
      # reconciled and paid for here, so it submits its workflows to THIS Temporal under
      # cogni-<lane>. Without these the queue has no poller and the lane's schedules never
      # fire — silently. The SCHEDULER_API_TOKEN the lane inherits is already this env's, so
      # no token plumbing changes. Mirrors SECRETS_LANE_TRUST[production].
      - op: add
        path: /data/TEMPORAL_CUSTODIED_NAMESPACES
        value: "cogni-candidate-a,cogni-preview"
      - op: replace
        path: /data/IMAGE_DIGEST
        value: "production-placeholder-scheduler-worker"

  # bug.0295: VM discovery via DNS (cogni.vm.cognidao.org).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  - target: { kind: Service, name: temporal }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: postgres }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: app }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: app
      spec:
        type: ExternalName
        externalName: cogni.vm.cognidao.org
        clusterIP: null
  - target: { kind: EndpointSlice, name: temporal-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: temporal-1
  - target: { kind: EndpointSlice, name: postgres-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-1
  - target: { kind: EndpointSlice, name: app-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: app-1
