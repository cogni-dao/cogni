apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: 921b1d1d-4ded-4a6d-b3f1-f7d6affa406a
  namespace: cogni-production
  labels:
    cogni.io/node-id: 921b1d1d-4ded-4a6d-b3f1-f7d6affa406a
    cogni.io/environment: production
    cogni.io/node: red
spec:
  nodeId: 921b1d1d-4ded-4a6d-b3f1-f7d6affa406a
  environment: production
  bundle:
    ref: ghcr.io/cogni-dao/red@sha256:e25289b9e0413d32ba160efb562f0e4168c759a22d35feadb227e2cfd1a9d119
    source:
      repository: cogni-dao/red
      sha: 3369a55ab1a0db7a6d3e15e4b48de4343b36dcb2
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/red@sha256:03be9b0b44d486d8e52fc16e2cc97b480a407f95eaede866634ba6ab353a40a3
  workload:
    name: red
    publicHost: red.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Hold
    onGiveUp: Hold
  leaseGeneration: 0
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
