apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: f97f68f2-8406-4a3b-b5a9-d579b779f19d
  namespace: cogni-production
  labels:
    cogni.io/node-id: f97f68f2-8406-4a3b-b5a9-d579b779f19d
    cogni.io/environment: production
    cogni.io/node: beacon
spec:
  nodeId: f97f68f2-8406-4a3b-b5a9-d579b779f19d
  environment: production
  bundle:
    ref: ghcr.io/cogni-dao/beacon@sha256:7c6d3a582ea6bf8764690364ae7be590335ec9c89748c523f6b00c2c24599744
    source:
      repository: cogni-dao/beacon
      sha: 57084e2b201bddabc6a685b1b340328ba4395f72
    artifacts:
      - name: app
        image: ghcr.io/cogni-dao/beacon@sha256:8bc4e742ed43cbe33a5f3ecf594101d91dc3e357afd1af906c3c55a969eb9f66
  workload:
    name: beacon
    publicHost: beacon.cognidao.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Hold
    onGiveUp: Hold
  leaseGeneration: 3
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni.vm.cognidao.org
