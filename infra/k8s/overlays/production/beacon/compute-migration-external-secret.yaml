apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beacon-compute-migration-secrets
  namespace: cogni-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: beacon-compute-migration-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: production/beacon-database-migration
        property: DATABASE_MIGRATION_URL
    - secretKey: DATABASE_SSL_CA_CERT
      remoteRef:
        key: production/beacon-database-migration
        property: DATABASE_SSL_CA_CERT
    - secretKey: DOLTGRES_URL
      remoteRef:
        key: production/beacon
        property: DOLTGRES_URL
