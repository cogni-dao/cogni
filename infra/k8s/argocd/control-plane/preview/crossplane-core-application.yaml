#
# Crossplane v2 control-plane substrate for PREVIEW (story.5016 / task.5129).
# This is the same pinned engine and resource envelope candidate-a and production run.
# Installing the engine grants no workload authority: desired XComputeWorkload instances
# remain in per-node deploy branches, and task.5129 installs this rail before adding Poly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.4.0
    helm:
      releaseName: crossplane
      values: |
        replicas: 1
        revisionHistoryLimit: 2

        image:
          repository: xpkg.crossplane.io/crossplane/crossplane@sha256:c5d773aa940041475e2cf6b9adf3512cb382b1a6b889f53ed791192ed8ada75b
          ignoreTag: true
          pullPolicy: IfNotPresent

        # Crossplane v2 otherwise activates every managed resource type from an
        # installed provider. Keep the provider package healthy but inert; the
        # composite Application activates only its required type explicitly.
        provider:
          defaultActivations: []

        metrics:
          enabled: true

        packageCache:
          medium: Memory
          sizeLimit: 64Mi
        functionCache:
          medium: Memory
          sizeLimit: 128Mi

        resourcesCrossplane:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        resourcesRBACManager:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
