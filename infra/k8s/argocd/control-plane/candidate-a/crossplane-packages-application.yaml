#
# Installs only the pinned provider/function packages used by the future
# composition. There is deliberately no ProviderConfig or managed resource:
# provider-http has no request to send and therefore no external write path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-packages
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cogni-dao/cogni.git
    targetRevision: main
    path: infra/crossplane/install/packages
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
