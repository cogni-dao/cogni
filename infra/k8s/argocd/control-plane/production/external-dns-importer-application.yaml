apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-importer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.22.0
    helm:
      releaseName: external-dns-importer
      skipCrds: true
      values: |
        image:
          repository: registry.k8s.io/external-dns/external-dns
          tag: v0.22.0@sha256:5fdcaf7deb5c158f93a1fc6fe169cdff4cfb9ae0172bee1a90ab0ef74fb9c9cf
          pullPolicy: IfNotPresent
        sources: [crd]
        provider:
          name: cloudflare
        policy: upsert-only
        registry: noop
        domainFilters: [cognidao.org]
        labelFilter: cogni.io/dns-role=import
        managedRecordTypes: [TXT]
        triggerLoopOnEvent: true
        interval: 1m
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: external-dns-cloudflare
                key: api-token
          - name: CLOUDFLARE_ZONE_ID
            valueFrom:
              secretKeyRef:
                name: external-dns-cloudflare
                key: zone-id
        extraArgs:
          - --zone-id-filter=$(CLOUDFLARE_ZONE_ID)
          - --cloudflare-dns-records-per-page=5000
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { cpu: 200m, memory: 192Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
