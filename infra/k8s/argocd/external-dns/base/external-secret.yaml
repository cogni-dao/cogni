#
# ExternalDNS gets only the two Cloudflare values it consumes. In particular, it
# never receives the broad operator Secret: ESO selects each property from the
# existing environment bucket and materializes a dedicated Secret here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: external-dns
  labels:
    app.kubernetes.io/part-of: cogni-compute-control-plane
    app.kubernetes.io/component: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: external-dns-cloudflare
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: ENVIRONMENT/operator
        property: CLOUDFLARE_API_TOKEN
    - secretKey: zone-id
      remoteRef:
        key: ENVIRONMENT/operator
        property: CLOUDFLARE_ZONE_ID
