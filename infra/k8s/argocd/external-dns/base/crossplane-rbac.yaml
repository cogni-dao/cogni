#
# Crossplane v2 composes namespaced third-party resources. Its RBAC manager
# aggregates this narrowly-scoped role; ExternalDNS keeps its own chart-owned
# ServiceAccount and provider permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-external-dns-endpoints
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: [externaldns.k8s.io]
    resources: [dnsendpoints]
    verbs: [get, list, watch, create, update, patch, delete]
