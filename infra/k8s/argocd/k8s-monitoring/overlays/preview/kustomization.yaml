#
# preview rendering of the in-cluster k8s state collector (bug.5165).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8s-monitoring

resources:
  - ../../base

patches:
  # env metric label — set BY NAME (env lists merge on `name`), never positional.
  - target:
      kind: Deployment
      name: alloy
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: alloy
      spec:
        template:
          spec:
            containers:
              - name: alloy
                env:
                  - name: DEPLOY_ENVIRONMENT
                    value: preview
  # OpenBao KV path for this env's shared Grafana Cloud credentials.
  - target:
      kind: ExternalSecret
      name: grafana-cloud-metrics
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: preview/_shared
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: preview/_shared
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: preview/_shared
