#
# Grafana Cloud Mimir credentials for the Alloy collector (bug.5165). Reads the
# SAME cogni/<env>/_shared PROMETHEUS_* values the Compose Alloy consumes from the
# VM env, so both shippers authenticate to one Mimir tenant. The `remoteRef.key`
# carries a placeholder env prefix; each overlay patches it to `<env>/_shared`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-metrics
  labels:
    app.kubernetes.io/part-of: cogni-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: grafana-cloud-metrics
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PROMETHEUS_REMOTE_WRITE_URL
      remoteRef:
        key: replace-in-overlay/_shared
        property: PROMETHEUS_REMOTE_WRITE_URL
    - secretKey: PROMETHEUS_USERNAME
      remoteRef:
        key: replace-in-overlay/_shared
        property: PROMETHEUS_USERNAME
    - secretKey: PROMETHEUS_PASSWORD
      remoteRef:
        key: replace-in-overlay/_shared
        property: PROMETHEUS_PASSWORD
