#
# Operator migration is a separate capability from the public app runtime.
# Every operator overlay patches the environment-scoped OpenBao path below;
# namePrefix turns the resource name into operator-migration-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: migration-secrets
  labels:
    app.kubernetes.io/part-of: cogni-secrets-substrate
    app.kubernetes.io/component: database-migration
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: operator-migration-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: replace-in-overlay/operator-database-migration
        property: DATABASE_MIGRATION_URL
