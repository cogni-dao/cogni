#
# Non-secret configuration for scheduler-worker.
# Env-specific values (TEMPORAL_NAMESPACE, IMAGE_DIGEST, COGNI_NODE_ENDPOINTS) are
# base DEFAULTS here and are patched by every overlay. Regenerate with
# `pnpm gen:scheduler-worker-endpoints` (drift-gated in CI).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-worker-config
  labels:
    app.kubernetes.io/name: scheduler-worker
    app.kubernetes.io/part-of: cogni
data:
  # Temporal connection — overridden per-env by overlay
  TEMPORAL_ADDRESS: "temporal:7233"
  TEMPORAL_NAMESPACE: "cogni-staging"
  TEMPORAL_TASK_QUEUE: "scheduler-tasks"
  # Per-node API endpoints — GENERATED placement-DEFAULT map (all deployment_provider=k3s):
  # each entry maps slug AND repo-spec nodeId to the node's in-cluster Service.
  # bug.5094 — every overlay REPLACES this with its env's provider-resolved map
  # (infra/k8s/overlays/<env>/scheduler-worker/node-endpoints.patch.yaml), because a
  # node placed on akash has no in-cluster Service and its public host is per-env.
  # This default is never the value a cluster runs; it is the k3s baseline a fork
  # with no off-cluster placement would get. Renderer: scripts/ci/render-scheduler-worker-endpoints.sh
  COGNI_NODE_ENDPOINTS: "beacon=http://beacon-node-app:3000,f97f68f2-8406-4a3b-b5a9-d579b779f19d=http://beacon-node-app:3000,levelup=http://levelup-node-app:3000,557d8b59-8e3b-42f0-9aeb-a5c171296556=http://levelup-node-app:3000,node-template=http://node-template-node-app:3000,b927a9dd-6132-4fc9-a51e-e3cee2568e3c=http://node-template-node-app:3000,operator=http://operator-node-app:3000,4ff8eac1-4eba-4ed0-931b-b1fe4f64713d=http://operator-node-app:3000,poly=http://poly-node-app:3000,4b06359a-a859-4399-888e-a8c7a6696f7e=http://poly-node-app:3000,toks4=http://toks4-node-app:3000,72aa130b-f0ad-495a-a061-9ee1f9c9525d=http://toks4-node-app:3000,trash=http://trash-node-app:3000,6001e8ff-e9c5-4965-adc8-f5ccc47f36e7=http://trash-node-app:3000"
  # Observability
  LOG_LEVEL: "info"
  SERVICE_NAME: "scheduler-worker"
  HEALTH_PORT: "9000"
  # Image digest — set by overlay on promotion
  IMAGE_DIGEST: "placeholder"
