#
# task.5102 — the Akash transaction actuator runtime. Modelled on
# base/compute-workload-controller (same image, same projected-credential shape, same
# per-env overlay wiring), with two deliberate differences called out below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akash-tx-actuator
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: akash-tx-actuator
    app.kubernetes.io/part-of: cogni
spec:
  replicas: 1
  # DIFFERENCE 1 vs the ComputeWorkload controller: a SURGE IS SAFE HERE. That controller is
  # singleton because a second pod races the same coordination Lease. The actuator holds no
  # Lease — the wallet slot is a partial unique index in Postgres
  # (akash_tx_allocations_single_writer_idx), so two live replicas structurally cannot both
  # spend. Since this one serves HTTP for Crossplane, availability across a rollout matters
  # more than the controller's terminate-then-start. rollingUpdate is still spelled out
  # explicitly so ArgoCD server-side-apply merges cleanly with any live object (bug.5110).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: akash-tx-actuator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akash-tx-actuator
        app.kubernetes.io/part-of: cogni
    spec:
      # DIFFERENCE 2: no ServiceAccount of its own and no RBAC. The actuator reads no
      # Kubernetes objects — Crossplane owns every CR. Default SA, no API access needed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: actuator
          image: ghcr.io/cogni-dao/cogni-template:placeholder
          imagePullPolicy: IfNotPresent
          command: [node, /app/nodes/operator/app/akash-tx-actuator.mjs]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # The ledger's wallet scope is `akash-console:<DEPLOY_ENVIRONMENT>`. It MUST match
            # the `environment` the Composition sends, which the Composition itself pins to
            # `cogni-<env>` == the namespace. Set BY NAME in every overlay (story.5016 Gate 0b:
            # never a positional /env/N/value patch).
            - name: DEPLOY_ENVIRONMENT
              value: replace-in-overlay
            - name: AKASH_ALLOWED_PROVIDERS
              value: ""
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: akash-tx-credentials
              mountPath: /var/run/secrets/akash-tx
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: akash-tx-credentials
          projected:
            sources:
              # Least privilege on purpose: an explicit `items:` list rather than
              # `envFrom: operator-env-secrets`, so this process can only ever see the four
              # values it needs. All four already live in the operator's ESO-managed bucket
              # (dataFrom: extract on cogni/<env>/operator) — no new secret plane.
              #
              # NOT optional. resolveAkashTxWallet refuses a missing or legacy-equal
              # AKASH_ACTUATOR_CONSOLE_API_KEY, and the process exits rather than spend from a
              # wallet that already has a writer. A CrashLoopBackOff with a stable reason is
              # the honest surface; a silently wrong wallet is not.
              - secret:
                  name: operator-env-secrets
                  items:
                    # The actuator's OWN dedicated per-environment Console account.
                    - key: AKASH_ACTUATOR_CONSOLE_API_KEY
                      path: AKASH_ACTUATOR_CONSOLE_API_KEY
                    # The legacy ComputeWorkload controller's wallet. Read ONLY to prove the
                    # two are distinct (ONE_WALLET_ONE_WRITER); never used to transact.
                    - key: AKASH_CONSOLE_API_KEY
                      path: AKASH_CONSOLE_API_KEY
                    # Bearer token the Composition presents as a provider-http placeholder
                    # `{{ akash-tx-actuator-auth:<ns>:token }}`; the auth Secret is projected
                    # from this same OpenBao key by the operator overlay's ExternalSecret.
                    - key: AKASH_TX_ACTUATOR_TOKEN
                      path: AKASH_TX_ACTUATOR_TOKEN
                    # Durable allocation ledger (akash_tx_allocations). App role, RLS-enforced.
                    - key: DATABASE_URL
                      path: DATABASE_URL
