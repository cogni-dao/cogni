#
# THE ADDRESS IS THE CONTRACT. Every caller (the node-deploy sequencer, the lease-log pump)
# dials the bare `http://akash-tx-actuator:8080` (AKASH_TX_ACTUATOR_URL default), so this
# Service must be named EXACTLY `akash-tx-actuator` in every environment namespace.
# The operator overlays apply `namePrefix: operator-`, which would render it as
# `operator-akash-tx-actuator` and leave every call at connection-refused — see
# ../akash-tx-actuator-service-name for the transformer that restores the name.
#
# ClusterIP and nothing else: bearer-authed private wallet writer. Never an Ingress, never a
# NodePort, never a public route.
apiVersion: v1
kind: Service
metadata:
  name: akash-tx-actuator
  labels:
    app.kubernetes.io/name: akash-tx-actuator
    app.kubernetes.io/part-of: cogni
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: akash-tx-actuator
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
