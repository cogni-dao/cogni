#
# story.5016 / task.5135 — the actuator runs the per-digest migration Job as a RELEASE step on
# its unpaid OBSERVE tick, so it must be able to create and read that Job. It is NOT a gate: a
# migration can no longer refuse a paid lease, which is why this Role is the actuator's ONLY
# Kubernetes reach and why the PAID path now needs no Kubernetes access at all. FOLLOW-UP: with
# the payment seam clean, the runner can leave the wallet-holding process and take this Role
# with it.
#
# Derived from the adapter, not copied wholesale from compute-workload-controller's Role:
# KubernetesMigrationJobAdapter calls readNamespacedJob (get), createNamespacedJob (create),
# listNamespacedJob (list), deleteNamespacedJob (delete), listNamespacedPod (list) and
# readNamespacedPodLog (get pods/log).
# Everything else the controller holds — computeworkloads(+status/finalizers), leases, events,
# the allocation ConfigMap — is deliberately ABSENT: Crossplane owns every CR here, this
# process holds no Lease (its wallet slot is a Postgres unique index), and its receipts are
# rows in Postgres, not a ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: akash-tx-actuator
rules:
  # A completed Job is the durable per-digest skip marker; delete is for superseded-digest GC
  # and for re-creating a Job that failed on infrastructure rather than on the migration script.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  # bug.5118 — classifying a Failed migration Job as script-failure vs never-ran requires
  # listing its pods by the `job-name` label to find a terminated migrate container with a
  # non-zero exitCode. The adapter only ever LISTS; `get` is not granted.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  # PR #2629 gave the SAME adapter a `readReceipt` that reads the migrator's own stdout
  # (readNamespacedPodLog) so the operator can report a node's APPLIED migrations without
  # holding a credential that can read the node's database. It did not come here, and
  # Kubernetes RBAC implies NEITHER a subresource from its parent (`pods` does not cover
  # `pods/log`) NOR `get` from `list` — so every receipt read was 403, the adapter's
  # best-effort catch turned that into `null`, and the actuator logged
  # `akash_tx_migration_receipt_absent` once per `akash_tx_migration_succeeded` for every
  # workload in every environment while `node_migration_reports` stayed empty everywhere.
  #
  # This stays inside VALUE_FREE: a migration Job's stdout carries journal tags and ledger
  # hashes, never a DSN. The grant is read-only, and `pods` itself is still LIST-only.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: akash-tx-actuator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: akash-tx-actuator
subjects:
  - kind: ServiceAccount
    name: akash-tx-actuator
