#
# bug.5240 — the lease-log pump: the keyless control-plane process that ships EVERY service
# of EVERY live Akash lease to Loki. Modelled on base/akash-tx-actuator (same image, same
# projected-credential shape, same per-env overlay wiring), with two deliberate differences:
#
#   1. NO wallet capability and NO Kubernetes Role at all. The pump enumerates leases through
#      the actuator's read-only `lease-log-sources` op (bearer token) and receives only a
#      logs-scoped ephemeral provider JWT — the Console API key never leaves the actuator
#      (story.5016 secret-boundary; NEVER_HOLDS_TWO_WALLETS stays intact).
#   2. Nothing dials this pod. It has no Service; the health port exists for kubelet probes
#      only. Losing it can never block a deploy — it only reads and ships.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lease-log-pump
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: lease-log-pump
    app.kubernetes.io/part-of: cogni
spec:
  replicas: 1
  # A surge is harmless: two pumps double-ship briefly and Loki tolerates duplicates
  # (at-least-once is the design), but explicit rollingUpdate keeps ArgoCD server-side-apply
  # merging cleanly with any live object (bug.5110 shape).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lease-log-pump
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lease-log-pump
        app.kubernetes.io/part-of: cogni
    spec:
      # Own ServiceAccount with NO Role bound — the narrowest identity possible. The pump's
      # entire Kubernetes surface is "exists as a pod".
      serviceAccountName: lease-log-pump
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pump
          image: ghcr.io/cogni-dao/cogni-template:placeholder
          imagePullPolicy: IfNotPresent
          command: [node, /app/nodes/operator/app/lease-log-pump.mjs]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # The environment this pod RUNS in — used only for the pump's own log lines.
            # Stream labels come from each receipt's own environment (UNFILTERED_ENUMERATION
            # in the bootstrap): a writer custodying several envs' lanes still covers all.
            # Set BY NAME in every overlay (story.5016 Gate 0b — never positional patches).
            - name: DEPLOY_ENVIRONMENT
              value: replace-in-overlay
            # Bare Service name on purpose: the overlay's namePrefix transformer restores the
            # actuator Service to exactly `akash-tx-actuator` (see
            # base/akash-tx-actuator-service-name).
            - name: AKASH_TX_ACTUATOR_URL
              value: http://akash-tx-actuator:8080
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: lease-log-pump-credentials
              mountPath: /var/run/secrets/lease-log-pump
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: lease-log-pump-credentials
          projected:
            sources:
              # Bearer for the actuator's read-only lease-log-sources op — the SAME OpenBao
              # key the Crossplane Composition presents (cogni/<env>/akash-tx-actuator),
              # projected from the actuator's own ExternalSecret. Read capability only: the
              # actuator's mutating ops are gated behind the same token, but this process
              # never sends one (and the wallet slot serializes spends regardless).
              - secret:
                  name: akash-tx-actuator-env-secrets
                  items:
                    - key: AKASH_TX_ACTUATOR_TOKEN
                      path: AKASH_TX_ACTUATOR_TOKEN
              # The DEDICATED logs:write-only Loki lease credential (bug.5127 catalog rows,
              # infra/secrets-catalog.yaml) — repurposed from the superseded app-push lane to
              # its operator-side successor. Never the fleet read/admin Grafana credential.
              # NOT optional: a pump that cannot ship must CrashLoop loudly, not idle.
              - secret:
                  name: operator-env-secrets
                  items:
                    - key: LOKI_LEASE_PUSH_URL
                      path: LOKI_LEASE_PUSH_URL
                    - key: LOKI_LEASE_PUSH_USER
                      path: LOKI_LEASE_PUSH_USER
                    - key: LOKI_LEASE_PUSH_TOKEN
                      path: LOKI_LEASE_PUSH_TOKEN
