apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compute-workload-controller
rules:
  - apiGroups: [compute.cogni.io]
    resources: [computeworkloads]
    verbs: [get, list, watch, patch]
  - apiGroups: [compute.cogni.io]
    resources: [computeworkloads/status, computeworkloads/finalizers]
    verbs: [get, patch, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [compute-workload-allocation-ledger]
    verbs: [get, update, patch]
  # Kubernetes cannot resourceName-scope CREATE. The controller creates exactly one
  # runtime ledger; keeping it out of Git prevents Argo self-heal from erasing receipts.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compute-workload-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compute-workload-controller
subjects:
  - kind: ServiceAccount
    name: compute-workload-controller
