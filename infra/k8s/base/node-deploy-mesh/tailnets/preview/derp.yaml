# task.5428 — the `preview` relay map: ONLY this tailnet's own relay (hard requirements 9 and 21). The
# relay is this tailnet's derper on its env VM, behind that VM's edge Caddy on 443 at its own DNS-only
# host (public ACME certificate). STUN is its own UDP port. No ipv4 pin: clients resolve the host.
# INERT until slice T1p: the preview VM runs no relay yet (empty vm_env in scripts/ci/lib/mesh-plane.sh), so
# this host has no DNS record and no edge site. No device joins this tailnet before then.
regions:
  902:
    regionid: 902
    regioncode: cogni-preview
    regionname: Cogni preview relay
    nodes:
      - name: 902a
        regionid: 902
        hostname: derp-preview.cognidao.org
        stunport: 3478
        stunonly: false
        derpport: 443
