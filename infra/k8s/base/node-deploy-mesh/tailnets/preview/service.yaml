#
# task.5428 — the `preview` Headscale CLIENT port, for the coordinator env VM's edge Caddy only (NodePort,
# host.docker.internal). The edge serves `mesh-preview.cognidao.org` with a public ACME certificate and
# forwards ONLY the Tailscale client paths + /verify (scripts/ci/render-caddyfile.sh); the hardener
# drops the NodePort from the public NIC before NAT (hard requirements 12, 22). NodePort from the
# tailnet table. publishNotReadyAddresses: a NotReady sequencer pod never withdraws the coordinator.
apiVersion: v1
kind: Service
metadata:
  name: node-deploy-mesh-preview
  labels:
    app.kubernetes.io/name: node-deploy-sequencer
    app.kubernetes.io/component: mesh-coordinator
    cogni.dev/mesh-tailnet: preview
spec:
  type: NodePort
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: node-deploy-sequencer
  ports:
    - name: headscale
      port: 8182
      targetPort: hs-pv
      nodePort: 32442
