#
# task.5428 — the `test-candidate-a` relay map: ONLY this tailnet's own relay (hard requirements 9 and 21). The
# relay is this tailnet's derper on its env VM, behind that VM's edge Caddy on 443 at its own DNS-only
# host (public ACME certificate). No STUN (relay-only): stunport -1 disables it, so clients never probe
# UDP. No ipv4 pin: clients resolve the host.
regions:
  904:
    regionid: 904
    regioncode: cogni-test-candidate-a
    regionname: Cogni test-candidate-a relay
    nodes:
      - name: 904a
        regionid: 904
        hostname: derp-test-candidate-a.cogni-testing.org
        stunport: -1
        stunonly: false
        derpport: 443
