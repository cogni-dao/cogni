#
# task.5428 — the production relay map: ONLY our region (hard requirements 9 and 21). The relay is the
# derper Compose service on the production env VM, behind that VM's Caddy on 443 (TLS with a public
# ACME certificate on the DNS-only VM alias `vm_host_for_env`). STUN stays on UDP 3478.
# No ipv4 pin: clients resolve the VM alias, so a VM migration needs no edit here.
regions:
  903:
    regionid: 903
    regioncode: cogni-production
    regionname: Cogni production relay
    nodes:
      - name: 903a
        regionid: 903
        hostname: cogni.vm.cognidao.org
        stunport: 3478
        stunonly: false
        derpport: 443
