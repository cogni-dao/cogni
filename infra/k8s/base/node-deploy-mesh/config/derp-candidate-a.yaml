#
# task.5428 — the candidate-a relay map: ONLY our region (hard requirements 9 and 21). The relay is the
# derper Compose service on the candidate-a env VM, behind that VM's Caddy on 443 (TLS with a public
# ACME certificate on the DNS-only VM alias `vm_host_for_env`). STUN stays on UDP 3478.
# No ipv4 pin: clients resolve the VM alias, so a VM migration needs no edit here.
regions:
  901:
    regionid: 901
    regioncode: cogni-candidate-a
    regionname: Cogni candidate-a relay
    nodes:
      - name: 901a
        regionid: 901
        hostname: cogni-candidate-a.vm.cognidao.org
        stunport: 3478
        stunonly: false
        derpport: 443
