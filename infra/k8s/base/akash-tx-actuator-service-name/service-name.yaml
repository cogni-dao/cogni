#
# A kustomize builtin PatchTransformer, referenced from each operator overlay's
# `transformers:` list. Transformers listed there run AFTER the built-in namePrefix
# transformer, which is the only supported way to keep ONE object out of the overlay's
# `operator-` prefix.
#
# Why this must exist: every caller (the node-deploy sequencer, the lease-log pump) dials the
# bare `http://akash-tx-actuator:8080`. They cannot know a kustomize prefix, so the Service
# name is a fixed wire contract and the prefix is what has to give.
#
# Scoped by label, not by the prefixed name, so it stays correct if the prefix ever changes.
# It is a no-op in any kustomization that does not contain this Service.
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: akash-tx-actuator-service-name
patch: '[{"op": "replace", "path": "/metadata/name", "value": "akash-tx-actuator"}]'
target:
  kind: Service
  labelSelector: app.kubernetes.io/name=akash-tx-actuator
