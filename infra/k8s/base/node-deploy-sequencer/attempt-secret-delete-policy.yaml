#
# task.5430 (HR5 of the node-service-delivery design, task.5384) — the CLUSTER-SIDE bound on which Secrets the
# node-deploy sequencer may DELETE.
#
# The sequencer stores two kinds of Secret in `cogni-node-deploy-<env>` (rbac.yaml):
#   - state passwords      `nd-<nodeId8>-<workload>`                         (guard live data; NEVER deleted)
#   - mesh attempt keys    `nd-<nodeId8>-<workload>-mesh-<releaseId>-a<n>`  (deleted one pass after revoke)
# RBAC cannot scope `delete` by a name pattern, so the Role's `delete` verb alone would let a buggy or compromised
# sequencer delete a state password and lose a node's data. This policy is that boundary: a sequencer DELETE of a
# Secret is admitted ONLY when the name is an attempt key. The release id is a UUID (node_workload_releases.id), so
# the anchored UUID + `-a<digits>` suffix refuses a state password even for a workload named `x-mesh-y`.
#
# Who it applies to: matchConditions select the sequencer ServiceAccount by username
# (`system:serviceaccount:<wallet ns>:<prefix->node-deploy-sequencer`, the same rule in every overlay). Other
# principals are not touched: the garbage collector, the namespace controller and ESO still delete the Secrets
# they own. There is no namespace selector on purpose: wherever the sequencer could delete a Secret, the same
# name rule holds, and a delete outside a `cogni-node-deploy-<env>` namespace is refused outright.
#
# DELETE semantics (Kubernetes docs, ValidatingAdmissionPolicy CEL variables): `object` is null for DELETE,
# `oldObject` is the existing object, `request` is the AdmissionRequest; `request.name` and `request.namespace`
# name the Secret being deleted. RBAC grants `delete`, not `deletecollection`.
# failurePolicy Fail + validationActions Deny: if the policy cannot be evaluated, the delete is refused.
#
# Needs admissionregistration.k8s.io/v1 (GA in Kubernetes 1.30). Candidate-a and production run k3s v1.31.4
# (infra/provision/cherry/base/bootstrap.yaml). tests/ci-invariants/node-deploy-sequencer-admission.spec.ts pins it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: node-deploy-sequencer-secret-delete
  labels:
    app.kubernetes.io/name: node-deploy-sequencer
    app.kubernetes.io/part-of: cogni
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [secrets]
  matchConditions:
    - name: sequencer-service-account
      expression: >-
        request.userInfo.username.matches('^system:serviceaccount:[a-z0-9-]+:([a-z0-9-]+-)?node-deploy-sequencer$')
  validations:
    - expression: "request.namespace.startsWith('cogni-node-deploy-')"
      message: "the node-deploy sequencer may delete Secrets only in a cogni-node-deploy-<env> namespace"
      reason: Forbidden
    - expression: >-
        request.name.matches('^nd-[0-9a-f]{8}-[a-z0-9-]+-mesh-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-a[0-9]+$')
      message: "the node-deploy sequencer may delete only mesh attempt-key Secrets (nd-<nodeId8>-<workload>-mesh-<releaseId>-a<attempt>); state passwords are never deleted"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: node-deploy-sequencer-secret-delete
  labels:
    app.kubernetes.io/name: node-deploy-sequencer
    app.kubernetes.io/part-of: cogni
spec:
  policyName: node-deploy-sequencer-secret-delete
  validationActions: [Deny]
  # No matchResources: the binding validates every request the policy matches (all namespaces).
