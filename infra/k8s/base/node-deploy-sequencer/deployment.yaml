#
# task.5400 / story.5127 — the node-deploy sequencer: converges every desired workload to its
# release by immutable blue/green. Modelled on base/lease-log-pump (same image, same projected-
# credential shape, same per-env overlay wiring) with these deliberate differences:
#
#   1. It PAYS only through the private akash-tx-actuator (bearer token). It holds NO Console API
#      key and NO wallet: the actuator stays the ONLY paid Akash writer (story.5016 secret
#      boundary; NEVER_HOLDS_TWO_WALLETS stays intact).
#   2. SINGLE INSTANCE by a Postgres advisory lock, so strategy is Recreate: a surged pod would
#      sit not-ready (it is not the leader) and a RollingUpdate would never finish.
#   3. Its Role allows get/create on Secrets in this namespace and nothing else (rbac.yaml).
#   4. Nothing dials this pod. It has no Service; the health port exists for kubelet probes only.
#      Losing it can never block a deploy of the operator: it only drives workloads declared to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deploy-sequencer
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: node-deploy-sequencer
    app.kubernetes.io/part-of: cogni
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: node-deploy-sequencer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-deploy-sequencer
        app.kubernetes.io/part-of: cogni
    spec:
      serviceAccountName: node-deploy-sequencer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sequencer
          image: ghcr.io/cogni-dao/cogni-template:placeholder
          imagePullPolicy: IfNotPresent
          command: [node, /app/nodes/operator/app/node-deploy-sequencer.mjs]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # Set BY NAME in every overlay (story.5016 Gate 0b — never positional patches).
            - name: DEPLOY_ENVIRONMENT
              value: replace-in-overlay
            # PUBLIC on-chain address of the wallet the actuator pays from; chain-truth reads
            # (close confirmation, insufficient_funds). Same value the actuator pins. Not a secret.
            - name: AKASH_CHAIN_OWNER
              value: replace-in-overlay
            # Bare Service name on purpose: the overlay's namePrefix transformer restores the
            # actuator Service to exactly `akash-tx-actuator` (base/akash-tx-actuator-service-name).
            - name: AKASH_TX_ACTUATOR_URL
              value: http://akash-tx-actuator:8080
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: node-deploy-sequencer-credentials
              mountPath: /var/run/secrets/node-deploy-sequencer
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: node-deploy-sequencer-credentials
          projected:
            sources:
              # Bearer for the actuator's create/observe/delete ops — the SAME OpenBao key the
              # Crossplane Composition and the lease-log pump present
              # (cogni/<env>/akash-tx-actuator), projected from the actuator's own ExternalSecret.
              - secret:
                  name: akash-tx-actuator-env-secrets
                  items:
                    - key: AKASH_TX_ACTUATOR_TOKEN
                      path: AKASH_TX_ACTUATOR_TOKEN
              # The operator's Postgres DSN (deploy history + desired state), the SAME key the
              # operator app and the actuator read. NOT optional: a sequencer with no durable
              # state must CrashLoop loudly, not idle.
              - secret:
                  name: operator-env-secrets
                  items:
                    - key: DATABASE_URL
                      path: DATABASE_URL
              # Edge credentials. OPTIONAL by catalog (`required: false`): without them the process
              # still runs, state workloads work, and http apps are refused BEFORE paying. A listed
              # key that is absent must not fail the mount, hence `optional: true` on this source.
              - secret:
                  name: operator-env-secrets
                  optional: true
                  items:
                    - key: CLOUDFLARE_API_TOKEN
                      path: CLOUDFLARE_API_TOKEN
                    - key: CLOUDFLARE_ZONE_ID
                      path: CLOUDFLARE_ZONE_ID
