# Private authenticated readback for the operator app. No Ingress or NodePort.
apiVersion: v1
kind: Service
metadata:
  name: database-reliability-actuator
  labels:
    app.kubernetes.io/name: database-reliability-actuator
    app.kubernetes.io/part-of: cogni
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: database-reliability-actuator
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
