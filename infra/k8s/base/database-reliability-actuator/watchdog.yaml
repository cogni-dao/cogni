apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-reliability-watchdog
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: database-reliability-watchdog
    app.kubernetes.io/part-of: cogni
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: database-reliability-watchdog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-reliability-watchdog
        app.kubernetes.io/part-of: cogni
    spec:
      serviceAccountName: database-reliability-actuator
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watchdog
          image: ghcr.io/cogni-dao/cogni-template:placeholder
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/nodes/operator/app/database-reliability-actuator.mjs
          env:
            - name: DATABASE_RELIABILITY_MODE
              value: watchdog
            - name: DEPLOY_ENVIRONMENT
              value: replace-in-overlay
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: http
              containerPort: 8082
          volumeMounts:
            - name: credentials
              mountPath: /var/run/secrets/database-reliability
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
      volumes:
        - name: credentials
          projected:
            sources:
              - secret:
                  name: database-reliability-actuator-env-secrets
                  optional: true
                  items:
                    - key: DATABASE_RELIABILITY_ADMIN_URL
                      path: DATABASE_RELIABILITY_ADMIN_URL
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-reliability-watchdog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: database-reliability-watchdog
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
