#
# Deliberately Role-less. The actuator talks to Postgres and Mimir through scoped
# credentials; it has no reason to read or mutate the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-reliability-actuator
  labels:
    app.kubernetes.io/name: database-reliability-actuator
    app.kubernetes.io/part-of: cogni
automountServiceAccountToken: false
