# Cogni Git Review Repository Specification Template
# Copy this file to .cogni/repo-spec.yaml and customize for your repository

schema_version: "0.1.4"

# Unique identity for this node deployment (infrastructure only).
# Scopes ledger tables alongside scope_id. Never used for governance domain.
# Generated once at init; must never change for an existing deployment.
# See: docs/spec/identity-model.md
node_id: "4ff8eac1-4eba-4ed0-931b-b1fe4f64713d"

# Governance domain (project). V0 default: 'default' (single-project node).
# Multi-scope: declare named scopes in .cogni/projects/*.yaml instead.
# scope_id is the canonical DB key (stable UUID FK); scope_key is the human-friendly slug.
# Derived: uuidv5(node_id, "default") — deterministic per deployment
scope_id: "a28a8b1e-1f9d-5cd5-9329-569e4819feda"
scope_key: "default"

# Activity ledger ingestion configuration
activity_ledger:
  epoch_length_days: 7
  approvers:
    - "0x070075F1389Ae1182aBac722B36CA12285d0c949" # derekg1729.eth operator wallet
  pool_config:
    base_issuance_credits: "10000"
  activity_sources:
    github:
      # cogni-v0.0 selects via main-merge-selection: a PR merged to main IS the
      # contribution. (The profile was repointed from the old promotion-selection,
      # which excluded every direct-to-main PR → zero claimants on this repo.)
      attribution_pipeline: cogni-v0.0
      # source_refs is a selection-time, fail-open repo allowlist (SSOT for the
      # repos whose merged PRs earn attribution). Empty/missing → no filtering.
      source_refs: ["cogni-dao/cogni"]
      # source_refs: ["cogni-test-org/test-cog"]   # candidate-a test value — swap back for candidate-a attribution testing
      excluded_logins: ["Cogni-1729"]

intent:
  name: cogni-template
  # One-line north star surfaced by the cognition substrate at session start.
  # The running operator app reads its OWN node spec (nodes/operator/.cogni/repo-spec.yaml);
  # this is the monorepo identity for tooling that resolves the repo root.
  mission: "The Cogni node platform monorepo — the operator control plane plus the node template every Cogni DAO node is forged from."

# Node registry — operator declares child nodes in the monorepo.
# Each entry points to a node dir with its own .cogni/repo-spec.yaml.
# Per REPO_SPEC_AUTHORITY: this is the node discovery source.
# Endpoints are Docker-internal URLs for LiteLLM callback routing.
nodes:
  - node_id: "4ff8eac1-4eba-4ed0-931b-b1fe4f64713d"
    node_name: "Cogni Operator"
    path: "nodes/operator"
    endpoint: "http://app:3000/api/internal/billing/ingest"

# Control GitHub check conclusion behavior for gate errors/timeouts
# false (default): errors/timeouts result in 'neutral' conclusion (non-blocking)
# true: errors/timeouts result in 'failure' conclusion (blocks merge)
fail_on_error: true

# Operator wallet configuration (Privy-managed)
# address: Privy-managed EOA that receives operator share from Split
# Split contract address lives in payments_in.credits_topup.receiving_address
operator_wallet:
  address: "0xdCCa8D85603C2CC47dc6974a790dF846f8695056" # Privy-managed operator wallet

governance:
  dao_contract: "0xF61c3fafD4D34b4568e7a500d92b28Ac175e83C6" # Current Cogni parent DAO Contract Address
  plugin_contract: "0x609B427f04C1C42De3e28898cb7b9Bad329e6b77" # DAO's Aragon Voting Plugin Address
  signal_contract: "0x590FC79B9c925C377fA63F4AaF54cdbF4Ee273A1" # DAO's CogniSignal Contract Address
  chain_id: "8453" # Chain ID: Eth Sepolia testnet
  base_url: "https://proposal.cognidao.org" # v0 Base URL: cogni-proposal-launcher service
  # Governance council schedules (charter-scoped per governance-council.md).
  # Each triggers a sandbox agent run with a 1-word entrypoint. Cron: https://crontab.guru/
  schedules:
    - charter: HEARTBEAT
      cron: "0 * * * *" # once per hour — git delta check + Discord status
      timezone: UTC
      entrypoint: HEARTBEAT
    - charter: LEDGER_INGEST
      cron: "0 6 * * *" # daily at 6am UTC
      timezone: UTC
      entrypoint: LEDGER_INGEST

# DAO Financial Rails Configuration
# Inbound payment configuration for USDC credits top-up
payments:
  status: active

payments_in:
  credits_topup:
    provider: cogni-usdc-backend-v1
    receiving_address: "0x4C4e559B2117AbA5f8BaE8a37d4B26BBAdc4C294" # Push Split V2o2 — 95.0001% operator / 4.9999% DAO (matches markup_factor 1.10803324099723 / revenue_share 0; on-chain splitHash 0xe62078796d90766dd09550d8997c3e067ba271a25a0c664ea289a1871ecb2943)
    allowed_chains:
      - Base
    allowed_tokens:
      - USDC
    # Purchase-side economics (governance config; replaces env USER_PRICE_MARKUP_FACTOR / SYSTEM_TENANT_REVENUE_SHARE).
    # Target default: 95% provider top-up / 5% DAO Split margin, no system-account credit increase.
    # Activation must point receiving_address at a Split whose on-chain splitHash matches these values.
    markup_factor: 1.10803324099723
    revenue_share: 0

# Outbound: human-custodied steward wallet that settles vendor invoices
# (OpenRouter, Cherry) via manual USDC crypto checkout. Mirrors
# nodes/operator/.cogni/repo-spec.yaml. MVP: reuse the governance approver wallet.
# See docs/design/node-steward-wallet.md.
payments_out:
  steward_wallet:
    address: "0x070075F1389Ae1182aBac722B36CA12285d0c949"

# PR review on/off + model selection. The operator reads THIS block from the
# target repo, so each node controls its own review with no operator-side hardcode.
#   enabled: false → operator skips review entirely (no Check Run, no comment).
#   model: any platform (LiteLLM-resolvable) model id; omit to use operator default.
review:
  enabled: true
  model: gpt-4o-mini

# Gates run in the order they appear below.
gates:
  # Built-in gates (run directly in bot process)
  - type: review-limits
    id: review_limits
    with:
      max_total_diff_kb: 1500

  # Ensure */*/AGENTS.md files are updated when code changes
  # - type: agents-md-sync
  #   id: agents_md_sync
  # with:  # Optional configuration
  #   code_patterns: ["src/**/*.js", "lib/**/*.ts"]  # Files that require doc updates
  #   doc_pattern: "CLAUDE.md"                       # Documentation file to check. Default is AGENTS.md

  - type: ai-rule
    with:
      rule_file: pr-syntropy-coherence.yaml
  - type: ai-rule
    with:
      rule_file: patterns-and-docs.yaml
  - type: ai-rule
    with:
      rule_file: repo-goal-alignment.yaml

  ## template for adding a new rule.
  # - type: ai-rule
  #   with:
  #     rule_file: ai-rule-template.yaml
# (governance.schedules merged into the unified `governance` section above)

# ---------------------------------------------------------------------------------------------
# Blue/green workloads shipped by the operator's node-deploy sequencer (task.5400, story.5127).
# `POST /api/v1/deploy/workloads {nodeId, env, workload, sourceSha}` reads THIS block at that sha and
# records a release; the sequencer deploys it to Akash through the akash-tx actuator.
#
# These two are the operator's CANARY pair: a state workload (`canary-db`, a TLS Postgres that is created
# once and never auto-replaced) and an app (`canary`) bound to it that proves the verb end to end — new
# lease, exact-sha proof, edge flip, retained blue, confirmed close, recovery of a lost lease. Hosts name
# the PRODUCTION hostname; candidate-a/preview/dev get the -test/-preview/-dev sibling of the first
# label. `deployment.services` is deliberately absent: this block is not an off-cluster placement.
deployment:
  workloads:
    - name: canary-db
      kind: state
      # postgres:16 (debian) by digest. The script mints a self-signed cert at boot so TLS is on;
      # clients use sslmode=require. POSTGRES_PASSWORD is injected by the sequencer.
      image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
      command:
        - bash
        - -c
        - >-
          mkdir -p /etc/pgtls &&
          openssl req -new -x509 -days 30 -nodes -subj /CN=state -out /etc/pgtls/server.crt -keyout /etc/pgtls/server.key &&
          chown postgres:postgres /etc/pgtls/server.* &&
          chmod 600 /etc/pgtls/server.key &&
          exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/etc/pgtls/server.crt -c ssl_key_file=/etc/pgtls/server.key
      port: 5432
      expose:
        tcp:
          global: true
      cpu: 0.5
      memoryMi: 512
      storageMi: 512
      persistent:
        sizeMi: 2048
        mountPath: /var/lib/postgresql/data
      env:
        PGDATA: /var/lib/postgresql/data/pgdata
      exclusive: false
    - name: canary
      kind: app
      # python:3.12-alpine ThreadingHTTPServer (a real HTTP server: the earlier busybox `nc -l` loop
      # returned 502 behind some provider ingresses). Serves /version (RELEASE_SHA), /readyz (select 1
      # against the bound db, 503 until it answers) and /data, shelling out to psql. YELLOW (CD10):
      # `apk add postgresql-client` floats at boot; replace with a built canary image once the
      # reusable build workflow lands.
      image: python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
      command:
        - sh
        - -c
        - |
          (until apk add --no-cache postgresql-client >/tmp/apk.log 2>&1; do sleep 3; done) &
          cat > /srv.py <<'PY'
          import json, os, subprocess, threading, time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          SHA = os.environ.get("RELEASE_SHA", "unset")
          URL = os.environ.get("DATABASE_URL", "")


          def psql(sql):
              r = subprocess.run(["psql", URL, "-tAc", sql], capture_output=True, text=True, timeout=10)
              return r.returncode == 0, r.stdout.strip()


          def boot():
              while True:
                  try:
                      ok, _ = psql("create table if not exists boots(id serial primary key, build_sha text, booted_at timestamptz default now()); insert into boots(build_sha) values ('%s')" % SHA)
                      if ok:
                          return
                  except Exception:
                      pass
                  time.sleep(3)


          threading.Thread(target=boot, daemon=True).start()


          class H(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, *a):
                  pass

              def reply(self, code, body):
                  b = body.encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("Content-Length", str(len(b)))
                  self.send_header("Connection", "close")
                  self.end_headers()
                  self.wfile.write(b)

              def do_GET(self):
                  p = self.path.split("?")[0]
                  if p == "/version":
                      self.reply(200, json.dumps({"buildSha": SHA}))
                  elif p == "/readyz":
                      try:
                          ok, _ = psql("select 1")
                      except Exception:
                          ok = False
                      self.reply(200 if ok else 503, json.dumps({"status": "ok" if ok else "db_unreachable"}))
                  elif p == "/data":
                      try:
                          ok, out = psql("select coalesce(json_agg(b order by id),'[]') from boots b")
                      except Exception:
                          ok, out = False, "[]"
                      self.reply(200 if ok else 503, out or "[]")
                  elif p == "/diag":
                      try:
                          log = open("/tmp/apk.log").read()[-400:]
                      except Exception:
                          log = ""
                      self.reply(200, json.dumps({"apk": log, "psql": os.path.exists("/usr/bin/psql")}))
                  else:
                      self.reply(404, '{"error":"not_found"}')


          ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
          PY
          exec python3 -u /srv.py
      port: 8080
      expose:
        http:
          host: node-deploy-canary.cognidao.org
      cpu: 0.25
      memoryMi: 256
      storageMi: 256
      bindings:
        - env: DATABASE_URL
          workload: canary-db
      exclusive: false
      health:
        version: /version
        ready: /readyz
